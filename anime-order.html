    tips.forEach(([x, y]) => { fg += limb(m, x - 10, 152, x, y + 1, 5, COL.skin) + `<circle cx="${n1(x)}" cy="${n1(y)}" r="5" ${F(m, COL.skin)}/>`; });
    if (o.handBad) fg += limb(m, cx + 26, 152, cx + 58, 100, 5, COL.skin) + limb(m, cx + 58, 100, cx + 30, 56, 5, COL.skin);
    fg += `<ellipse cx="${n1(cx + 4)}" cy="60" rx="12" ry="6" ${F(m, COL.skin)}/>`;
    g += `<g class="fingers">${fg}</g>`;
    return g;
  }
  function drawC4(f, m) {
    let g = `<rect x="0" y="0" width="320" height="142" ${F(m, COL.wallR)}/><rect x="0" y="142" width="320" height="38" ${F(m, COL.floor)}/>`;
    g += `<rect x="26" y="28" width="66" height="114" ${F(m, COL.hall)}/>`;
    g += `<g class="mio">${girl({ mode: m, x: 60, y: 56, k: 0.95, hair: "mio", outfit: f.mio, pose: "stand", face: "r", muffler: f.muffler })}</g>`;
    g += `<g class="door-p">${poly([[26, 28], [48, 36], [48, 134], [26, 142]], F(m, COL.door))}</g>`;
    g += yuiBack(m, 232, 96, 2.6, f.yui);
    return f.door === "R" ? `<g transform="translate(320 0) scale(-1 1)">${g}</g>` : g;
  }
  function drawCut(c, f, m, cls = "") {
    const label = `${c}（${m === "conte" ? "コンテ" : m === "genga" ? "原画" : "映像"}）`;
    if (c === "C1") return svg(m, room(m, f.rain, true, f.yui), label, cls);
    if (c === "C2") return svg(m, drawC2(f, m), label, cls);
    if (c === "C3") return svg(m, `<rect x="0" y="0" width="320" height="180" ${F(m, COL.wallR)}/>` + fretboard(m, { capo: f.capo, chord: f.chord, yui: f.yui, handBad: f.handBad }), label, cls);
    return svg(m, drawC4(f, m), label, cls + (f.stiff ? " stiff" : ""));
  }
  function drawMat(id) {
    const m = "color", nm = E.MATS[id].name;
    const person = (hair, outfit) => svg(m, girl({ mode: m, x: 160, y: 30, k: 1.7, hair, outfit, pose: "stand", face: "f" }), nm);
    if (id === "yui_w") return person("yui", "w");
    if (id === "yui_s") return person("yui", "s");
    if (id === "mio_w") return person("mio", "w");
    if (id === "mio_p") return person("mio", "p");
    if (id === "guitar_a" || id === "guitar_e") return svg(m, guitarBody(m, id === "guitar_a" ? "a" : "e", 110, 100, 0.95) + poly([[176, 92], [300, 88], [300, 102], [176, 108]], F(m, COL.neck)) + poly([[300, 84], [318, 80], [318, 108], [300, 106]], F(m, COL.neck)), nm);
    if (id === "capo") return svg(m, `<rect x="140" y="40" width="18" height="100" rx="4" ${F(m, COL.capo)}/><path d="M158,52 Q210,60 196,128" fill="none" stroke="#555" stroke-width="7" stroke-linecap="round"/>`, nm);
    if (id === "muffler") return svg(m, poly([[90, 60], [230, 60], [230, 84], [90, 84]], F(m, COL.muffler)) + poly([[190, 70], [214, 70], [222, 160], [198, 160]], F(m, COL.muffler)) + `<path d="M110,60 L110,84 M140,60 L140,84 M170,60 L170,84 M200,60 L200,84 M196,100 L218,100 M198,130 L221,130" ${Lc(m, COL.check, 1.5)}/>`, nm);
    if (id === "bg_rain" || id === "bg_day") return svg(m, room(m, id === "bg_rain", false), nm);
    if (id === "bg_door") return svg(m, `<rect x="0" y="0" width="320" height="142" ${F(m, COL.wallR)}/><rect x="0" y="142" width="320" height="38" ${F(m, COL.floor)}/><rect x="26" y="28" width="66" height="114" ${F(m, COL.door)}/><circle cx="84" cy="88" r="2.4" ${F(m, COL.skin)}/><rect x="150" y="40" width="120" height="60" ${F(m, "#cdbfa9")}/>`, nm);
    if (id === "bg_hall") return svg(m, `<rect x="0" y="0" width="320" height="180" ${F(m, "#c9a77f")}/><path d="M0,40 L120,80 L200,80 L320,40 M0,160 L120,110 L200,110 L320,160 M120,80 L120,110 M200,80 L200,110" ${Ln(m, 2)}/><rect x="30" y="60" width="40" height="80" ${F(m, COL.door)}/>`, nm);
    if (id === "ref_g" || id === "ref_c") return svg(m, `<rect x="0" y="0" width="320" height="180" fill="#f2efe6"/>` + fretboard(m, { capo: false, chord: id === "ref_g" ? "G" : "C", yui: "w", handBad: false }) + `<text x="16" y="44" font-size="34" font-weight="700" fill="#1d2236">${id === "ref_g" ? "G" : "C"}</text>`, nm);
    return svg(m, "", nm);
  }
  function drawSample(id) {
    const m = "genga", nm = E.ANIMS[id].sample;
    if (id === "mori") { let g = `<rect x="20" y="100" width="280" height="60" ${F(m, "#fff")}/>`; for (let x = 20; x < 300; x += 28) g += `<line x1="${x}" y1="100" x2="${x}" y2="160" ${Ln(m)}/>`; for (const x of [40, 68, 124, 152, 180, 236, 264]) g += `<rect x="${x}" y="100" width="16" height="34" ${solid(m)}/>`; g += `<ellipse cx="160" cy="70" rx="56" ry="26" ${F(m)}/>`; for (const [x, y] of [[118, 112], [140, 118], [162, 120], [184, 116], [204, 106]]) g += limb(m, x + 6, 80, x, y, 5, "#fff"); return svg(m, g, nm); }
    if (id === "miyashita") return svg(m, girl({ mode: m, x: 150, y: 40, k: 1.5, hair: "yui", outfit: "w", pose: "stand", face: "l" }) + `<path d="M200,40 Q230,60 210,90 M214,34 Q252,62 226,100" ${Ln(m, 1.4)}/>`, nm);
    if (id === "hayase") return svg(m, `<circle cx="170" cy="48" r="14" ${F(m)}/><path d="M168,62 L158,108 M162,76 L190,90 L204,80 M162,76 L136,90 L124,82 M158,108 L184,130 L182,154 M158,108 L136,134 L112,136" ${Ln(m, 3)}/><path d="M40,60 L100,60 M30,90 L96,90 M48,120 L104,120" ${Ln(m, 1.2)}/>`, nm);
    return svg(m, girl({ mode: m, x: 150, y: 46, k: 1.5, hair: "mio", outfit: "w", pose: "sit", face: "r" }) + `<rect x="128" y="104" width="60" height="7" ${F(m)}/>`, nm);
  }

  // ================= references to things on the desk =================
  const split = (r) => { const i = r.indexOf(":"); return [r.slice(0, i), r.slice(i + 1)]; };
  function title(r) {
    const [k, v] = split(r);
    if (k === "conte") return `コンテ ${v}`;
    if (k === "genga") return `原画 ${v}`;
    if (k === "mat") return E.MATS[v].name;
    if (k === "anim") return `${E.ANIMS[v].name}さん`;
    if (k === "bag") return `${E.ANIMS[v].name}さんの袋`;
    if (k === "person") return v === "oshima" ? "大島さん（作監）" : "ミナト（仕上げ）";
    if (k === "res") return `${v}の映像`;
    return r;
  }
  const valid = (r) => { if (!r || typeof r !== "string" || r.indexOf(":") < 0) return false; const [k, v] = split(r); return k === "conte" ? !!E.CUT[v] : k === "res" ? !!(E.CUT[v] && s.res) : k === "genga" ? !!(E.CUT[v] && s.ret) : k === "mat" ? !!E.MATS[v] : (k === "anim" || k === "bag") ? !!E.ANIMS[v] : k === "person" ? (v === "oshima" || v === "minato") : false; };
  function thumb(r) {
    const [k, v] = split(r);
    if (k === "conte") return drawCut(v, E.RIGHT, "conte");
    if (k === "genga") return drawCut(v, s.ret.cut[v].f, "genga");
    if (k === "mat") return drawMat(v);
    if (k === "anim") return drawSample(v);
    if (k === "res") { const c = s.res.cut[v]; return drawCut(v, c.f, c.painted ? "color" : "genga"); }
    return "";
  }
  const dragAttr = (r) => (accepts(null, r, true) ? ` draggable="true" data-drag="${r}"` : "");
  function item(r, sub = "", mark = "", warn = false) {
    return `<button class="item ${ui.sel === r ? "on" : ""}" data-act="sel" data-v="${r}"${dragAttr(r)}><span class="th">${thumb(r)}</span><span class="tx"><b>${esc(title(r))}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>${mark ? `<span class="mk ${warn ? "warn" : ""}">${esc(mark)}</span>` : ""}</button>`;
  }

  // ================= where things can go =================
  // zone: "tray" | "shelf" | "bag:<anim>" | "anim:<anim>" | "unassign" | "slot:<i>" | "bundle:kan|shi"; zone null = can it go anywhere
  function accepts(zone, r, any) {
    if (!r || !valid(r)) return false;
    const [k, v] = split(r);
    const zs = any ? zonesNow() : [zone];
    return zs.some((z) => {
      if (!z) return false;
      if (z === "tray") return s.phase <= 3 && !s.ret && k === "mat" && !s.tray.includes(v);
      if (z === "shelf") return s.phase <= 3 && !s.ret && k === "mat" && s.tray.includes(v);
      if (z.startsWith("bag:")) { const a = z.slice(4); return s.phase === 3 && !s.ret && k === "mat" && s.tray.includes(v) && E.cutsOf(s, a).length > 0 && !s.bags[a].includes(v); }
      if (z.startsWith("anim:")) { const a = z.slice(5); return s.phase === 2 && !s.ret && k === "conte" && s.assign[v] !== a && !E.assignWhy(s, v, a); }
      if (z === "unassign") return s.phase === 2 && !s.ret && k === "conte" && !!s.assign[v];
      if (z.startsWith("slot:")) return s.phase === 4 && ["conte", "genga", "mat", "bag"].includes(k) && s.bench[+z.slice(5)] !== r;
      if (z.startsWith("bundle:")) return s.phase === 4 && k === "genga" && s.bundle[v] !== z.slice(7);
      return false;
    });
  }
  function zonesNow() {
    if (s.phase === 1) return ["tray", "shelf"];
    if (s.phase === 2) return E.ANIM_IDS.map((a) => "anim:" + a).concat("unassign");
    if (s.phase === 3) return E.ANIM_IDS.map((a) => "bag:" + a).concat("shelf");
    if (s.phase === 4) return ["slot:0", "slot:1", "slot:2", "bundle:kan", "bundle:shi"];
    return [];
  }
  function put(zone, r) {
    if (!accepts(zone, r)) return false;
    const [, v] = split(r);
    let why = "";
    if (zone === "tray" || zone === "shelf") why = E.trayToggle(s, v);
    else if (zone.startsWith("bag:")) why = E.bagToggle(s, zone.slice(4), v);
    else if (zone.startsWith("anim:")) why = E.assign(s, v, zone.slice(5));
    else if (zone === "unassign") why = E.assign(s, v, null);
    else if (zone.startsWith("slot:")) why = E.bench(s, +zone.slice(5), r);
    else if (zone.startsWith("bundle:")) why = E.bundle(s, v, zone.slice(7));
    if (why) { ui.flash = why; return false; }
    return true;
  }
  const putBtn = (zone, label) => (ui.sel && accepts(zone, ui.sel) ? `<button class="put" data-act="put" data-zone="${zone}">${esc(label)}</button>` : "");
  const zoneCls = (zone) => (ui.sel && accepts(zone, ui.sel) ? " hot" : "");

  // ================= header =================
  const STEPS = ["コンテ", "原画マン", "発注", "照合", "渡す", "映像"];
  function header() {
    const st = STEPS.map((n, i) => { const p = i + 1, why = E.goWhy(s, p); return `<li><button data-act="go" data-v="${p}" class="${s.phase === p ? "on" : p < s.phase ? "done" : ""}" ${why || s.phase === p ? "disabled" : ""} title="${esc(why)}">${p} ${n}</button></li>`; }).join("");
    const clock = s.phase <= 3 ? `月 10:00<small>12:30に佐伯が出る</small>` : s.phase <= 5 ? `火 13:00<small>原画が戻った</small>` : `水 10:00<small>撮影入れ</small>`;
    return `<header class="top"><h1>4カットの発注<small>制作デスクの机（試作）</small></h1><ol class="steps" aria-label="段取り">${st}</ol><span class="clock">${clock}</span><span class="sp"></span><button class="tb" data-act="help">遊び方</button><button class="tb" data-act="restartAsk">最初から</button></header>`;
  }

  // ================= 佐伯 =================
  function saeki() {
    let t = "", warn = false;
    if (s.phase === 1) t = s.tray.length ? `今回の資料、${s.tray.length}枚出てます。足りないものはないですか？ 袋に入れるのは発注のときです。` : "コンテ来ました！ 4カットです。要る資料を棚から「今回の資料」に出しておいてください。";
    if (s.phase === 2) { const un = E.CUT_IDS.filter((c) => !s.assign[c]); const over = E.used(s).filter((a) => !E.fits(s, a)); if (over.length) { warn = true; t = `${over.map((a) => E.ANIMS[a].name + "さん").join("・")}、空いてる時間に収まりません！`; } else t = un.length ? `今週空いてる原画マンさんは4人です。作例と空き予定、見てください。まだ決まってないのは ${un.join("・")} です。` : "4カットとも頼む人が決まりました！ 次は袋づめです。"; }
    if (s.phase === 3) { const why = E.dispatchWhy(s); if (why) { warn = true; t = why.includes("描き終わらない") ? `${why.replace("火曜12:00までに描き終わらない", "")}……このままだと火曜の昼に間に合いません！ 回る順番か、頼む人を変えないと。` : `${why}みたいです。`; } else t = "袋の中身と回る順番、これでいいですか？ よければ12:30に出ます！"; }
    if (s.phase === 4) t = "戻りました！ 4カットです。作監の大島さんに見てもらう束と、そのまま仕上げに回す束に分けてください。";
    if (s.phase === 5) t = "どっちから持っていきます？ ミナトさんは届いた順に塗るそうです。";
    if (s.phase === 6) t = s.res.unpainted ? "映像、来ました……塗りが間に合わなかったカットがあります。" : s.res.remain ? "映像、来ました！ ……あれ、ちょっと気になるところが。" : "映像、来ました！ つながってます！";
    if (ui.flash) { t = ui.flash; warn = true; }
    return `<div class="saeki ${warn ? "warn" : ""}" role="status"><b>佐伯</b><span>${esc(t)}</span></div>`;
  }

  // ================= gantt =================
  function gantt(rows, t0, t1, ticks, due, offs = []) {
    const pc = (t) => `${Math.max(0, Math.min(100, ((t - t0) / (t1 - t0)) * 100)).toFixed(2)}%`;
    const wd = (a, b) => `${Math.max(0, ((Math.min(b, t1) - Math.max(a, t0)) / (t1 - t0)) * 100).toFixed(2)}%`;
    const axis = `<div class="gaxis" aria-hidden="true">${ticks.map(([t, l]) => `<span style="left:${pc(t)}">${l}</span>`).join("")}</div>`;
    const body = rows.map((r) => `<div class="grow"><div class="gl">${esc(r.label)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</div><div class="gbar">${offs.map(([a, b]) => `<span class="gseg off" style="left:${pc(a)};width:${wd(a, b)}"></span>`).join("")}${r.segs.map((g) => `<span class="gseg ${g.cls}" style="left:${pc(g.a)};width:${wd(g.a, g.b)}" title="${esc(g.title || "")}">${esc(g.text || "")}</span>`).join("")}${(r.marks || []).map((t) => `<span class="gmark" style="left:${pc(t)}" title="着く"></span>`).join("")}${due ? `<span class="gdue" style="left:${pc(due)}"></span>` : ""}</div></div>${r.note ? `<p class="gnote ${r.ok ? "ok" : "ng"}">${esc(r.note)}</p>` : ""}`).join("");
    return `<div class="gantt">${axis}${body}</div>`;
  }
  const T = E.T;
  const MON_TICKS = [[T(0, 12), "月12"], [T(0, 15), "15"], [T(0, 18), "18"], [T(0, 21), "21"], [T(1, 0), "火0"], [T(1, 3), "3"], [T(1, 6), "6"], [T(1, 9), "9"], [T(1, 12), "12"]];
  const TUE_TICKS = [[T(1, 13), "火13"], [T(1, 16), "16"], [T(1, 19), "19"], [T(1, 22), "22"], [T(2, 1), "水1"], [T(2, 4), "4"], [T(2, 7), "7"], [T(2, 10), "10"]];

  // ================= phase 1: storyboard and model sheets =================
  function conteSheet(sel = true) {
    return `<p class="scene">${esc(E.SCENE)}　演出：三宅</p><div class="conte">${E.CUTS.map((c) => `<button class="cpanel ${ui.sel === "conte:" + c.id ? "on" : ""}" data-act="sel" data-v="conte:${c.id}"${sel ? dragAttr("conte:" + c.id) : ""}>
      ${drawCut(c.id, E.RIGHT, "conte")}<span class="ch"><b>${c.id}</b><span>${esc(c.shot)}・${c.sec}秒</span>${c.star ? `<span class="star">★${esc(c.star)}</span>` : ""}</span><p>${esc(c.text)}${c.line ? `<br>${esc(c.line)}` : ""}</p></button>`).join("")}</div>`;
  }
  function shelf(markTray = true) {
    const kinds = ["人物", "小物", "背景", "参考"];
    return kinds.map((k) => `<h3>${k}</h3><div class="items">${E.MAT_IDS.filter((m) => E.MATS[m].kind === k).map((m) => item("mat:" + m, "", markTray && s.tray.includes(m) ? "出した" : "")).join("")}</div>`).join("");
  }
  function list1() { return `<div class="box zone" data-drop="shelf"><h2>資料棚 <small>押すと中身が見られる</small></h2>${putBtn("shelf", "棚に戻す")}${shelf()}</div>`; }
  function desk1() {
    const tray = s.tray.length ? `<div class="items wrapit">${s.tray.map((m) => item("mat:" + m)).join("")}</div>` : `<p class="empty">まだ何も出していない。棚の資料を選んで「今回の資料に出す」、またはここへドラッグ。</p>`;
    return `${saeki()}<div class="box"><h2>コンテ <small>4カット</small></h2>${conteSheet()}</div>
      <div class="zone traybar${zoneCls("tray")}" data-drop="tray"><div class="zh"><b>今回の資料</b><small>袋に入れられるのは、ここに出した資料だけ</small>${putBtn("tray", "選んだ資料を出す")}</div>${tray}</div>
      <div class="box"><ul class="rule"><li>袋にない設定は、原画マンが<b>記憶で描く</b>（第1話の前半は夏だった）。</li><li>資料には、別の資料を見るように書いてあるものがある。</li></ul></div>
      <div class="foot"><button class="go" data-act="go" data-v="2">次へ：原画マンを探す</button></div>`;
  }

  // ================= phase 2: animators =================
  function availSegs(a) { return E.ANIMS[a].avail.map(([x, y]) => ({ a: x, b: y, cls: "av", title: "空き" })); }
  function list2() {
    return `<div class="box"><h2>原画マン <small>今週空いている4人</small></h2><div class="items">${E.ANIM_IDS.map((a) => { const n = E.cutsOf(s, a).length; return item("anim:" + a, `${E.ANIMS[a].good ? "得意：" + E.ANIMS[a].good + "　" : ""}${E.ANIMS[a].bad ? "苦手：" + E.ANIMS[a].bad : ""}`.trim() || "新人", n ? `${n}カット` : ""); }).join("")}</div></div>
      <div class="box"><h2>コンテ</h2><div class="items">${E.CUT_IDS.map((c) => item("conte:" + c, `${E.CUT[c].shot}${E.CUT[c].star ? "　★" + E.CUT[c].star : ""}`, s.assign[c] ? E.ANIMS[s.assign[c]].name + "さん" : "未定", !s.assign[c])).join("")}</div></div>`;
  }
  function desk2() {
    const cuts = `<div class="grid4">${E.CUTS.map((c) => { const a = s.assign[c.id]; return `<button class="cutcard ${ui.sel === "conte:" + c.id ? "on" : ""}" data-act="sel" data-v="conte:${c.id}"${dragAttr("conte:" + c.id)}>${drawCut(c.id, E.RIGHT, "conte")}<b>${c.id} ${esc(c.shot)}${c.star ? ` <span class="star">★${esc(c.star)}</span>` : ""}</b><span class="who ${a ? "" : "none"}">${a ? esc(E.ANIMS[a].name) + "さん" : "未定"}</span></button>`; }).join("")}</div>`;
    const anims = `<div class="grid2">${E.ANIM_IDS.map((a) => { const A = E.ANIMS[a], cs = E.cutsOf(s, a), ok = E.fits(s, a); return `<div class="zone anim${zoneCls("anim:" + a)}" data-drop="anim:${a}"><div class="zh"><b>${esc(A.name)}さん</b><small>${esc(A.where)}</small>${putBtn("anim:" + a, "このカットを頼む")}</div>
      <div class="samp">${drawSample(a)}<ul><li>作例：${esc(A.sample)}</li><li>得意：${esc(A.good || "とくになし")}${A.good === "手" ? "（★手元を描ける）" : A.good === "芝居" ? "（★芝居を描ける）" : ""}</li><li>苦手：${esc(A.bad || "とくになし")}</li><li>1カット${A.speed}時間</li></ul></div>
      <div class="cuts">${cs.length ? cs.map((c) => `<button class="chipbtn" data-act="sel" data-v="conte:${c}">${c}</button>`).join("") : '<span class="empty">まだ頼んでいない</span>'}</div>
      ${cs.length ? `<p class="fit ${ok ? "ok" : "ng"}">${ok ? `${cs.length}カットで${cs.length * A.speed}時間。空きに収まる` : `${cs.length}カットで${cs.length * A.speed}時間。空き（${esc(A.availText)}）に収まらない`}</p>` : ""}</div>`; }).join("")}</div>`;
    const rows = E.ANIM_IDS.map((a) => ({ label: E.ANIMS[a].name + "さん", sub: `1カット${E.ANIMS[a].speed}時間`, segs: availSegs(a) }));
    return `${saeki()}<div class="box"><h2>カット <small>選んで、頼む原画マンを決める（ドラッグでもよい）</small></h2>${cuts}<div class="zone${zoneCls("unassign")}" data-drop="unassign" style="margin-top:8px"><div class="zh"><small>頼むのをやめるときは、ここへ</small>${putBtn("unassign", "頼むのをやめる")}</div></div></div>
      <div class="box"><h2>原画マン</h2>${anims}</div>
      <div class="box"><h2>空き予定 <small>緑が空いている時間。赤い線が回収（火曜12:00）</small></h2>${gantt(rows, T(0, 12), T(1, 13), MON_TICKS, E.DUE)}</div>
      <div class="box"><ul class="rule"><li>コンテに<b>★</b>がついたカットは見せ場。★手元は手が得意な人、★芝居は芝居が得意な人でないと、崩れたり硬くなったりする。</li><li><b>苦手</b>なものは、★がなくても崩れる（小物が苦手な人は小物を描き落とす）。</li><li>一人に頼めるのは2カットまで。</li></ul></div>
      <div class="foot"><button class="sub" data-act="go" data-v="1">戻る：コンテ</button><button class="go" data-act="go" data-v="3">次へ：発注する</button></div>`;
  }

  // ================= phase 3: bags and the round =================
  function list3() {
    const tray = s.tray.length ? `<div class="items">${s.tray.map((m) => item("mat:" + m, E.MATS[m].kind)).join("")}</div>` : `<p class="empty">今回の資料がない。「1 コンテ」に戻って棚から出す。</p>`;
    return `<div class="box zone" data-drop="shelf"><h2>今回の資料 <small>袋にドラッグ、または選んで袋を押す</small></h2>${tray}</div>
      <div class="box"><h2>コンテ</h2><div class="items">${E.CUT_IDS.map((c) => item("conte:" + c, s.assign[c] ? E.ANIMS[s.assign[c]].name + "さん" : "未定")).join("")}</div></div>`;
  }
  function desk3() {
    const u = E.used(s), p = E.plan(s);
    const bags = u.length ? `<div class="grid2">${u.map((a) => { const cs = E.cutsOf(s, a), bag = s.bags[a], conf = E.conflicts(bag); return `<div class="zone bag${zoneCls("bag:" + a)}" data-drop="bag:${a}"><div class="zh"><b>${esc(E.ANIMS[a].name)}さんの袋</b><small>${cs.join("・")}</small>${putBtn("bag:" + a, "この袋に入れる")}</div>
      <div class="mats">${cs.map((c) => `<button class="chipbtn" data-act="sel" data-v="conte:${c}">コンテ ${c}</button>`).join("")}</div>
      <h3>資料</h3><div class="mats">${bag.length ? bag.map((m) => `<span class="mchip"><button data-act="sel" data-v="mat:${m}">${esc(E.MATS[m].name)}</button><button data-act="bagDel" data-a="${a}" data-m="${m}" aria-label="${esc(E.MATS[m].name)}を出す">×</button></span>`).join("") : '<span class="empty">まだ入っていない</span>'}</div>
      ${conf.length ? `<p class="why">同じものが2種類入っている（${conf.map((g) => ({ yui: "ユイ", mio: "ミオ", guitar: "ギター", room: "部室", chord: "コード" })[g]).join("・")}）：電話がきて1時間ずつ遅れる</p>` : ""}</div>`; }).join("")}</div>` : `<p class="empty">まだ誰にも頼んでいない。「2 原画マン」で決める。</p>`;
    const route = s.route.length ? `<div class="route">${s.route.map((a, i) => { const A = E.ANIMS[a]; return `<div class="rrow"><span class="n">${i + 1}</span><span><b>${esc(A.name)}さん</b>　<small>${esc(A.where)}</small><br><small>${E.fmt(p[a].arrive)} に着く</small></span><span class="ud"><button data-act="route" data-a="${a}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="${esc(A.name)}さんを先に">↑</button><button data-act="route" data-a="${a}" data-d="1" ${i === s.route.length - 1 ? "disabled" : ""} aria-label="${esc(A.name)}さんをあとに">↓</button></span></div>`; }).join("")}</div>
      <p class="map">月12:30にスタジオを出る。車で スタジオ↔森さん 20分／スタジオ↔宮下さん 30分／森さん↔宮下さん 20分。作画部屋の人に渡すのは10分（外にいるときは、いったんスタジオに戻る）。</p>` : "";
    const rows = s.route.map((a) => { const r = p[a]; const segs = availSegs(a).concat(r.blocks.map(([x, y]) => ({ a: x, b: y, cls: "wk" + (r.ok ? "" : " late"), text: r.cuts.join("・"), title: "描いている" }))); return { label: E.ANIMS[a].name + "さん", sub: r.conf.length ? `迷って電話 +${r.conf.length}時間` : `${r.cuts.length}カット`, segs, marks: [r.arrive], ok: r.ok, note: r.ok ? `${E.fmt(r.finish)}に描き終わる` : (r.finish === null ? `空きのうちに描き終わらない（あと${Math.ceil(r.left / 60)}時間ぶん）` : `${E.fmt(r.finish)}まで。回収に間に合わない`) }; });
    const why = E.dispatchWhy(s);
    return `${saeki()}<div class="box"><h2>袋づめ <small>原画マンごとに、そのカットに要る資料を入れる</small></h2>${bags}</div>
      <div class="box"><h2>佐伯の回る順番</h2>${route || '<p class="empty">頼む人が決まると、ここに並ぶ。</p>'}</div>
      ${rows.length ? `<div class="box"><h2>見込み <small>青い線が袋の届く時刻、緑が空き、濃い色が描いている時間、赤い点線が回収</small></h2>${gantt(rows, T(0, 12), T(1, 13), MON_TICKS, E.DUE)}</div>` : ""}
      <div class="box"><ul class="rule"><li>同じものの違う版（服・背景・ギター・コード）が袋に2つ入っていると、原画マンが迷って電話してくる。佐伯がコンテを見て答えるが、<b>1つにつき1時間</b>遅れる。</li><li>火曜12:00までに描き終わったカットを、佐伯が回収して13:00に戻る。</li></ul></div>
      <div class="foot"><button class="sub" data-act="go" data-v="2">戻る：原画マン</button><button class="go" data-act="dispatch" ${why ? "disabled" : ""}>佐伯に手配を頼む（月12:30出発）</button>${why ? `<span class="why">${esc(why)}</span>` : ""}</div>`;
  }

  // ================= phase 4: check what came back =================
  function gmeta(c) {
    const r = s.ret.cut[c], cut = E.CUT[c], keys = r.f.stiff ? 2 : cut.keys;
    return `${E.ANIMS[r.anim].name}さん　タイムシート ${cut.sec}+0　原画${keys}枚${c === "C4" ? (r.f.stiff ? "（溜めなし）" : "（溜めあり）") : ""}`;
  }
  function bagRecord(a) { const r = s.ret; return `<ul class="bagrec"><li>カット：${E.cutsOf(s, a).join("・")}</li><li>資料：${r.bags[a].length ? r.bags[a].map((m) => esc(E.MATS[m].name)).join("、") : "なし"}</li><li>袋が届いた：${E.fmt(r.plan[a].arrive)}　描き終えた：${E.fmt(r.plan[a].finish)}</li></ul>`; }
  function list4() {
    const st = (c) => (s.bundle[c] === "kan" ? "作監へ" : s.bundle[c] === "shi" ? "仕上げへ" : "まだ");
    return `<div class="box"><h2>戻った原画</h2><div class="items">${E.CUT_IDS.map((c) => item("genga:" + c, gmeta(c).split("　")[0], st(c), !s.bundle[c])).join("")}</div><p class="note"><button class="see" data-act="log">昨日からの記録を見る</button></p></div>
      <div class="box"><h2>コンテ</h2><div class="items">${E.CUT_IDS.map((c) => item("conte:" + c, E.CUT[c].shot)).join("")}</div></div>
      <div class="box"><h2>袋の記録 <small>何を入れて発注したか</small></h2><div class="items">${s.ret.route.map((a) => `<button class="item ${ui.sel === "bag:" + a ? "on" : ""}" data-act="sel" data-v="bag:${a}" draggable="true" data-drag="bag:${a}"><span class="tx"><b>${esc(E.ANIMS[a].name)}さんの袋</b><small>${E.cutsOf(s, a).join("・")}／資料${s.ret.bags[a].length}枚</small></span></button>`).join("")}</div></div>
      <details class="box" data-k="shelf" ${ui.shelfOpen ? "open" : ""}><summary>資料棚 <small>設定を確かめるときに開く</small></summary>${shelf(false)}</details>`;
  }
  function slotView(i) {
    const r = s.bench[i], zone = "slot:" + i;
    if (!r || !valid(r)) return `<div class="zone slot${zoneCls(zone)}" data-drop="${zone}"><div class="zh"><b>${i + 1}</b><small>ここに並べる</small>${putBtn(zone, "ここに並べる")}</div><p class="empty">左の一覧から選んで「ここに並べる」、またはドラッグ。</p></div>`;
    const [k, v] = split(r);
    let body = "";
    if (k === "conte") body = thumb(r) + `<p class="meta">${esc(E.CUT[v].text)}${E.CUT[v].line ? `<br>${esc(E.CUT[v].line)}` : ""}<br><small>${E.CUT[v].sec}秒${E.CUT[v].star ? "　★" + esc(E.CUT[v].star) : ""}</small></p>`;
    else if (k === "genga") body = thumb(r) + `<p class="meta">${esc(gmeta(v))}</p>`;
    else if (k === "mat") body = thumb(r) + `<p class="meta">${esc(E.MATS[v].text)}</p>`;
    else if (k === "bag") body = bagRecord(v);
    return `<div class="zone slot${zoneCls(zone)}" data-drop="${zone}"><div class="st"><b>${i + 1}　${esc(title(r))}</b><span class="sb">${putBtn(zone, "入れ替える")}<button data-act="benchClear" data-i="${i}">外す</button></span></div>${body}</div>`;
  }
  function gcard(c, inKan) {
    return `<div class="gcard ${ui.sel === "genga:" + c ? "on" : ""}"><div class="gh"><button class="nm" data-act="sel" data-v="genga:${c}" draggable="true" data-drag="genga:${c}">${thumb("genga:" + c)}<b>${c}</b></button><button class="back" data-act="bundle" data-c="${c}" data-w="">戻す</button></div>
      ${inKan ? `<div class="memo">確認メモ：${E.CATS.map((cat) => `<button class="chipbtn ${s.memo[c].includes(cat) ? "on" : ""}" data-act="memo" data-c="${c}" data-cat="${cat}" aria-pressed="${s.memo[c].includes(cat)}">${cat}</button>`).join("")}</div>` : ""}</div>`;
  }
  function desk4() {
    const kan = E.CUT_IDS.filter((c) => s.bundle[c] === "kan"), shi = E.CUT_IDS.filter((c) => s.bundle[c] === "shi"), why = E.goWhy(s, 5);
    return `${saeki()}<div class="box"><h2>見比べ台 <small>コンテ・原画・資料・袋の記録を並べる</small></h2><div class="slots">${[0, 1, 2].map(slotView).join("")}</div></div>
      <div class="grid2"><div class="zone kan${zoneCls("bundle:kan")}" data-drop="bundle:kan"><div class="zh"><b>作監に確認する束</b><small>大島さんが直す</small>${putBtn("bundle:kan", "この束へ")}</div><div class="items">${kan.length ? kan.map((c) => gcard(c, true)).join("") : '<p class="empty">直しが要りそうな原画をここへ。</p>'}</div></div>
      <div class="zone shi${zoneCls("bundle:shi")}" data-drop="bundle:shi"><div class="zh"><b>仕上げへ渡す束</b><small>そのまま色を塗る</small>${putBtn("bundle:shi", "この束へ")}</div><div class="items">${shi.length ? shi.map((c) => gcard(c, false)).join("") : '<p class="empty">そのままでいい原画をここへ。</p>'}</div></div></div>
      <div class="box"><ul class="rule"><li>作監の大島さんは火曜14:00から。1カット見るのに15分、直しは1か所30分。<b>確認メモ</b>で直す場所を伝えれば15分（違う場所を書くと5分むだ）。</li><li>仕上げのミナトは届いた順に、1カット3時間で塗る。撮影入れ（水曜10:00）までに塗り終わらないと、線のまま撮影に入る。</li></ul></div>
      <div class="foot"><button class="go" data-act="go" data-v="5" ${why ? "disabled" : ""}>次へ：渡す順番を決める</button>${why ? `<span class="why">${esc(why)}</span>` : ""}</div>`;
  }

  // ================= phase 5: hand on =================
  function list5() {
    const kan = E.CUT_IDS.filter((c) => s.bundle[c] === "kan"), shi = E.CUT_IDS.filter((c) => s.bundle[c] === "shi");
    return `<div class="box"><h2>作監に確認する束</h2><div class="items">${kan.length ? kan.map((c) => item("genga:" + c, s.memo[c].length ? "メモ：" + s.memo[c].join("・") : "メモなし")).join("") : '<p class="empty">なし</p>'}</div></div>
      <div class="box"><h2>仕上げへ渡す束</h2><div class="items">${shi.length ? shi.map((c) => item("genga:" + c)).join("") : '<p class="empty">なし</p>'}</div></div>
      <div class="box"><h2>渡す先</h2><div class="items">${["oshima", "minato"].map((p) => `<button class="item ${ui.sel === "person:" + p ? "on" : ""}" data-act="sel" data-v="person:${p}"><span class="tx"><b>${esc(title("person:" + p))}</b><small>${p === "oshima" ? "スタジオ・火曜14:00から" : "車で30分・届いた順に塗る"}</small></span></button>`).join("")}</div></div>`;
  }
  function deliverChart(d, real) {
    const rows = [];
    rows.push({ label: "大島さん", sub: "作監", segs: d.kan.map((k) => ({ a: k.start, b: k.end, cls: "kn", text: k.cut, title: `${k.cut} ${k.mins}分` })), note: d.kan.length ? `${E.fmt(d.kanDone)}に直し終わる${real ? "" : "見込み"}` : "作監に回すカットなし", ok: true });
    rows.push({ label: "佐伯", sub: "ミナトへ", segs: d.trips.map((t) => ({ a: t.depart, b: t.arrive, cls: "tr", title: t.cuts.join("・") })), marks: d.trips.map((t) => t.arrive), note: d.trips.map((t) => `${E.fmt(t.arrive)} ${t.cuts.join("・")}`).join("　／　"), ok: true });
    rows.push({ label: "ミナト", sub: "仕上げ", segs: d.paint.flatMap((p) => p.blocks.map(([a, b]) => ({ a, b, cls: "pt" + (p.ok ? "" : " late"), text: p.cut }))), note: d.paint.map((p) => `${p.cut} ${p.ok ? E.fmt(p.finish) + "に塗り上がり" : "線のまま"}`).join("　／　"), ok: d.paint.every((p) => p.ok) });
    return gantt(rows, T(1, 13), T(2, 10, 30), TUE_TICKS, E.SHOOT, [[T(2, 0), T(2, 8)]]);
  }
  function desk5() {
    const d = E.deliver(s, false), kanN = E.CUT_IDS.filter((c) => s.bundle[c] === "kan").length, shiN = 4 - kanN;
    const both = kanN && shiN;
    return `${saeki()}<div class="box"><h2>佐伯に、渡す順番を指示する</h2>${both ? `<div class="order"><button data-act="order" data-v="first" class="${s.order === "first" ? "on" : ""}" aria-pressed="${s.order === "first"}"><b>仕上げの束を先に届ける</b><span>13:00に出て13:30にミナトへ。作監の束は、直し終わったら届ける。</span></button><button data-act="order" data-v="together" class="${s.order === "together" ? "on" : ""}" aria-pressed="${s.order === "together"}"><b>作監の直しを待って、まとめて届ける</b><span>大島さんが直し終わってから、4カットいっしょにミナトへ。</span></button></div>` : `<p class="meta">${kanN ? "4カットとも作監に回す。直し終わったらミナトへ届ける。" : "4カットとも仕上げに回す。13:00に出て13:30にミナトへ。"}</p>`}</div>
      <div class="box"><h2>見込み <small>確認メモの数で計算（メモのないカットは、大島さんが探して1か所直すとみる）。メモにない直しがほかにあれば、そのぶん遅れる</small></h2>${deliverChart(d, false)}</div>
      <div class="box"><ul class="rule"><li>大島さん：火曜14:00から。見るのは1カット15分、直しは1か所30分（メモで伝えた場所は15分）。</li><li>ミナト：届いた順に1カット3時間。作業は火曜24:00まで、水曜は8:00から（斜線は作業しない時間）。撮影入れは水曜10:00。</li></ul></div>
      <div class="foot"><button class="sub" data-act="go" data-v="4">戻る：照合</button><button class="go" data-act="send">この順番で送る</button></div>`;
  }

  // ================= phase 6: the footage =================
  function verdict() {
    const r = s.res, first = E.CUT_IDS.map((c) => r.cut[c].remain[0]).find(Boolean);
    if (r.unpainted) return `${E.CUT_IDS.filter((c) => !r.cut[c].painted).join("・")}が線のまま撮影に入った……`;
    if (r.remain) return `つながったけど、${first.label}……`;
    return "4カット、ちゃんとつながった。";
  }
  function list6() { return `<div class="box"><h2>カット</h2><div class="items">${E.CUT_IDS.map((c) => { const r = s.res.cut[c]; return item("res:" + c, r.painted ? (r.remain.length ? `気になるところ ${r.remain.length}` : "いい") : "線のまま", r.painted && !r.remain.length ? "○" : "△", !(r.painted && !r.remain.length)); }).join("")}</div></div>`; }
  function frame(i) {
    if (i >= 4) return `<div class="frame">${svg("color", `<rect x="0" y="0" width="320" height="180" fill="#111"/><text x="160" y="96" text-anchor="middle" font-size="16" fill="#fff">おわり</text>`, "おわり")}</div><div class="cap"><button class="sub" data-act="play">もう一度見る</button></div><div class="sub2"></div>`;
    const c = E.CUT_IDS[i], r = s.res.cut[c];
    return `<div class="frame">${drawCut(c, r.f, r.painted ? "color" : "genga", "play")}</div><div class="cap"><b>${c}</b><span>${E.CUT[c].sec}秒</span>${r.painted ? "" : '<span class="line">線のまま（塗りが間に合わなかった）</span>'}</div><div class="sub2">${c === "C4" ? "<span class='c4line'>ミオ「……まだいたの？」</span>" : ""}</div>`;
  }
  function playVideo(from = 0) {
    clearTimeout(ui.vidTimer); ui.vid = from;
    const step = () => { const el = $("video"); if (!el || s.phase !== 6) return; el.innerHTML = frame(ui.vid); if (ui.vid < 4) { const ms = E.CUT[E.CUT_IDS[ui.vid]].sec * 1000; ui.vid++; ui.vidTimer = setTimeout(step, ms); } };
    step();
  }
  function desk6() {
    const r = s.res, d = r.d;
    const cuts = E.CUT_IDS.map((c) => { const x = r.cut[c], a = s.ret.cut[c].anim; return `<button class="rcut ${ui.sel === "res:" + c ? "on" : ""}" data-act="sel" data-v="res:${c}">${thumb("res:" + c)}<span><b>${c} ${esc(E.CUT[c].shot)}</b>　<small>原画：${esc(E.ANIMS[a].name)}さん</small><ul>
      ${x.kan ? (x.fixed.length ? x.fixed.map((f) => `<li><span class="ok">作監が直した</span>：${esc(f.label)}<br><small>発注で防げた：${esc(f.cause)}</small></li>`).join("") : '<li>作監：<span class="so">見たが、直すところはなかった</span></li>') : ""}
      ${x.remain.map((f) => `<li><span class="ng">${esc(f.label)}</span>：${esc(f.cause)}</li>`).join("")}
      <li>仕上げ：${E.fmt(x.arrive)}に届く → ${x.painted ? `<span class="ok">${E.fmt(x.finish)}に塗り上がり</span>` : '<span class="ng">撮影入れに間に合わず、線のまま</span>'}</li>
      ${!x.kan && !x.remain.length ? '<li><span class="ok">直すところなし</span></li>' : ""}</ul></span></button>`; }).join("");
    const log = s.ret.log.concat(d.kan.map((k) => ({ t: k.start, who: "大島", text: `${k.cut}を見る：${k.mins}分。${k.fixes.length ? "直した：" + k.fixes.map((f) => f.label + (f.memo ? "［メモあり］" : "")).join("、") : "直しなし"}${k.wrong.length ? `。メモの「${k.wrong.join("・")}」は違った` : ""}` })), d.trips.map((t) => ({ t: t.arrive, who: "佐伯", text: `ミナトに${t.cuts.join("・")}を届ける` })), d.paint.map((p) => ({ t: p.ok ? p.finish : E.SHOOT, who: "ミナト", text: p.ok ? `${p.cut}を塗り終える` : `${p.cut}は塗り終わらなかった` }))).sort((x, y) => x.t - y.t);
    return `${saeki()}<div class="box vid"><div id="video"></div></div>
      <div class="box"><p class="verdict">${esc(verdict())}</p><div class="counts"><span>作監で直した ${r.fixed}か所</span><span>見逃した ${r.remain}か所</span><span>作監に回したが直しなし ${r.wasted}カット</span><span>線のまま ${r.unpainted}カット</span></div></div>
      <div class="box"><h2>カットごとの結果</h2><div class="res">${cuts}</div></div>
      <div class="box"><h2>誰がどう動いたか</h2><ul class="log">${log.map((l) => `<li><span class="t">${E.fmt(l.t)}</span><span class="w">${esc(l.who)}</span><span>${esc(l.text)}</span></li>`).join("")}</ul></div>
      <div class="foot"><button class="go" data-act="restartAsk">最初からもう一度</button></div>`;
  }

  // ================= the picked thing =================
  const act = (label, a, data, opt = {}) => `<div class="a"><button data-act="${a}" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")} class="${opt.on ? "on" : ""}" ${opt.why ? "disabled" : ""}>${esc(label)}</button>${opt.note ? `<small>${esc(opt.note)}</small>` : ""}${opt.why ? `<span class="why">${esc(opt.why)}</span>` : ""}</div>`;
  const TODO = {
    1: ["コンテを読んで、4カットに要る資料を棚から「今回の資料」に出す。", "資料を押すと中身が出る。別の資料を見るように書いてあることもある。", "袋に入れるのは「3 発注」で。"],
    2: ["カットごとに、頼む原画マンを決める（一人2カットまで）。", "★のカットは、その得意な人でないと崩れる。苦手なものは★がなくても崩れる。", "空き予定と速さを見て、火曜12:00までに描き終わるように。"],
    3: ["原画マンごとの袋に、そのカットに要る資料を入れる。", "同じものの違う版を2つ入れると、電話がきて1時間遅れる。", "佐伯が回る順番を決めて、手配を頼む（月12:30出発）。"],
    4: ["コンテ・原画・資料・袋の記録を見比べ台に並べて、違うところを探す。", "直しが要りそうな原画は「作監に確認する束」、そのままでいい原画は「仕上げへ渡す束」へ。", "作監の束には、直す場所を確認メモで添えられる。"],
    5: ["佐伯に、どちらの束から届けるかを指示する。", "ミナトは届いた順に塗る。撮影入れまでに塗り終わらないカットは線のまま。"],
    6: ["映像を見る。自分が扱ったカットがつながったか。", "カットを押すと、何がどうしてそうなったかが出る。"],
  };
  function pane() {
    const r = ui.sel && valid(ui.sel) ? ui.sel : null;
    if (!r) return `<aside class="pane"><div class="box"><h2>この場面でやること</h2><ul class="todo">${TODO[s.phase].map((t) => `<li>${esc(t)}</li>`).join("")}</ul><p class="note" style="font-size:13px;color:var(--soft)">机の上のものを押すと、ここに詳しく出る。</p></div></aside>`;
    const [k, v] = split(r);
    let body = "", acts = [];
    if (k === "conte") {
      const c = E.CUT[v];
      body = `<div class="big">${thumb(r)}</div><dl><dt>カット</dt><dd>${v}　${esc(c.shot)}・${c.sec}秒${c.star ? `　<span class="star">★${esc(c.star)}</span>` : ""}</dd><dt>内容</dt><dd>${esc(c.text)}${c.line ? `<br>${esc(c.line)}` : ""}</dd><dt>場面</dt><dd>${esc(E.SCENE)}</dd>${s.assign[v] ? `<dt>原画</dt><dd>${esc(E.ANIMS[s.assign[v]].name)}さん</dd>` : ""}</dl>`;
      if (s.phase === 2) { acts = E.ANIM_IDS.map((a) => act(s.assign[v] === a ? `${E.ANIMS[a].name}さんに頼んでいる` : `${E.ANIMS[a].name}さんに頼む`, "assign", { c: v, a }, { on: s.assign[v] === a, why: s.assign[v] === a ? "" : E.assignWhy(s, v, a) })); if (s.assign[v]) acts.push(act("頼むのをやめる", "assign", { c: v, a: "" })); }
      if (s.phase === 4) acts = [0, 1, 2].map((i) => act(`見比べ台の${i + 1}に並べる`, "bench", { i, r }, { why: s.bench[i] === r ? "もう並べている" : "" }));
    }
    if (k === "mat") {
      const M = E.MATS[v];
      body = `<div class="big">${thumb(r)}</div><dl><dt>種類</dt><dd>${esc(M.kind)}</dd><dt>メモ</dt><dd>${esc(M.text)}</dd></dl>${M.see ? `<p>見る資料：${M.see.map((x) => `<button class="see" data-act="sel" data-v="mat:${x}">${esc(E.MATS[x].name)}</button>`).join(" ")}</p>` : ""}`;
      if (s.phase <= 3 && !s.ret) acts.push(act(s.tray.includes(v) ? "今回の資料から棚に戻す" : "今回の資料に出す", "tray", { m: v }, { on: s.tray.includes(v), note: s.tray.includes(v) && s.phase === 3 ? "棚に戻すと、袋からも出る" : "" }));
      if (s.phase === 3) for (const a of E.used(s)) { const inb = s.bags[a].includes(v); acts.push(act(inb ? `${E.ANIMS[a].name}さんの袋から出す` : `${E.ANIMS[a].name}さんの袋に入れる（${E.cutsOf(s, a).join("・")}）`, "bag", { a, m: v }, { on: inb, why: E.bagWhy(s, a, v) })); }
      if (s.phase === 4) acts = [0, 1, 2].map((i) => act(`見比べ台の${i + 1}に並べる`, "bench", { i, r }, { why: s.bench[i] === r ? "もう並べている" : "" }));
    }
    if (k === "anim") {
      const A = E.ANIMS[v];
      body = `<div class="big">${thumb(r)}</div><dl><dt>作例</dt><dd>${esc(A.sample)}</dd><dt>得意</dt><dd>${esc(A.good || "とくになし")}${A.good === "手" ? "（★手元を描ける）" : A.good === "芝居" ? "（★芝居を描ける）" : ""}</dd><dt>苦手</dt><dd>${esc(A.bad || "とくになし")}</dd><dt>速さ</dt><dd>1カット${A.speed}時間</dd><dt>空き</dt><dd>${esc(A.availText)}</dd><dt>場所</dt><dd>${esc(A.where)}</dd></dl><p>${esc(A.note)}</p>`;
      if (s.phase === 2) acts = E.CUT_IDS.map((c) => act(s.assign[c] === v ? `${c}を頼んでいる（やめる）` : `${c}を頼む${s.assign[c] ? `（いまは${E.ANIMS[s.assign[c]].name}さん）` : ""}`, "assign", { c, a: s.assign[c] === v ? "" : v }, { on: s.assign[c] === v, why: s.assign[c] === v ? "" : E.assignWhy(s, c, v) }));
      if (s.phase === 3 && s.route.includes(v)) { const i = s.route.indexOf(v); acts = [act("先に回る", "route", { a: v, d: -1 }, { why: i === 0 ? "もういちばん先" : "" }), act("あとに回る", "route", { a: v, d: 1 }, { why: i === s.route.length - 1 ? "もういちばんあと" : "" })]; }
    }
    if (k === "bag") {
      body = s.ret ? bagRecord(v) : `<ul class="bagrec"><li>カット：${E.cutsOf(s, v).join("・") || "なし"}</li><li>資料：${s.bags[v].map((m) => esc(E.MATS[m].name)).join("、") || "なし"}</li></ul>`;
      if (s.phase === 4) acts = [0, 1, 2].map((i) => act(`見比べ台の${i + 1}に並べる`, "bench", { i, r }, { why: s.bench[i] === r ? "もう並べている" : "" }));
    }
    if (k === "genga") {
      body = `<div class="big">${thumb(r)}</div><dl><dt>原画</dt><dd>${esc(gmeta(v))}</dd><dt>ひとこと</dt><dd>${esc(E.ANIMS[s.ret.cut[v].anim].name)}さん「${esc(E.ANIMS[s.ret.cut[v].anim].back)}」</dd></dl>`;
      if (s.phase === 4) {
        acts.push(act("コンテと並べる（見比べ台の1と2）", "pair", { c: v }));
        acts.push(...[0, 1, 2].map((i) => act(`見比べ台の${i + 1}に並べる`, "bench", { i, r }, { why: s.bench[i] === r ? "もう並べている" : "" })));
        acts.push(act(s.bundle[v] === "kan" ? "作監に確認する束に入っている" : "作監に確認する束へ", "bundle", { c: v, w: "kan" }, { on: s.bundle[v] === "kan", why: s.bundle[v] === "kan" ? "もう入っている" : "" }));
        acts.push(act(s.bundle[v] === "shi" ? "仕上げへ渡す束に入っている" : "仕上げへ渡す束へ", "bundle", { c: v, w: "shi" }, { on: s.bundle[v] === "shi", why: s.bundle[v] === "shi" ? "もう入っている" : "" }));
        if (s.bundle[v] === "kan") acts.push(`<div class="a"><small>確認メモ（直す場所を大島さんに伝える）</small><div class="row">${E.CATS.map((cat) => `<button class="chipbtn ${s.memo[v].includes(cat) ? "on" : ""}" data-act="memo" data-c="${v}" data-cat="${cat}" aria-pressed="${s.memo[v].includes(cat)}">${cat}</button>`).join("")}</div></div>`);
      }
    }
    if (k === "person") {
      body = v === "oshima" ? `<p>作画監督。火曜は午前中ほかの話数を見ていて、14:00から空く。</p><dl><dt>見る</dt><dd>1カット15分</dd><dt>直す</dt><dd>1か所30分。確認メモで場所を伝えれば15分。違う場所を書くと5分むだ。</dd></dl>` : `<p>仕上げ（色を塗る会社）。スタジオから車で30分。</p><dl><dt>塗る</dt><dd>届いた順に、1カット3時間</dd><dt>時間</dt><dd>火曜24:00まで。水曜は8:00から</dd><dt>締切</dt><dd>撮影入れ 水曜10:00。塗り終わらないカットは線のまま撮影に入る</dd></dl>`;
    }
    if (k === "res") {
      const x = s.res.cut[v];
      body = `<div class="big">${thumb(r)}</div><dl><dt>原画</dt><dd>${esc(E.ANIMS[s.ret.cut[v].anim].name)}さん</dd><dt>作監</dt><dd>${x.kan ? (x.fixed.length ? "直した：" + x.fixed.map((f) => `${esc(f.label)}（${esc(f.cause)}）`).join("、") : "見たが、直すところはなかった") : "回していない"}</dd><dt>仕上げ</dt><dd>${x.painted ? E.fmt(x.finish) + "に塗り上がり" : "線のまま"}</dd></dl>${x.remain.length ? `<p><b>残ったところ</b></p><ul class="bagrec">${x.remain.map((f) => `<li>${esc(f.label)}：${esc(f.cause)}</li>`).join("")}</ul>` : ""}`;
      acts = [act("このカットから映像を見る", "playFrom", { i: E.CUT[v].i })];
    }
    return `<aside class="pane"><div class="box"><h2>${esc(title(r))}</h2>${body}${acts.length ? `<div class="acts"><h3>${esc(title(r))}にできること</h3>${acts.join("")}</div>` : ""}</div></aside>`;
  }

  // ================= dialogs =================
  const RULES = `<ul>
    <li>あなたは制作デスク。演出の三宅さんから届いた4カットのコンテを、新人の制作進行・佐伯と一緒に原画マンへ発注し、戻った原画を確かめて仕上げへ渡す。</li>
    <li>目標は、水曜10:00の撮影入れで4カットがつながる映像にすること。</li>
    <li>机で考えている間は時間が進まない。時間が進むのは、佐伯を動かしたとき（月12:30の手配と、火13:00の受け渡し）だけ。</li>
    <li>机の上のものは押すと右に詳しく出て、そこからできることを選べる。ドラッグして置き場所に落としてもよい。</li>
    <li>袋にない設定は、原画マンが記憶で描く。同じものの違う版が2つ入っていると、電話がきて1時間遅れる。</li>
    <li>★のカットは、その得意な人でないと崩れる。苦手なものは★がなくても崩れる。</li>
    <li>作監の大島さんは直すが時間がかかる。仕上げのミナトは届いた順に塗る。</li>
  </ul>`;
  function modal() {
    if (ui.modal === "intro") return `<div class="modal-bg"><div class="dlg" role="dialog" aria-modal="true" aria-label="はじめに"><h2>4カットの発注（試作）</h2><p>10分ほどの試作です。</p>${RULES}<div class="acts2"><button data-act="start">はじめる</button></div></div></div>`;
    if (ui.modal === "help") return `<div class="modal-bg"><div class="dlg" role="dialog" aria-modal="true" aria-label="遊び方"><h2>遊び方</h2>${RULES}<div class="acts2"><button data-act="close">閉じる</button></div></div></div>`;
    if (ui.modal === "restart") return `<div class="modal-bg"><div class="dlg" role="dialog" aria-modal="true" aria-label="最初から"><h2>最初からやり直しますか？</h2><p>いまの発注は消える。</p><div class="acts2"><button data-act="restart">やり直す</button><button class="sub" data-act="close">やめる</button></div></div></div>`;
    if (ui.modal === "log" && s.ret) return `<div class="modal-bg"><div class="dlg" role="dialog" aria-modal="true" aria-label="昨日からの記録"><h2>昨日からの記録</h2><ul class="log">${s.ret.log.map((l) => `<li><span class="t">${E.fmt(l.t)}</span><span class="w">${esc(l.who)}</span><span>${esc(l.text)}</span></li>`).join("")}</ul><div class="acts2"><button data-act="close">原画を確かめる</button></div></div></div>`;
    return "";
  }

  // ================= render =================
  const LIST = { 1: list1, 2: list2, 3: list3, 4: list4, 5: list5, 6: list6 };
  const DESK = { 1: desk1, 2: desk2, 3: desk3, 4: desk4, 5: desk5, 6: desk6 };
  function render() {
    if (ui.sel && !valid(ui.sel)) ui.sel = null;
    const y = window.scrollY, oldPane = document.querySelector(".pane"), py = oldPane && ui.paneFor === ui.sel ? oldPane.scrollTop : 0;
    const oldList = document.querySelector(".list"), ly = oldList && ui.listFor === s.phase ? oldList.scrollTop : 0;
    $("app").innerHTML = header() + `<div class="wrap"><aside class="list">${LIST[s.phase]()}</aside><main class="desk">${DESK[s.phase]()}</main>${pane()}</div>`;
    $("modal-root").innerHTML = modal();
    ui.flash = "";
    if (s.phase === 6 && $("video")) { if (!$("video").innerHTML) $("video").innerHTML = frame(Math.min(ui.vid, 4)); }
    window.scrollTo(0, y);
    const np = document.querySelector(".pane"); if (np) np.scrollTop = py; ui.paneFor = ui.sel;
    const nl = document.querySelector(".list"); if (nl) nl.scrollTop = ly; ui.listFor = s.phase;
    topHeight();
  }
  // the header wraps on narrow windows; the sticky list and detail sit just under it
  function topHeight() { const t = document.querySelector(".top"); if (t) document.documentElement.style.setProperty("--top", `${Math.ceil(t.getBoundingClientRect().height)}px`); }
  window.addEventListener("resize", topHeight);
  function scrollPane() { if (window.innerWidth <= 860) { const p = document.querySelector(".pane"); if (p) setTimeout(() => p.scrollIntoView({ behavior: "smooth", block: "start" }), 30); } }

  // ================= input =================
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act, d = b.dataset;
    if (a === "sel") { ui.sel = ui.sel === d.v ? null : d.v; save(); render(); if (ui.sel) scrollPane(); return; }
    if (a === "put") { if (ui.sel) put(d.zone, ui.sel); save(); render(); return; }
    if (a === "go") { const p = +d.v, why = E.go(s, p); if (why) ui.flash = why; else { ui.sel = null; window.scrollTo(0, 0); } save(); render(); if (p === 6) playVideo(0); return; }
    if (a === "tray") { ui.flash = E.trayToggle(s, d.m); save(); render(); return; }
    if (a === "assign") { ui.flash = E.assign(s, d.c, d.a || null); save(); render(); return; }
    if (a === "bag") { ui.flash = E.bagToggle(s, d.a, d.m); save(); render(); return; }
    if (a === "bagDel") { ui.flash = E.bagToggle(s, d.a, d.m); save(); render(); return; }
    if (a === "route") { ui.flash = E.routeMove(s, d.a, +d.d); save(); render(); return; }
    if (a === "dispatch") { const why = E.dispatch(s); if (why) ui.flash = why; else { ui.sel = null; ui.modal = "log"; window.scrollTo(0, 0); } save(); render(); return; }
    if (a === "bench") { ui.flash = E.bench(s, +d.i, d.r); save(); render(); return; }
    if (a === "benchClear") { E.bench(s, +d.i, null); save(); render(); return; }
    if (a === "pair") { E.bench(s, 0, "conte:" + d.c); E.bench(s, 1, "genga:" + d.c); save(); render(); return; }
    if (a === "bundle") { ui.flash = E.bundle(s, d.c, d.w || null); save(); render(); return; }
    if (a === "memo") { ui.flash = E.memo(s, d.c, d.cat); save(); render(); return; }
    if (a === "order") { ui.flash = E.setOrder(s, d.v); save(); render(); return; }
    if (a === "send") { const why = E.send(s); if (why) ui.flash = why; else { ui.sel = null; window.scrollTo(0, 0); } save(); render(); if (!why) playVideo(0); return; }
    if (a === "play") { playVideo(0); return; }
    if (a === "playFrom") { const v = document.querySelector(".vid"); if (v) v.scrollIntoView({ behavior: "smooth", block: "start" }); playVideo(+d.i); return; }
    if (a === "log") { ui.modal = "log"; save(); render(); return; }
    if (a === "help") { ui.modal = "help"; render(); return; }
    if (a === "start" || a === "close") { ui.modal = null; save(); render(); return; }
    if (a === "restartAsk") { ui.modal = "restart"; render(); return; }
    if (a === "restart") { clearTimeout(ui.vidTimer); s = E.newGame(); ui.sel = null; ui.modal = null; ui.vid = 0; save(); render(); window.scrollTo(0, 0); return; }
  });
  // drag and drop (mouse); the same moves are on every item's detail and on the zones' buttons
  let dragRef = null;
  document.addEventListener("dragstart", (ev) => { const el = ev.target.closest && ev.target.closest("[data-drag]"); if (!el) return; dragRef = el.dataset.drag; try { ev.dataTransfer.setData("text/plain", dragRef); ev.dataTransfer.effectAllowed = "move"; } catch (e) { /* old browsers */ } });
  document.addEventListener("dragend", () => { dragRef = null; document.querySelectorAll(".zone.over").forEach((z) => z.classList.remove("over")); });
  document.addEventListener("dragover", (ev) => { const z = ev.target.closest && ev.target.closest("[data-drop]"); if (!z || !dragRef || !accepts(z.dataset.drop, dragRef)) return; ev.preventDefault(); document.querySelectorAll(".zone.over").forEach((x) => x !== z && x.classList.remove("over")); z.classList.add("over"); });
  document.addEventListener("dragleave", (ev) => { const z = ev.target.closest && ev.target.closest("[data-drop]"); if (z && !z.contains(ev.relatedTarget)) z.classList.remove("over"); });
  document.addEventListener("drop", (ev) => { const z = ev.target.closest && ev.target.closest("[data-drop]"); if (!z || !dragRef) return; ev.preventDefault(); const r = dragRef; dragRef = null; if (put(z.dataset.drop, r)) ui.sel = r; save(); render(); });
  document.addEventListener("toggle", (ev) => { if (ev.target.matches && ev.target.matches("details[data-k=shelf]")) ui.shelfOpen = ev.target.open; }, true);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ["help", "restart", "log"].includes(ui.modal)) { ui.modal = null; save(); render(); } });
  window.addEventListener("pagehide", () => { if (s) save(); });

  if (!load()) { s = E.newGame(); ui.modal = "intro"; }
  render();
  if (s.phase === 6) playVideo(0);
})();
</script>
</body>
</html>
