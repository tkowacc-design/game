<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4カットの発注 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* The desk of a 制作デスク: four cuts of storyboard come in, you gather the model sheets, pick the animators,
     pack each one's bag, send 佐伯 round, then check what comes back and split it between the 作監 and 仕上げ.
     Left: what is on the desk (list). Centre: the work surface. Right: the picked thing and what you can do with it. */
  :root {
    --bg: #eceef3; --panel: #ffffff; --ink: #1d2236; --soft: #4a5068; --line: #d3d7e1; --navy: #1f2a44;
    --yellow: #ffd54f; --sel: #f2b400; --red: #b3262e; --orange: #8a4b00; --green: #11693f; --blue: #1f56b0;
    --zone: #f6f7fa; --hot: #fff7d6; --kan: #fdeeee; --shi: #ecf6f0;
    --font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { min-width: 0; overflow-x: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }
  .top { position: sticky; top: 0; z-index: 6; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px 18px; padding: 8px 18px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 17px; color: #d6dcef; }
  .top h1 small { font-size: 12px; font-weight: 400; margin-left: 6px; color: #b9c2dc; }
  .steps { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; flex-wrap: wrap; }
  .steps button { border: 0; background: #2f3c60; color: #c9d1e8; padding: 6px 10px; font-size: 13px; font-weight: 700; min-height: 36px; }
  .steps button.on { background: var(--yellow); color: var(--ink); }
  .steps button.done { background: #3c4b74; color: #fff; }
  .steps button:disabled { background: #283456; color: #aab4d0; }
  .steps button.on, .steps button.on:disabled { background: var(--yellow); color: var(--ink); }
  .clock { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .clock small { font-size: 13px; font-weight: 400; color: #c9d1e8; margin-left: 6px; }
  .top .sp { flex: 1; }
  .top .tb { border: 0; padding: 6px 12px; font-weight: 700; background: #34426a; color: #fff; min-height: 36px; }

  .wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; gap: 14px; padding: 14px 16px 40px; max-width: 1680px; margin: 0 auto; align-items: start; }
  .list, .desk, .pane { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* the list and the detail stay beside the desk while it scrolls, so a sheet can be dragged onto any part of it */
  .pane, .list { position: sticky; top: calc(var(--top, 52px) + 10px); max-height: calc(100vh - var(--top, 52px) - 20px); overflow-y: auto; }
  details.box > summary { cursor: pointer; font-weight: 700; font-size: 16px; min-height: 32px; display: flex; align-items: center; gap: 8px; }
  details.box > summary small { font-size: 12px; color: var(--soft); font-weight: 400; }
  .box { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }
  .box > h2 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .box > h2 small { font-size: 12px; color: var(--soft); font-weight: 400; }
  h3 { margin: 10px 0 6px; font-size: 14px; color: var(--soft); }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .items.wrapit { flex-direction: row; flex-wrap: wrap; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; padding: 4px 8px 4px 4px; min-height: 44px; font-size: 14px; position: relative; }
  .item:hover { border-color: #9aa2b8; }
  .item.on { outline: 3px solid var(--sel); outline-offset: -1px; border-color: var(--sel); background: #fffbea; }
  .item .th { flex: 0 0 64px; width: 64px; }
  .item .th svg { display: block; width: 64px; height: auto; }
  .item .tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .item .tx b { font-size: 14px; }
  .item .tx small { font-size: 12px; color: var(--soft); }
  .item .mk { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--green); white-space: nowrap; }
  .item .mk.warn { color: var(--red); }
  .items.wrapit .item { width: auto; flex: 0 1 auto; }
  .chipbtn { border: 1px solid #9aa2b8; background: #fff; padding: 4px 8px; font-size: 13px; min-height: 32px; }
  .chipbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  .saeki { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--blue); padding: 10px 12px; font-size: 15px; line-height: 1.6; }
  .saeki b { flex: 0 0 auto; color: var(--blue); }
  .saeki.warn { border-left-color: var(--red); }

  .zone { background: var(--zone); border: 2px dashed #b8bfcf; padding: 8px 10px; min-width: 0; }
  .zone.hot { background: var(--hot); border-color: var(--sel); }
  .zone.over { background: #fff0b3; border-style: solid; }
  .zone .zh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .zone .zh b { font-size: 15px; }
  .zone .zh small { color: var(--soft); font-size: 12px; }
  .zone .zh .put { margin-left: auto; }
  .zone .empty { color: var(--soft); font-size: 13px; padding: 6px 0; }
  .zone.kan { background: var(--kan); }
  .zone.shi { background: var(--shi); }
  .zone.kan.hot, .zone.shi.hot { background: var(--hot); }
  /* the basket of sheets stays at the bottom of the screen in step 1, so a sheet can always be dropped into it */
  .zone.traybar { position: sticky; bottom: 0; z-index: 3; max-height: 32vh; overflow-y: auto; box-shadow: 0 -6px 14px rgba(15, 20, 36, .12); }
  .put { border: 0; background: var(--sel); color: var(--ink); font-weight: 700; padding: 6px 10px; min-height: 36px; font-size: 13px; }

  .conte { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .cpanel { border: 1px solid var(--line); background: #fbfaf2; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .cpanel.on { outline: 3px solid var(--sel); }
  .cpanel svg { width: 100%; height: auto; display: block; }
  .cpanel .ch { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .cpanel .ch b { font-size: 16px; }
  .cpanel .ch span { font-size: 13px; color: var(--soft); }
  .cpanel p { margin: 0; font-size: 14px; line-height: 1.55; }
  .star { color: var(--red); font-weight: 700; }
  .scene { font-size: 14px; color: var(--soft); margin: 0 0 8px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .cutcard { border: 1px solid var(--line); background: #fff; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .cutcard.on { outline: 3px solid var(--sel); }
  .cutcard svg { width: 100%; height: auto; display: block; }
  .cutcard b { font-size: 14px; }
  .who { font-size: 13px; }
  .who.none { color: var(--red); font-weight: 700; }

  .anim .samp { display: flex; gap: 8px; align-items: center; }
  .anim .samp svg { width: 96px; flex: 0 0 96px; height: auto; }
  .anim ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
  .anim .cuts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .fit { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .fit.ok { color: var(--green); } .fit.ng { color: var(--red); }

  .gantt { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .grow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: center; }
  .grow .gl { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .grow .gl small { display: block; font-weight: 400; color: var(--soft); font-size: 11px; }
  .gbar { position: relative; height: 26px; background: #eef0f5; border: 1px solid var(--line); overflow: hidden; }
  .gseg { position: absolute; top: 0; bottom: 0; }
  .gseg.av { background: #cfead9; top: 4px; bottom: 4px; }
  .gseg.wk { background: #2b6b4a; top: 3px; bottom: 3px; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
  .gseg.wk.late { background: var(--red); }
  .gseg.kn { background: #8a3b3f; top: 3px; bottom: 3px; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; border-right: 1px solid #fff; }
  .gseg.tr { background: #1f56b0; top: 6px; bottom: 6px; }
  .gseg.pt { background: #2b6b4a; top: 3px; bottom: 3px; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; border-right: 1px solid #fff; }
  .gseg.pt.late { background: var(--red); }
  .gseg.off { background: repeating-linear-gradient(45deg, #e2e5ec, #e2e5ec 4px, #d6dae3 4px, #d6dae3 8px); }
  .gmark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--blue); }
  .gdue { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--red); }
  .gaxis { position: relative; height: 16px; margin-left: 100px; color: var(--soft); font-size: 11px; }
  .gaxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .gnote { font-size: 12px; font-weight: 700; margin: 0 0 0 100px; }
  .gnote.ok { color: var(--green); } .gnote.ng { color: var(--red); }

  .bag .mats { display: flex; gap: 6px; flex-wrap: wrap; }
  .mchip { display: inline-flex; align-items: stretch; border: 1px solid #9aa2b8; background: #fff; font-size: 13px; }
  .mchip button { border: 0; background: transparent; padding: 4px 8px; min-height: 34px; }
  .mchip button + button { border-left: 1px solid var(--line); color: var(--red); font-weight: 700; }
  .route { display: flex; flex-direction: column; gap: 6px; }
  .rrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--line); padding: 6px 8px; font-size: 14px; }
  .rrow .n { font-weight: 700; font-size: 18px; text-align: center; }
  .rrow small { color: var(--soft); }
  .rrow .ud { display: flex; gap: 4px; }
  .rrow .ud button { border: 1px solid #9aa2b8; background: #fff; width: 40px; min-height: 36px; font-weight: 700; }
  .map { font-size: 12px; color: var(--soft); line-height: 1.6; margin: 6px 0 0; }

  .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .slot { min-height: 150px; display: flex; flex-direction: column; gap: 6px; }
  .slot svg { width: 100%; height: auto; display: block; }
  .slot .st { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .slot .st b { font-size: 14px; }
  .slot .st .sb { margin-left: auto; display: flex; gap: 6px; }
  .slot .st .sb button { border: 1px solid #9aa2b8; background: #fff; min-height: 32px; font-size: 12px; padding: 2px 8px; }
  .slot .st .sb .put { background: var(--sel); border-color: var(--sel); font-weight: 700; }
  .meta { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0; }
  .meta small { color: var(--soft); }
  .bagrec { font-size: 13px; line-height: 1.6; margin: 0; padding-left: 18px; }
  .gcard { background: #fff; border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .gcard .gh { display: flex; align-items: center; gap: 8px; }
  .gcard .gh button.nm { border: 0; background: transparent; padding: 0; text-align: left; display: flex; gap: 8px; align-items: center; min-height: 40px; }
  .gcard .gh svg { width: 72px; height: auto; display: block; }
  .gcard .gh .back { margin-left: auto; border: 1px solid #9aa2b8; background: #fff; min-height: 34px; font-size: 12px; padding: 2px 8px; }
  .gcard.on { outline: 3px solid var(--sel); }
  .memo { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--soft); }

  .order { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .order button { text-align: left; border: 2px solid var(--line); background: #fff; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
  .order button b { font-size: 15px; }
  .order button span { font-size: 13px; color: var(--soft); line-height: 1.5; }
  .order button.on { border-color: var(--sel); background: #fffbea; }
  .rule { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.65; color: var(--soft); }
  .rule b { color: var(--ink); }

  .foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .go { border: 0; background: var(--navy); color: #fff; font-weight: 700; font-size: 16px; padding: 10px 18px; min-height: 52px; }
  .go:disabled { background: #c9cdd8; color: #343a4f; }
  .sub { border: 1px solid #9aa2b8; background: #fff; font-weight: 700; padding: 8px 14px; min-height: 44px; }
  .why { font-size: 13px; color: var(--red); font-weight: 700; }

  .pane .big svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
  .pane dl { margin: 6px 0 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 8px; font-size: 13px; line-height: 1.55; }
  .pane dt { color: var(--soft); }
  .pane dd { margin: 0; }
  .pane p { margin: 6px 0 0; font-size: 14px; line-height: 1.6; }
  .acts { border-top: 2px solid var(--navy); margin-top: 12px; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .acts h3 { margin: 0 0 2px; color: var(--ink); font-size: 14px; }
  .acts .a { display: flex; flex-direction: column; gap: 2px; }
  .acts .a button { text-align: left; border: 1px solid var(--navy); background: #fff; font-weight: 700; padding: 8px 10px; min-height: 44px; font-size: 14px; }
  .acts .a button.on { background: var(--navy); color: #fff; }
  .acts .a button:disabled { border-color: var(--line); background: #eef0f4; color: #545b72; }
  .acts .a small { font-size: 12px; color: var(--soft); }
  .acts .a .why { font-size: 12px; }
  .acts .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .row button { flex: 1 1 90px; }
  .see { border: 0; background: transparent; color: var(--blue); text-decoration: underline; padding: 0 2px; font-size: 13px; min-height: 28px; }
  .todo { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }

  .pic { display: block; }
  .vid { background: #111; padding: 8px; }
  .vid .frame svg { width: 100%; height: auto; display: block; }
  .vid .cap { color: #fff; font-size: 14px; display: flex; gap: 10px; align-items: baseline; margin-top: 6px; min-height: 22px; flex-wrap: wrap; }
  .vid .sub2 { color: #fff; font-size: 18px; text-align: center; min-height: 28px; margin-top: 4px; }
  .vid .line { color: #ffd54f; font-weight: 700; }
  .res { display: flex; flex-direction: column; gap: 8px; }
  .rcut { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; background: #fff; border: 1px solid var(--line); padding: 8px; text-align: left; }
  .rcut.on { outline: 3px solid var(--sel); }
  .rcut svg { width: 100%; height: auto; display: block; }
  .rcut ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
  .ok { color: var(--green); font-weight: 700; } .ng { color: var(--red); font-weight: 700; } .so { color: var(--orange); font-weight: 700; }
  .verdict { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .counts span { background: #f0f2f7; border: 1px solid var(--line); padding: 6px 10px; font-size: 14px; }
  .log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.5; }
  .log li { display: grid; grid-template-columns: 70px 54px minmax(0, 1fr); gap: 6px; }
  .log li .t { color: var(--soft); white-space: nowrap; }
  .log li .w { font-weight: 700; }

  #modal-root .modal-bg { position: fixed; inset: 0; z-index: 20; background: rgba(15, 20, 36, .55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .dlg { width: min(680px, 100%); background: #fff; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .dlg h2 { margin: 0; font-size: 21px; }
  .dlg p { margin: 0; font-size: 15px; line-height: 1.65; }
  .dlg ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65; display: grid; gap: 4px; }
  .dlg .acts2 { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .dlg .acts2 button { flex: 1 1 180px; min-height: 50px; border: 0; background: var(--navy); color: #fff; font-weight: 700; font-size: 16px; }
  .dlg .acts2 button.sub { background: #e3e6ee; color: var(--ink); }

  @keyframes rain { from { transform: translate(2px, -8px); } to { transform: translate(-2px, 8px); } }
  @keyframes capoIn { from { transform: translate(-16px, 14px); opacity: .2; } to { transform: none; opacity: 1; } }
  @keyframes press { from { transform: translateY(10px); } to { transform: none; } }
  @keyframes vib { from { transform: translateY(-.8px); } to { transform: translateY(.8px); } }
  @keyframes doorOpen { from { transform: scaleX(3); } to { transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes turnGood { 0%, 55% { opacity: 0; transform: translateX(5px); } 100% { opacity: 1; transform: none; } }
  @keyframes turnStiff { from { opacity: 0; } to { opacity: 1; } }
  .play .rain line { animation: rain .45s linear infinite; }
  .play .capo-g { animation: capoIn 1.4s ease-out both; }
  .play .fingers { animation: press .7s ease-out both; }
  .play .str { animation: vib .09s linear 1s 14 alternate; }
  .play .door-p { transform-box: view-box; transform-origin: 26px 85px; animation: doorOpen 1s ease-out both; }
  .play .mio { animation: fadeIn .6s ease-out .6s both; }
  .play .turnface { animation: turnGood 1.8s ease-in-out .9s both; }
  .play.stiff .turnface { animation: turnStiff .05s steps(1) .7s both; }

  @media (max-width: 1240px) {
    .wrap { grid-template-columns: 200px minmax(0, 1fr) 290px; gap: 10px; padding: 12px 10px 40px; }
    .list .item .th { flex-basis: 48px; width: 48px; }
    .list .item .th svg { width: 48px; }
  }
  @media (max-width: 999px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 300px; }
    .list { position: static; max-height: none; overflow: visible; }
    .list { grid-column: 1; grid-row: 1; }
    .desk { grid-column: 1; grid-row: 2; }
    .pane { grid-column: 2; grid-row: 1 / span 2; }
    .list .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .list .item .th { flex-basis: 48px; width: 48px; }
    .list .item .th svg { width: 48px; }
  }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 40px; }
    .list, .desk, .pane { grid-column: auto; grid-row: auto; position: static; max-height: none; overflow: visible; }
    .desk { order: 1; } .list { order: 2; } .pane { order: 3; }
    .zone.traybar { position: static; max-height: none; box-shadow: none; }
    .top { position: static; padding: 8px 10px; }
    .top h1 small { display: none; }
    .steps button { padding: 4px 8px; font-size: 12px; }
    details.box > summary { min-height: 44px; }
    .slots, .grid3 { grid-template-columns: minmax(0, 1fr); }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .order, .grid2 { grid-template-columns: minmax(0, 1fr); }
    .steps button, .top .tb { min-height: 44px; }
    .chipbtn, .put, .slot .st .sb button, .gcard .gh .back, .mchip button, .see, .gcard .gh button.nm { min-height: 44px; }
    .chipbtn, .slot .st .sb button, .gcard .gh .back { min-width: 44px; }
    .rrow .ud button { min-height: 44px; width: 44px; }
    .grow { grid-template-columns: 70px minmax(0, 1fr); }
    .gaxis, .gnote { margin-left: 78px; }
    .rcut { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    .conte { grid-template-columns: minmax(0, 1fr); }
    .clock { font-size: 18px; }
    .log li { grid-template-columns: 62px minmax(0, 1fr); }
    .log li .w { grid-column: 2; }
    .log li span:last-child { grid-column: 2; }
  }
</style>
</head>
<body>

<script id="engine">
const Engine = (() => {
  "use strict";
  // Times are minutes from Monday 0:00. Desk work (reading, packing, sorting) takes no time;
  // the clock moves only when 佐伯 goes out (Monday 12:30) and when the bundles are sent (Tuesday 13:00).
  const VERSION = 1;
  const T = (d, h, m = 0) => d * 1440 + h * 60 + m;
  const DAYS = ["月", "火", "水"];
  function fmt(t) { if (t === null || t === undefined) return "—"; const d = Math.floor(t / 1440), r = t - d * 1440; return `${DAYS[d] || ""} ${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`; }
  const DEPART = T(0, 12, 30), DUE = T(1, 12), BACK = T(1, 13), KAN = T(1, 14), SHOOT = T(2, 10);
  const PAINT_WIN = [[T(1, 13), T(2, 0)], [T(2, 8), T(2, 10)]];
  const MIN = { paint: 180, check: 15, fix: 30, fixMemo: 15, wrongMemo: 5, hand: 10, call: 60, trip: 30 };
  const MAX_CUTS = 2;
  const CATS = ["服", "小物", "楽器", "背景", "手", "芝居"];

  const SCENE = "第1話 Bパート「雨の部室」　11月・放課後";
  const CUTS = [
    { id: "C1", shot: "引き", sec: 3, star: "", hand: false, keys: 2, needs: ["yui", "rain"],
      text: "夕方の部室。窓の外は雨。ユイが窓ぎわの椅子に座って、外を見ている。", line: "" },
    { id: "C2", shot: "バストアップ", sec: 4, star: "", hand: true, keys: 3, needs: ["yui", "guitar", "capo", "handBad"],
      text: "ユイ、ひざのギターにカポをつける（2フレット）。手が映る。", line: "" },
    { id: "C3", shot: "手元アップ", sec: 3, star: "手元", hand: true, keys: 3, needs: ["yui", "capo", "chord", "handBad"],
      text: "Gのコードを押さえて、ひと鳴らし。指の形が見せ場。", line: "" },
    { id: "C4", shot: "ドア側", sec: 4, star: "芝居", hand: false, keys: 4, needs: ["yui", "mio", "muffler", "door", "stiff"],
      text: "ドアが開いて、ミオ（外から来た。マフラー）。ユイ、溜めてから左へ振り向く。ドア側は新しい背景。", line: "ミオ「……まだいたの？」" },
  ];
  const CUT = Object.fromEntries(CUTS.map((c, i) => [c.id, { ...c, i }]));
  const CUT_IDS = CUTS.map((c) => c.id);

  const MATS = {
    yui_w: { kind: "人物", name: "ユイ（冬服）", group: "yui", text: "10月〜3月。紺のブレザーに赤いリボン。長袖。" },
    yui_s: { kind: "人物", name: "ユイ（夏服）", group: "yui", text: "6月〜9月。白の半袖シャツに赤いリボン。" },
    mio_w: { kind: "人物", name: "ミオ（冬服）", group: "mio", text: "10月〜3月。紺のブレザー。外から来たときはマフラーを巻く（小物「マフラー（ミオ）」を見る）。", see: ["muffler"] },
    mio_p: { kind: "人物", name: "ミオ（私服）", group: "mio", text: "休日の回。緑のパーカー。" },
    guitar_a: { kind: "小物", name: "ギター（アコースティック）", group: "guitar", text: "ユイが部室で弾くギター。カポをつけるときは小物「カポタスト」を見る。", see: ["capo"] },
    guitar_e: { kind: "小物", name: "ギター（エレキ）", group: "guitar", text: "ライブの回で使う赤いエレキ。" },
    capo: { kind: "小物", name: "カポタスト", text: "黒。つける位置はコンテのとおり。" },
    muffler: { kind: "小物", name: "マフラー（ミオ）", text: "赤のチェック。首にひと巻きして、片方を前に垂らす。" },
    bg_rain: { kind: "背景", name: "部室（夕方・雨）", group: "room", text: "窓は右、ドアは左の壁。雨の日は窓に雨。" },
    bg_day: { kind: "背景", name: "部室（昼・晴れ）", group: "room", text: "いつもの晴れた部室。窓は右、ドアは左の壁。" },
    bg_door: { kind: "背景", name: "部室（ドア側）", text: "窓のほうからドアを見た向き。ドアは画面の左。" },
    bg_hall: { kind: "背景", name: "廊下（夕方）", text: "部室の前の廊下。" },
    ref_g: { kind: "参考", name: "参考：Gコード", group: "chord", text: "Gコードの押さえ方。3本の指を大きく開く。" },
    ref_c: { kind: "参考", name: "参考：Cコード", group: "chord", text: "Cコードの押さえ方。3本の指を斜めに並べる。" },
  };
  const MAT_IDS = Object.keys(MATS);
  const GROUPS = { yui: ["yui_w", "yui_s"], mio: ["mio_w", "mio_p"], guitar: ["guitar_a", "guitar_e"], room: ["bg_rain", "bg_day"], chord: ["ref_g", "ref_c"] };
  // what an animator asks when a bag holds two versions of the same thing, and what 佐伯 answers from the storyboard
  const ASK = {
    yui: ["ユイの服、冬服と夏服、どっち？", "11月なので冬服です！"],
    mio: ["ミオは制服？ 私服？", "制服です、冬服です！"],
    guitar: ["ギター、アコギとエレキ、どっち？", "部室なのでアコギです！"],
    room: ["背景、雨と晴れ、どっち？", "雨の夕方です！"],
    chord: ["コード、GとC、どっち？", "コンテにGって書いてあります！"],
  };

  const ANIMS = {
    mori: { name: "森", good: "手", bad: "", speed: 3, loc: "M", where: "自宅（スタジオから車20分）",
      avail: [[T(0, 13), T(0, 16)]], availText: "月 13:00〜16:00 だけ（火曜は他社の仕事）",
      sample: "ピアノを弾く手のアップ", note: "佐伯「手を描かせたら、うちでいちばんです」", back: "指の形、きれいに入ったと思う。" },
    miyashita: { name: "宮下", good: "芝居", bad: "", speed: 5, loc: "Y", where: "自宅（スタジオから車30分・森さんの家から20分）",
      avail: [[T(0, 17), T(1, 0)], [T(1, 8), T(1, 12)]], availText: "月 17:00〜24:00、火 8:00〜12:00",
      sample: "振り返る女の子", note: "佐伯「芝居はすごくいいです。描くのはゆっくりです」", back: "ゆっくり描かせてもらったよ。" },
    hayase: { name: "早瀬", good: "", bad: "小物", speed: 2, loc: "S", where: "スタジオの作画部屋",
      avail: [[T(0, 13), T(0, 22)], [T(1, 9), T(1, 12)]], availText: "月 13:00〜22:00、火 9:00〜12:00",
      sample: "走る男の子", note: "作監メモ「小物がよく抜けている」", back: "速く上げといたよ！" },
    kobayashi: { name: "小林", good: "", bad: "手", speed: 4, loc: "S", where: "スタジオの作画部屋",
      avail: [[T(0, 13), T(0, 22)], [T(1, 9), T(1, 12)]], availText: "月 13:00〜22:00、火 9:00〜12:00",
      sample: "座っている女の子", note: "佐伯「新人さんです。手の作例はまだありません」", back: "がんばりました……。" },
  };
  const ANIM_IDS = Object.keys(ANIMS);
  const DIST = { "M-S": 20, "S-Y": 30, "M-Y": 20 };
  const dist = (a, b) => (a === b ? 0 : DIST[[a, b].sort().join("-")]);
  const RIGHT = { yui: "w", mio: "w", guitar: "a", capo: true, muffler: true, rain: true, door: "L", chord: "G", handBad: false, stiff: false };

  function newGame() {
    return { v: VERSION, phase: 1, tray: [], assign: Object.fromEntries(CUT_IDS.map((c) => [c, null])),
      bags: Object.fromEntries(ANIM_IDS.map((a) => [a, []])), route: [], ret: null,
      bench: [null, null, null], bundle: Object.fromEntries(CUT_IDS.map((c) => [c, null])),
      memo: Object.fromEntries(CUT_IDS.map((c) => [c, []])), order: "first", res: null };
  }
  const cutsOf = (s, a) => CUT_IDS.filter((c) => s.assign[c] === a);
  const used = (s) => ANIM_IDS.filter((a) => cutsOf(s, a).length);
  const planning = (s) => !s.ret;
  function sync(s) {
    const u = used(s);
    s.route = s.route.filter((a) => u.includes(a));
    for (const a of u) if (!s.route.includes(a)) s.route.push(a);
  }

  // ---------- planning (Monday morning) ----------
  function trayWhy(s, m) { if (!planning(s)) return "もう手配した"; if (!MATS[m]) return "ない資料"; return ""; }
  function trayToggle(s, m) {
    const why = trayWhy(s, m); if (why) return why;
    if (s.tray.includes(m)) { s.tray = s.tray.filter((x) => x !== m); for (const a of ANIM_IDS) s.bags[a] = s.bags[a].filter((x) => x !== m); }
    else s.tray.push(m);
    return "";
  }
  function assignWhy(s, c, a) {
    if (!planning(s)) return "もう手配した";
    if (!CUT[c]) return "ないカット";
    if (a && !ANIMS[a]) return "いない人";
    if (a && s.assign[c] !== a && cutsOf(s, a).length >= MAX_CUTS) return `${ANIMS[a].name}さんはもう2カット持っている`;
    return "";
  }
  function assign(s, c, a) { const why = assignWhy(s, c, a); if (why) return why; s.assign[c] = a || null; sync(s); return ""; }
  function bagWhy(s, a, m) {
    if (!planning(s)) return "もう手配した";
    if (!cutsOf(s, a).length) return "この人にはまだカットを頼んでいない";
    if (!s.tray.includes(m)) return "「今回の資料」に出していない";
    return "";
  }
  function bagToggle(s, a, m) {
    const why = bagWhy(s, a, m); if (why) return why;
    const b = s.bags[a]; s.bags[a] = b.includes(m) ? b.filter((x) => x !== m) : b.concat(m);
    return "";
  }
  function routeMove(s, a, d) {
    if (!planning(s)) return "もう手配した";
    const i = s.route.indexOf(a), j = i + d;
    if (i < 0 || j < 0 || j >= s.route.length) return "動かせない";
    [s.route[i], s.route[j]] = [s.route[j], s.route[i]];
    return "";
  }
  const conflicts = (bag) => Object.keys(GROUPS).filter((g) => GROUPS[g].every((m) => bag.includes(m)));

  // work `mins` inside the windows, starting no earlier than `from`
  function runWork(from, mins, wins) {
    const blocks = []; let left = mins;
    if (left <= 0) return { finish: from, blocks, left: 0 };
    for (const [a, b] of wins) {
      const st = Math.max(a, from); if (st >= b) continue;
      const take = Math.min(b - st, left); blocks.push([st, st + take]); left -= take;
      if (left === 0) return { finish: st + take, blocks, left: 0 };
    }
    return { finish: null, blocks, left };
  }
  function plan(s) {
    let t = DEPART, at = "S"; const per = {};
    for (const id of s.route) {
      const a = ANIMS[id];
      if (a.loc === "S") { t += dist(at, "S"); at = "S"; t += MIN.hand; } else { t += dist(at, a.loc); at = a.loc; }
      const cuts = cutsOf(s, id), bag = s.bags[id] || [], conf = conflicts(bag);
      const mins = cuts.length * a.speed * 60 + conf.length * MIN.call;
      const w = runWork(t, mins, a.avail);
      const ok = w.finish !== null && w.finish <= DUE;
      per[id] = { arrive: t, cuts, conf, mins, blocks: w.blocks, finish: w.finish, left: w.left, ok, start: w.blocks.length ? w.blocks[0][0] : null };
    }
    return per;
  }
  // can this animator's cuts fit in their free time at all (ignoring the drive)?
  function fits(s, id) { const a = ANIMS[id], n = cutsOf(s, id).length; const w = runWork(0, n * a.speed * 60, a.avail); return w.finish !== null && w.finish <= DUE; }
  function dispatchWhy(s) {
    if (!planning(s)) return "もう手配した";
    const un = CUT_IDS.filter((c) => !s.assign[c]);
    if (un.length) return `頼む人が決まっていないカットがある（${un.join("・")}）`;
    const p = plan(s), bad = s.route.filter((id) => !p[id].ok);
    if (bad.length) return `${bad.map((id) => ANIMS[id].name + "さん").join("・")}が火曜12:00までに描き終わらない`;
    return "";
  }

  // ---------- what comes back ----------
  function features(c, a, bag) {
    const cut = CUT[c], an = ANIMS[a], has = (m) => bag.includes(m);
    return {
      yui: has("yui_w") ? "w" : "s",                      // both in the bag: they phone, 佐伯 answers from the storyboard
      mio: has("mio_w") ? "w" : has("mio_p") ? "p" : "s",
      guitar: has("guitar_a") ? "a" : "e",
      capo: has("capo") && an.bad !== "小物",
      muffler: has("muffler") && an.bad !== "小物",
      rain: has("bg_rain"),
      door: has("bg_door") ? "L" : "R",
      chord: has("ref_g") ? "G" : has("ref_c") ? "C" : "X",
      handBad: (cut.hand && an.bad === "手") || (cut.star === "手元" && an.good !== "手"),
      stiff: cut.star === "芝居" && an.good !== "芝居",
    };
  }
  function defects(c, a, bag) {
    const f = features(c, a, bag), an = ANIMS[a], nm = an.name, has = (m) => bag.includes(m), out = [];
    const add = (k, cat, label, cause) => out.push({ k, cat, label, cause });
    for (const k of CUT[c].needs) {
      if (f[k] === RIGHT[k]) continue;
      if (k === "yui") add(k, "服", c === "C3" ? "ユイの袖が半袖（夏服）" : "ユイが夏服（白い半袖）", has("yui_s") ? "袋に入っていたのはユイ（夏服）だけだった" : `袋にユイ（冬服）がなく、${nm}さんは記憶で夏服に描いた（第1話の前半は夏）`);
      if (k === "mio") add(k, "服", f.mio === "p" ? "ミオが私服（パーカー）" : "ミオが夏服", f.mio === "p" ? "袋に入っていたのはミオ（私服）だった" : `袋にミオ（冬服）がなく、${nm}さんは記憶で夏服に描いた`);
      if (k === "guitar") add(k, "楽器", "ギターがエレキになっている", has("guitar_e") ? "袋に入っていたのはギター（エレキ）だった" : `袋にギターの設定がなく、${nm}さんはライブのエレキで描いた`);
      if (k === "capo") add(k, "小物", "カポがついていない", an.bad === "小物" ? (has("capo") ? `${nm}さんは小物を省きがち（カポタストは袋に入っていた）` : `袋にカポタストがなく、${nm}さんも小物を省きがち`) : "袋にカポタストがなかった");
      if (k === "muffler") add(k, "小物", "ミオのマフラーがない", an.bad === "小物" ? (has("muffler") ? `${nm}さんは小物を省きがち（マフラーは袋に入っていた）` : `袋にマフラーがなく、${nm}さんも小物を省きがち`) : "袋にマフラー（ミオ）がなかった");
      if (k === "rain") add(k, "背景", "窓の外が晴れている（雨の夕方のはず）", has("bg_day") ? "袋に入っていたのは部室（昼・晴れ）だった" : `袋に部室の背景がなく、${nm}さんはいつもの晴れた部室で描いた`);
      if (k === "door") add(k, "背景", "ドアが右にある（ユイが右へ振り向く）", `袋に部室（ドア側）がなく、${nm}さんはドアを右に描いた`);
      if (k === "chord") add(k, "手", f.chord === "C" ? "指の形がCコード" : "指の形がコードになっていない", f.chord === "C" ? "袋に入っていたのは参考：Cコードだった" : "袋にコードの参考がなかった");
      if (k === "handBad") add(k, "手", "指の形が崩れている", an.bad === "手" ? `${nm}さんは手が苦手` : `★手元を、手が得意でない${nm}さんに頼んだ`);
      if (k === "stiff") add(k, "芝居", "振り向きが硬い（原画2枚・溜めがない）", `★芝居を、芝居が得意でない${nm}さんに頼んだ`);
    }
    return out;
  }
  function dispatch(s) {
    const why = dispatchWhy(s); if (why) return why;
    const p = plan(s), log = [], cut = {};
    log.push({ t: DEPART, who: "佐伯", text: "袋を持ってスタジオを出る" });
    for (const id of s.route) {
      const a = ANIMS[id], r = p[id], cs = r.cuts.join("・");
      log.push({ t: r.arrive, who: "佐伯", text: a.loc === "S" ? `作画部屋の${a.name}さんに袋を渡す（${cs}）` : `${a.name}さんの家に袋を届ける（${cs}）` });
      r.conf.forEach((g, i) => log.push({ t: r.start + i * MIN.call, who: a.name, text: `電話「${ASK[g][0]}」→ 佐伯「${ASK[g][1]}」（1時間遅れる）` }));
      log.push({ t: r.finish, who: a.name, text: `${cs}を描き終える` });
      for (const c of r.cuts) cut[c] = { anim: id, f: features(c, id, s.bags[id]), defects: defects(c, id, s.bags[id]) };
    }
    log.push({ t: BACK, who: "佐伯", text: "4カットの原画を回収して戻る" });
    log.sort((x, y) => x.t - y.t);
    s.ret = { plan: p, bags: JSON.parse(JSON.stringify(s.bags)), route: s.route.slice(), cut, log };
    s.phase = 4;
    return "";
  }

  // ---------- Tuesday: check and hand on ----------
  const benchRefOk = (r) => typeof r === "string" && /^(conte|genga|mat|bag):/.test(r);
  function bench(s, i, r) {
    if (!s.ret || s.res) return "いまは並べられない";
    if (i < 0 || i > 2) return "置き場所がない";
    if (r !== null && !benchRefOk(r)) return "並べられないもの";
    s.bench[i] = r; return "";
  }
  function bundleWhy(s, c, w) { if (!s.ret || s.res) return "いまは分けられない"; if (!CUT[c]) return "ないカット"; if (w !== null && w !== "kan" && w !== "shi") return "ない束"; return ""; }
  function bundle(s, c, w) { const why = bundleWhy(s, c, w); if (why) return why; s.bundle[c] = w; if (w !== "kan") s.memo[c] = []; return ""; }
  function memo(s, c, cat) {
    if (!s.ret || s.res) return "いまは書けない";
    if (s.bundle[c] !== "kan") return "作監に確認する束に入れたカットだけ";
    if (!CATS.includes(cat)) return "ない項目";
    const m = s.memo[c]; s.memo[c] = m.includes(cat) ? m.filter((x) => x !== cat) : m.concat(cat);
    return "";
  }
  function setOrder(s, o) { if (!s.ret || s.res) return "いまは決められない"; if (o !== "first" && o !== "together") return "ない順番"; s.order = o; return ""; }
  const unsorted = (s) => CUT_IDS.filter((c) => !s.bundle[c]);
  // real: use what is really wrong; otherwise estimate from the check memos (a cut without memos counts as one fix she must find)
  function deliver(s, real) {
    const kan = CUT_IDS.filter((c) => s.bundle[c] === "kan"), shi = CUT_IDS.filter((c) => s.bundle[c] === "shi");
    let t = KAN; const kanRows = [];
    for (const c of kan) {
      const mm = s.memo[c] || []; let mins = MIN.check;
      if (real) {
        const defs = s.ret.cut[c].defects, fixes = defs.map((d) => ({ ...d, memo: mm.includes(d.cat) }));
        fixes.forEach((d) => { mins += d.memo ? MIN.fixMemo : MIN.fix; });
        const wrong = mm.filter((cat) => !defs.some((d) => d.cat === cat)); mins += wrong.length * MIN.wrongMemo;
        kanRows.push({ cut: c, start: t, end: t + mins, mins, fixes, wrong });
      } else { mins += mm.length ? mm.length * MIN.fixMemo : MIN.fix; kanRows.push({ cut: c, start: t, end: t + mins, mins }); }
      t += mins;
    }
