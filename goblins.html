<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>棒立ち騎士とゴブリン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* Layout: full-bleed 3D field; retro RPG windows pinned to the corners, message log along the bottom. */
  :root {
    --ink: #f5f3ea;          /* window text, borders */
    --window: rgba(10, 12, 34, 0.86);
    --gold: #ffd863;         /* levels, numbers */
    --hp: #6fe08a;
    --muted: #a9b0d6;
    --night: #0b0d22;        /* page ground behind the canvas */
    --font-pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-pixel);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
  }
  .win {
    background: var(--window);
    border: 3px solid var(--ink);
    border-radius: 8px;
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.55);
    padding: 8px 12px;
    line-height: 1.5;
    letter-spacing: .04em;
    font-size: 15px;
  }
  .status { justify-self: start; align-self: start; min-width: 9.5em; }
  .status .name { color: var(--ink); }
  .status .row { display: flex; justify-content: space-between; gap: 1.2em; font-variant-numeric: tabular-nums; }
  .status .lv { color: var(--gold); }
  .bar { height: 5px; background: rgba(255,255,255,.15); border-radius: 2px; margin: 1px 0 3px; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--hp); border-radius: 2px; }
  .tally { justify-self: end; align-self: start; font-size: 13px; }
  .tally .row { display: flex; justify-content: space-between; gap: 1em; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--gold); font-weight: normal; }

  .bottom {
    grid-column: 1 / -1; grid-row: 3;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end;
  }
  .log { min-height: 6.4em; font-size: 15px; }
  .log p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log p.new { animation: pop .25s steps(3); }
  .log p .hl { color: var(--gold); }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }

  .cmd { pointer-events: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 10px; padding: 8px 10px; }
  .cmd button {
    font: inherit; font-size: 15px; color: var(--ink); background: none; border: 0;
    text-align: left; padding: 4px 4px 4px 1.1em; position: relative; cursor: pointer; white-space: nowrap;
  }
  .cmd button::before { content: "▶"; position: absolute; left: 0; top: 4px; font-size: 11px; line-height: 1.9; opacity: 0; color: var(--ink); }
  .cmd button:hover::before, .cmd button:focus-visible::before { opacity: 1; animation: blink .6s steps(2) infinite; }
  .cmd button:focus-visible { outline: 1px dashed var(--muted); outline-offset: 1px; }
  .cmd .sep { grid-column: 1 / -1; height: 1px; background: rgba(245,243,234,.35); margin: 4px 0; }
  .cmd .call { color: var(--gold); }
  @keyframes blink { 50% { opacity: 0; } }

  .pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dmg {
    position: absolute; left: 0; top: 0; font-size: 22px; color: #fff; will-change: transform, opacity;
    text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 2px 2px #000, -2px -2px #000, 2px -2px #000, -2px 2px #000;
  }
  .dmg.miss { color: var(--muted); font-size: 17px; }
  .dmg.crit { color: var(--gold); font-size: 28px; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); font-size: 12px; color: var(--muted); pointer-events: none; text-shadow: 0 1px 2px #000; white-space: nowrap; }

  @media (max-width: 640px) {
    .win { font-size: 13px; padding: 6px 9px; }
    .tally { font-size: 11px; }
    .bottom { grid-template-columns: minmax(0, 1fr); }
    .cmd { order: -1; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px 8px; }
    .cmd .sep { display: none; }
    .cmd button { font-size: 13px; padding-block: 3px; }
    .log { font-size: 13px; min-height: 4.6em; }
    .log p:nth-last-child(n+4) { display: none; }
    .hint { display: none; }
  }
  @media (max-height: 520px) {
    .hud { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
    .win { font-size: 12px; padding: 4px 8px; line-height: 1.4; }
    .tally { font-size: 11px; }
    .bottom { grid-template-columns: minmax(0, 1fr) auto; }
    .cmd { order: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; padding: 4px 8px; }
    .cmd .sep { display: none; }
    .cmd button { font-size: 12px; padding-block: 1px; }
    .log { font-size: 12px; min-height: 2.9em; }
    .log p:nth-last-child(n+3) { display: none; }
    .hint { display: none; }
  }
</style>

<div id="stage"></div>
<div class="pops" id="pops"></div>
<div class="flash" id="flash"></div>
<div class="hint">ドラッグで視点をまわす ・ ホイール / ピンチでズーム</div>

<div class="hud">
  <div class="win status" aria-label="勇者のステータス">
    <div class="name">ゆうしゃ</div>
    <div class="row"><span>Lv</span><span class="lv">99</span></div>
    <div class="row"><span>HP</span><span id="hp">9999</span></div>
    <div class="bar"><i></i></div>
    <div class="row"><span>MP</span><span>999</span></div>
  </div>
  <div class="win tally" aria-label="戦闘の記録">
    <div class="row"><span>こうげきされた</span><span><b id="tHits">0</b>かい</span></div>
    <div class="row"><span>うけたダメージ</span><span><b id="tDmg">0</b></span></div>
    <div class="row"><span>てが しびれた</span><span><b id="tNumb">0</b>かい</span></div>
    <div class="row"><span>ゴブリン</span><span><b>4</b>ひき</span></div>
  </div>
  <div class="bottom">
    <div class="win log" id="log" aria-live="polite"></div>
    <div class="win cmd" role="group" aria-label="コマンド">
      <button id="cFight">たたかう</button>
      <button id="cGuard">ぼうぎょ</button>
      <button id="cItem">どうぐ</button>
      <button id="cRun">にげる</button>
      <div class="sep"></div>
      <button id="cCall" class="call">いっせいこうげき</button>
      <button id="cSound">おと：OFF</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(() => {
  "use strict";
  const T = THREE;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t);
  const C = (hex) => new T.Color(hex).convertSRGBToLinear();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- renderer / scene ----------
  const stage = document.getElementById("stage");
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new T.Scene();
  const HORIZON = 0xf3c9a2;
  scene.fog = new T.Fog(C(HORIZON), 38, 150);
  const camera = new T.PerspectiveCamera(42, 1, 0.1, 600);

  // Sky: gradient dome, also used to bake the environment map for the armor.
  const skyMat = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new T.Color(0x2c4f9c) }, mid: { value: new T.Color(0x7fb2d6) },
      hor: { value: new T.Color(HORIZON) }, gnd: { value: new T.Color(0x41522f) },
    },
    vertexShader: "varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: `uniform vec3 top, mid, hor, gnd; varying vec3 vDir;
      void main(){ float y = vDir.y; vec3 c;
        if (y > 0.0) { c = mix(hor, mid, smoothstep(0.0, 0.25, y)); c = mix(c, top, smoothstep(0.25, 0.9, y)); }
        else { c = mix(hor, gnd, smoothstep(0.0, 0.12, -y)); }
        gl_FragColor = vec4(c, 1.0); }`,
  });
  const sky = new T.Mesh(new T.SphereGeometry(400, 48, 24), skyMat);
  scene.add(sky);

  // Environment for the armor reflections: a painted equirect gradient (sky above, meadow below).
  {
    const c = document.createElement("canvas"); c.width = 256; c.height = 128;
    const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 128);
    gr.addColorStop(0, "#2c4f9c"); gr.addColorStop(0.3, "#7fb2d6"); gr.addColorStop(0.49, "#f3c9a2");
    gr.addColorStop(0.53, "#6f8a48"); gr.addColorStop(1, "#33402a");
    g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
    const sg = g.createRadialGradient(170, 38, 0, 170, 38, 22);
    sg.addColorStop(0, "rgba(255,250,235,1)"); sg.addColorStop(1, "rgba(255,250,235,0)");
    g.fillStyle = sg; g.fillRect(140, 10, 60, 60);
    const tex = new T.CanvasTexture(c);
    tex.mapping = T.EquirectangularReflectionMapping;
    tex.encoding = T.sRGBEncoding;
    const pmrem = new T.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();
  }

  // Two moons: the quickest way to say "this is not Earth".
  function moon(color, r, dir) {
    const m = new T.Mesh(new T.SphereGeometry(r, 32, 16), new T.MeshBasicMaterial({ color, fog: false }));
    m.position.copy(dir.normalize().multiplyScalar(360));
    scene.add(m);
    const halo = new T.Mesh(new T.SphereGeometry(r * 1.6, 32, 16), new T.MeshBasicMaterial({ color, fog: false, transparent: true, opacity: 0.12, depthWrite: false }));
    halo.position.copy(m.position);
    scene.add(halo);
  }
  moon(0xf6f1ff, 26, new T.Vector3(-0.55, 0.42, -1));
  moon(0xffc0d2, 11, new T.Vector3(-0.2, 0.62, -1));

  // Lights
  scene.add(new T.HemisphereLight(C(0xbcd6ff), C(0x50603a), 0.55));
  const sun = new T.DirectionalLight(C(0xffe2bd), 2.4);
  sun.position.set(14, 22, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 70 });
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  // ---------- terrain ----------
  const groundH = (x, z) => {
    const r = Math.hypot(x, z);
    const k = clamp((r - 16) / 30, 0, 1);
    return k * k * (Math.sin(x * 0.08) * 2.2 + Math.cos(z * 0.07) * 2.6 + Math.sin((x + z) * 0.15) * 0.9);
  };
  {
    const g = new T.CircleGeometry(170, 160, 0, Math.PI * 2);
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, col = [];
    const a = C(0x5d8a3a), b = C(0x7aa24a), d = C(0x8a7a4e), tmp = new T.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, groundH(x, z));
      const n = Math.sin(x * 0.7) * Math.cos(z * 0.6) * 0.5 + 0.5;
      tmp.copy(a).lerp(b, n);
      if (Math.hypot(x, z) < 2.2) tmp.lerp(d, 0.35);
      col.push(tmp.r, tmp.g, tmp.b);
    }
    g.setAttribute("color", new T.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    const ground = new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors: true }));
    ground.receiveShadow = true;
    scene.add(ground);
  }

  // Grass: instanced blades swaying in the wind (shader patch on a Lambert material).
  const timeU = { value: 0 };
  {
    const blade = new T.BufferGeometry();
    blade.setAttribute("position", new T.Float32BufferAttribute([-0.035, 0, 0, 0.035, 0, 0, 0, 0.42, 0, 0.035, 0, 0, -0.035, 0, 0, 0, 0.42, 0], 3));
    blade.setAttribute("color", new T.Float32BufferAttribute([0.35, 0.5, 0.25, 0.35, 0.5, 0.25, 1, 1, 0.8, 0.35, 0.5, 0.25, 0.35, 0.5, 0.25, 1, 1, 0.8], 3));
    blade.setAttribute("normal", new T.Float32BufferAttribute([0, 1, 0.3, 0, 1, 0.3, 0, 1, 0.3, 0, 1, -0.3, 0, 1, -0.3, 0, 1, -0.3], 3));
    const mat = new T.MeshLambertMaterial({ vertexColors: true });
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uTime = timeU;
      sh.vertexShader = "uniform float uTime;\n" + sh.vertexShader.replace("#include <begin_vertex>",
        `#include <begin_vertex>
         float ph = instanceMatrix[3].x * 0.35 + instanceMatrix[3].z * 0.25;
         float h = position.y / 0.42;
         transformed.x += sin(uTime * 1.6 + ph) * 0.09 * h * h;
         transformed.z += cos(uTime * 1.3 + ph) * 0.05 * h * h;`);
    };
    const N = 9000;
    const mesh = new T.InstancedMesh(blade, mat, N);
    const m4 = new T.Matrix4(), q = new T.Quaternion(), s = new T.Vector3(), pos = new T.Vector3(), c = new T.Color();
    const g1 = C(0x6fa548), g2 = C(0xa5c75a);
    for (let i = 0; i < N; i++) {
      const r = 1.0 + Math.sqrt(Math.random()) * 34, a = Math.random() * Math.PI * 2;
      pos.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      pos.y = groundH(pos.x, pos.z) - 0.02;
      q.setFromAxisAngle(new T.Vector3(0, 1, 0), Math.random() * Math.PI);
      const k = rand(0.6, 1.5);
      s.set(k, k * rand(0.7, 1.3), k);
      m4.compose(pos, q, s);
      mesh.setMatrixAt(i, m4);
      mesh.setColorAt(i, c.copy(g1).lerp(g2, Math.random()));
    }
    scene.add(mesh);

    // flowers
    const fl = new T.InstancedMesh(new T.SphereGeometry(0.06, 6, 4), new T.MeshLambertMaterial(), 420);
    const fcols = [0xfff4f0, 0xffd1e8, 0xffe27a, 0xb9c7ff].map(C);
    for (let i = 0; i < 420; i++) {
      const r = 3 + Math.random() * 30, a = Math.random() * Math.PI * 2;
      pos.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      pos.y = groundH(pos.x, pos.z) + rand(0.15, 0.3);
      m4.compose(pos, q.identity(), s.set(1, 0.7, 1));
      fl.setMatrixAt(i, m4);
      fl.setColorAt(i, pick(fcols));
    }
    scene.add(fl);
  }

  // Trees ringing the clearing
  {
    const trunkM = new T.MeshLambertMaterial({ color: C(0x5b3d26) });
    const leafMs = [0x2f6b3a, 0x3a7a3c, 0x295c3b].map((h) => new T.MeshStandardMaterial({ color: C(h), roughness: 1, flatShading: true }));
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2, r = rand(19, 48);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const t = new T.Group();
      const h = rand(2.5, 5.5);
      const trunk = new T.Mesh(new T.CylinderGeometry(0.12 * h / 3, 0.2 * h / 3, h * 0.4, 6), trunkM);
      trunk.position.y = h * 0.2;
      t.add(trunk);
      const lm = pick(leafMs);
      for (let k = 0; k < 3; k++) {
        const cone = new T.Mesh(new T.ConeGeometry(h * (0.42 - k * 0.1), h * 0.45, 7), lm);
        cone.position.y = h * (0.42 + k * 0.2);
        cone.castShadow = r < 26;
        t.add(cone);
      }
      t.position.set(x, groundH(x, z) - 0.05, z);
      t.rotation.y = Math.random() * 6;
      scene.add(t);
    }
  }

  // Distant mountains and a castle on the ridge
  {
    const mm = new T.MeshStandardMaterial({ color: C(0x6c7fa6), roughness: 1, flatShading: true });
    const snow = new T.MeshStandardMaterial({ color: C(0xf2f0ff), roughness: 1, flatShading: true });
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + rand(-0.1, 0.1), r = rand(110, 140);
      const h = rand(22, 52), w = h * rand(0.9, 1.4);
      const m = new T.Mesh(new T.ConeGeometry(w, h, 6), mm);
      m.position.set(Math.cos(a) * r, h / 2 - 3, Math.sin(a) * r);
      m.rotation.y = Math.random() * 3;
      scene.add(m);
      const cap = new T.Mesh(new T.ConeGeometry(w * 0.26, h * 0.26, 6), snow);
      cap.position.set(0, h * 0.37 + 0.01, 0);
      m.add(cap);
    }
    const stone = new T.MeshLambertMaterial({ color: C(0xc8c2d6) });
    const roof = new T.MeshLambertMaterial({ color: C(0x3b4f8f) });
    const castle = new T.Group();
    const base = new T.Mesh(new T.BoxGeometry(14, 6, 8), stone);
    base.position.y = 3;
    castle.add(base);
    [[-7, 11, -4], [7, 11, -4], [-7, 11, 4], [7, 11, 4], [0, 18, 0]].forEach(([x, h, z]) => {
      const tw = new T.Mesh(new T.CylinderGeometry(1.6, 1.8, h, 10), stone);
      tw.position.set(x, h / 2, z);
      castle.add(tw);
      const rf = new T.Mesh(new T.ConeGeometry(2.2, 4.5, 10), roof);
      rf.position.set(x, h + 2.2, z);
      castle.add(rf);
    });
    castle.position.set(-30, groundH(-30, -70) + 2, -70);
    castle.rotation.y = 0.4;
    scene.add(castle);
  }

  // Floating islands
  const islands = [];
  {
    const rock = new T.MeshStandardMaterial({ color: C(0x7a6a5c), roughness: 1, flatShading: true });
    const turf = new T.MeshStandardMaterial({ color: C(0x6e9d45), roughness: 1, flatShading: true });
    const leaf = new T.MeshStandardMaterial({ color: C(0x2f6b3a), roughness: 1, flatShading: true });
    [[38, 16, -44, 4.5], [-52, 22, -18, 6], [10, 28, -78, 8], [64, 20, 10, 3.5]].forEach(([x, y, z, s]) => {
      const g = new T.Group();
      const under = new T.Mesh(new T.ConeGeometry(s, s * 1.8, 7), rock);
      under.rotation.x = Math.PI;
      under.position.y = -s * 0.9;
      g.add(under);
      const top = new T.Mesh(new T.CylinderGeometry(s * 1.02, s, s * 0.25, 7), turf);
      g.add(top);
      const tree = new T.Mesh(new T.ConeGeometry(s * 0.3, s * 0.8, 6), leaf);
      tree.position.set(s * 0.3, s * 0.5, 0);
      g.add(tree);
      g.position.set(x, y, z);
      g.userData.y0 = y;
      g.userData.ph = Math.random() * 6;
      islands.push(g);
      scene.add(g);
    });
  }

  // ---------- the knight ----------
  const steel = new T.MeshStandardMaterial({ color: C(0xc9ced8), metalness: 0.92, roughness: 0.28, envMapIntensity: 1.1 });
  const darkSteel = new T.MeshStandardMaterial({ color: C(0x464c5a), metalness: 0.8, roughness: 0.45 });
  const gold = new T.MeshStandardMaterial({ color: C(0xd9a93a), metalness: 0.95, roughness: 0.3 });
  const leather = new T.MeshStandardMaterial({ color: C(0x5a3a22), roughness: 0.8 });
  const capeM = new T.MeshStandardMaterial({ color: C(0x8a1427), roughness: 0.85, side: T.DoubleSide });
  const plumeM = new T.MeshStandardMaterial({ color: C(0xd8243a), roughness: 0.7 });
  const slitM = new T.MeshBasicMaterial({ color: 0x050508 });

  const up = new T.Vector3(0, 1, 0);
  function limb(a, b, r1, r2, mat) {
    const dir = new T.Vector3().subVectors(b, a);
    const len = dir.length();
    const m = new T.Mesh(new T.CylinderGeometry(r2, r1, len, 12), mat);
    m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(up, dir.normalize());
    return m;
  }
  function ball(r, mat, x, y, z, sx = 1, sy = 1, sz = 1) {
    const m = new T.Mesh(new T.SphereGeometry(r, 20, 14), mat);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    return m;
  }

    } else {

      const br = new T.Mesh(new T.CylinderGeometry(0.055, 0.055, 0.07, 8), clothM); br.position.y = 0.06; w.add(br);
    }
    parts.hand.add(w); parts.weapon = w;
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
    return { group: g, parts };
  }

  const GOBLIN_DEFS = [
    { name: "ゴブリンA", weapon: "club",   style: "smash", angle: 0.35,  r: 0.88 },
    { name: "ゴブリンB", weapon: "dagger", style: "stab",  angle: -0.85, r: 0.8 },
    { name: "ゴブリンC", weapon: "fist",   style: "jump",  angle: 2.3,   r: 1.55 },
    { name: "ゴブリンD", weapon: "rock",   style: "throw", angle: -2.4,  r: 3.0 },
  ];
  const goblins = GOBLIN_DEFS.map((d, i) => {
    const { group, parts } = buildGoblin(skinCols[i], d.weapon);
    const root = new T.Group();
    const squashG = new T.Group();    // squash from the feet
    const pose = new T.Group();       // lean / lunge / flips around the body centre (works for loaded models too)
    root.add(squashG);
    squashG.add(pose);
    pose.position.y = 0.5;
    group.position.y = -0.5;
    pose.add(group);
    root.scale.setScalar(GOBLIN_H);
    const gb = {
      ...d, root, pose, squashG, visual: group, parts, state: "idle", t: 0,
      wait: 0.6 + i * 0.7, slotA: d.angle, slotR: d.r, phase: Math.random() * 6,
      hits: 0, mixer: null, clips: {}, numb: 0, poseBaseY: 0.5,
      from: new T.Vector3(), to: new T.Vector3(),
    };
    root.position.set(Math.sin(d.angle) * d.r, 0, Math.cos(d.angle) * d.r);
    scene.add(root);
    return gb;
  });
  const projectiles = [];

  const knightHead = V(0, 1.9, 0);
  function contactPoint(gb, y) {
    const p = gb.root.position;
    const d = tmpV2.set(p.x, 0, p.z).normalize();
    return V(d.x * 0.4, y, d.z * 0.4);
  }
  function faceAngle(gb) { const p = gb.root.position; return Math.atan2(-p.x, -p.z); }
  function turnToKnight(gb, k) {
    let d = faceAngle(gb) - gb.root.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    gb.root.rotation.y += d * k;
  }
  // Bone posing in model space: each bone turns about axes of the character (x = its left, y = up, z = forward).
  function makeRig(root) {
    root.updateMatrixWorld(true);
    const bones = {};
    root.traverse((o) => {
      if (!o.isBone) return;
      const key = o.name.replace(/^mixamorig[:_]?/, "").replace(/[^A-Za-z0-9]/g, "");
      o.userData.restQ = o.quaternion.clone();
      o.userData.restWQ = o.getWorldQuaternion(new T.Quaternion());
      o.userData.restWQi = o.userData.restWQ.clone().invert();
      bones[key] = o;
    });
    const e = new T.Euler(), d = new T.Quaternion();
    return {
      bones,
      reset() { for (const k in bones) bones[k].quaternion.copy(bones[k].userData.restQ); },
      rot(name, x, y, z) {
        const b = bones[name];
        if (!b) return;
        d.setFromEuler(e.set(x || 0, y || 0, z || 0, "XYZ"));
        d.premultiply(b.userData.restWQi).multiply(b.userData.restWQ);   // restWQ^-1 * D * restWQ
        b.quaternion.copy(b.userData.restQ).multiply(d);
      },
    };
  }

  // Rigged goblin: the same pose vocabulary as the built-in one, mapped onto Mixamo bones.
  const LEG = 0.19;                     // thigh / shin length as a share of model height
  function setRigPose(gb, o) {
    const r = gb.rig;
    r.reset();
    const lean = o.lean || 0, knee = o.knee || 0;
    r.rot("Spine", lean * 0.5, 0, 0);
    r.rot("Spine1", lean * 0.3, 0, 0);
    r.rot("Spine2", lean * 0.2, 0, 0);
    r.rot("Head", (o.headX || 0) - lean * 0.4, 0, o.headZ || 0);
    r.rot("RightArm", o.armR || 0, 0, 1.0 + (o.armRz || 0));
    r.rot("LeftArm", o.armL || 0, 0, -1.0 - (o.armLz || 0));
    r.rot("RightForeArm", o.foreR ?? -0.5, 0, 0);
    r.rot("RightHand", o.wristR ?? -1.3, 0, 0);        // grip: turns the blade from hanging down to pointing forward
    r.rot("LeftForeArm", o.foreL ?? -0.3, 0, 0);
    const aL = -0.2 + (o.legL || 0) - knee * 0.5, bL = 0.35 + knee;
    const aR = -0.2 + (o.legR || 0) - knee * 0.5, bR = 0.35 + knee;
    r.rot("LeftUpLeg", aL, 0, 0); r.rot("LeftLeg", bL, 0, 0);
    r.rot("RightUpLeg", aR, 0, 0); r.rot("RightLeg", bR, 0, 0);
    // bent knees shorten the legs: lower the body so the standing foot stays on the ground
    const drop = (a, b) => LEG * (2 - Math.cos(a) - Math.cos(a + b));
    const sink = Math.min(drop(aL, bL), drop(aR, bR)) - drop(-0.2, 0.35);
    gb.pose.rotation.x = o.poseX || 0;
    gb.pose.rotation.z = 0;
    gb.pose.position.y = gb.poseBaseY + (o.hop || 0) - sink * GOBLIN_H;
    gb.pose.position.z = o.poseZ || 0;
    const sq = o.squash || 0;
    gb.squashG.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
  }

  function setPose(gb, o) {
    if (gb.rig) return setRigPose(gb, o);
    const P = gb.parts;
    if (P.armR) P.armR.rotation.set(o.armR || 0, 0, o.armRz || 0);
    if (P.armL) P.armL.rotation.set(o.armL || 0, 0, o.armLz || 0);
    if (P.legL) P.legL.rotation.x = o.legL || 0;
    if (P.legR) P.legR.rotation.x = o.legR || 0;
    if (P.torso) P.torso.rotation.x = o.lean || 0;
    if (P.head) { P.head.rotation.x = o.headX || 0; P.head.rotation.z = o.headZ || 0; }
    if (P.torso) { gb.pose.rotation.x = o.poseX || 0; gb.pose.rotation.z = 0; }
    else {
      // a loaded model has no limbs to pose: express the same motion with the whole body
      gb.pose.rotation.x = (o.poseX || 0) + (o.lean || 0) * 0.8 + (o.armR ? Math.sin(o.armR) * -0.08 : 0);
      gb.pose.rotation.z = (o.headZ || 0) * 0.7 + (o.armRz || 0) * 0.3;
    }
    gb.pose.position.y = gb.poseBaseY + (o.hop || 0);
    gb.pose.position.z = o.poseZ || 0;
    const sq = o.squash || 0;
    gb.squashG.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
  }
  function playClip(gb, key) {
    if (!gb.mixer) return;
    const c = gb.clips[key] || gb.clips.idle;
    if (!c || gb.curClip === c) return;
    const a = gb.mixer.clipAction(c);
    a.reset();
    a.setLoop(key === "attack" ? T.LoopOnce : T.LoopRepeat);
    a.clampWhenFinished = true;
    if (gb.curAction) a.crossFadeFrom(gb.curAction, 0.12, false);
    a.play();
    gb.curAction = a; gb.curClip = c;
  }

  const LINES = {
    smash: (g) => pick([g.weapon === "club" && !g.loaded ? `${g.name}は こんぼうで なぐりかかった！` : `${g.name}は きりかかった！`, `${g.name}の ちからいっぱいの いちげき！`]),
    stab:  (g) => pick([`${g.name}の れんぞくづき！`, `${g.name}は たんけんで つきさした！`]),
    jump:  (g) => pick([g.loaded ? `${g.name}の ジャンプぎり！` : `${g.name}の とびげり！`, `${g.name}は おどりかかってきた！`]),
    throw: (g) => pick([`${g.name}は いしを なげつけた！`, `${g.name}の とうてき！`]),
  };

  const stats = { hits: 0, numb: 0 };
  let hitStop = 0;
  function registerHit(gb, at, opts = {}) {
    stats.hits++;
    gb.hits++;
    if (gb.quietOnce) opts.quiet = true;
    const crit = !opts.quiet && Math.random() < 0.07;
    const miss = !crit && !opts.noMiss && Math.random() < 0.1;
    hitFx(at, (opts.power || 1) * (crit ? 1.8 : 1), crit ? 0xffd863 : 0xfff2b0);
    sfx[opts.sound || "hit"]();
    if (crit) {
      flash(0.5); hitStop = 0.09; shake = Math.max(shake, 0.2);
      if (!opts.quiet) { log(hl("かいしんの いちげき！")); log(`ゆうしゃに ${hl("0")}の ダメージ！`); }
      popup(at, "0", "crit");
    } else if (miss) {
      if (!opts.quiet) log("ミス！ ゆうしゃは ダメージを うけない！");
      popup(at, "MISS", "miss");
    } else {
      if (!opts.quiet) log(opts.line || `ゆうしゃに ${hl("0")}の ダメージ！`);
      popup(at, "0");
    }
    if (Math.random() < 0.15) lookAt(gb);
    updateTally();
  }

  function startAttack(gb) {
    gb.state = gb.style; gb.t = 0; gb.didHit = 0;
    gb.from.copy(gb.root.position);
    if (!gb.quietOnce) log(LINES[gb.style](gb));
    playClip(gb, "attack");
  }
  function backToIdle(gb, wait) {
    gb.quietOnce = false;
    gb.state = "idle"; gb.t = 0;
    gb.wait = wait ?? rand(0.9, 2.6);
    playClip(gb, "idle");
    // sometimes shuffle to a new spot around the knight
    if (Math.random() < 0.3) {
      gb.slotA += rand(-0.9, 0.9);
      gb.state = "walk";
      playClip(gb, "walk");
    }
  }

  function updateGoblin(gb, dt, t) {
    gb.t += dt;
    const p = gb.root.position;
    const k = gb.t;
    const bob = Math.sin(t * 6 + gb.phase);
    switch (gb.state) {
      case "idle": {
        turnToKnight(gb, 0.15);
        setPose(gb, { armR: -0.3 + bob * 0.08, armL: 0.1 - bob * 0.05, lean: 0.12, squash: bob * 0.03, headX: -0.15 });
        gb.wait -= dt;
        if (gb.wait <= 0) startAttack(gb);
        break;
      }
      case "walk": {
        const to = tmpV.set(Math.sin(gb.slotA) * gb.slotR, 0, Math.cos(gb.slotA) * gb.slotR);
        const d = to.sub(p); d.y = 0;
        const dist = d.length();
        const sw = Math.sin(t * 16);
        setPose(gb, { legL: sw * 0.7, legR: -sw * 0.7, armR: -sw * 0.5, armL: sw * 0.5, lean: 0.2 });
        gb.root.rotation.y = Math.atan2(d.x, d.z);
        if (dist < 0.05) { gb.state = "idle"; gb.wait = rand(0.4, 1.4); playClip(gb, "idle"); break; }
        p.addScaledVector(d.normalize(), Math.min(dist, dt * 1.2));
        break;
      }
      case "smash": {
        turnToKnight(gb, 0.3);
        const W = 0.5, S = 0.12, R = 0.55;
        if (k < W) { const e = ease(k / W); setPose(gb, { armR: lerp(-0.3, -3.0, e), armL: -0.6 * e, lean: -0.35 * e, headX: -0.3 * e, squash: 0.08 * e }); }
        else if (k < W + S) {
          const e = (k - W) / S;
          setPose(gb, { armR: lerp(-3.0, -0.2, e), armL: lerp(-0.6, 0.4, e), lean: lerp(-0.35, 0.5, e), poseZ: 0.12 * e, squash: -0.05, hop: Math.sin(e * Math.PI) * 0.12 });
          if (!gb.slashed) { gb.slashed = true; slashFx(V(p.x * 0.75, 0.75, p.z * 0.75), faceAngle(gb), true, 0xfff3c4, 0.45); sfx.swing(); }
        } else {
          if (!gb.didHit) {
            gb.didHit = 1; gb.slashed = false;
            registerHit(gb, contactPoint(gb, rand(0.55, 0.8)), { power: 1.2, sound: "clank" });
            shake = Math.max(shake, 0.08);
          }
          const e = clamp((k - W - S) / R, 0, 1);
          setPose(gb, { armR: lerp(-0.2, -0.3, e) + Math.sin(e * 30) * 0.25 * (1 - e), lean: lerp(0.5, 0.12, e), poseZ: 0.12 * (1 - e), squash: Math.sin(e * 12) * 0.05 * (1 - e) });
          if (e >= 1) {
            if (Math.random() < 0.3) { gb.state = "numb"; gb.t = 0; stats.numb++; log(`${gb.name}は てが しびれた！`); updateTally(); }
            else backToIdle(gb);
          }
        }
        break;
      }
      case "stab": {
        turnToKnight(gb, 0.4);
        const IN = 0.18, N = 3, each = 0.17, OUT = 0.3;
        const dir = tmpV2.set(-p.x, 0, -p.z).normalize();
        if (k < IN) {
          const e = ease(k / IN);
          p.lerpVectors(gb.from, V(dir.x * -0.62, 0, dir.z * -0.62), e);
          setPose(gb, { legL: 0.5 * e, legR: -0.5 * e, lean: 0.3 * e, armR: -1.0 * e });
        } else if (k < IN + N * each) {
          const i = Math.floor((k - IN) / each), e = ((k - IN) % each) / each;
          const thrust = Math.sin(e * Math.PI);
          setPose(gb, { armR: -1.0 - thrust * 0.55, foreR: -0.4 * (1 - thrust), lean: 0.3 + thrust * 0.15, poseZ: thrust * 0.1, armL: 0.5, legL: -0.4, legR: 0.3 });
          if (gb.didHit <= i && e > 0.5) {
            gb.didHit = i + 1;
            const at = contactPoint(gb, rand(0.45, 0.7));
            spriteFx(starTex, at, 0.28, 0.12, 0xdde8ff);
            registerHit(gb, at, { power: 0.6, sound: "tink", quiet: true, noMiss: true });
            if (i === N - 1) log(`ゆうしゃに ${hl("0")}・${hl("0")}・${hl("0")}の ダメージ！`);
          }
        } else {
          const e = clamp((k - IN - N * each) / OUT, 0, 1);
          p.lerpVectors(V(dir.x * -0.62, 0, dir.z * -0.62), gb.from, ease(e));
          setPose(gb, { legL: 0.5 * (1 - e), legR: -0.5 * (1 - e), lean: 0.3 * (1 - e), armR: -1.0 * (1 - e) - 0.3 * e });
          if (e >= 1) backToIdle(gb);
        }
        break;
      }
      case "jump": {
        turnToKnight(gb, 0.3);
        const CR = 0.32, UP = 0.36, BACK = 0.6;
        const dir = tmpV2.set(-p.x, 0, -p.z).normalize();
        const hitPos = V(-dir.x * 0.55, 0.62, -dir.z * 0.55);
        if (k < CR) { const e = k / CR; setPose(gb, gb.rig ? { knee: 0.9 * ease(e), armR: -1.2 * e, armL: 0.5 * e, lean: 0.35 * e } : { squash: 0.25 * ease(e), legL: -0.4 * e, legR: -0.4 * e, armR: 0.6 * e, armL: 0.6 * e, lean: 0.3 * e }); }
        else if (k < CR + UP) {
          const e = (k - CR) / UP;
          p.lerpVectors(gb.from, hitPos, ease(e));
          p.y += Math.sin(e * Math.PI) * 0.5;
          setPose(gb, gb.rig ? { knee: 0.9 * (1 - e) + Math.sin(e * Math.PI) * 0.6, armR: lerp(-1.2, -3.0, e), foreR: -0.2, armL: 0.6, lean: -0.25 * e, hop: 0.1 * e } : { squash: -0.1, legR: -1.4 * e, legL: 0.6 * e, armR: 0.8, armL: 0.8, poseX: -0.4 * e, lean: -0.2 });
          if (!gb.whoosh) { gb.whoosh = true; sfx.swing(); }
        } else {
          if (!gb.didHit) {
            gb.didHit = 1; gb.whoosh = false;
            const at = contactPoint(gb, 0.95);
            slashFx(at, faceAngle(gb), !!gb.rig, 0xffe9a8, gb.rig ? 0.4 : 0.3);
            registerHit(gb, at, { power: 1.1, sound: "thump" });
            gb.bounceFrom = p.clone();
          }
          const e = clamp((k - CR - UP) / BACK, 0, 1);
          p.lerpVectors(gb.bounceFrom, gb.from, e);
          p.y = Math.max(0, lerp(gb.bounceFrom.y, 0, e) + Math.sin(e * Math.PI) * 0.6);
          setPose(gb, gb.rig ? { poseX: -e * Math.PI * 2, armR: lerp(0.4, -0.3, e), armL: 0.6, knee: e > 0.85 ? 0.6 : 0.3, lean: 0.3 * (1 - e) } : { poseX: -0.4 - e * Math.PI * 2, squash: e > 0.9 ? 0.15 : 0, armR: 1, armL: 1 });
          if (e >= 1) { gb.pose.rotation.x = 0; backToIdle(gb); }
        }
        break;
      }
      case "throw": {
        turnToKnight(gb, 0.3);
        const W = 0.45, REL = 0.15, F = 0.5;
        const TA = gb.rig ? "armL" : "armR", TB = gb.rig ? "armR" : "armL";
        if (k < W) { const e = ease(k / W); setPose(gb, { [TA]: -2.6 * e, [TB]: 0.6 * e, lean: -0.3 * e, legL: 0.4 * e }); }
        else if (k < W + REL) {
          const e = (k - W) / REL;
          setPose(gb, { [TA]: lerp(-2.6, -0.6, e), [TB]: 0.6, lean: lerp(-0.3, 0.35, e), legL: 0.4 });
          if (!gb.thrown) {
            gb.thrown = true;
            if (gb.parts.rock) gb.parts.rock.visible = false;
            const start = new T.Vector3();
            if (gb.rig && gb.rig.bones.LeftHand) gb.rig.bones.LeftHand.getWorldPosition(start);
            else if (gb.parts.hand) gb.parts.hand.getWorldPosition(start);
            else start.copy(p).add(V(0, GOBLIN_H * 0.8, 0));
            const rock = new T.Mesh(new T.DodecahedronGeometry(0.06), rockM);
            rock.castShadow = true;
            rock.position.copy(start);
            scene.add(rock);
            const tgt = knightHead.clone().add(V(rand(-0.05, 0.05), rand(-0.05, 0.08), 0));
            const toward = tmpV.set(p.x, 0, p.z).normalize().multiplyScalar(0.2);
            tgt.add(toward);
            projectiles.push({ mesh: rock, from: start, to: tgt, t: 0, dur: 0.55, h: 0.9, gb });
            sfx.swing();
          }
        } else {
          const e = clamp((k - W - REL) / F, 0, 1);
          setPose(gb, { [TA]: lerp(-0.6, -0.3, e), lean: lerp(0.35, 0.12, e) });
          if (e >= 1) { gb.thrown = false; if (gb.parts.rock) gb.parts.rock.visible = true; backToIdle(gb, rand(1.2, 2.8)); }
        }
        break;
      }
      case "numb": {
        // shaking a stinging hand
        const s = Math.sin(k * 40);
        setPose(gb, { armR: -1.2 + s * 0.4, armRz: 0.3, lean: 0.25, headZ: Math.sin(k * 7) * 0.2, legL: Math.abs(Math.sin(k * 9)) * 0.5 });
        if (k > 1.4) backToIdle(gb, rand(0.6, 1.4));
        break;
      }
    }
    if (gb.mixer) gb.mixer.update(dt);
  }

  function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.t += dt;
      const e = clamp(pr.t / pr.dur, 0, 1);
      pr.mesh.position.lerpVectors(pr.from, pr.to, e);
      pr.mesh.position.y += Math.sin(e * Math.PI) * pr.h;
      pr.mesh.rotation.x += dt * 14; pr.mesh.rotation.y += dt * 9;
      if (e >= 1) {
        scene.remove(pr.mesh);
        projectiles.splice(i, 1);
        shardsFx(pr.to);
        registerHit(pr.gb, pr.to, { power: 0.9, sound: "kotsun", line: `ゆうしゃの かぶとに あたった！ ${hl("0")}の ダメージ！` });
      }
    }
  }

  // ---------- optional: user-supplied models (models/knight.json, models/goblin.json) ----------
  function fitHeight(obj, h) {
    obj.updateMatrixWorld(true);
    const box = new T.Box3().setFromObject(obj);
    const size = box.getSize(new T.Vector3());
    const s = h / (size.y || 1);
    obj.scale.multiplyScalar(s);
    obj.updateMatrixWorld(true);
    const b2 = new T.Box3().setFromObject(obj);
    const c = b2.getCenter(new T.Vector3());
    obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b2.min.y;
  }
  function findClips(anims) {
    const f = (re) => anims.find((a) => re.test(a.name));
    return {
      idle: f(/idle|stand|wait|breath/i) || anims[0],
      walk: f(/walk|run|move/i),
      attack: f(/attack|slash|swing|hit|punch|strike|stab|throw/i),
    };
  }
  const loadErrors = [];
  function loadGLB(url) {
    return new Promise((res) => {
      if (!T.GLTFLoader) { loadErrors.push("GLTFLoader が よみこめない"); return res(null); }
      const fail = (e) => { loadErrors.push(url + ": " + ((e && (e.message || e.type)) || e)); res(null); };
      try { new T.GLTFLoader().load(url, res, undefined, fail); } catch (e) { fail(e); }
    });
  }
  const modelStatus = { knight: "仮モデル", goblin: "仮モデル" };
  let knightMixer = null, userKnight = null, knightRig = null;
  async function loadUserModels() {
    const [kg, gg] = await Promise.all([loadGLB("models/knight.json"), loadGLB("models/goblin.json")]);
    if (kg) {
      const m = kg.scene;
      m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
      knightRig = makeRig(m);
      if (!Object.keys(knightRig.bones).length) knightRig = null;
      fitHeight(m, 2.1);
      knight.visible = false;
      knightHolder.add(m);
      userKnight = m;
      if (kg.animations && kg.animations.length) {
        knightMixer = new T.AnimationMixer(m);
        knightMixer.clipAction(findClips(kg.animations).idle).play();
      }
      modelStatus.knight = "models/knight.json";
    }
    if (gg) {
      const clips = findClips(gg.animations || []);
      const tints = [0xffffff, 0xd9ffc8, 0xfff0cf, 0xd6e4ff];
      goblins.forEach((gb, gi) => {
        const m = T.SkeletonUtils ? T.SkeletonUtils.clone(gg.scene) : gg.scene.clone(true);
        m.traverse((o) => {
          if (!o.isMesh) return;
          o.castShadow = true;
          o.frustumCulled = false;
          o.material = o.material.clone();
          o.material.color.multiply(C(tints[gi]));
        });
        gb.loaded = true;
        gb.poseBaseY = GOBLIN_H / 2;
        const rig = makeRig(m);
        gb.rig = Object.keys(rig.bones).length ? rig : null;
        gb.pose.remove(gb.visual);
        gb.root.scale.setScalar(1);
        const holder = new T.Group();
        holder.add(m);
        fitHeight(m, GOBLIN_H);
        holder.position.y = -GOBLIN_H / 2;
        gb.pose.position.y = GOBLIN_H / 2;
        gb.pose.add(holder);
        gb.visual = holder;
        gb.parts = {};                // procedural limb posing no longer applies
        if (gb.rig && gb.style === "throw" && gb.rig.bones.LeftHand) {
          const hand = gb.rig.bones.LeftHand, ws = hand.getWorldScale(new T.Vector3()).x;
          const rock = new T.Mesh(new T.DodecahedronGeometry(0.06), rockM);
          rock.scale.setScalar(1 / ws);
          rock.position.set(0, 0.05 / ws, 0);
          hand.add(rock);
          gb.parts.rock = rock;
        }
        if (gg.animations && gg.animations.length) {
          gb.mixer = new T.AnimationMixer(m);
          gb.clips = clips;
          playClip(gb, "idle");
        }
      });
      modelStatus.goblin = "models/goblin.json";
    }
  }
  // ---------- HUD ----------
  const logEl = document.getElementById("log");
  const LOG_LINES = 4;
  function log(html) {
    const p = document.createElement("p");
    p.className = "new";
    p.innerHTML = html;
    logEl.appendChild(p);
    while (logEl.children.length > LOG_LINES) logEl.removeChild(logEl.firstChild);
  }
  const hl = (s) => `<span class="hl">${s}</span>`;
  const el = (id) => document.getElementById(id);
  function updateTally() {
    el("tHits").textContent = stats.hits.toLocaleString("ja-JP");
    el("tNumb").textContent = stats.numb;
  }

  const popsEl = document.getElementById("pops");
  const pops = [];
  const proj = new T.Vector3();
  function toScreen(v) {
    proj.copy(v).project(camera);
    return { x: (proj.x * 0.5 + 0.5) * innerWidth, y: (-proj.y * 0.5 + 0.5) * innerHeight, behind: proj.z > 1 };
  }
  function popup(at, text, cls) {
    const d = document.createElement("div");
    d.className = "dmg" + (cls ? " " + cls : "");
    d.textContent = text;
    popsEl.appendChild(d);
    pops.push({ el: d, at: at.clone(), t: 0, dx: rand(-14, 14) });
    if (pops.length > 40) { const o = pops.shift(); o.el.remove(); }
  }

  const flashEl = document.getElementById("flash");
  function flash(op = 0.5) {
    flashEl.animate([{ opacity: op }, { opacity: 0 }], { duration: 220, easing: "ease-out" });
  }

  // ---------- sound (WebAudio, off until the player turns it on) ----------
  let actx = null, soundOn = false;
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, hp = 1200) {
    if (!soundOn || !actx) return;
    const n = actx.sampleRate * dur, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  }
  const sfx = {
    hit() { tone("square", 2100, 1500, 0.06, 0.025); tone("triangle", 3300, 2600, 0.12, 0.03); },
    clank() { tone("square", 1700, 900, 0.09, 0.03); tone("triangle", 2500, 2300, 0.35, 0.035); noise(0.08, 0.08, 2000); },
    tink() { tone("triangle", 3800, 3400, 0.07, 0.025); },
    thump() { tone("sine", 160, 60, 0.18, 0.18); noise(0.05, 0.05, 800); },
    kotsun() { tone("square", 1200, 1100, 0.04, 0.03); tone("triangle", 2600, 2500, 0.2, 0.03, 0.01); noise(0.1, 0.05, 1500); },
    swing() { noise(0.12, 0.05, 3000); },
    menu() { tone("square", 880, 880, 0.05, 0.03); },
  };

  // ---------- knight idle ----------
  let headYaw = 0, headYawTarget = 0, headPitchTarget = 0, lookTimer = 2;
  let shake = 0;
  function lookAt(gb) {
    const p = gb.root.position;
    headYawTarget = clamp(Math.atan2(p.x, p.z), -0.9, 0.9);
    headPitchTarget = 0.35;
    lookTimer = 1.6;
  }

  // ---------- commands ----------
  function cmd(id, fn) {
    el(id).addEventListener("click", () => { initAudio(); sfx.menu(); fn(); });
  }
  cmd("cFight", () => {
    log("ゆうしゃは けんを ぬこうとした！");
    log(pick(["しかし めんどうに なって やめた。", "しかし ゴブリンが かわいそうに なった。", "しかし ぬくまでも ないと おもった。"]));
  });
  cmd("cGuard", () => {
    log("ゆうしゃは みを まもっている。");
    log("…もともと ダメージは 0だ。");
  });
  cmd("cItem", () => {
    log("ゆうしゃは やくそうを とりだした！");
    log("しかし HPは まんたんだった。");
  });
  cmd("cRun", () => {
    log("ゆうしゃは にげだした！");
    log("…しかし ゴブリンに かこまれていて うごくのが めんどうだ。");
  });
  cmd("cCall", () => {
    if (!ready) return;
    log(`ゴブリンたちの ${hl("いっせいこうげき")}！`);
    goblins.forEach((gb, i) => {
      if (gb.state === "idle" || gb.state === "walk" || gb.state === "numb") {
        gb.root.rotation.y = faceAngle(gb);
        gb.state = "idle";
        gb.wait = i * 0.12;
        gb.quietOnce = true;
      }
    });
    setTimeout(() => { if (ready) { flash(0.35); shake = Math.max(shake, 0.25); log(`ゆうしゃに ${hl("0")}の ダメージ！`); } }, 1100);
  });
  const soundBtn = el("cSound");
  function initAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === "suspended") actx.resume();
  }
  soundBtn.addEventListener("click", () => {
    initAudio();
    soundOn = !soundOn && !!actx;
    soundBtn.textContent = soundOn ? "おと：ON" : "おと：OFF";
    sfx.menu();
  });
  // ---------- camera orbit (drag / wheel / pinch) ----------
  const target = V(0, 1.15, 0);
  const orbit = { theta: 0.55, phi: 1.36, r: 6.5, minR: 2.6, maxR: 22 };
  let lastInteract = -10;
  const pointers = new Map();
  let pinch0 = 0, r0 = 0;
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = orbit.r; } });
  cv.addEventListener("pointermove", (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    lastInteract = clock.elapsedTime;
    if (pointers.size === 1) {
      orbit.theta -= (cur.x - prev.x) * 0.006;
      orbit.phi = clamp(orbit.phi - (cur.y - prev.y) * 0.005, 0.35, 1.52);
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0 > 0) orbit.r = clamp(r0 * pinch0 / d, orbit.minR, orbit.maxR);
    }
  });
  const up2 = (e) => { pointers.delete(e.pointerId); pinch0 = 0; };
  cv.addEventListener("pointerup", up2);
  cv.addEventListener("pointercancel", up2);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); lastInteract = clock.elapsedTime; orbit.r = clamp(orbit.r * Math.exp(e.deltaY * 0.001), orbit.minR, orbit.maxR); }, { passive: false });

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 55 : 42;
    orbit.r = clamp(orbit.r, orbit.minR, orbit.maxR);
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  if (innerWidth < innerHeight) orbit.r = 8.5;

  // ---------- opening state ----------
  let ready = false;
  knight.visible = false;
  goblins.forEach((gb) => { gb.root.visible = false; });
  log("モデルを よみこんでいます…");
  function begin() {
    ready = true;
    knightHolder.visible = true;
    goblins.forEach((gb) => { gb.root.visible = true; });
    logEl.innerHTML = "";
    log("ゴブリンが 4ひき あらわれた！");
    log(`ゆうしゃは ${hl("Lv99")}だ。`);
    log("ゆうしゃは じっと たっている。");
    updateTally();
  }
  loadUserModels().catch((e) => { loadErrors.push("モデルの せっちで エラー: " + (e && e.message)); }).then(() => {
    if (!modelStatus.knight.endsWith(".json")) knight.visible = true;   // fall back to the built-in knight
    begin();
    if (loadErrors.length) {
      log("モデルを よみこめなかったので かりの モデルで うごいています。");
      log(loadErrors.join(" / ").replace(/[<>&]/g, ""));
    }
  });

  // ---------- main loop ----------
  const clock = new T.Clock();
  function frame() {
    let dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    timeU.value = t;
    if (hitStop > 0) { hitStop -= dt; dt *= 0.08; }

    if (ready) {
      for (const gb of goblins) updateGoblin(gb, dt, t);
      updateProjectiles(dt);
    }
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i];
      f.t += dt;
      const k = Math.min(1, f.t / f.dur);
      f.update(k, dt);
      if (k >= 1) { scene.remove(f.obj); fx.splice(i, 1); }
    }
    barrierMat.uniforms.uOp.value = Math.max(0, barrierMat.uniforms.uOp.value - dt * 2.2);
    barrier.visible = barrierMat.uniforms.uOp.value > 0.01;

    // knight idle: breathing, bored glances (procedural knight also waves cape and plume)
    const breathe = Math.sin(t * 1.4);
    if (!knightRig) knightHolder.scale.set(1 + breathe * 0.004, 1 + breathe * 0.006, 1 + breathe * 0.004);
    lookTimer -= dt;
    if (lookTimer <= 0) {
      headYawTarget = Math.random() < 0.5 ? 0 : rand(-0.6, 0.6);
      headPitchTarget = Math.random() < 0.3 ? rand(-0.15, 0.1) : 0;
      lookTimer = rand(2, 5);
    }
    headYaw = lerp(headYaw, headYawTarget, 1 - Math.exp(-dt * 3));
    if (knight.visible) {
      torso.scale.set(1 + breathe * 0.008, 1 + breathe * 0.012, 1 + breathe * 0.01);
      head.rotation.y = headYaw;
      head.rotation.x = lerp(head.rotation.x, headPitchTarget, 1 - Math.exp(-dt * 3));
      plume.rotation.x = Math.sin(t * 2.1) * 0.06;
      plume.rotation.z = Math.sin(t * 1.7) * 0.05;
      const pa = capeGeo.attributes.position;
      for (let i = 0; i < pa.count; i++) {
        const bx = capeBase[i * 3], by = capeBase[i * 3 + 1];
        const hang = (0.725 - by) / 1.45;
        const wave = Math.sin(t * 2.2 + hang * 4 + bx * 3) * 0.06 + Math.sin(t * 3.7 + bx * 6) * 0.02;
        pa.setXYZ(i, bx * (1 + hang * 0.25), by, -(hang * hang) * 0.28 - wave * hang - 0.02);
      }
      pa.needsUpdate = true;
      capeGeo.computeVertexNormals();
    } else if (knightRig) {
      // rigged knight: MMO-style AFK idle (feet apart, soft knees, arms hanging loose); only breathing moves
      const r = knightRig;
      r.reset();
      r.rot("Spine", 0.05 + breathe * 0.015, 0, 0);
      r.rot("Spine2", 0.02 - breathe * 0.025, 0, 0);
      r.rot("LeftShoulder", 0, 0, -0.04 + breathe * 0.025);
      r.rot("RightShoulder", 0, 0, 0.04 - breathe * 0.025);
      r.rot("Neck", 0.04, 0, 0);
      r.rot("Head", 0.08 + breathe * 0.01, 0, 0);
      r.rot("LeftArm", 0.1, 0, -1.4 - breathe * 0.012);
      r.rot("LeftForeArm", -0.24, 0, 0);
      r.rot("LeftHand", 0, 0, 0.15);
      r.rot("RightArm", 0.1, 0, 1.4 + breathe * 0.012);
      r.rot("RightForeArm", -0.24, 0, 0);
      r.rot("RightHand", 0, 0, -0.15);
      r.rot("LeftUpLeg", -0.06, 0, 0.07);
      r.rot("LeftLeg", 0.12, 0, 0);
      r.rot("LeftFoot", 0, -0.15, -0.07);
      r.rot("RightUpLeg", -0.06, 0, -0.07);
      r.rot("RightLeg", 0.12, 0, 0);
      r.rot("RightFoot", 0, 0.15, 0.07);
    } else if (userKnight) {
      userKnight.rotation.y = lerp(userKnight.rotation.y, headYaw * 0.15, 1 - Math.exp(-dt * 2));
    }
    if (knightMixer) knightMixer.update(dt);
    aura.material.opacity = 0.45 + Math.sin(t * 2) * 0.15;
    if (Math.random() < dt * 6) {
      const a = Math.random() * Math.PI * 2, r = rand(0.3, 0.9);
      emit(V(Math.cos(a) * r, rand(0, 0.5), Math.sin(a) * r), V(0, rand(0.4, 0.9), 0), rand(1.2, 2.2), 0xffd77a);
    }

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.v.y -= q.max < 1 ? 9 * dt : 0;
      q.p.addScaledVector(q.v, dt);
    }
    for (let i = 0; i < PMAX; i++) {
      const q = parts[i];
      if (q) {
        pPos[i * 3] = q.p.x; pPos[i * 3 + 1] = q.p.y; pPos[i * 3 + 2] = q.p.z;
        const f = q.life / q.max;
        pCol[i * 3] = q.c.r * f; pCol[i * 3 + 1] = q.c.g * f; pCol[i * 3 + 2] = q.c.b * f;
      } else {
        pPos[i * 3 + 1] = -100;
      }
    }
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.color.needsUpdate = true;

    for (const g of islands) g.position.y = g.userData.y0 + Math.sin(t * 0.4 + g.userData.ph) * 0.8;

    // camera
    const sp = Math.sin(orbit.phi);
    camera.position.set(target.x + orbit.r * sp * Math.sin(orbit.theta), target.y + orbit.r * Math.cos(orbit.phi), target.z + orbit.r * sp * Math.cos(orbit.theta));
    if (camera.position.y < 0.3) camera.position.y = 0.3;
    camera.lookAt(target);
    if (shake > 0) {
      shake = Math.max(0, shake - dt);
      const k = reduceMotion ? 0 : shake * 0.25;
      camera.position.x += rand(-k, k); camera.position.y += rand(-k, k);
    }

    renderer.render(scene, camera);

    for (let i = pops.length - 1; i >= 0; i--) {
      const o = pops[i];
      o.t += dt;
      const sc = toScreen(o.at);
      const rise = Math.min(o.t, 0.25) * 140 + o.t * 18;
      const op = o.t < 0.7 ? 1 : Math.max(0, 1 - (o.t - 0.7) / 0.4);
      o.el.style.transform = `translate(${sc.x + o.dx}px, ${sc.y - rise}px) translate(-50%, -50%)`;
      o.el.style.opacity = sc.behind ? 0 : op;
      if (o.t > 1.1) { o.el.remove(); pops.splice(i, 1); }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
