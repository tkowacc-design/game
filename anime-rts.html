<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行RTS 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* The desk, seen from your chair, drawn at 1920x1080 and scaled to the window. No fixed panels:
     press a 進行 and what you can tell them appears beside them; press the phone and it comes up in front of you. */
  :root {
    --navy: #1f2a44; --navy-2: #2a3654; --cream: #fdf3dc; --cream-2: #f5ead0; --ink: #1d2236; --ink-soft: #4d5470;
    --yellow: #ffe082; --line: #1a2036; --red: #c8323a; --orange: #a35a00; --blue: #1f5fbf; --green: #167a4d; --gray: #b9bfcc;
    --font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: #0f1320; overflow: hidden; }
  body { color: #fff; font-family: var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #app { position: relative; width: 100%; height: 100%; }
  .box { position: absolute; overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .stage img.art { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; user-select: none; -webkit-user-drag: none; }

  /* whiteboard: the twelve episodes, drawn as text on the board in the picture */
  .wb { position: absolute; left: 770px; top: 84px; width: 400px; height: 390px; box-sizing: border-box; padding: 14px 18px 0; color: var(--ink); pointer-events: none; }
  .wb h2 { margin: 0 0 6px; text-align: center; font-size: 25px; font-weight: 700; letter-spacing: .02em; }
  .wb table { width: 100%; border-collapse: collapse; font-size: 19px; font-weight: 700; line-height: 1.12; color: var(--ink); }
  .wb th { font-size: 18px; border: 1px solid #9aa2b8; padding: 2px 4px; background: rgba(255, 255, 255, .35); }
  .wb td { border-left: 1px solid #9aa2b8; border-right: 1px solid #9aa2b8; border-bottom: 1px solid #c3c8d6; padding: 1px 6px; white-space: nowrap; }
  .wb td:first-child { text-align: center; width: 46px; }
  .wb td:last-child { text-align: center; width: 120px; }
  .wb .red { color: var(--red); } .wb .org { color: var(--orange); } .wb .blu { color: var(--blue); } .wb .grn { color: var(--green); } .wb .mut { color: #565c72; font-weight: 400; }
  .wb tr.now td { background: rgba(255, 224, 130, .45); }

  /* who you can press */
  .zone { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 8px; }
  .zone:hover, .zone:focus-visible { box-shadow: inset 0 0 0 4px rgba(255, 224, 130, .55); outline: none; }
  .zone.on { box-shadow: inset 0 0 0 5px var(--yellow); }
  .zone.drop { box-shadow: inset 0 0 0 6px var(--yellow); background: rgba(255, 224, 130, .14); }
  .zone.nodrop { box-shadow: inset 0 0 0 6px #8a93ab; }
  .obj { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 10px; }
  .obj:hover, .obj:focus-visible { box-shadow: 0 0 0 4px rgba(255, 224, 130, .7); outline: none; }
  .keys { touch-action: none; cursor: grab; }
  .badge { position: absolute; right: -8px; top: -14px; min-width: 48px; height: 48px; padding: 0 6px; box-sizing: border-box; background: var(--red); color: #fff; font-size: 28px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--line); }

  /* status tag and report bubble over each person */
  .tag { position: absolute; height: 42px; padding: 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; font-size: 22px; font-weight: 700; white-space: nowrap; pointer-events: none; box-shadow: 0 0 0 3px var(--line); }
  .tag.att { background: var(--yellow); color: var(--ink); }
  .tag .bar { width: 72px; height: 8px; background: #46506e; display: block; }
  .tag .bar i { display: block; height: 100%; background: var(--yellow); }
  .bubble { position: absolute; min-width: 260px; max-width: 360px; box-sizing: border-box; padding: 14px 22px; background: var(--cream); color: var(--ink); font-size: 28px; font-weight: 700; line-height: 1.3; text-align: center; border: 0; box-shadow: 0 0 0 5px var(--line), 6px 6px 0 5px rgba(0, 0, 0, .25); }
  .bubble::after { content: ""; position: absolute; left: 60px; bottom: -22px; border: 11px solid transparent; border-top: 12px solid var(--line); }
  .bubble.r::after { left: auto; right: 60px; }
  .bubble.bad { background: #ffe1e1; }
  .zzz { position: absolute; font-size: 40px; font-weight: 700; color: #dfe4f0; text-shadow: 0 3px 0 var(--line); pointer-events: none; }

  /* clock (top left) and controls (top right) */
  .hud { position: absolute; left: 28px; top: 24px; width: 485px; min-height: 112px; box-sizing: border-box; padding: 14px 22px 12px; background: rgba(31, 42, 68, .94); color: #fff; font-weight: 700; pointer-events: none; }
  .hud .l1 { font-size: 30px; display: flex; gap: 22px; align-items: baseline; }
  .hud .l1 small { margin-left: auto; font-size: 18px; color: #c9d0e4; }
  .hud .l2 { font-size: 30px; }
  .hud .l2.on { color: #ffb3b3; }
  .hud .l2 small { font-size: 18px; color: #c9d0e4; margin-left: 10px; }
  .hud .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
  .hud .days span { height: 8px; background: #46506e; }
  .hud .days span i { display: block; height: 100%; background: var(--yellow); }
  .ctl { position: absolute; right: 28px; top: 24px; display: flex; gap: 6px; }
  .ctl button { height: 60px; min-width: 76px; padding: 0 18px; background: rgba(31, 42, 68, .94); border: 0; color: #fff; font-size: 24px; font-weight: 700; }
  .ctl button.on { color: var(--yellow); }


  /* what you can tell a 進行: beside them, unscaled enough to read */
  .ui { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .menu { position: absolute; transform-origin: 0 0; display: flex; flex-direction: column; gap: 8px; width: 260px; }
  .menu .head { background: var(--cream); color: var(--ink); padding: 10px 14px; box-shadow: 0 0 0 4px var(--line), 6px 6px 0 4px rgba(0, 0, 0, .25); font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; gap: 4px; }
  .menu .head b { font-size: 18px; }
  .menu .head .said { border-top: 2px dashed #d9caa6; padding-top: 4px; }
  .menu .head .me { color: var(--ink-soft); }
  .menu .head .me.worry { color: var(--orange); } .menu .head .me.bad { color: var(--red); } .menu .head .me.good { color: var(--green); }
  .cmd { height: 64px; width: 260px; box-sizing: border-box; padding: 0 10px; border: 0; background: var(--cream); color: var(--ink); font-size: 24px; font-weight: 700; box-shadow: 0 0 0 4px var(--line), inset 0 -5px 0 var(--cream-2); display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.1; text-align: center; }
  .cmd small { font-size: 14px; font-weight: 700; color: var(--ink-soft); display: block; }
  .cmd:hover:not(:disabled), .cmd.on { background: var(--yellow); }
  .cmd:disabled { background: var(--gray); color: #2f3550; box-shadow: 0 0 0 4px var(--line); cursor: not-allowed; font-size: 20px; }
  .cmd.sub { height: 56px; font-size: 20px; flex-direction: column; gap: 0; }
  .cmd .stack { display: flex; flex-direction: column; }
  .menu.eps { width: 260px; }
  .menu .cap { font-size: 15px; font-weight: 700; color: #fff; background: var(--navy); padding: 4px 10px; box-shadow: 0 0 0 4px var(--line); }

  /* the phone, brought up in front of you */
  .phone-bg { position: fixed; inset: 0; z-index: 30; background: rgba(8, 10, 18, .35); }
  .phone { position: absolute; left: 50%; top: 50%; width: 460px; height: 820px; transform-origin: 50% 50%; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .scr { position: absolute; left: 32px; top: 66px; width: 396px; height: 678px; background: #f5efe0; color: var(--ink); display: flex; flex-direction: column; }
  .scr .bar { background: var(--navy); color: #fff; height: 74px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; font-size: 24px; font-weight: 700; flex: none; }
  .scr .bar small { font-size: 20px; }
  .scr .list { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  .scr .m { display: flex; flex-direction: column; gap: 6px; }
  .scr .m .who { font-size: 17px; font-weight: 700; color: #565c72; }
  .scr .m .txt { background: #e3e5ea; padding: 12px 14px; font-size: 19px; font-weight: 700; line-height: 1.5; }
  .scr .m.bad .txt { background: #f6dcdc; }
  .scr .m .at { font-size: 14px; color: #565c72; }
  .scr .empty { color: #565c72; font-size: 18px; padding: 20px 0; text-align: center; }
  .scr .back { margin: 0 18px 18px; height: 72px; flex: none; border: 0; background: var(--navy); color: #fff; font-size: 22px; font-weight: 700; }

  /* dialogs (help, end of week, end of the season) */
  .modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 18, .7); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .card { width: min(620px, 100%); background: var(--cream); color: var(--ink); box-shadow: 0 0 0 5px var(--line), 10px 10px 0 5px rgba(0, 0, 0, .3); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card .k { display: inline-block; align-self: flex-start; background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; padding: 2px 10px; }
  .card h2 { margin: 0; font-size: 28px; }
  .card .big { font-size: 34px; font-weight: 700; }
  .card .big.on { color: var(--red); }
  .card .rows { display: flex; flex-direction: column; }
  .card .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 6px 2px; border-bottom: 2px dashed #e0d2ae; font-size: 15px; font-weight: 700; }
  .card .row .v.good { color: var(--green); } .card .row .v.warn { color: var(--orange); } .card .row .v.bad { color: var(--red); } .card .row .v.mute { color: var(--ink-soft); }
  .card ul { margin: 0; padding-left: 22px; display: grid; gap: 7px; font-size: 15px; line-height: 1.55; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .card .acts .cmd { width: auto; min-width: 220px; padding: 0 20px; flex: 1 1 220px; }
  .card .acts .cmd.pri { background: var(--yellow); }
  .rank { font-size: 72px; font-weight: 700; line-height: 1; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 35; background: var(--navy); color: #fff; padding: 10px 18px; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px var(--line); pointer-events: none; max-width: 90vw; }
  .ghost { position: fixed; z-index: 36; width: 200px; pointer-events: none; image-rendering: pixelated; display: none; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35)); }
  @media (prefers-reduced-motion: no-preference) {
    .bubble { animation: pop .25s ease-out; }
    @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<div id="app">
  <div class="box" id="box">
    <div class="stage" id="stage">
      <img class="art" id="bg" src="assets/rts/bg-day.webp" alt="" style="left:0;top:0;width:1920px;height:1080px">
      <div class="wb" id="wb"></div>
      <img class="art" id="c-s2" alt="" style="left:1300px;top:235px;width:430px;height:430px">
      <img class="art" id="c-s1" alt="" style="left:0px;top:242px;width:640px;height:640px">
      <img class="art" id="c-s3" alt="" style="left:1375px;top:344px;width:640px;height:640px">
      <img class="art" src="assets/rts/fg.webp" alt="" style="left:0;top:0;width:1920px;height:1080px">
      <img class="art" src="assets/rts/phone-desk.webp" alt="" style="left:50px;top:932px;width:286px">
      <img class="art" id="keys-art" src="assets/rts/car-keys.webp" alt="" style="left:352px;top:916px;width:280px">
      <div id="ov"></div>
      <div id="ovb"></div>
    </div>
  </div>
  <div class="ui" id="ui"></div>
  <img class="ghost" id="ghost" src="assets/rts/car-keys.webp" alt="">
  <div id="toast"></div>
  <div id="modal-root"></div>
</div>
<script id="engine">
const Engine = (() => {
  "use strict";
  // Time is in game minutes from 第1週 月曜 0:00. One week (10080 min) is 120 real seconds: 84 min per second.
  const HOUR = 60, DAY = 1440, WEEK = 7 * DAY, START = 9 * HOUR, EPS = 12, SCHEDULE = 4;
  const TASK = {
    eigyo: { label: "原画マン営業", short: "営業", hours: 16, ep: true },
    meet: { label: "作打ち", short: "作打ち", hours: 8, ep: true },
    shinko: { label: "進行表", short: "進行表", hours: 10, ep: true, sheet: true },
    soto: { label: "回収へ", short: "回収", hours: 16, car: true },
    rest: { label: "休ませる", short: "休憩", hours: 0 },
  };
  const NAMES = ["高槻 透", "三好 かおる", "芹沢 一馬", "小野寺 ゆう", "柚木 瞳", "黒川 仁", "日向 まどか", "塩見 直", "久住 梓", "早瀬 涼", "蓮見 楓", "宇佐美 圭", "榎本 一花", "真田 航"];
  const SHINKO = [
    { id: "s1", name: "佐伯", rookie: true },
    { id: "s2", name: "川口", rookie: false },
    { id: "s3", name: "真壁", rookie: true },
  ];
  const DOUGA_PER_DAY = 70, DOUGA_LAG = 36 * HOUR, SHOT_PER_DAY = 90, SHOT_LAG = 12 * HOUR, CAR_CAP = 60, ANIM_CAP = 40;

  function rnd(s) {
    let a = (s.r = (s.r + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const hourOf = (t) => Math.floor((t % DAY) / HOUR);
  const weekOf = (t) => Math.floor(t / WEEK) + 1;
  const airOf = (n) => (n + SCHEDULE - 1) * WEEK; // 第n話: starts at the beginning of week n, airs at the end of week n+3
  const famName = (name) => name.split(" ")[0];
  function log(s, text, tone = "") { s.log.unshift({ t: s.t, text, tone }); if (s.log.length > 200) s.log.length = 200; }

  function newGame(seed = 1) {
    const s = { v: 2, seed, r: (seed * 2654435761) >>> 0 || 1, t: START, phase: "play", week: 1, eps: [], anims: [], shinko: [], car: null, pipe: [], phone: [], log: [], weekEnd: null, result: null, acc: { douga: 0, shot: 0 },
      stats: { orders: 0, waited: 0, blank: 0, drops: 0 } };
    s.anims = NAMES.map((name, i) => ({ id: "a" + (i + 1), name, rate: 2.0 + rnd(s) * 1.2, acc: 0, queue: [] }));
    s.shinko = SHINKO.map((d) => ({ ...d, sta: 100, task: null, report: null, idleSince: START, asleep: false }));
    startEp(s, 1);
    log(s, "第1週 月曜 9:00。第1話のコンテが上がった。放送まで4週。");
    return s;
  }
  function startEp(s, n) {
    const cuts = 180 + Math.floor(rnd(s) * 41);
    s.eps.push({ n, cuts, empty: cuts, drawn: 0, coll: 0, douga: 0, dDone: 0, shooting: 0, shot: 0, meet: false, sheets: { shinko: false, hatchu: true, kouban: true } /* 香盤表・発注表 are made as the episode starts */, air: airOf(n), result: null });
  }
  const live = (s) => s.eps.filter((e) => !e.result);
  const epOf = (s, n) => s.eps.find((e) => e.n === n);
  const shOf = (s, id) => s.shinko.find((x) => x.id === id);
  const queued = (s, e) => s.anims.reduce((t, a) => t + a.queue.filter((q) => q.ep === e.n).reduce((u, q) => u + q.n, 0), 0);
  const animLoad = (a) => a.queue.reduce((t, q) => t + q.n, 0);
  function counts(s, e) {
    const q = queued(s, e);
    return { empty: e.empty, queued: q, drawn: e.drawn, coll: e.coll, douga: e.douga, dDone: e.dDone, shooting: e.shooting, shot: e.shot, filled: e.cuts - e.empty };
  }

  // ---------- the 進行: they never move on their own ----------
  function canOrder(s, sid, kind, n) {
    const sh = shOf(s, sid), T = TASK[kind];
    if (s.phase !== "play") return "いまは指示を出せない";
    if (!T) return "その指示はない";
    if (T.ep) {
      const e = epOf(s, n);
      if (!e || e.result) return "その話数はない";
      if (kind === "eigyo" && e.empty <= 0) return "空きカットがない";
      if (kind === "meet" && e.meet) return "作打ちは済んでいる";
      if (kind === "meet" && e.cuts - e.empty <= 0) return "まだ誰にも頼んでいない（先に営業）";
      if (T.sheet && e.sheets[kind]) return "もうできている";
    }
    if (kind === "soto" && s.car && s.car !== sid) return `社用車がない（${shOf(s, s.car).name}が使用中）`;
    if (sh.task && sh.task.kind === kind && sh.task.kind !== "rest" && (!T.ep || sh.task.ep === n)) return "いまやっている";
    if (kind === "rest" && sh.task && sh.task.kind === "rest") return "もう休んでいる";
    if (kind === "rest" && sh.sta >= 95) return "体力は十分";
    return "";
  }
  function order(s, sid, kind, n = null) {
    if (canOrder(s, sid, kind, n)) return false;
    const sh = shOf(s, sid);
    if (sh.task && sh.task.kind === "soto" && kind !== "soto") s.car = null; // calling them back brings the car back
    if (sh.task && sh.task.kind !== "rest") log(s, `${sh.name}：「${TASK[sh.task.kind].short}」を途中でやめた。`, "warn");
    if (!sh.asleep && !sh.task) s.stats.waited += Math.max(0, s.t - sh.idleSince);
    sh.report = null;
    sh.asleep = false;
    sh.task = { kind, ep: TASK[kind].ep ? n : null, need: TASK[kind].hours * HOUR, done: 0, t0: s.t };
    if (kind === "soto") s.car = sid;
    s.stats.orders++;
    return true;
  }
  function cancel(s, sid) {
    const sh = shOf(s, sid);
    if (!sh.task) return false;
    if (sh.task.kind === "soto") s.car = null;
    log(s, `${sh.name}：「${TASK[sh.task.kind].short}」を取り消した。`);
    sh.task = null; sh.idleSince = s.t;
    return true;
  }
  const ack = (s, sid) => { const sh = shOf(s, sid); sh.report = null; };

  function finish(s, sh) {
    const T = sh.task, e = T.ep ? epOf(s, T.ep) : null;
    let text = "", tone = "", short = "";
    if (e && e.result) { text = `${e.n}話はもう放送されていた……。`; short = "もう放送されてました……"; }
    else if (T.kind === "eigyo") {
      // fill the cut table: the animators with room take some cuts
      let want = Math.round((12 + rnd(s) * 10) * (sh.rookie ? 0.85 : 1));
      want = Math.min(want, e.empty);
      const free = s.anims.map((a) => ({ a, room: ANIM_CAP - animLoad(a) })).filter((x) => x.room > 0).sort((x, y) => y.room - x.room + (rnd(s) - 0.5) * 8);
      const took = [];
      for (const { a, room } of free) {
        if (want <= 0 || took.length >= 3) break;
        const k = Math.min(room, Math.max(6, Math.ceil(want / (3 - took.length))), want);
        a.queue.push({ ep: e.n, n: k });
        e.empty -= k; want -= k; took.push([a, k]);
      }
      const got = took.reduce((t, [, k]) => t + k, 0);
      if (got) { text = `${e.n}話の営業、終わりました！ ${took.map(([a]) => famName(a.name) + "さん").join("と")}で${got}カット埋まりました！`; tone = "good"; short = `${e.n}話、${got}カット埋まりました！`; }
      else { text = `${e.n}話の営業……みんな手一杯で、取れませんでした。`; tone = "bad"; short = "取れませんでした……"; }
      if (got && !e.meet) text += "（作打ちはまだです）";
    } else if (T.kind === "meet") {
      e.meet = true; text = `${e.n}話の作打ち、終わりました。原画、描き始めてもらいます！`; tone = "good"; short = `${e.n}話の作打ち、終わりました！`;
    } else if (TASK[T.kind].sheet) {
      e.sheets[T.kind] = true; text = `${e.n}話の${TASK[T.kind].short}、できました！`; tone = "good"; short = text;
    } else if (T.kind === "soto") {
      s.car = null;
      text = collect(s, sh); tone = /白紙/.test(text) ? "warn" : /ありませんでした/.test(text) ? "bad" : "good"; short = "戻りました！";
    }
    log(s, `${sh.name}：${text}`, tone);
    sh.report = { text, tone, short: short || text, t: s.t };
    sh.task = null; sh.idleSince = s.t;
  }
  function collect(s, sh) {
    let cap = CAR_CAP;
    const got = [];
    let blank = 0;

    if (c.filled > 0 && !e.meet) step = "作打ち";
    else if (e.meet && c.queued + c.drawn > 0) step = "原画";

    else if (c.dDone + c.shooting > 0 && c.queued + c.drawn + c.coll + c.douga === 0) step = "撮影";
    if (c.empty > 0 && c.filled === 0) step = "営業";
    const st = m.tone === "bad" ? ["要確認", "red"] : m.tone === "worry" ? ["遅れ気味", "org"] : e.sheets.shinko && c.drawn > 0 ? ["回収待ち", "blu"] : ["進行中", ""];
    return [step, st[0], st[1]];
  }
  function whiteboard() {
    const next = E.live(s).sort((a, b) => a.air - b.air)[0];
    const rows = [];
    for (let n = 1; n <= E.EPS; n++) {
      const e = E.epOf(s, n);
      if (!e) { rows.push(`<tr><td>${pad(n)}</td><td class="mut">未着手</td><td class="mut">—</td></tr>`); continue; }
      if (e.result) { const cls = e.result.key === "full" ? "grn" : e.result.key === "still" ? "org" : "red"; rows.push(`<tr><td>${pad(n)}</td><td class="mut">放送済</td><td class="${cls}">${e.result.key === "full" ? "完成" : e.result.key === "still" ? "止め絵" : "落とした"}</td></tr>`); continue; }
      const [step, st, cls] = stage(e);
      rows.push(`<tr class="${next && next.n === n ? "now" : ""}"><td>${pad(n)}</td><td>${step}</td><td class="${cls}">${st}</td></tr>`);
    }
    return `<h2>TVアニメ 進行表</h2><table><thead><tr><th>話数</th><th>工程</th><th>状況</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  }
  function overlay() {
    const out = [];
    const a = E.airStatus(s), d = dayOf(s.t), part = (s.t % E.DAY) / E.DAY;
    const secLeft = Math.max(0, Math.ceil((E.WEEK - (s.t % E.WEEK)) / MIN_PER_SEC));
    out.push(`<div class="hud"><div class="l1">${s.phase === "end" ? `<span>第${E.EPS + E.SCHEDULE - 1}週</span><span>放送終了</span>` : `<span>第${Math.min(s.week, E.weekOf(s.t))}週</span><span>${clock(s.t)}</span><small>残り${secLeft}秒</small>`}</div><div class="l2 ${a.airing ? "on" : ""}">${esc(a.main)}${a.sub ? `<small>${esc(a.sub)}</small>` : ""}</div><div class="days">${DOW.map((_, i) => `<span><i style="width:${i < d ? 100 : i === d ? Math.round(part * 100) : 0}%"></i></span>`).join("")}</div></div>`);
    out.push(`<div class="ctl"><button data-act="pause" aria-label="${ui.paused || ui.modal ? "時間を動かす" : "時間を止める"}">${ui.paused || ui.modal || s.phase !== "play" ? "▶ 再開" : "Ⅱ 停止"}</button><button data-act="speed" class="${ui.speed === 2 ? "on" : ""}" aria-pressed="${ui.speed === 2}">×${ui.speed}</button><button data-act="help" aria-label="遊び方">？</button></div>`);
    for (const sh of s.shinko) {

      let extra = "";
      if (tg.task) { const pr = Math.min(1, tg.task.done / tg.task.need); extra = `<span>${esc(taskName(tg.task))}</span><span class="bar"><i style="width:${Math.round(pr * 100)}%"></i></span>`; }
      if (st === "out") extra = `<span>あと${hrs(sh.task.need - sh.task.done)}</span>`;
      out.push(`<div class="tag ${tg.att ? "att" : ""}" style="left:${p.tag[0]}px;top:${p.tag[1]}px"><span>${sh.name}</span><span>${tg.t}</span>${extra}</div>`);
      if (st === "sleep") out.push(`<div class="zzz" style="left:${p.zzz[0]}px;top:${p.zzz[1]}px">z Z Z</div>`);

  }
  // report bubbles in their own layer: redrawn only when a report comes or goes

  function drawArt() {

  }

  // ---------- the menu beside a 進行 ----------
  function urgentEps(kind) {
    return E.live(s).sort((a, b) => a.air - b.air).filter((e) => !E.canOrder(s, ui.sel, kind, e.n));
  }
  function menuHtml() {
    if (!ui.sel || ui.phone || ui.modal) return "";

    const m = E.shMut(s, sh);

    };

    }

  }

  // ---------- the phone ----------
  function phoneHtml() {
    if (!ui.phone) return "";
    const msgs = s.phone.slice(0, 30);
    const list = msgs.length ? msgs.map((m) => `<div class="m ${m.tone}"><span class="who">${esc(m.from)}</span><span class="txt">${esc(m.text)}</span><span class="at">${E.weekOf(m.t)}週 ${clock(m.t)} 受信</span></div>`).join("") : `<div class="empty">まだ連絡はない</div>`;
    return `<div class="phone-bg modal-bg" data-act="phoneClose" style="display:block;padding:0;place-items:initial"><div class="phone" id="phoneEl" role="dialog" aria-label="スマホ"><img src="assets/rts/phone-body.webp" alt=""><div class="scr"><div class="bar"><span>連絡</span><small>${clock(s.t)}</small></div><div class="list">${list}</div><button class="back" data-act="phoneClose">机に戻す</button></div></div></div>`;
  }

  // ---------- dialogs ----------

        <li>スペースで止める・動かす。1〜3キーで進行を選ぶ。Esc で閉じる。</li></ul>`,

  // ---------- rendering ----------
  const cache = {};
  function put(id, html) {
    if (cache[id] === html) return false;
    const el = document.getElementById(id), ae = document.activeElement;
    let key = null;
    if (ae && el.contains(ae) && ae.dataset && ae.dataset.act) key = `${ae.dataset.act}|${ae.dataset.v || ""}`;
    cache[id] = html; el.innerHTML = html;
    if (key) { const again = [...el.querySelectorAll("[data-act]")].find((x) => `${x.dataset.act}|${x.dataset.v || ""}` === key); if (again && !again.disabled) again.focus({ preventScroll: true }); }
    return true;
  }
  function render() {
    if (!s || pressing || dragging) return;
    drawArt();
    put("wb", whiteboard());
    put("ov", overlay());
    put("ovb", bubbles());
    if (put("ui", menuHtml())) placeMenu();
    put("modal-root", phoneHtml() + modalHtml());
    placePhone();
    if (!rendered) { rendered = true; layout(); }
  }
  let rendered = false;
  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    k = Math.min(W / 1920, H / 1080);
    const bw = 1920 * k, bh = 1080 * k, box = document.getElementById("box");
    box.style.width = `${bw}px`; box.style.height = `${bh}px`; box.style.left = `${(W - bw) / 2}px`; box.style.top = `${Math.max(0, (H - bh) / 2)}px`;
    document.getElementById("stage").style.transform = `scale(${k})`;

  }
  // the menu stays readable in a small window: never below 0.72 of its drawn size, kept inside the window
  function placeMenu() {
    if (!ui.sel) return;
    const box = document.getElementById("box").getBoundingClientRect(), p = P[ui.sel];
    const uk = Math.max(k, 0.72); // buttons stay at least 46px tall
    const main = document.querySelector('#ui .menu[data-anchor="main"]'), eps = document.querySelector('#ui .menu[data-anchor="eps"]');
    if (!main) return;
    const mw = 260 * uk, mh = main.offsetHeight * uk;
    let x = box.left + p.menu[0] * k, y = box.top + p.menu[1] * k;
    x = Math.max(6, Math.min(window.innerWidth - mw - 6, x)); y = Math.max(6, Math.min(window.innerHeight - mh - 6, y));
    main.style.transform = `scale(${uk})`; main.style.left = `${x}px`; main.style.top = `${y}px`;
    if (eps) {
      const ew = 260 * uk, eh = eps.offsetHeight * uk;
      let ex = p.side > 0 ? x + mw + 12 : x - ew - 12;
      if (ex < 6 || ex + ew > window.innerWidth - 6) ex = p.side > 0 ? x - ew - 12 : x + mw + 12;
      if (ex < 6 || ex + ew > window.innerWidth - 6) ex = Math.max(6, Math.min(window.innerWidth - ew - 6, x + 20));
      const ey = Math.max(6, Math.min(window.innerHeight - eh - 6, y));

  function placePhone() {
    const el = document.getElementById("phoneEl");
    if (!el) return;

  }
  function toast(text) {

  }

  // ---------- time ----------
  let last = performance.now(), acc = 0, lastRender = 0, lastSave = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (s && s.phase === "play" && !ui.paused && !ui.modal) {
      acc += dt * MIN_PER_SEC * ui.speed;
      const n = Math.floor(acc);
      if (n > 0) {
        acc -= n;

        E.tick(s, n);
        if (s.phase !== "play") { ui.sel = null; ui.phone = false; save(); render(); }
        else if (s.shinko.some((x, i) => x.report && !before[i])) render();
      }
    }
    if (now - lastRender > 200) { lastRender = now; render(); }
    if (now - lastSave > 3000) { lastSave = now; save(); }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function select(id) {
    const sh = shOf(id);
    if (ui.sel === id && !sh.report) { ui.sel = null; ui.pick = null; return render(); } // pressing again closes the menu
    ui.sel = id; ui.pick = null;
    if (sh.report) { sh.lastReport = sh.report.text; E.ack(s, id); } else if (!sh.task) sh.lastReport = sh.lastReport || null;
    save(); render();
  }
  function give(sid, kind, ep) {
    const ok = E.order(s, sid, kind, ep);
    if (ok) { const sh = shOf(sid); sh.lastReport = null; toast(`${sh.name}：${taskName(sh.task)}に取りかかった`); ui.sel = null; ui.pick = null; }
    save(); render();
    return ok;
  }
  function doAct(el) {
    const a = el.dataset.act, v = el.dataset.v;
    if (a === "sel") return select(v);
    if (a === "cmd") {
      const T = E.TASK[v];
      if (!T.ep) return give(ui.sel, v, null);
      const list = urgentEps(v);
      if (list.length === 1) return give(ui.sel, v, list[0].n);
      ui.pick = ui.pick === v ? null : v; return render();
    }
    if (a === "ep") return give(ui.sel, ui.pick, Number(v));
    if (a === "cancel") { E.cancel(s, ui.sel); ui.sel = null; save(); return render(); }
    if (a === "phone") { ui.phone = true; ui.sel = null; s.phone.forEach((m) => (m.read = true)); save(); return render(); }
    if (a === "phoneClose") { ui.phone = false; return render(); }
    if (a === "keys") { toast("車の鍵は、回収に出す進行までドラッグする"); return; }
    if (a === "pause") { if (ui.modal || s.phase !== "play") return; ui.paused = !ui.paused; return render(); }
    if (a === "speed") { ui.speed = ui.speed === 2 ? 1 : 2; return render(); }
    if (a === "help") { ui.modal = "help"; ui.sel = null; return render(); }
    if (a === "start") { ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "close") { ui.modal = null; return render(); }
    if (a === "restartAsk") { ui.modal = "restart"; return render(); }
    if (a === "restart") { fresh(1 + Math.floor(Math.random() * 100000)); ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "nextWeek") { E.nextWeek(s); save(); return render(); }
  }
  function stagePoint(ev) { const r = document.getElementById("box").getBoundingClientRect(); return { x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k }; }
  // front to back: 真壁, 佐伯, 川口
  function zoneAt(pt) { return ["s3", "s1", "s2"].map(shOf).find((sh) => drawnAt(sh, pt)); }
  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el) return;
    pressing = true;
    if (el.dataset.keys && s.phase === "play" && !ui.modal && !s.car) {

    g.style.display = "block"; g.style.width = `${Math.max(90, 280 * k)}px`; g.style.left = `${ev.clientX - Math.max(45, 140 * k)}px`; g.style.top = `${ev.clientY - Math.max(25, 75 * k)}px`;
    const z = zoneAt(stagePoint(ev));
    document.querySelectorAll(".zone").forEach((el) => { el.classList.remove("drop", "nodrop"); if (z && el.dataset.zone === z.id) el.classList.add(E.canOrder(s, z.id, "soto") ? "nodrop" : "drop"); });
  });
  document.addEventListener("pointerup", (ev) => {
    if (dragging) {
      const d = dragging; dragging = null;
      document.getElementById("ghost").style.display = "none";
      if (d.moved) {
        const z = zoneAt(stagePoint(ev));
        if (z) { const why = E.canOrder(s, z.id, "soto"); if (why) toast(`${z.name}は回収に出せない：${why}`); else give(z.id, "soto", null); }

  });

    if (suppressClick) { suppressClick = false; return; }

    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (el && el.dataset.act === "phoneClose" && el.classList.contains("phone-bg") && ev.target.closest("#phoneEl")) return; // inside the phone
    if (el && el.classList.contains("zone") && ev.detail > 0) {

      const pt = stagePoint(ev);
      const who = zoneAt(pt) || ["s3", "s1", "s2"].map(shOf).find((x) => { if (stateOf(x) !== "out") return false; const [x1, y1, x2, y2] = P[x.id].zone; return pt.x >= x1 && pt.x <= x2 && pt.y >= y1 && pt.y <= y2; });
      if (who) return select(who.id);
      if (ui.sel) { ui.sel = null; ui.pick = null; render(); }
      return;
    }
    if (!el) { if (ui.sel) { ui.sel = null; ui.pick = null; render(); } return; } // pressing the room closes the menu
    if (el.disabled) return;
    doAct(el);
  });
  document.addEventListener("keydown", (ev) => {
    if (!s) return;
    if (ev.key === "Escape") { if (ui.modal === "intro") { ui.modal = null; ui.paused = false; } else if (ui.modal === "help" || ui.modal === "restart") ui.modal = null; else if (ui.phone) ui.phone = false; else { ui.sel = null; ui.pick = null; } render(); return; }
    if (ui.modal) return;
    if (ev.key === " ") { ev.preventDefault(); if (!ev.repeat && s.phase === "play") { ui.paused = !ui.paused; render(); } }
    if (["1", "2", "3"].includes(ev.key)) select(s.shinko[Number(ev.key) - 1].id);
  });
  document.addEventListener("keyup", (ev) => { if (ev.key === " " && !ui.modal) ev.preventDefault(); });
  window.addEventListener("resize", layout);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  if (!load()) fresh(1 + Math.floor(Math.random() * 100000));
  layout();
  render();
  requestAnimationFrame(frame);
})();
