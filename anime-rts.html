<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行RTS 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* The desk, seen from your chair (a PC game), drawn at 1920x1080 and scaled to the window. No fixed panels:
     press a 進行 and what you can tell them appears beside them; the phone and the PC come up in front of you. */
  :root {
    --navy: #1f2a44; --navy-2: #2a3654; --cream: #fdf3dc; --cream-2: #f5ead0; --ink: #1d2236; --ink-soft: #464d68;
    --yellow: #ffe082; --line: #1a2036; --red: #c8323a; --orange: #9a5200; --blue: #1f5fbf; --green: #167a4d; --gray: #b9bfcc;
    --font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: #0f1320; overflow: hidden; }
  body { color: #fff; font-family: var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #app { position: relative; width: 100%; height: 100%; }
  .box { position: absolute; overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .stage img.art { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; -webkit-user-drag: none; }

  /* whiteboard: the twelve episodes */
  .wb { position: absolute; left: 770px; top: 84px; width: 400px; height: 390px; box-sizing: border-box; padding: 14px 16px 0; color: var(--ink); pointer-events: none; }
  .wb h2 { margin: 0 0 6px; text-align: center; font-size: 25px; font-weight: 700; }
  .wb table { width: 100%; border-collapse: collapse; font-size: 18px; font-weight: 700; line-height: 1.12; color: var(--ink); table-layout: fixed; }
  .wb th { font-size: 17px; border: 1px solid #9aa2b8; padding: 2px 4px; background: rgba(255, 255, 255, .35); }
  .wb td { border-left: 1px solid #9aa2b8; border-right: 1px solid #9aa2b8; border-bottom: 1px solid #c3c8d6; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb td:first-child { text-align: center; width: 62px; } .wb td:first-child small { font-size: 14px; margin-left: 3px; }
  .wb td:last-child { text-align: center; width: 92px; }
  .wb .red { color: var(--red); } .wb .org { color: var(--orange); } .wb .blu { color: var(--blue); } .wb .grn { color: var(--green); } .wb .mut { color: #565c72; font-weight: 400; }
  .wb tr.now td { background: rgba(255, 224, 130, .45); }

  /* who and what you can press in the room */
  .zone { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 8px; }
  .zone:hover, .zone:focus-visible { box-shadow: inset 0 0 0 4px rgba(255, 224, 130, .55); outline: none; }
  .zone.on { box-shadow: inset 0 0 0 5px var(--yellow); }
  .zone.drop { box-shadow: inset 0 0 0 6px var(--yellow); background: rgba(255, 224, 130, .14); }
  .zone.nodrop { box-shadow: inset 0 0 0 6px #8a93ab; }
  .obj { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 10px; }
  .obj:hover, .obj:focus-visible { box-shadow: 0 0 0 4px rgba(255, 224, 130, .7); outline: none; }
  .keys { touch-action: none; cursor: grab; }
  .badge { position: absolute; right: -8px; top: -14px; min-width: 48px; height: 48px; padding: 0 6px; box-sizing: border-box; background: var(--red); color: #fff; font-size: 28px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--line); }
  .pclabel { position: absolute; left: 1752px; top: 1024px; padding: 4px 12px; background: var(--navy); color: #fff; font-size: 20px; font-weight: 700; box-shadow: 0 0 0 3px var(--line); pointer-events: none; }
  /* the shelf of cut bags waiting for the next round (placeholder art) */
  .shelf { position: absolute; left: 880px; top: 548px; width: 250px; height: 80px; pointer-events: none; }
  .shelf .bags { position: absolute; left: 0; bottom: 0; display: flex; align-items: flex-end; gap: 3px; }
  .shelf .bags i { display: block; width: 26px; background: #c9a46a; box-shadow: inset 0 -4px 0 #a8834d, 0 0 0 2px var(--line); }
  .shelf .lbl { position: absolute; left: 0; top: -36px; padding: 2px 10px; background: var(--navy); color: #fff; font-size: 18px; font-weight: 700; box-shadow: 0 0 0 3px var(--line); white-space: nowrap; }

  /* status tag and report bubble over each person */
  .tag { position: absolute; height: 42px; padding: 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; font-size: 22px; font-weight: 700; white-space: nowrap; pointer-events: none; box-shadow: 0 0 0 3px var(--line); }
  .tag.att { background: var(--yellow); color: var(--ink); }
  .tag .bar { width: 72px; height: 8px; background: #46506e; display: block; }
  .tag .bar i { display: block; height: 100%; background: var(--yellow); }
  .tag .night { background: #6b2d8f; color: #fff; padding: 0 8px; font-size: 18px; }
  .bubble { position: absolute; min-width: 260px; max-width: 380px; box-sizing: border-box; padding: 14px 22px; background: var(--cream); color: var(--ink); font-size: 28px; font-weight: 700; line-height: 1.3; text-align: center; border: 0; box-shadow: 0 0 0 5px var(--line), 6px 6px 0 5px rgba(0, 0, 0, .25); }
  .bubble::after { content: ""; position: absolute; left: 60px; bottom: -22px; border: 11px solid transparent; border-top: 12px solid var(--line); }
  .bubble.r::after { left: auto; right: 60px; }
  .bubble.bad { background: #ffe1e1; }
  .zzz { position: absolute; font-size: 40px; font-weight: 700; color: #dfe4f0; text-shadow: 0 3px 0 var(--line); pointer-events: none; }

  /* clock (top left) and controls (top right) */
  .hud { position: absolute; left: 28px; top: 24px; width: 485px; min-height: 112px; box-sizing: border-box; padding: 14px 22px 12px; background: rgba(31, 42, 68, .94); color: #fff; font-weight: 700; pointer-events: none; }
  .hud .l1 { font-size: 30px; display: flex; gap: 22px; align-items: baseline; }
  .hud .l1 small { margin-left: auto; font-size: 18px; color: #c9d0e4; }
  .hud .l2 { font-size: 30px; }
  .hud .l2.on { color: #ffb3b3; }
  .hud .l2 small { font-size: 18px; color: #c9d0e4; margin-left: 10px; }
  .hud .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
  .hud .days span { height: 8px; background: #46506e; }
  .hud .days span i { display: block; height: 100%; background: var(--yellow); }
  .ctl { position: absolute; right: 28px; top: 24px; display: flex; gap: 6px; }
  .ctl button { height: 60px; min-width: 76px; padding: 0 18px; background: rgba(31, 42, 68, .94); border: 0; color: #fff; font-size: 24px; font-weight: 700; }
  .ctl button.on { color: var(--yellow); }

  /* what you can tell a 進行: beside them */
  .ui { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .menu { position: absolute; transform-origin: 0 0; display: flex; flex-direction: column; gap: 7px; width: 270px; }
  .menu .head { background: var(--cream); color: var(--ink); padding: 10px 14px; box-shadow: 0 0 0 4px var(--line), 6px 6px 0 4px rgba(0, 0, 0, .25); font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; gap: 4px; }
  .menu .head b { font-size: 18px; }
  .menu .head .said { border-top: 2px dashed #d9caa6; padding-top: 4px; }
  .menu .head .me { color: var(--ink-soft); }
  .menu .head .me.worry { color: var(--orange); } .menu .head .me.bad { color: var(--red); } .menu .head .me.good { color: var(--green); }
  .cmd { height: 52px; width: 270px; box-sizing: border-box; padding: 0 10px; border: 0; background: var(--cream); color: var(--ink); font-size: 22px; font-weight: 700; box-shadow: 0 0 0 4px var(--line), inset 0 -5px 0 var(--cream-2); display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.1; text-align: center; }
  .cmd small { font-size: 13px; font-weight: 700; color: var(--ink-soft); display: block; }
  .cmd:hover:not(:disabled), .cmd.on { background: var(--yellow); }
  .cmd:disabled { background: var(--gray); color: #2f3550; box-shadow: 0 0 0 4px var(--line); cursor: not-allowed; font-size: 18px; }
  .cmd.sub { height: 56px; font-size: 20px; flex-direction: column; gap: 0; }
  .cmd.night { background: #e7d6f3; }
  .cmd .stack { display: flex; flex-direction: column; }
  .menu .cap { font-size: 15px; font-weight: 700; color: #fff; background: var(--navy); padding: 4px 10px; box-shadow: 0 0 0 4px var(--line); }
  .menu .sep { height: 2px; }

  /* the phone and the PC, brought up in front of you (time keeps running) */
  .pop-bg { position: fixed; inset: 0; z-index: 30; background: rgba(8, 10, 18, .4); }
  .phone { position: absolute; left: 50%; top: 50%; width: 460px; height: 820px; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .scr { position: absolute; left: 32px; top: 66px; width: 396px; height: 678px; background: #f5efe0; color: var(--ink); display: flex; flex-direction: column; }
  .scr .bar { background: var(--navy); color: #fff; height: 70px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; font-size: 24px; font-weight: 700; flex: none; }
  .scr .bar small { font-size: 20px; }
  .scr .list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; user-select: text; }
  .scr .m { display: flex; flex-direction: column; gap: 6px; }
  .scr .m .who { font-size: 16px; font-weight: 700; color: #565c72; display: flex; justify-content: space-between; }
  .scr .m .txt { background: #e3e5ea; padding: 10px 12px; font-size: 18px; font-weight: 700; line-height: 1.5; }
  .scr .m.new .txt { background: #fff1c2; box-shadow: inset 4px 0 0 var(--orange); }
  .scr .m .rep { display: flex; gap: 8px; }
  .scr .m .rep button { flex: 1; height: 50px; border: 0; font-size: 17px; font-weight: 700; color: #fff; background: var(--navy); }
  .scr .m .rep button.angry { background: var(--red); }
  .scr .m .rep button:disabled { background: var(--gray); color: #2f3550; cursor: not-allowed; font-size: 14px; }
  .scr .m .done { font-size: 14px; color: #565c72; font-weight: 700; }
  .scr .empty { color: #565c72; font-size: 18px; padding: 20px 0; text-align: center; }
  .scr .back { margin: 0 16px 16px; height: 64px; flex: none; border: 0; background: var(--navy); color: #fff; font-size: 22px; font-weight: 700; }
  .pc { position: absolute; left: 50%; top: 50%; width: 1500px; height: 860px; background: #2b3349; box-shadow: 0 0 0 6px var(--line), 12px 12px 0 6px rgba(0, 0, 0, .35); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .pc .win { flex: 1; background: #f4f2ec; color: var(--ink); display: flex; flex-direction: column; min-height: 0; }
  .pc .tb { display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; padding: 8px 12px; }
  .pc .tb b { font-size: 22px; margin-right: 16px; }
  .pc .tb button { height: 46px; padding: 0 22px; border: 0; background: #3a4566; color: #fff; font-size: 19px; font-weight: 700; }
  .pc .tb button.on { background: var(--yellow); color: var(--ink); }
  .pc .tb .close { margin-left: auto; background: var(--red); }
  .pc .body { flex: 1; overflow: auto; padding: 14px 16px; user-select: text; }
  .pc .note { font-size: 15px; color: var(--ink-soft); margin: 0 0 10px; }
  .pc table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .pc th { background: #dfe2ea; font-size: 14px; padding: 6px 6px; border: 1px solid #c3c8d6; white-space: nowrap; position: sticky; top: 0; }
  .pc td { border: 1px solid #d3d7e0; padding: 6px 6px; text-align: center; font-weight: 700; white-space: nowrap; }
  .pc td.l { text-align: left; }
  .pc td.z { color: #8a90a4; font-weight: 400; }
  .pc td.red, .pc .red { color: var(--red); } .pc td.org, .pc .org { color: var(--orange); } .pc td.grn, .pc .grn { color: var(--green); }
  .pc td.hot { background: #fff1c2; }
  .pc tr.air td { background: #eceef3; color: #6a7088; font-weight: 400; }
  .pc .gs { display: flex; flex-direction: column; gap: 12px; }
  .pc .g { background: #fff; padding: 12px 14px; box-shadow: inset 4px 0 0 var(--navy); display: flex; flex-direction: column; gap: 8px; }
  .pc .g b { font-size: 19px; }
  .pc .g .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .pc .g button { height: 48px; padding: 0 16px; border: 0; background: var(--navy); color: #fff; font-size: 16px; font-weight: 700; }
  .pc .g button:disabled { background: var(--gray); color: #2f3550; cursor: not-allowed; }
  .pc .legend { font-size: 14px; color: var(--ink-soft); margin-top: 10px; line-height: 1.6; }

  /* dialogs (help, end of week, end of the season) */
  .modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 18, .7); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .card { width: min(660px, 100%); background: var(--cream); color: var(--ink); box-shadow: 0 0 0 5px var(--line), 10px 10px 0 5px rgba(0, 0, 0, .3); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card .k { display: inline-block; align-self: flex-start; background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; padding: 2px 10px; }
  .card h2 { margin: 0; font-size: 28px; }
  .card .big { font-size: 34px; font-weight: 700; }
  .card .big.on { color: var(--red); }
  .card .rows { display: flex; flex-direction: column; }
  .card .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 6px 2px; border-bottom: 2px dashed #e0d2ae; font-size: 15px; font-weight: 700; }
  .card .row .v.good { color: var(--green); } .card .row .v.warn { color: var(--orange); } .card .row .v.bad { color: var(--red); } .card .row .v.mute { color: var(--ink-soft); }
  .card ul { margin: 0; padding-left: 22px; display: grid; gap: 7px; font-size: 15px; line-height: 1.55; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .card .acts .cmd { width: auto; min-width: 180px; padding: 0 16px; flex: 1 1 180px; height: 64px; }
  .card .acts .cmd.pri { background: var(--yellow); }
  .rank { font-size: 72px; font-weight: 700; line-height: 1; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 35; background: var(--navy); color: #fff; padding: 10px 18px; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px var(--line); pointer-events: none; max-width: 90vw; }
  .ghost { position: fixed; z-index: 36; width: 200px; pointer-events: none; image-rendering: pixelated; display: none; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35)); }
  @media (prefers-reduced-motion: no-preference) {
    .bubble { animation: pop .25s ease-out; }
    @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<div id="app">
  <div class="box" id="box">
    <div class="stage" id="stage">
      <img class="art" id="bg" src="assets/rts/bg-day.webp" alt="" style="left:0;top:0;width:1920px;height:1080px">
      <div class="wb" id="wb"></div>
      <div class="shelf" id="shelf"></div>
      <img class="art" id="c-s2" alt="" style="left:1300px;top:235px;width:430px;height:430px">
      <img class="art" id="c-s1" alt="" style="left:0px;top:242px;width:640px;height:640px">
      <img class="art" id="c-s3" alt="" style="left:1375px;top:344px;width:640px;height:640px">
      <img class="art" src="assets/rts/fg.webp" alt="" style="left:0;top:0;width:1920px;height:1080px">
      <img class="art" src="assets/rts/phone-desk.webp" alt="" style="left:50px;top:932px;width:286px">
      <img class="art" id="keys-art" src="assets/rts/car-keys.webp" alt="" style="left:352px;top:916px;width:280px">
      <div id="ov"></div>
      <div id="ovb"></div>
    </div>
  </div>
  <div class="ui" id="ui"></div>
  <img class="ghost" id="ghost" src="assets/rts/car-keys.webp" alt="">
  <div id="toast"></div>
  <div id="modal-root"></div>
</div>
<script id="engine">
const Engine = (() => {
  "use strict";
  // Time is in game minutes from 第1週 月曜 0:00. One week (10080 min) is 120 real seconds.
  const HOUR = 60, DAY = 1440, WEEK = 7 * DAY, ARRIVE = 10, START = ARRIVE * HOUR, EPS = 12, SCHEDULE = 4;
  const DIFF = {
    easy: { label: "やさしい", fill: 0.8, note: "原画マンが最初から8割埋まっている" },
    normal: { label: "ふつう", fill: 0.6, note: "原画マンが最初に6割埋まっている" },
    hard: { label: "きびしい", fill: 0.5, note: "原画マンが最初に5割しか埋まっていない" },
  };
  const TASK = {
    eigyo: { label: "原画営業", short: "原画営業", hours: 10, ep: true },
    meet: { label: "作打ち", short: "作打ち", hours: 6, ep: true },
    douga: { label: "動仕撒き", short: "動仕撒き", hours: 6, ep: true },
    satsu: { label: "撮入れ準備", short: "撮入れ準備", hours: 6, ep: true },
    soto: { label: "外回り", short: "外回り", hours: 10 },
    break: { label: "休憩", short: "休憩", hours: 2 },
    sleep: { label: "寝る", short: "仮眠", hours: 0 },
  };
  const NAMES = ["高槻 透", "三好 かおる", "芹沢 一馬", "小野寺 ゆう", "柚木 瞳", "黒川 仁", "日向 まどか", "塩見 直", "久住 梓", "早瀬 涼", "蓮見 楓", "宇佐美 圭", "榎本 一花", "真田 航", "相良 実", "桐生 遥", "七瀬 律", "望月 紬", "狩野 蒼", "白石 葵"];
  const SHINKO = [{ id: "s1", name: "佐伯", rookie: true }, { id: "s2", name: "川口", rookie: false }, { id: "s3", name: "真壁", rookie: true }];
  const STUDIOS = [
    { id: "g1", name: "スタジオ極光", days: 16, rel: 0.9 },
    { id: "g2", name: "アニメーション工房ひばり", days: 20, rel: 0.75 },
    { id: "g3", name: "夜明けスタジオ", days: 24, rel: 0.6 },
  ];
  const DOUGA_CO = ["動画会社 ブルーライン", "仕上げ ネオンセル"];
  const DOUGA_LAG = 24 * HOUR, SHOT_LAG = 12 * HOUR, ANIM_CAP = 40, PER_ANIM = 20, MAIL_WAIT = DAY;

  function rnd(s) {
    let a = (s.r = (s.r + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const hourOf = (t) => Math.floor((t % DAY) / HOUR);
  const weekOf = (t) => Math.floor(t / WEEK) + 1;
  const airOf = (n) => (n + SCHEDULE - 1) * WEEK;
  const ownerOf = (n) => SHINKO[(n - 1) % 3].id;
  const famName = (name) => name.split(" ")[0];
  function log(s, text, tone = "") { s.log.unshift({ t: s.t, text, tone }); if (s.log.length > 200) s.log.length = 200; }

  function newGame(seed = 1, diff = "easy") {
    const s = { v: 3, seed, diff: DIFF[diff] ? diff : "easy", r: (seed * 2654435761) >>> 0 || 1, t: START, phase: "play", week: 1, eps: [], anims: [], shinko: [], car: null, pipe: [], mails: [], mailSeq: 0, angry: {}, log: [], weekEnd: null, result: null,
      studios: STUDIOS.map((g) => ({ ...g, ep: null })), stats: { orders: 0, blank: 0, drops: 0, angry: 0, allnight: 0 } };
    s.anims = NAMES.map((name, i) => ({ id: "a" + (i + 1), name, rate: 3.0 + rnd(s) * 1.2, acc: 0, queue: [], slowUntil: 0 }));
    s.shinko = SHINKO.map((d) => ({ ...d, sta: 100, task: null, report: null, idleSince: START, at: "desk", allnight: false, allnightWeek: 0 }));
    startEp(s, 1);
    log(s, `第1週 月曜 10:00。第1話のコンテが上がった（担当：佐伯）。放送まで4週。`);
    return s;
  }
  function startEp(s, n) {
    const cuts = 180 + Math.floor(rnd(s) * 41);
    const e = { n, owner: ownerOf(n), cuts, empty: cuts, drawn: 0, coll: 0, douga: 0, dDone: 0, shelf: 0, shooting: 0, shot: 0, meet: false, air: airOf(n), result: null, gross: null, grossLeft: 0, grossAcc: 0, grossPause: 0 };
    s.eps.push(e);
    // the cut table starts partly filled (difficulty)
    let want = Math.round(cuts * DIFF[s.diff].fill);
    for (const a of shuffled(s, s.anims)) {
      if (want <= 0) break;
      const room = ANIM_CAP - load(a);
      if (room < 8) continue;
      const k = Math.min(want, room, 15 + Math.floor(rnd(s) * 11));
      a.queue.push({ ep: n, n: k }); e.empty -= k; want -= k;
    }
  }
  function shuffled(s, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const live = (s) => s.eps.filter((e) => !e.result);
  const epOf = (s, n) => s.eps.find((e) => e.n === n);
  const shOf = (s, id) => s.shinko.find((x) => x.id === id);
  const load = (a) => a.queue.reduce((t, q) => t + q.n, 0);
  const queued = (s, e) => s.anims.reduce((t, a) => t + a.queue.filter((q) => q.ep === e.n).reduce((u, q) => u + q.n, 0), 0);
  const animsOn = (s, e) => s.anims.filter((a) => a.queue.some((q) => q.ep === e.n));
  function counts(s, e) {
    const q = queued(s, e);
    return { empty: e.empty, queued: q, drawn: e.drawn, coll: e.coll, douga: e.douga, dDone: e.dDone, shelf: e.shelf, shooting: e.shooting, shot: e.shot, gross: e.grossLeft, filled: e.cuts - e.empty, need: Math.ceil(e.empty / PER_ANIM) };
  }

  // ---------- the 進行 (they never move on their own) ----------
  const present = (sh) => sh.at === "desk";
  function canOrder(s, sid, kind, n) {
    const sh = shOf(s, sid), T = TASK[kind];
    if (s.phase !== "play") return "いまは指示を出せない";
    if (!present(sh)) return "帰宅している（10時に来る）";
    if (kind === "home") return "";
    if (kind === "allnight") return sh.allnight ? "今夜は徹夜する" : sh.allnightWeek === s.week ? "今週はもう徹夜させた" : "";
    if (!T) return "その指示はない";
    if (sh.task && sh.task.kind === kind && (!T.ep || sh.task.ep === n)) return "いまやっている";
    if (T.ep) {
      const e = epOf(s, n);
      if (!e || e.result) return "その話数はない";
      if (e.owner !== sid) return "担当の話数ではない";
      if (e.gross) return "グロスに出している";
      const c = counts(s, e);
      if (kind === "eigyo") { if (c.empty <= 0) return "空きカットなし"; if (!s.anims.some((a) => load(a) < ANIM_CAP - 4)) return "原画マンが手一杯"; }
      if (kind === "meet") { if (e.meet) return "作打ちは済んでいる"; if (c.filled <= 0) return "原画マンがいない"; }
      if (kind === "douga" && c.coll <= 0) return c.drawn > 0 ? "まず回収（外回り）" : "撒く原画がない";
      if (kind === "satsu" && c.dDone <= 0) return c.douga > 0 ? "動仕の上がり待ち" : "撮入れするものがない";
    }
    if (kind === "soto" && s.car && s.car !== sid) return `車を使用中（${shOf(s, s.car).name}）`;
    if (kind === "break" && sh.sta >= 90) return "体力は十分";
    if (kind === "sleep" && sh.sta >= 70) return "まだ眠くない";
    return "";
  }
  function order(s, sid, kind, n = null) {
    if (canOrder(s, sid, kind, n)) return false;
    const sh = shOf(s, sid);
    if (kind === "allnight") { sh.allnight = true; sh.allnightWeek = s.week; s.stats.allnight++; log(s, `${sh.name}：今夜は徹夜する。`); return true; }
    if (sh.task && sh.task.kind === "soto") s.car = null;
    if (sh.task && sh.task.kind !== "break" && sh.task.kind !== "sleep") log(s, `${sh.name}：「${label(sh.task)}」を途中でやめた。`, "warn");
    sh.report = null;
    if (kind === "home") { sh.task = null; goHome(s, sh, "帰らせた"); s.stats.orders++; return true; }
    if (!sh.task) s.stats.waited = (s.stats.waited || 0) + Math.max(0, s.t - sh.idleSince);
    sh.task = { kind, ep: TASK[kind].ep ? n : null, need: TASK[kind].hours * HOUR, done: 0 };
    if (kind === "soto") s.car = sid;
    s.stats.orders++;
    return true;
  }
  function cancel(s, sid) {
    const sh = shOf(s, sid);
    if (!sh.task) return false;
    if (sh.task.kind === "soto") s.car = null;
    log(s, `${sh.name}：「${label(sh.task)}」を取り消した。`);
    sh.task = null; sh.idleSince = s.t;
    return true;
  }
  const label = (T) => (T.ep ? `第${T.ep}話の${TASK[T.kind].short}` : TASK[T.kind].short);
  const ack = (s, sid) => { shOf(s, sid).report = null; };
  function goHome(s, sh, why) {
    sh.at = "home"; sh.allnight = false;
    if (sh.task && (sh.task.kind === "break" || sh.task.kind === "sleep")) sh.task = null;
    log(s, `${sh.name}：${why}（明日10時に来る）。`);
  }
  function report(sh, s, text, short, tone = "") { sh.report = { text, short: short || text, tone, t: s.t }; log(s, `${sh.name}：${text}`, tone); }

  function finish(s, sh) {
    const T = sh.task, e = T.ep ? epOf(s, T.ep) : null;
    sh.task = null; sh.idleSince = s.t;
    if (e && (e.result || e.gross)) return report(sh, s, `第${e.n}話は、もう手を離れていました……。`, "もう手を離れてました", "bad");
    if (T.kind === "eigyo") {
      let want = Math.min(e.empty, Math.round((16 + rnd(s) * 14) * (sh.rookie ? 0.85 : 1)));
      const took = [];
      for (const a of shuffled(s, s.anims).sort((x, y) => load(x) - load(y))) {
        if (want <= 0 || took.length >= 2) break;
        const room = ANIM_CAP - load(a);
        if (room < 4) continue;
        const k = Math.min(room, want, took.length ? want : Math.max(4, Math.ceil(want * 0.6)));
        a.queue.push({ ep: e.n, n: k }); e.empty -= k; want -= k; took.push([a, k]);
      }
      const got = took.reduce((t, [, k]) => t + k, 0);
      if (!got) return report(sh, s, `第${e.n}話の原画営業……みんな手一杯でした。`, "取れませんでした……", "bad");
      const c = counts(s, e);
      return report(sh, s, `第${e.n}話の原画営業、${took.map(([a]) => famName(a.name) + "さん").join("と")}で${got}カット埋まりました！${c.empty ? `（あと${c.need}人くらい足りません）` : "（カット表、埋まりました）"}`, `第${e.n}話、${got}カット埋まりました！`, "good");
    }
    if (T.kind === "meet") { e.meet = true; return report(sh, s, `第${e.n}話の作打ち、終わりました。原画、描き始めてもらいます！`, `第${e.n}話の作打ち、終わりました！`, "good"); }
    if (T.kind === "douga") {
      const k = e.coll; e.coll = 0; e.douga += k;
      if (k) s.pipe.push({ ep: e.n, n: k, ready: s.t + DOUGA_LAG, stage: "douga" });
      return report(sh, s, `第${e.n}話の動仕撒き、${k}カット出しました！`, `第${e.n}話、${k}カット撒きました！`, k ? "good" : "");
    }
    if (T.kind === "satsu") {
      const k = e.dDone; e.dDone = 0; e.shelf += k;
      return report(sh, s, `第${e.n}話の撮入れ準備、${k}カット分の袋を棚に置きました。外回りで撮影に届けます。`, `第${e.n}話、${k}袋 棚に置きました！`, k ? "good" : "");
    }
    if (T.kind === "soto") { s.car = null; const r = collect(s, sh); return report(sh, s, r.text, "戻りました！", r.tone); }
    if (T.kind === "break") { sh.report = null; return; }
  }
  // one trip does everyone's episodes: pick up finished drawings, drop the cut bags at the filming studio
  function collect(s, sh) {
    let got = 0, blank = 0, bags = 0;
    for (const e of live(s)) {
      if (e.gross) continue;
      if (e.drawn > 0) {
        let b = 0;
        for (let i = 0; i < e.drawn; i++) if (rnd(s) < (sh.rookie ? 0.06 : 0.03)) b++;
        if (b) { const a = s.anims.slice().sort((x, y) => load(x) - load(y))[0]; a.queue.unshift({ ep: e.n, n: b }); }
        e.coll += e.drawn - b; got += e.drawn - b; blank += b; e.drawn = 0;
      }
      if (e.shelf > 0) { s.pipe.push({ ep: e.n, n: e.shelf, ready: s.t + SHOT_LAG, stage: "shot" }); e.shooting += e.shelf; bags += e.shelf; e.shelf = 0; }
    }
    s.stats.blank += blank;
    if (!got && !bags) return { text: "外回り、戻りました……回収も届けるものもありませんでした。", tone: "bad" };
    return { text: `外回り、戻りました！ 原画${got}カット回収、撮影に${bags}袋届けました。${blank ? `……${blank}カット白紙でした。` : ""}`, tone: blank ? "warn" : "good" };
  }

  // ---------- mail (on your phone) ----------
  function mail(s, kind, from, text, ctx) {
    const m = { id: ++s.mailSeq, t: s.t, kind, from, text, ctx, state: "new", reply: null };
    s.mails.unshift(m); if (s.mails.length > 40) s.mails.length = 40;
    log(s, `メール：${from}「${text}」`, "warn");
  }
  const canAngry = (s, m) => !s.angry[m.from];
  function reply(s, id, how) {
    const m = s.mails.find((x) => x.id === id);
    if (!m || (m.state !== "new" && m.state !== "read")) return false;
    if (how === "angry" && !canAngry(s, m)) return false;
    if (how === "angry") { s.angry[m.from] = true; s.stats.angry++; m.state = "angry"; m.reply = "キレて出させた"; log(s, `${m.from}にキレて、出させた。`, "warn"); return true; }
    accept(s, m); m.state = "accepted"; m.reply = "受け入れた";
    return true;
  }
  function accept(s, m) {
    const e = m.ctx.ep ? epOf(s, m.ctx.ep) : null;
    if (m.kind === "drop") {
      const a = s.anims.find((x) => x.id === m.ctx.aid), q = a && a.queue.find((x) => x.ep === m.ctx.ep);
      const k = q ? Math.min(q.n, m.ctx.k) : 0;
      if (k && e && !e.result && !e.gross) { q.n -= k; e.empty += k; if (q.n <= 0) a.queue.splice(a.queue.indexOf(q), 1); s.stats.drops++; }
      log(s, `${m.from}の${k}カットを受け入れた。第${m.ctx.ep}話の空きが増えた。`, "warn");
    } else if (m.kind === "late") {
      const a = s.anims.find((x) => x.id === m.ctx.aid); if (a) a.slowUntil = s.t + 2 * DAY;
      log(s, `${m.from}の遅れを受け入れた。`);
    } else if (m.kind === "gross") {
      if (e) e.grossPause += m.ctx.days * DAY;
      log(s, `${m.from}の${m.ctx.days}日の遅れを受け入れた。`, "warn");
    } else if (m.kind === "douga") {
      for (const p of s.pipe) if (p.ep === m.ctx.ep && p.stage === "douga") p.ready += DAY;
      log(s, `${m.from}の遅れを受け入れた（第${m.ctx.ep}話の動仕が1日遅れる）。`);
    }
  }
  function mailEvents(s) {
    // an animator wants to give cuts back
    if (rnd(s) < 1 / 48) {
      const cands = s.anims.filter((a) => a.queue.some((q) => q.n >= 6 && !epOf(s, q.ep).gross));
      if (cands.length) {
        const a = cands[Math.floor(rnd(s) * cands.length)], q = a.queue.find((x) => x.n >= 6 && !epOf(s, x.ep).gross);
        const k = Math.max(3, Math.round(q.n * (0.3 + rnd(s) * 0.4)));
        mail(s, "drop", `${a.name}さん`, `すみません、第${q.ep}話の${k}カット……他社が入って、無理になりました。`, { aid: a.id, ep: q.ep, k });
      }
    }
    if (rnd(s) < 1 / 96) {
      const cands = s.anims.filter((a) => a.queue.length && a.slowUntil < s.t);
      if (cands.length) { const a = cands[Math.floor(rnd(s) * cands.length)]; mail(s, "late", `${a.name}さん`, `第${a.queue[0].ep}話、体調を崩して少し遅れます……。`, { aid: a.id, ep: a.queue[0].ep }); }
    }
    if (rnd(s) < 1 / 120 && live(s).some((e) => e.douga > 0)) {
      const e = live(s).find((x) => x.douga > 0), co = DOUGA_CO[Math.floor(rnd(s) * DOUGA_CO.length)];
      mail(s, "douga", co, `第${e.n}話の動仕、上がりが1日遅れそうです。`, { ep: e.n });
    }
    for (const g of s.studios) {
      if (!g.ep || s.t % DAY) continue;
      if (rnd(s) < (1 - g.rel) * 0.45) { const days = 2 + Math.floor(rnd(s) * 3); mail(s, "gross", g.name, `第${g.ep}話、${days}日ほど遅れます。申し訳ありません。`, { ep: g.ep, days }); }
    }
    // unanswered for a day: taken as accepted
    for (const m of s.mails) if ((m.state === "new" || m.state === "read") && s.t - m.t >= MAIL_WAIT) { accept(s, m); m.state = "auto"; m.reply = "返事をしなかった（受け入れた扱い）"; }
  }

  // ---------- gross (a whole episode to another studio) ----------
  function canGross(s, n, gid) {
    const e = epOf(s, n), g = s.studios.find((x) => x.id === gid);
    if (!e || e.result) return "その話数はない";
    if (e.gross) return "もうグロスに出している";
    if (e.shot >= e.cuts) return "もう撮影まで終わっている";
    if (!g) return "その会社はない";
    if (g.ep) return `第${g.ep}話を担当中`;
    return "";
  }
  function grossOut(s, n, gid) {
    if (canGross(s, n, gid)) return false;
    const e = epOf(s, n), g = s.studios.find((x) => x.id === gid);
    for (const a of s.anims) a.queue = a.queue.filter((q) => q.ep !== n);
    s.pipe = s.pipe.filter((p) => p.ep !== n);
    e.grossLeft = e.cuts - e.shot;
    e.empty = e.drawn = e.coll = e.douga = e.dDone = e.shelf = e.shooting = 0;
    e.gross = gid; e.grossRate = e.cuts / (g.days * DAY); g.ep = n;
    for (const sh of s.shinko) if (sh.task && sh.task.ep === n) { sh.task = null; sh.idleSince = s.t; }
    log(s, `第${n}話を${g.name}にグロスで出した。`);
    return true;
  }
  const grossDays = (s, e) => (e.gross ? e.grossLeft / (e.grossRate * DAY) + e.grossPause / DAY : null);

  // ---------- one game minute ----------
  function step(s) {
    s.t++;
    const h = hourOf(s.t), min = s.t % DAY;
    // 24:00: home, unless told to stay up
    if (min === 0) for (const sh of s.shinko) {
      if (!present(sh)) continue;
      if (sh.allnight) { log(s, `${sh.name}：徹夜で残っている。`); continue; }
      if (sh.task && sh.task.kind === "soto") continue; // finishes the round first
      goHome(s, sh, "24時、帰宅した");
    }
    // 10:00: everyone at the desk
    if (min === ARRIVE * HOUR) for (const sh of s.shinko) {
      sh.allnight = false;
      if (!present(sh)) { sh.at = "desk"; sh.idleSince = s.t; log(s, `${sh.name}：出社した。`); }
    }
    for (const a of s.anims) {
      a.acc += (a.rate * (a.slowUntil > s.t ? 0.5 : 1)) / DAY;
      while (a.acc >= 1) {
        const q = a.queue.find((x) => { const e = epOf(s, x.ep); return e && !e.result && !e.gross && e.meet; });
        if (!q) { a.acc = Math.min(a.acc, 1); break; }
        a.acc -= 1; q.n--; epOf(s, q.ep).drawn++;
        if (q.n <= 0) a.queue.splice(a.queue.indexOf(q), 1);
      }
    }
    for (const sh of s.shinko) {
      if (!present(sh)) { sh.sta = Math.min(100, sh.sta + 9 / HOUR); continue; }
      const T = sh.task, late = h < ARRIVE;
      if (!T) { sh.sta = Math.min(100, sh.sta + (late ? 12 : 2) / HOUR); continue; } // up all night with nothing to do: asleep at the desk
      if (T.kind === "sleep") { sh.sta = Math.min(100, sh.sta + 15 / HOUR); if (sh.sta >= 85) { sh.task = null; sh.idleSince = s.t; report(sh, s, "寝ました！ 次、なにやりますか", "起きました！"); } continue; }
      if (T.kind === "break") { sh.sta = Math.min(100, sh.sta + 10 / HOUR); T.done++; if (T.done >= T.need) finish(s, sh); continue; }
      sh.sta = Math.max(0, sh.sta - (late ? 5.5 : 3.5) / HOUR);
      T.done += sh.sta <= 0 ? 0.3 : sh.sta < 25 ? 0.6 : 1;
      if (T.done >= T.need) { finish(s, sh); if (!present(sh)) continue; }
      if (late && !sh.allnight && T.kind === "soto" && !sh.task) goHome(s, sh, "外回りから戻って、帰宅した");
    }
    for (const e of live(s)) {
      if (!e.gross) continue;
      if (e.grossPause > 0) { e.grossPause--; continue; }
      e.grossAcc += e.grossRate;
      while (e.grossAcc >= 1 && e.grossLeft > 0) { e.grossAcc -= 1; e.grossLeft--; e.shot++; }
    }
    if (min % HOUR === 0) {
      for (const p of s.pipe) {
        if (p.ready > s.t) continue;
        const e = epOf(s, p.ep);
        if (!e.result && !e.gross) { if (p.stage === "douga") { e.douga -= p.n; e.dDone += p.n; } else { e.shooting -= p.n; e.shot += p.n; } }
        p.done = true;
      }
      s.pipe = s.pipe.filter((p) => !p.done);
      mailEvents(s);
    }
    if (s.t % WEEK === 0) endWeek(s);
  }
  function airResult(e) {
    const r = e.shot / e.cuts;
    return r >= 1 ? { key: "full", label: "完成して放送", tone: "good", r } : r >= 0.85 ? { key: "still", label: "止め絵でしのいで放送", tone: "warn", r } : { key: "drop", label: "落とした（総集編）", tone: "bad", r };
  }
  function endWeek(s) {
    const week = weekOf(s.t - 1), aired = [];
    for (const e of live(s)) {
      if (e.air > s.t) continue;
      e.result = airResult(e);
      for (const a of s.anims) a.queue = a.queue.filter((q) => q.ep !== e.n);
      for (const g of s.studios) if (g.ep === e.n) g.ep = null;
      aired.push(e.n);
      log(s, `第${e.n}話：${e.result.label}（撮影 ${e.shot}/${e.cuts}）`, e.result.tone);
    }
    s.week = week + 1;
    if (s.week <= EPS) { startEp(s, s.week); log(s, `第${s.week}週。第${s.week}話のコンテが上がった（担当：${shOf(s, ownerOf(s.week)).name}）。`); }
    s.weekEnd = { week, aired };
    s.phase = s.eps.length === EPS && s.eps.every((e) => e.result) ? "end" : "weekEnd";
    if (s.phase === "end") s.result = result(s);
  }
  function nextWeek(s) { if (s.phase === "weekEnd") { s.phase = "play"; s.weekEnd = null; } }
  function airStatus(s) {
    const next = live(s).sort((x, y) => x.air - y.air)[0], left = EPS - s.eps.filter((e) => e.result).length;
    const weeksTo = (e) => Math.max(0, Math.ceil((e.air - s.t) / WEEK));
    if (!s.eps.some((e) => e.result)) return { main: `第1話 放送まで あと${weeksTo(epOf(s, 1))}週`, sub: "", airing: false, left };
    if (!next) return { main: "全話 放送終了", sub: "", airing: false, left: 0 };
    return { main: `放送中 残り${left}話`, sub: `次は第${next.n}話（あと${weeksTo(next)}週）`, airing: true, left };
  }

  // ---------- what is holding an episode up, and your read of it ----------
  const say = (tone, t) => ({ tone, t });
  function pace(s, e) {
    const d = (e.air - s.t) / DAY, c = counts(s, e);
    if (c.shot >= e.cuts) return { level: 2, d };
    if (e.gross) { const need = grossDays(s, e); return { level: need > d ? 0 : need > d * 0.9 ? 1 : 2, d }; }
    const down = (c.coll + c.douga + c.dDone + c.shelf + c.shooting + c.shot) / e.cuts, up = (e.cuts - c.empty - c.queued) / e.cuts, filled = c.filled / e.cuts;
    if (d <= 14) { const need = d <= 7 ? 0.9 : 0.9 - ((d - 7) / 7) * 0.6; return { level: down < need * 0.55 ? 0 : down < need ? 1 : 2, d }; }
    if (d <= 17 && up < 0.1) return { level: 0, d };
    if (d <= 21 && filled < 0.85) return { level: 1, d };
    return { level: 2, d };
  }
  // the one thing to do next for this episode
  function blocker(s, e) {
    const c = counts(s, e);
    if (e.result) return null;
    if (e.gross) { const g = s.studios.find((x) => x.id === e.gross); return { key: "gross", text: `グロス（${g.name}）`, tone: pace(s, e).level === 0 ? "bad" : "ok" }; }
    if (c.shot >= e.cuts) return { key: "done", text: "撮影済み", tone: "good" };
    if (c.empty > 0 && !e.meet) return { key: "eigyo", text: `原画マン あと${c.need}人`, tone: "worry" };
    if (!e.meet) return { key: "meet", text: "作打ちまだ", tone: "worry" };
    if (c.coll > 0) return { key: "douga", text: `動仕撒き待ち ${c.coll}`, tone: "worry" };
    if (c.dDone > 0) return { key: "satsu", text: `撮入れ準備待ち ${c.dDone}`, tone: "worry" };
    if (c.shelf > 0) return { key: "shelf", text: `棚に${c.shelf}袋（外回り待ち）`, tone: "worry" };
    if (c.empty > 0) return { key: "eigyo", text: `原画マン あと${c.need}人`, tone: "worry" };
    if (c.drawn > 0) return { key: "soto", text: `回収待ち ${c.drawn}`, tone: "ok" };
    if (c.queued > 0) return { key: "draw", text: "原画中", tone: "ok" };

  // ---------- dialogs ----------

  // ---------- rendering ----------
  const cache = {};
  function put(id, html) {
    if (cache[id] === html) return false;
    const el = document.getElementById(id), ae = document.activeElement;
    let key = null;
    if (ae && el.contains(ae) && ae.dataset && ae.dataset.act) key = `${ae.dataset.act}|${ae.dataset.v || ""}|${ae.dataset.id || ""}`;
    const sc = el.querySelector(".list, .body"); const top = sc ? sc.scrollTop : 0;
    cache[id] = html; el.innerHTML = html;
    const sc2 = el.querySelector(".list, .body"); if (sc2) sc2.scrollTop = top;
    if (key) { const again = [...el.querySelectorAll("[data-act]")].find((x) => `${x.dataset.act}|${x.dataset.v || ""}|${x.dataset.id || ""}` === key); if (again && !again.disabled) again.focus({ preventScroll: true }); }
    return true;
  }
  function render() {
    if (!s || pressing || dragging) return;
    drawArt();
    put("wb", whiteboard());
    put("shelf", shelf());
    put("ov", overlay());
    put("ovb", bubbles());
    if (put("ui", menuHtml())) placeMenu();
    put("modal-root", phoneHtml() + pcHtml() + modalHtml());

  function layout() {

    k = Math.min(W / 1920, H / 1080);
    const bw = 1920 * k, bh = 1080 * k, box = document.getElementById("box");
    box.style.width = `${bw}px`; box.style.height = `${bh}px`; box.style.left = `${(W - bw) / 2}px`; box.style.top = `${Math.max(0, (H - bh) / 2)}px`;
    document.getElementById("stage").style.transform = `scale(${k})`;
    placeMenu(); placePop();
  }
  // the menu stays readable in a small window: never below 0.72 of its drawn size, kept inside the window
  function placeMenu() {
    if (!ui.sel) return;
    const box = document.getElementById("box").getBoundingClientRect(), p = P[ui.sel];
    const uk = Math.max(k, 0.72);
    const main = document.querySelector('#ui .menu[data-anchor="main"]'), eps = document.querySelector('#ui .menu[data-anchor="eps"]');
    if (!main) return;
    const mw = 270 * uk, mh = main.offsetHeight * uk;
    let x = box.left + p.menu[0] * k, y = box.top + p.menu[1] * k;
    x = Math.max(6, Math.min(window.innerWidth - mw - 6, x)); y = Math.max(6, Math.min(window.innerHeight - mh - 6, y));
    main.style.transform = `scale(${uk})`; main.style.left = `${x}px`; main.style.top = `${y}px`;
    if (eps) {
      const ew = 270 * uk, eh = eps.offsetHeight * uk;
      let ex = p.side > 0 ? x + mw + 12 : x - ew - 12;
      if (ex < 6 || ex + ew > window.innerWidth - 6) ex = p.side > 0 ? x - ew - 12 : x + mw + 12;
      if (ex < 6 || ex + ew > window.innerWidth - 6) ex = Math.max(6, Math.min(window.innerWidth - ew - 6, x + 20));
      eps.style.transform = `scale(${uk})`; eps.style.left = `${ex}px`; eps.style.top = `${Math.max(6, Math.min(window.innerHeight - eh - 6, y))}px`;
    }

  // ---------- time ----------
  let last = performance.now(), acc = 0, lastRender = 0, lastSave = 0;

      acc += dt * MIN_PER_SEC * ui.speed;
      const n = Math.floor(acc);

        acc -= n;
        const before = s.shinko.map((x) => !!x.report), mails = s.mailSeq;

        else if (s.shinko.some((x, i) => x.report && !before[i]) || s.mailSeq !== mails) render();
      }
    }
    if (now - lastRender > 200) { lastRender = now; render(); }
    if (now - lastSave > 3000) { lastSave = now; save(); }
    requestAnimationFrame(frame);
  }

  const maskBits = {};
  function drawnAt(sh, pt) {
    const st = stateOf(sh);
    if (st === "out" || st === "home") return false;
    const [fx, fy, fw] = FRAME[sh.id], pose = poseOf(sh);
    const cx = Math.floor(((pt.x - fx) / fw) * 32), cy = Math.floor(((pt.y - fy) / fw) * 32);
    if (cx < 0 || cy < 0 || cx >= 32 || cy >= 32) return false;
    const key = sh.id + pose;
    if (!maskBits[key]) maskBits[key] = Uint8Array.from(atob(MASKS[sh.id][pose]), (c) => c.charCodeAt(0));
    const i = cy * 32 + cx;
    return !!(maskBits[key][i >> 3] & (1 << (i & 7)));
  }
  // front to back: 真壁, 佐伯, 川口; someone away is found by their empty chair
  function zoneAt(pt) {
    const order = ["s3", "s1", "s2"].map(shOf);
    return order.find((sh) => drawnAt(sh, pt)) || order.find((sh) => { const st = stateOf(sh); if (st !== "out" && st !== "home") return false; const [x1, y1, x2, y2] = P[sh.id].zone; return pt.x >= x1 && pt.x <= x2 && pt.y >= y1 && pt.y <= y2; });
  }
  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el) return;
    pressing = true;
    if (el.dataset.keys && s.phase === "play" && !ui.modal && !s.car) {
      dragging = { x0: ev.clientX, y0: ev.clientY, moved: false };
      try { el.setPointerCapture(ev.pointerId); } catch (e) { /* fine */ }
    }
  });
  document.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    if (!dragging.moved && Math.hypot(ev.clientX - dragging.x0, ev.clientY - dragging.y0) < 6) return;
    dragging.moved = true;
    const g = document.getElementById("ghost");
    g.style.display = "block"; g.style.width = `${Math.max(90, 280 * k)}px`; g.style.left = `${ev.clientX - Math.max(45, 140 * k)}px`; g.style.top = `${ev.clientY - Math.max(25, 75 * k)}px`;
    const z = zoneAt(stagePoint(ev));
    document.querySelectorAll(".zone").forEach((el) => { el.classList.remove("drop", "nodrop"); if (z && el.dataset.zone === z.id) el.classList.add(E.canOrder(s, z.id, "soto") ? "nodrop" : "drop"); });
  });
  document.addEventListener("pointerup", (ev) => {
    if (dragging) {
      const d = dragging; dragging = null;
      document.getElementById("ghost").style.display = "none";
      if (d.moved) {
        const z = zoneAt(stagePoint(ev));
        if (z) { const why = E.canOrder(s, z.id, "soto"); if (why) toast(`${z.name}は外回りに出せない：${why}`); else give(z.id, "soto", null); }
        pressing = false; render();
        suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
        return;
      }
    }
    setTimeout(() => { pressing = false; }, 0);
  });
  document.addEventListener("pointercancel", () => { pressing = false; dragging = null; document.getElementById("ghost").style.display = "none"; });
  document.addEventListener("click", (ev) => {
    if (suppressClick) { suppressClick = false; return; }
    pressing = false;
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (el && el.classList.contains("pop-bg") && ev.target.closest("#popEl")) return; // inside the phone or the PC
    if (el && el.classList.contains("zone") && ev.detail > 0) {
      const who = zoneAt(stagePoint(ev));
      if (who) return select(who.id);
      if (ui.sel) { ui.sel = null; ui.pick = null; render(); }
      return;
    }
    if (!el) { if (ui.sel) { ui.sel = null; ui.pick = null; render(); } return; }
    if (el.disabled) return;
    doAct(el);
  });
  document.addEventListener("keydown", (ev) => {
    if (!s) return;
    if (ev.key === "Escape") { if (ui.modal === "help" || ui.modal === "restart") ui.modal = null; else if (ui.pop) ui.pop = null; else { ui.sel = null; ui.pick = null; } render(); return; }
    if (ui.modal) return;
    if (ev.key === " ") { ev.preventDefault(); if (!ev.repeat && s.phase === "play") { ui.paused = !ui.paused; render(); } }
    if (["1", "2", "3"].includes(ev.key) && !ui.pop) select(s.shinko[Number(ev.key) - 1].id);
  });
  document.addEventListener("keyup", (ev) => { if (ev.key === " " && !ui.modal) ev.preventDefault(); });
  window.addEventListener("resize", layout);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  if (!load()) { s = E.newGame(1, "easy"); ui.modal = "intro"; }
  layout();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
