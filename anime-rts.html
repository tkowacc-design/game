<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行RTS 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* The desk, seen from your chair. Press a 進行 who is back at the desk and tell them what to do next.
     The detail of whatever you pressed opens beside it, with what you can do at the bottom (same as 深夜アニメP). */
  :root {
    --night: #12151f; --desk: #1c2130; --desk-2: #262c40; --line: #2a3146; --line-2: #323a52;
    --on: #e8eaf1; --on-soft: #a1a9be;
    --paper: #f4f2ec; --card: #ffffff; --rule: #dcd8cc; --ink: #1a1c24; --ink-soft: #5a6072; --chip: #e3dfd3;
    --marker: #ffe14a; --marker-d: #b89e1e;
    --red: #c8323a; --red-l: #ff9a9d; --green: #167a4d; --green-l: #8fe0b5; --amber: #e0b400; --teal: #1f7f7f; --gross: #8a93ab;
    --s1: #ff9f43; --s2: #4fc3f7; --s3: #c792ea;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--on); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1440px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; margin: 0; }
  button, select { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }

  /* header: the week, how far the broadcast is, the clock of this week */
  .hud { min-height: 64px; box-sizing: border-box; padding: 8px 24px; display: flex; align-items: center; gap: 10px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--night); }
  .hud-l { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .wk { font-family: var(--font-pixel); font-size: 26px; line-height: 1; color: var(--marker); white-space: nowrap; }
  .air { font-family: var(--font-pixel); font-size: 16px; white-space: nowrap; }
  .air.on { color: var(--red-l); }
  .air small { font-size: 12px; color: var(--on-soft); margin-left: 8px; }
  .gauge { flex: 1 1 280px; max-width: 520px; display: grid; gap: 3px; }
  .gauge .bars, .gauge .lbls { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .gauge .bars span { height: 10px; border-radius: 1px; background: var(--line-2); overflow: hidden; }
  .gauge .bars span i { display: block; height: 100%; background: var(--marker); }
  .gauge .lbls span { font-size: 11px; color: var(--on-soft); text-align: center; }
  .gauge .lbls span.now { color: var(--marker); }
  .sec-left { font-size: 13px; white-space: nowrap; }
  .sec-left b { font-family: var(--font-pixel); font-weight: 400; font-size: 20px; color: var(--marker); }
  .hud-r { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-main { min-height: 44px; padding: 0 18px; font-family: var(--font-pixel); font-size: 15px; background: var(--marker); color: var(--night); border: 0; border-radius: 4px; box-shadow: 0 3px 0 var(--marker-d); white-space: nowrap; }
  .btn-sys { min-height: 44px; padding: 0 14px; background: transparent; color: var(--on); border: 1px solid var(--line-2); border-radius: 4px; white-space: nowrap; }
  .btn-sys:hover { border-color: var(--on-soft); }
  .btn-sys.on { background: var(--desk-2); color: var(--marker); }

  /* the scene: drawn at 1440x900 and scaled to fit */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 12px 24px 24px; align-items: start; }
  .wrap { position: relative; min-width: 0; }
  .stage-box { position: relative; overflow: hidden; margin: 0 auto; }
  .stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .stage svg { position: absolute; left: 0; top: 0; display: block; }
  .ov { position: absolute; inset: 0; font-family: var(--font-pixel); pointer-events: none; }
  .ov > * { pointer-events: auto; }
  .ov .tag, .ov .chip, .ov .zzz, .ov .tray-l, .ov .note, .ov .plate { pointer-events: none; }
  .ov button { font-family: inherit; }
  .zone { position: absolute; width: 192px; height: 380px; top: 196px; background: transparent; border: 2px solid transparent; border-radius: 6px; padding: 0; }
  .zone:hover, .zone:focus-visible { border-color: rgba(232, 234, 241, .45); }
  .zone.att { border: 2px dashed var(--marker); }
  .zone.on { border: 3px solid var(--marker); box-shadow: 0 0 0 4px rgba(255, 225, 74, .25); }
  .zone.drop { border: 3px solid var(--marker); background: rgba(255, 225, 74, .12); }
  .zone.nodrop { border: 3px dashed #8a93ab; }
  .tag { position: absolute; top: 530px; width: 200px; box-sizing: border-box; padding: 4px 10px; font-size: 19px; border-radius: 2px; background: var(--night); color: var(--on); display: flex; justify-content: space-between; gap: 6px; pointer-events: none; white-space: nowrap; }
  .tag.att { background: var(--marker); color: var(--night); box-shadow: none !important; }
  .chip { position: absolute; top: 452px; width: 264px; box-sizing: border-box; padding: 6px 10px; background: var(--night); border-radius: 3px; display: flex; flex-direction: column; gap: 4px; font-size: 18px; pointer-events: none; }
  .chip .bar { height: 6px; background: var(--line-2); border-radius: 1px; overflow: hidden; display: block; }
  .chip .bar i { display: block; height: 100%; }
  .chip small { color: var(--on-soft); font-size: 16px; }
  .bubble { position: absolute; top: 578px; width: 400px; box-sizing: border-box; padding: 8px 12px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); font-family: var(--font-body) !important; }
  .bubble .w { font-family: var(--font-pixel); font-size: 16px; color: var(--ink-soft); }
  .bubble .t { font-size: 19px; font-weight: 700; line-height: 1.35; }
  .bubble .h { font-size: 15px; color: var(--ink-soft); }
  .bubble::after { content: ""; position: absolute; left: 190px; top: -11px; width: 18px; height: 18px; background: var(--paper); border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); transform: rotate(45deg); }
  .bubble.good { box-shadow: inset 5px 0 0 var(--green), 0 4px 0 rgba(0, 0, 0, .35); }
  .bubble.warn, .bubble.bad { box-shadow: inset 5px 0 0 var(--red), 0 4px 0 rgba(0, 0, 0, .35); }
  .zzz { position: absolute; top: 350px; font-size: 30px; color: var(--on-soft); line-height: 1; pointer-events: none; }
  .zzz span:nth-child(2) { font-size: 32px; } .zzz span:nth-child(3) { font-size: 40px; }
  .wb { position: absolute; left: 676px; top: 84px; width: 520px; height: 228px; box-sizing: border-box; padding: 10px 16px; background: transparent; border: 0; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 2px; font-size: 19px; line-height: 1.4; }
  .wb:hover, .wb:focus-visible { outline: 2px solid rgba(26, 28, 36, .4); }
  .wb .hd { font-size: 20px; border-bottom: 2px solid var(--ink); align-self: flex-start; padding-right: 20px; margin-bottom: 2px; }
  .wb .bad { color: var(--red); } .wb .done { color: #5a6072; }
  .mon { position: absolute; left: 1052px; top: 604px; width: 344px; height: 240px; box-sizing: border-box; padding: 10px 14px; background: transparent; border: 0; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 4px; font-family: var(--font-body) !important; font-size: 18px; }
  .mon:hover, .mon:focus-visible { outline: 3px solid var(--marker); }
  .mon .tabs { display: flex; gap: 4px; font-family: var(--font-pixel); font-size: 15px; }
  .mon .tabs span { background: var(--chip); padding: 0 6px; border-radius: 2px; }
  .mon .tabs span:first-child { background: var(--ink); color: var(--paper); }
  .mon .r { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--rule); }
  .mon .r.bad { color: var(--red); font-weight: 700; }
  .phone { position: absolute; left: 64px; top: 724px; width: 76px; height: 124px; background: transparent; border: 2px solid transparent; border-radius: 6px; padding: 0; }
  .phone:hover, .phone:focus-visible { border-color: var(--marker); }
  .phone .badge { position: absolute; right: -10px; top: -10px; min-width: 28px; height: 28px; border-radius: 14px; background: var(--red); color: #fff; font-size: 16px; display: grid; place-items: center; }
  .car { position: absolute; left: 264px; top: 716px; width: 200px; height: 104px; background: transparent; border: 2px solid transparent; border-radius: 6px; padding: 0; touch-action: none; cursor: grab; }
  .car:hover, .car:focus-visible { border-color: var(--marker); }
  .car svg { position: absolute; left: 36px; top: 18px; }
  .tray-l { position: absolute; left: 216px; top: 826px; width: 296px; text-align: center; font-size: 18px; color: var(--on); pointer-events: none; }
  .stage svg.ghost { position: absolute; width: 120px; height: 72px; pointer-events: none; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); display: none; }
  .note { position: absolute; left: 714px; top: 700px; width: 116px; color: var(--ink); font-size: 15px; line-height: 1.4; pointer-events: none; font-family: var(--font-body); }
  .plate { position: absolute; left: 1288px; top: 160px; width: 88px; height: 32px; display: grid; place-items: center; color: var(--ink); font-size: 14px; pointer-events: none; }
  .toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 90%; background: var(--night); color: var(--on); border: 1px solid var(--marker); border-radius: 4px; padding: 8px 14px; font-size: 14px; z-index: 6; pointer-events: none; }

  /* below the scene: everything you can press, also as plain buttons (keyboard, phones) */
  .bar2 { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; align-items: stretch; }
  .who { min-height: 52px; min-width: 168px; display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: var(--desk); color: var(--on); border: 0; border-radius: 4px; padding: 4px 12px 4px 0; overflow: hidden; }
  .who > i { align-self: stretch; margin: -4px 0; background: var(--c); }
  .who b { display: block; font-size: 13px; }
  .who small { display: block; font-size: 12px; color: var(--on-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .who.att { box-shadow: inset 0 0 0 2px var(--marker); }
  .who.on { background: var(--desk-2); box-shadow: 0 0 0 2px var(--marker); }

  /* the detail of what you pressed */
  .dock { min-width: 0; position: sticky; top: 12px; }
  .pane { background: var(--paper); color: var(--ink); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 0 0 2px var(--marker), 0 12px 32px rgba(0, 0, 0, .45); min-width: 0; max-height: inherit; overflow-y: auto; }
  .pane-b { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .pane-f { margin-top: 14px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
  .pane-f > .lbl { font-size: 11px; color: var(--ink-soft); }
  .pane .note2 { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .oh { display: flex; flex-direction: column; gap: 4px; }
  .oh-top { display: flex; align-items: center; gap: 8px; }
  .typ { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 6px; border-radius: 2px; }
  .ptag { margin-left: auto; font-family: var(--font-pixel); font-size: 12px; padding: 0 8px; border-radius: 2px; background: var(--chip); color: var(--ink); white-space: nowrap; }
  .ptag.att { background: var(--marker); }
  .ptag.bad { background: var(--red); color: #fff; }
  .x { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); font-size: 22px; margin: -10px -8px -10px 0; }
  .oh h2 { font-size: 22px; line-height: 1.3; }
  .oh-sub { font-size: 12px; color: var(--ink-soft); }
  .said { background: var(--card); border-radius: 4px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
  .said small { display: block; font-size: 11px; color: var(--ink-soft); }
  .mut { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
  .me { width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--font-pixel); font-size: 11px; }
  .mut-b { background: var(--card); border-radius: 4px; padding: 8px 12px; box-shadow: inset 4px 0 0 var(--tone, var(--gross)); }
  .mut-b .l { font-size: 11px; color: var(--ink-soft); }
  .mut-b .t { font-size: 15px; font-weight: 700; }
  .tone-good { --tone: var(--green); } .tone-ok { --tone: var(--teal); } .tone-worry { --tone: var(--amber); } .tone-bad { --tone: var(--red); } .tone-mute { --tone: var(--gross); }
  .psec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .psec h3 { font-size: 14px; }
  .psec p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .eps { display: flex; flex-wrap: wrap; gap: 6px; }
  .eps button { min-height: 44px; min-width: 64px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--card); color: var(--ink); display: grid; align-content: center; padding: 2px 8px; }
  .eps button small { font-size: 11px; color: var(--ink-soft); }
  .eps button.on { background: var(--ink); color: var(--paper); }
  .eps button.on small { color: #c9cedc; }
  .eps button.bad { box-shadow: inset 0 -4px 0 var(--red); }
  .rows { display: flex; flex-direction: column; }
  .row { min-height: 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; border-bottom: 1px dashed var(--rule); text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; color: var(--ink); padding: 0 2px; }
  button.row { min-height: 44px; }
  button.row:hover { background: rgba(26, 28, 36, .05); }
  .row .v { font-weight: 700; text-align: right; }
  .row .v.bad { color: var(--red); } .row .v.good { color: var(--green); } .row .v.warn { color: #8a5a00; } .row .v.mute { color: var(--ink-soft); font-weight: 400; }
  .acts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .act { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 4px; text-align: left; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .act.pri { background: var(--ink); color: var(--paper); }
  .act:hover:not(:disabled) { box-shadow: 0 2px 0 var(--ink); }
  .act:disabled { color: var(--ink-soft); border: 1.5px dashed #b9b4a6; }
  .act .m { display: grid; line-height: 1.35; }
  .act .m b { font-size: 14px; }
  .act .m small { font-size: 11.5px; }
  .cost { font-family: var(--font-pixel); font-size: 11px; padding: 0 6px; border-radius: 2px; white-space: nowrap; background: var(--chip); color: var(--ink); }
  .act.pri .cost { background: #3a4158; color: var(--on); }
  .tabs2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .tabs2 button { min-height: 44px; border: 0; background: transparent; color: var(--ink); font-size: 13px; }
  .tabs2 button.on { background: var(--ink); color: var(--paper); }
  .msgs { display: flex; flex-direction: column; gap: 6px; }
  .msg { background: var(--card); border-radius: 4px; padding: 8px 10px; font-size: 13px; box-shadow: inset 4px 0 0 var(--gross); }
  .msg.bad { box-shadow: inset 4px 0 0 var(--red); }
  .msg small { display: block; color: var(--ink-soft); font-size: 11px; }
  .log { font-size: 12.5px; display: grid; gap: 4px; max-height: 300px; overflow-y: auto; }
  .log p { margin: 0; }
  .log p.warn { color: #8a5a00; } .log p.bad { color: var(--red); } .log p.good { color: var(--green); }
  .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; white-space: nowrap; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--card); border-radius: 4px; padding: 8px 10px; min-width: 0; }
  .tile .l { font-size: 11px; color: var(--ink-soft); }
  .tile .v { font-family: var(--font-pixel); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.bad .l, .tile.bad .v { color: var(--red); }
  .tile.bad { box-shadow: inset 0 0 0 1.5px var(--red); }
  .tile.good .l, .tile.good .v { color: var(--green); }
  .tile.good { box-shadow: inset 0 0 0 1.5px var(--green); }

  /* dialogs */
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 10, 18, .78); display: grid; place-items: center; padding: 16px; z-index: 20; overflow-y: auto; }
  .dlg { width: min(580px, 100%); max-height: none; }
  .dlg ul { margin: 0; padding-left: 20px; font-size: 13px; display: grid; gap: 6px; }
  .big { font-family: var(--font-pixel); font-size: 30px; line-height: 1.2; }
  .big.on { color: var(--red); }
  .rank { font-family: var(--font-pixel); font-size: 64px; line-height: 1; }

  @media (max-width: 1099px) {
    .hud { padding: 8px 16px; }
    .main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; }
    .dock { position: static; }
  }
  @media (max-width: 640px) {
    .hud-l { flex: 1 1 100%; flex-wrap: wrap; row-gap: 2px; }
    .gauge { flex: 1 1 100%; }
    .hud-r { margin-left: 0; flex: 1 1 100%; }
    .hud-r .btn-main { flex: 1 1 auto; }
    .who { flex: 1 1 100%; }
    .bar2 > .btn-sys { flex: 1 1 calc(50% - 8px); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .arm-mid { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .arm-up { animation: wave-a .8s steps(1) infinite; }
    .arm-mid { display: inline; animation: wave-b .8s steps(1) infinite; }
    @keyframes wave-a { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes wave-b { 0% { opacity: 0; } 50% { opacity: 1; } }
    .bubble { animation: pop .25s ease-out; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud"></header>
  <div class="main" id="main">
  <div class="wrap" id="wrap">
    <div class="stage-box" id="box">
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 0 360 225" width="1440" height="900" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="ov" id="ov"></div>
        <div class="ov" id="ovb"></div>
        <svg class="ghost" id="ghost" viewBox="0 0 30 18" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="6" width="28" height="9" fill="#e8eaf1"/><rect x="16" y="1" width="12" height="6" fill="#e8eaf1"/><rect x="18" y="2" width="8" height="4" fill="#86b6da"/><rect x="1" y="10" width="28" height="2" fill="#c8323a"/><rect x="4" y="14" width="5" height="3" fill="#1a1c24"/><rect x="20" y="14" width="5" height="3" fill="#1a1c24"/></svg>
      </div>
      <div id="toast"></div>
    </div>
    <div class="bar2" id="bar2"></div>
  </div>
  <div class="dock" id="dock"></div>
  </div>
  <div id="modal-root"></div>
</div>
<script id="engine">
const Engine = (() => {
  "use strict";
  // Time is in game minutes from 第1週 月曜 0:00. One week (10080 min) is 120 real seconds: 84 min per second.
  const HOUR = 60, DAY = 1440, WEEK = 7 * DAY, START = 9 * HOUR, EPS = 12, SCHEDULE = 4;
  const TASK = {
    eigyo: { label: "カット表を埋める（原画マン営業）", short: "営業", hours: 16, ep: true },
    meet: { label: "作打ちの段取り", short: "作打ち", hours: 8, ep: true },
    shinko: { label: "進行表を作る", short: "進行表", hours: 10, ep: true, sheet: true },
    hatchu: { label: "発注表を作る", short: "発注表", hours: 10, ep: true, sheet: true },
    kouban: { label: "香盤表を作る", short: "香盤表", hours: 10, ep: true, sheet: true },
    soto: { label: "外回り（回収・届け）", short: "外回り", hours: 16, car: true },
    rest: { label: "寝かせる", short: "休む", hours: 0 },
  };
  const NAMES = ["高槻 透", "三好 かおる", "芹沢 一馬", "小野寺 ゆう", "柚木 瞳", "黒川 仁", "日向 まどか", "塩見 直", "久住 梓", "早瀬 涼", "蓮見 楓", "宇佐美 圭", "榎本 一花", "真田 航"];
  const SHINKO = [
    { id: "s1", name: "佐伯", rookie: true },
    { id: "s2", name: "川口", rookie: false },
    { id: "s3", name: "真壁", rookie: true },
  ];
  const DOUGA_PER_DAY = 70, DOUGA_LAG = 36 * HOUR, SHOT_PER_DAY = 90, SHOT_LAG = 12 * HOUR, CAR_CAP = 70, ANIM_CAP = 40;

  function rnd(s) {
    let a = (s.r = (s.r + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const hourOf = (t) => Math.floor((t % DAY) / HOUR);
  const weekOf = (t) => Math.floor(t / WEEK) + 1;
  const airOf = (n) => (n + SCHEDULE - 1) * WEEK; // 第n話: starts at the beginning of week n, airs at the end of week n+3
  const famName = (name) => name.split(" ")[0];
  function log(s, text, tone = "") { s.log.unshift({ t: s.t, text, tone }); if (s.log.length > 200) s.log.length = 200; }

  function newGame(seed = 1) {
    const s = { v: 1, seed, r: (seed * 2654435761) >>> 0 || 1, t: START, phase: "play", week: 1, eps: [], anims: [], shinko: [], car: null, pipe: [], phone: [], log: [], weekEnd: null, result: null, acc: { douga: 0, shot: 0 },
      stats: { orders: 0, waited: 0, blank: 0, drops: 0 } };
    s.anims = NAMES.map((name, i) => ({ id: "a" + (i + 1), name, rate: 2.0 + rnd(s) * 1.2, acc: 0, queue: [] }));
    s.shinko = SHINKO.map((d) => ({ ...d, sta: 100, task: null, report: null, idleSince: START, asleep: false }));
    startEp(s, 1);
    log(s, "第1週 月曜 9:00。第1話のコンテが上がった。放送まで4週。");
    return s;
  }
  function startEp(s, n) {
    const cuts = 180 + Math.floor(rnd(s) * 41);
    s.eps.push({ n, cuts, empty: cuts, drawn: 0, coll: 0, douga: 0, dDone: 0, shooting: 0, shot: 0, meet: false, sheets: { shinko: false, hatchu: false, kouban: false }, air: airOf(n), result: null });
  }
  const live = (s) => s.eps.filter((e) => !e.result);
  const epOf = (s, n) => s.eps.find((e) => e.n === n);
  const shOf = (s, id) => s.shinko.find((x) => x.id === id);
  const queued = (s, e) => s.anims.reduce((t, a) => t + a.queue.filter((q) => q.ep === e.n).reduce((u, q) => u + q.n, 0), 0);
  const animLoad = (a) => a.queue.reduce((t, q) => t + q.n, 0);
  function counts(s, e) {
    const q = queued(s, e);
    return { empty: e.empty, queued: q, drawn: e.drawn, coll: e.coll, douga: e.douga, dDone: e.dDone, shooting: e.shooting, shot: e.shot, filled: e.cuts - e.empty };
  }

  // ---------- the 進行: they never move on their own ----------
  function canOrder(s, sid, kind, n) {
    const sh = shOf(s, sid), T = TASK[kind];
    if (s.phase !== "play") return "いまは指示を出せない";
    if (!T) return "その指示はない";
    if (T.ep) {
      const e = epOf(s, n);
      if (!e || e.result) return "その話数はない";
      if (kind === "eigyo" && e.empty <= 0) return "空きカットがない";
      if (kind === "meet" && e.meet) return "作打ちは済んでいる";
      if (kind === "meet" && e.cuts - e.empty <= 0) return "まだ誰にも頼んでいない（先に営業）";
      if (T.sheet && e.sheets[kind]) return "もうできている";
    }
    if (kind === "soto" && s.car && s.car !== sid) return `社用車がない（${shOf(s, s.car).name}が使用中）`;
    if (sh.task && sh.task.kind === kind && sh.task.kind !== "rest" && (!T.ep || sh.task.ep === n)) return "いまやっている";
    if (kind === "rest" && sh.task && sh.task.kind === "rest") return "もう休んでいる";
    if (kind === "rest" && sh.sta >= 95) return "体力は十分";
    return "";
  }
  function order(s, sid, kind, n = null) {
    if (canOrder(s, sid, kind, n)) return false;
    const sh = shOf(s, sid);
    if (sh.task && sh.task.kind === "soto" && kind !== "soto") s.car = null; // calling them back brings the car back
    if (sh.task && sh.task.kind !== "rest") log(s, `${sh.name}：「${TASK[sh.task.kind].short}」を途中でやめた。`, "warn");
    if (!sh.asleep && !sh.task) s.stats.waited += Math.max(0, s.t - sh.idleSince);
    sh.report = null;
    sh.asleep = false;
    sh.task = { kind, ep: TASK[kind].ep ? n : null, need: TASK[kind].hours * HOUR, done: 0, t0: s.t };
    if (kind === "soto") s.car = sid;
    s.stats.orders++;
    return true;
  }
  function cancel(s, sid) {
    const sh = shOf(s, sid);
    if (!sh.task) return false;
    if (sh.task.kind === "soto") s.car = null;
    log(s, `${sh.name}：「${TASK[sh.task.kind].short}」を取り消した。`);
    sh.task = null; sh.idleSince = s.t;
    return true;
  }
  const ack = (s, sid) => { const sh = shOf(s, sid); sh.report = null; };

  function finish(s, sh) {
    const T = sh.task, e = T.ep ? epOf(s, T.ep) : null;
    let text = "", tone = "";
    if (e && e.result) text = `${e.n}話はもう放送されていた……。`;
    else if (T.kind === "eigyo") {
      // fill the cut table: the animators with room take some cuts
      let want = Math.round((15 + rnd(s) * 12) * (sh.rookie ? 0.85 : 1));
      want = Math.min(want, e.empty);
      const free = s.anims.map((a) => ({ a, room: ANIM_CAP - animLoad(a) })).filter((x) => x.room > 0).sort((x, y) => y.room - x.room + (rnd(s) - 0.5) * 8);
      const took = [];
      for (const { a, room } of free) {
        if (want <= 0 || took.length >= 3) break;
        const k = Math.min(room, Math.max(6, Math.ceil(want / (3 - took.length))), want);
        a.queue.push({ ep: e.n, n: k });
        e.empty -= k; want -= k; took.push([a, k]);
      }
      const got = took.reduce((t, [, k]) => t + k, 0);
      if (got) { text = `${e.n}話の営業、終わりました！ ${took.map(([a]) => famName(a.name) + "さん").join("と")}で${got}カット埋まりました！`; tone = "good"; }
      else { text = `${e.n}話の営業……みんな手一杯で、取れませんでした。`; tone = "bad"; }
      if (got && !e.meet) text += "（作打ちはまだです）";
    } else if (T.kind === "meet") {
      e.meet = true; text = `${e.n}話の作打ち、終わりました。原画、描き始めてもらいます！`; tone = "good";
    } else if (TASK[T.kind].sheet) {
      e.sheets[T.kind] = true; text = `${e.n}話の${TASK[T.kind].short}、できました！`; tone = "good";
    } else if (T.kind === "soto") {
      s.car = null;
      text = collect(s, sh); tone = /白紙/.test(text) ? "warn" : "good";
    }
    log(s, `${sh.name}：${text}`, tone);
    sh.report = { text, tone, t: s.t };
    sh.task = null; sh.idleSince = s.t;
  }
  function collect(s, sh) {
    let cap = CAR_CAP;
    const got = [];
    let blank = 0;
    for (const e of live(s).sort((x, y) => x.air - y.air)) {
      if (cap <= 0 || e.drawn <= 0) continue;
      // without a 進行表 nobody knows who is done: some finished cuts are missed
      const found = e.sheets.shinko ? e.drawn : Math.round(e.drawn * (0.6 + rnd(s) * 0.2));
      let k = Math.min(cap, found);
      if (k <= 0) continue;
      let b = 0;
      for (let i = 0; i < k; i++) if (rnd(s) < (sh.rookie ? 0.07 : 0.04)) b++;
      e.drawn -= k; cap -= k;
      // white bags go back to an animator to finish
      if (b) { const a = s.anims.slice().sort((x, y) => animLoad(x) - animLoad(y))[0]; a.queue.unshift({ ep: e.n, n: b }); }
      const ok = k - b;
      e.coll += ok; blank += b;
      got.push(`${e.n}話 ${ok}`);
    }
    s.stats.blank += blank;
    if (!got.length) return "回収、戻りました……上がっている原画がありませんでした。";
    return `回収、戻りました！ ${got.join("・")}カット。${blank ? `……${blank}カット、白紙でした。` : ""}`;
  }

  // ---------- one game minute ----------
  function step(s) {
    s.t++;
    const h = hourOf(s.t), night = h < 7;
    // animators draw (only cuts of episodes whose 作打ち is done)
    for (const a of s.anims) {
      a.acc += a.rate / DAY;
      while (a.acc >= 1) {
        const q = a.queue.find((x) => { const e = epOf(s, x.ep); return e && !e.result && e.meet; });
        if (!q) { a.acc = Math.min(a.acc, 1); break; }
        a.acc -= 1; q.n--; epOf(s, q.ep).drawn++;
        if (q.n <= 0) a.queue.splice(a.queue.indexOf(q), 1);
      }
    }
    // 進行
    for (const sh of s.shinko) {
      const T = sh.task;
      if (!T) {
        sh.asleep = night; // nothing to do at night: asleep at the desk (a report waits in its bubble)
        sh.sta = Math.min(100, sh.sta + (night ? 14 : 4) / HOUR);
        continue;
      }
      if (T.kind === "rest") {
        sh.asleep = true;
        sh.sta = Math.min(100, sh.sta + 14 / HOUR);
        if (sh.sta >= 95) { sh.task = null; sh.idleSince = s.t; sh.report = { text: "寝ました！ 次、なにやりますか", tone: "", t: s.t }; }
        continue;
      }
      sh.asleep = false;
      sh.sta = Math.max(0, sh.sta - (night ? 5 : 3.5) / HOUR);
      T.done += sh.sta <= 0 ? 0.3 : sh.sta < 25 ? 0.6 : 1;
      if (T.done >= T.need) finish(s, sh);
    }
    if (s.t % HOUR === 0) hourly(s);
    if (s.t % WEEK === 0) endWeek(s);
  }
  function hourly(s) {
    // 動画・仕上げ (outsourced): needs the 発注表, takes a day and a half
    s.acc.douga += DOUGA_PER_DAY / 24;
    for (const e of live(s).sort((x, y) => x.air - y.air)) {
      if (!e.sheets.hatchu || e.coll <= 0) continue;
      const k = Math.min(e.coll, Math.floor(s.acc.douga));
      if (k <= 0) break;
      e.coll -= k; e.douga += k; s.acc.douga -= k;
      s.pipe.push({ ep: e.n, n: k, ready: s.t + DOUGA_LAG, stage: "douga" });
    }
    s.acc.douga = Math.min(s.acc.douga, DOUGA_PER_DAY / 24);
    // 撮影: needs the 香盤表
    s.acc.shot += SHOT_PER_DAY / 24;
    for (const e of live(s).sort((x, y) => x.air - y.air)) {
      if (!e.sheets.kouban || e.dDone <= 0) continue;
      const k = Math.min(e.dDone, Math.floor(s.acc.shot));
      if (k <= 0) break;
      e.dDone -= k; e.shooting += k; s.acc.shot -= k;
      s.pipe.push({ ep: e.n, n: k, ready: s.t + SHOT_LAG, stage: "shot" });
    }
    s.acc.shot = Math.min(s.acc.shot, SHOT_PER_DAY / 24);
    for (const p of s.pipe) {
      if (p.ready > s.t) continue;
      const e = epOf(s, p.ep);
      if (!e.result) {
        if (p.stage === "douga") { e.douga -= p.n; e.dDone += p.n; }
        else { e.shooting -= p.n; e.shot += p.n; }
      }
      p.done = true;
    }
    s.pipe = s.pipe.filter((p) => !p.done);
    // the smartphone: an animator gives cuts back
    if (rnd(s) < 1 / 40) {
      const cands = s.anims.filter((a) => a.queue.some((q) => q.n >= 6));
      if (cands.length) {
        const a = cands[Math.floor(rnd(s) * cands.length)], q = a.queue.filter((x) => x.n >= 6)[0];
        const k = Math.max(3, Math.round(q.n * (0.3 + rnd(s) * 0.4)));
        q.n -= k; epOf(s, q.ep).empty += k;
        if (q.n <= 0) a.queue.splice(a.queue.indexOf(q), 1);
        s.stats.drops++;
        phone(s, `${a.name}さん`, `すみません、${q.ep}話の${k}カット……他社が入って、無理になりました。`, "bad");
      }
    }
  }
  function phone(s, from, text, tone = "") {
    s.phone.unshift({ t: s.t, from, text, tone, read: false });
    if (s.phone.length > 40) s.phone.length = 40;
    log(s, `スマホ：${from}「${text}」`, tone);
  }
  function airResult(e) {
    const r = e.shot / e.cuts;
    return r >= 1 ? { key: "full", label: "完成して放送", tone: "good", r } : r >= 0.85 ? { key: "still", label: "止め絵でしのいで放送", tone: "warn", r } : { key: "drop", label: "落とした（総集編）", tone: "bad", r };
  }
  function endWeek(s) {
    const week = weekOf(s.t - 1);
    const aired = [];
    for (const e of live(s)) {
      if (e.air <= s.t) {
        e.result = airResult(e);
        // whatever was left is thrown away
        for (const a of s.anims) a.queue = a.queue.filter((q) => q.ep !== e.n);
        aired.push(e.n);
        log(s, `第${e.n}話：${e.result.label}（撮影 ${e.shot}/${e.cuts}）`, e.result.tone);
      }
    }
    s.week = week + 1;
    if (s.week <= EPS) { startEp(s, s.week); log(s, `第${s.week}週。第${s.week}話のコンテが上がった。放送まで4週。`); }
    const left = s.eps.filter((e) => !e.result).length + (EPS - s.eps.length);
    s.weekEnd = { week, aired, left };
    s.phase = s.eps.length === EPS && s.eps.every((e) => e.result) ? "end" : "weekEnd";
    if (s.phase === "end") s.result = result(s);
  }
  function nextWeek(s) { if (s.phase === "weekEnd") { s.phase = "play"; s.weekEnd = null; } }

  // what the header says: before the first broadcast, how many weeks to go; then how many are left
  function airStatus(s) {
    const firstAired = s.eps.some((e) => e.result);
    const next = live(s).sort((x, y) => x.air - y.air)[0];
    const left = EPS - s.eps.filter((e) => e.result).length;
    const weeksTo = (e) => Math.max(0, Math.ceil((e.air - s.t) / WEEK));
    if (!firstAired) return { main: `第1話 放送まで あと${weeksTo(epOf(s, 1))}週`, sub: "", airing: false, left };
    if (!next) return { main: "全話 放送終了", sub: "", airing: false, left: 0 };
    return { main: `放送中　残り${left}話`, sub: `次は第${next.n}話（あと${weeksTo(next)}週）`, airing: true, left };
  }

  // ---------- your read of things, never a number ----------
  const say = (tone, t) => ({ tone, t });
  // how far along this episode should be by now (from many played seasons): collected or later, and drawn or later
  function pace(s, e) {
    const d = (e.air - s.t) / DAY, c = counts(s, e);
    const down = (c.coll + c.douga + c.dDone + c.shooting + c.shot) / e.cuts;
    const up = (e.cuts - c.empty - c.queued) / e.cuts, filled = c.filled / e.cuts;
    if (c.shot >= e.cuts) return { level: 2, d };
    if (d <= 14) {
      const need = d <= 7 ? 0.9 : 0.9 - ((d - 7) / 7) * 0.6;
      return { level: down < need * 0.55 ? 0 : down < need ? 1 : 2, d };
    }
    if (d <= 17 && up < 0.1) return { level: 0, d };
    if (d <= 21 && filled < 0.6) return { level: 1, d };
    return { level: 2, d };
  }
  function epMut(s, e) {
    if (e.result) return say(e.result.tone === "good" ? "good" : e.result.tone === "warn" ? "worry" : "bad", e.result.label);
    const c = counts(s, e), p = pace(s, e);
    if (c.shot >= e.cuts) return say("good", "撮影まで終わった。あとは放送を待つだけ");
    if (c.filled > 0 && !e.meet) return say("worry", "作打ちがまだだ。原画が始まらない・・・");
    if (c.coll > 0 && !e.sheets.hatchu) return say("worry", "回収した原画が発注表待ちで止まってる");
    if (c.dDone > 0 && !e.sheets.kouban) return say("worry", "撮影にものが入ってない・・・香盤表がない");
    if (p.level === 0) return say("bad", p.d < 7 ? "このままじゃ落ちる・・・" : "スケジュールが無い・・・");
    if (p.level === 1) return say("worry", p.d < 10 ? "ギリギリだ・・・止め絵になるかも" : "ちょっと遅れてる・・・");
    if (c.empty > 0 && p.d < 21) return say("worry", "まだ空きカットがある。営業しないと");
    return say("ok", "このペースなら、なんとか");
  }
  function hint(s) {
    // the most urgent thing a free 進行 could do
    for (const e of live(s).sort((x, y) => x.air - y.air)) {
      const c = counts(s, e);
      if (c.filled > 0 && !e.meet) return say("worry", `${e.n}話の作打ちがまだだ`);
      if (c.coll > 0 && !e.sheets.hatchu) return say("worry", `${e.n}話の発注表がないと、動画に出せない`);
      if ((c.dDone > 0 || c.douga > 0) && !e.sheets.kouban) return say("worry", `${e.n}話の香盤表がないと、撮影に入れない`);
      if (c.empty > 0) return say("worry", `${e.n}話の空きが${c.empty}カットもある・・・営業だ`);
    }
    const drawn = live(s).reduce((t, e) => t + e.drawn, 0);
    if (drawn > 20 && !s.car) return say("ok", "上がっている原画がありそうだ。回収に行かせたい");
    return say("ok", "いまは落ち着いている");
  }
  function shMut(s, sh) {
    if (sh.sta < 25) return say("bad", "もう限界だ・・・寝かせないと");
    if (sh.task && sh.task.kind !== "rest") return say("ok", `${TASK[sh.task.kind].short}をやっている`);
    return hint(s);
  }

  function result(s) {
    const r = { full: 0, still: 0, drop: 0 };
    s.eps.forEach((e) => r[e.result.key]++);
    const score = r.full * 3 + r.still;
    const rank = score >= 34 ? "S" : score >= 28 ? "A" : score >= 20 ? "B" : score >= 12 ? "C" : "D";
    return { ...r, score, rank, ...s.stats };
  }
  function tick(s, n) { for (let i = 0; i < n && s.phase === "play"; i++) step(s); }

  return { HOUR, DAY, WEEK, START, EPS, SCHEDULE, TASK, newGame, tick, order, canOrder, cancel, ack, nextWeek, airStatus, counts, live, epOf, shOf, epMut, shMut, hint, pace, airOf, weekOf, hourOf, animLoad, ANIM_CAP };
})();
if (typeof module !== "undefined") module.exports = Engine;
</script>
<script>
(() => {
  "use strict";
  const E = Engine;
  const SAVE_KEY = "animep.desk";
  const MIN_PER_SEC = E.WEEK / 120; // one week is 120 seconds
  const SEAT = { s1: 80, s2: 180, s3: 280 }; // x of each 進行's seat, in scene units (x4 = px)
  const HAIR = { s1: "#4a3020", s2: "#1a1c24", s3: "#2a2a3a" };
  const SLEEP_SIDE = { s1: -1, s2: -1, s3: 1 };
  const DOW = ["月", "火", "水", "木", "金", "土", "日"];
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let s = null;
  const ui = { speed: 1, paused: true, sel: null, epSel: null, tab: "eps", modal: null };
  let pressing = false, dragging = null, toastTimer = 0;

  // ---------- save ----------
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ s, ui: { speed: ui.speed, sel: ui.sel, epSel: ui.epSel, tab: ui.tab, modal: ui.modal } })); } catch (e) { /* storage may be off */ } }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (d && d.s && d.s.v === 1 && d.s.shinko) { s = d.s; Object.assign(ui, d.ui || {}); ui.paused = true; return true; }
    } catch (e) { /* a broken save: start over */ }
    return false;
  }
  function fresh(seed) { s = E.newGame(seed); Object.assign(ui, { sel: null, epSel: null, tab: "eps", paused: true, modal: "intro", speed: 1 }); save(); }

  // ---------- words ----------
  const pad = (n) => String(n).padStart(2, "0");
  const dayOf = (t) => Math.floor((t % E.WEEK) / E.DAY);
  const clock = (t) => `${DOW[dayOf(t)]}曜 ${pad(E.hourOf(t))}:${pad(t % 60)}`;
  const stamp = (t) => `${E.weekOf(t)}週 ${DOW[dayOf(t)]} ${pad(E.hourOf(t))}:${pad(t % 60)}`;
  const hrs = (m) => (m < 60 ? `${Math.max(1, Math.round(m))}分` : `${Math.round(m / 60)}時間`);
  const daysTo = (t) => { const d = (t - s.t) / E.DAY; return d >= 1 ? `${Math.floor(d)}日` : `${Math.max(0, Math.round(d * 24))}時間`; };
  const shOf = (id) => E.shOf(s, id);
  const isNight = () => E.hourOf(s.t) < 7;
  function stateOf(sh) {
    if (sh.task && sh.task.kind === "soto") return "out";
    if (sh.task && sh.task.kind !== "rest") return "work";

    const sw = E.canOrder(s, sh.id, "soto");
    const drawn = E.live(s).reduce((t, x) => t + x.drawn, 0);
    acts += act({ label: E.TASK.soto.label, sub: sw || `上がった原画を回収し、動画・仕上げへ（放送が近い話数から）${drawn ? "" : " ・ いまは上がりが少なそう"}`, cost: "1日", attrs: `data-act="order" data-v="soto"`, disabled: !!sw });
    acts += act({ label: E.TASK.rest.label, sub: E.canOrder(s, sh.id, "rest") || "体力が戻るまで、机で寝る", cost: "体力しだい", attrs: `data-act="order" data-v="rest"`, disabled: !!E.canOrder(s, sh.id, "rest") });
    if (sh.task) acts += act({ label: "いまの作業をやめさせる", sub: "やりかけは無駄になる", attrs: `data-act="cancel"` });
    return pane(body, foot(sh.name, acts, `外回りは、机の社用車を${sh.name}にドラッグしても出せる。指示を出すまで、${sh.name}は動かない。`));
  }
  function paneEp(e) {
    const c = E.counts(s, e), m = E.epMut(s, e);
    const known = e.sheets.shinko;
    const body = oh("話数", `第${e.n}話`, e.result ? `${e.result.label} ・ 撮影 ${e.shot}/${e.cuts}` : `${e.cuts}カット ・ 放送 ${stamp(e.air)}`, e.result ? `<span class="ptag">${esc(e.result.label)}</span>` : `<span class="ptag ${m.tone === "bad" ? "bad" : ""}">放送まで${daysTo(e.air)}</span>`)
      + `<div class="tiles">${tile("空きカット", c.empty, c.empty ? "bad" : "good")}${tile("撮影済み", `${c.shot}/${e.cuts}`, c.shot >= e.cuts ? "good" : "")}${tile("作打ち", e.meet ? "済" : "まだ", e.meet ? "good" : "bad")}</div>`
      + mut(m, `あなたの見立て（${e.n}話）`)
      + `<section class="psec"><h3>カットの流れ</h3><div class="rows">${row("空き（原画マンが決まっていない）", c.empty, c.empty ? "bad" : "")}${row(`原画中${e.meet ? "" : "（作打ち待ち）"}`, known ? c.queued : "分からない", known ? "" : "mute")}${row("上がり（回収待ち）", known ? c.drawn : "分からない", known ? "" : "mute")}${row(`回収済み${e.sheets.hatchu ? "" : "（発注表待ち）"}`, c.coll, c.coll && !e.sheets.hatchu ? "bad" : "")}${row("動画・仕上げ中", c.douga)}${row(`撮影待ち${e.sheets.kouban ? "" : "（香盤表待ち）"}`, c.dDone, c.dDone && !e.sheets.kouban ? "bad" : "")}${row("撮影中", c.shooting)}${row("撮影済み", c.shot, "good")}</div><p>${known ? "進行表があるので、原画の進み具合が分かる。" : "進行表がないので、原画がどこまで上がっているかは分からない。"}</p></section>`
      + `<section class="psec"><h3>表</h3><div class="rows">${row("進行表", e.sheets.shinko ? "あり" : "まだ", e.sheets.shinko ? "good" : "mute")}${row("発注表", e.sheets.hatchu ? "あり" : "まだ", e.sheets.hatchu ? "good" : "mute")}${row("香盤表", e.sheets.kouban ? "あり" : "まだ", e.sheets.kouban ? "good" : "mute")}</div></section>`;
    const free = s.shinko.filter((x) => !x.task || x.task.kind === "rest");
    const acts = free.map((x) => act({ label: `${x.name}に指示を出す`, sub: tagOf(x).t, attrs: `data-act="sel" data-k="sh" data-v="${x.id}" data-ep="${e.n}"` })).join("");
    return pane(body, foot(`第${e.n}話`, acts, acts ? "" : "手の空いている進行がいない。"));
  }
  function paneMonitor() {
    const tabs = `<div class="tabs2" role="tablist">${[["eps", "話数"], ["anims", "原画マン"], ["log", "記録"]].map(([v, t]) => `<button class="${ui.tab === v ? "on" : ""}" data-act="tab" data-v="${v}" role="tab" aria-selected="${ui.tab === v}">${t}</button>`).join("")}</div>`;
    let inner = "";
    if (ui.tab === "eps") {
      const live = E.live(s).sort((a, b) => a.air - b.air), done = s.eps.filter((e) => e.result);
      inner = `<section class="psec"><h3>制作中</h3><div class="rows">${live.map((e) => { const c = E.counts(s, e), m = E.epMut(s, e); return row(`第${e.n}話 ・ 放送まで${daysTo(e.air)} ・ 空き${c.empty}`, `撮影 ${c.shot}/${e.cuts}`, m.tone === "bad" ? "bad" : "", `data-act="sel" data-k="ep" data-v="${e.n}"`); }).join("")}</div></section>`
        + (done.length ? `<section class="psec"><h3>放送済み</h3><div class="rows">${done.map((e) => row(`第${e.n}話`, e.result.label, e.result.tone, `data-act="sel" data-k="ep" data-v="${e.n}"`)).join("")}</div></section>` : "");
    } else if (ui.tab === "anims") {
      inner = `<section class="psec"><h3>原画マン（${s.anims.length}人）</h3><p>営業で、手の空いている人にカットを頼む。</p><div class="rows">${s.anims.map((a) => { const l = E.animLoad(a); return row(a.name, l >= E.ANIM_CAP ? "手一杯" : l > 0 ? `${l}カット抱えている` : "空いている", l >= E.ANIM_CAP ? "bad" : l ? "" : "good"); }).join("")}</div></section>`;
    } else {
      inner = `<section class="psec"><h3>現場の記録</h3><div class="log">${s.log.slice(0, 60).map((l) => `<p class="${l.tone}"><span class="w">${stamp(l.t)}</span>${esc(l.text)}</p>`).join("")}</div></section>`;
    }
    const a = E.airStatus(s);
    const body = oh("モニター", "あなたのモニター", `${esc(a.main)}${a.sub ? ` ・ ${esc(a.sub)}` : ""}`, "", false) + mut(E.hint(s)) + tabs + inner;
    return pane(body, foot("モニター", "", "話数を押すと、その話数のくわしい状況。指示は進行を押して出す。"));
  }
  function panePhone() {
    const body = oh("スマホ", "あなたのスマホ", `未読 ${s.phone.filter((m) => !m.read).length}件`)
      + (s.phone.length ? `<div class="msgs">${s.phone.slice(0, 20).map((m) => `<div class="msg ${m.tone}"><small>${stamp(m.t)} ・ ${esc(m.from)}</small>${esc(m.text)}</div>`).join("")}</div>` : `<p class="note2">まだ何も来ていない。</p>`);
    return pane(body, foot("スマホ", "", "原画マンがカットを返してくると、その話数の空きが増える。営業で埋め直す。"));
  }
  function paneCar() {
    const by = s.car ? shOf(s.car) : null;
    const body = oh("社用車", "社用車（1台）", by ? `${by.name}が外回りで使用中 ・ あと 約${hrs(by.task.need - by.task.done)}` : "机の上にある。進行にドラッグすると外回りへ")
      + mut(by ? { tone: "mute", t: "戻るまで、ほかの進行は外回りに出せない" } : E.hint(s));
    const acts = s.shinko.map((x) => { const w = E.canOrder(s, x.id, "soto"); return act({ label: `${x.name}を外回りに出す`, sub: w || tagOf(x).t + (x.task && x.task.kind !== "rest" ? "（いまの作業はやめる）" : ""), cost: "1日", attrs: `data-act="order" data-v="soto" data-sid="${x.id}"`, disabled: !!w }); }).join("");
    return pane(body, foot("社用車", acts));
  }
  function paneHtml() {
    if (!ui.sel) ui.sel = { k: "monitor", id: "eps" };
    const { k, id } = ui.sel;
    if (k === "sh" && shOf(id)) return paneSh(shOf(id));
    if (k === "ep" && E.epOf(s, Number(id))) return paneEp(E.epOf(s, Number(id)));
    if (k === "phone") return panePhone();
    if (k === "car") return paneCar();
    if (k === "monitor") return paneMonitor();
    return "";
  }

  // ---------- dialogs ----------
  const dlg = (body, f) => `<div class="modal-bg"><div class="pane dlg" role="dialog" aria-modal="true" aria-labelledby="paneT"><div class="pane-b">${body}</div>${f}</div></div>`;
  const dh = (type, name, sub = "") => `<div class="oh"><div class="oh-top"><span class="typ">${esc(type)}</span></div><h2 id="paneT">${esc(name)}</h2>${sub ? `<span class="oh-sub">${sub}</span>` : ""}</div>`;
  function modalHtml() {
    if (ui.modal === "intro" || ui.modal === "help") {
      const intro = ui.modal === "intro";
      return dlg(dh("遊び方", intro ? "進行RTS（試作）" : "遊び方", "制作デスクの席から、制作進行3人に指示を出す。1週間＝120秒。")
        + `<section class="psec" style="border:0;padding:0"><ul>
          <li>全12話。1話のスケジュールは<b>4週</b>（炎上中）。毎週1話ずつコンテが上がり、4週後に放送される。</li>
          <li>進行は<b>自分からは動かない</b>。仕事が終わると、報告の吹き出しを出して席で待つ（押すまで出たまま）。押すと吹き出しが消え、次の指示を出せる。待たせた時間はそのまま無駄になる。</li>
          <li>1話の流れ：<b>営業</b>でカット表を埋める → <b>作打ち</b>で原画が始まる → <b>外回り</b>で回収 → <b>発注表</b>があれば動画・仕上げへ → <b>香盤表</b>があれば撮影へ。<b>進行表</b>があると原画の進み具合が分かり、回収の取りこぼしがなくなる。</li>
          <li>社用車は<b>1台</b>。机の社用車を進行にドラッグすると外回りに出る（進行の詳細からも出せる）。</li>
          <li>夜、仕事のない進行は机で寝る。仕事をさせると体力が減り、へとへとになると遅くなる。</li>
          <li>スマホには原画マンから連絡が来る。カットを返されると、その話数の空きが増える。</li>
          <li>放送日に撮影が全部終わっていれば「完成」、85%以上なら「止め絵でしのぐ」、それ未満は「落とした」。</li>
        </ul></section>`,
        foot("この画面", act({ label: intro ? "はじめる" : "閉じる", sub: intro ? "第1週 月曜 9:00 から" : "Esc でも閉じる", attrs: `data-act="${intro ? "start" : "close"}"`, pri: true })));
    }
    if (ui.modal === "restart") {
      return dlg(dh("最初から", "最初からやり直しますか？", "いまの現場は消える。"),
        foot("この画面", act({ label: "最初からやり直す", attrs: `data-act="restart"`, pri: true }) + act({ label: "やめる", sub: "続ける", attrs: `data-act="close"` })));
    }
    if (s.phase === "weekEnd" && s.weekEnd) {
      const w = s.weekEnd, a = E.airStatus(s);
      const airedNow = w.aired.map((n) => E.epOf(s, n));
      const airedHtml = airedNow.map((e) => `<div class="said"><small>第${e.n}話 放送</small><b>${esc(e.result.label)}</b>（撮影 ${e.shot}/${e.cuts}）</div>`).join("");
      const live = E.live(s).sort((x, y) => x.air - y.air);
      const body = dh("1週間おわり", `第${w.week}週 おわり`, `次は第${w.week + 1}週`)
        + airedHtml
        + `<div class="big ${a.airing ? "on" : ""}">${esc(a.main)}</div>${a.sub ? `<p class="note2">${esc(a.sub)}</p>` : ""}`
        + `<section class="psec"><h3>制作中の話数</h3><div class="rows">${live.map((e) => { const m = E.epMut(s, e); return row(`第${e.n}話 ・ 放送まで${daysTo(e.air)}`, esc(m.t), m.tone === "bad" ? "bad" : m.tone === "good" ? "good" : ""); }).join("")}</div></section>`;
      return dlg(body, foot("この画面", act({ label: `第${w.week + 1}週へ`, sub: live.some((e) => e.n === w.week + 1) ? `第${w.week + 1}話のコンテが上がった` : "", attrs: `data-act="nextWeek"`, pri: true })));
    }
    if (s.phase === "end" && s.result) {
      const r = s.result;
      const m = r.rank === "S" ? { tone: "good", t: "全話、落とさずに走りきった" } : r.rank === "A" ? { tone: "good", t: "なんとか形になった" } : r.rank === "B" ? { tone: "ok", t: "傷だらけだが、最後まで放送した" } : { tone: "bad", t: "落としすぎた・・・" };
      const body = dh("放送終了", "全12話 放送終了", `完成 ${r.full}話 ・ 止め絵 ${r.still}話 ・ 落とした ${r.drop}話`)
        + `<div style="display:flex;align-items:center;gap:16px"><span class="rank">${esc(r.rank)}</span><span class="note2">指示 ${r.orders}回 ・ 白紙 ${r.blank}カット ・ 返されたカット ${r.drops}回</span></div>`
        + mut(m)
        + `<section class="psec"><h3>各話</h3><div class="rows">${s.eps.map((e) => row(`第${e.n}話`, `${esc(e.result.label)}（${e.shot}/${e.cuts}）`, e.result.tone)).join("")}</div></section>`;
      return dlg(body, foot("この画面", act({ label: "もう一度", sub: "別の現場で最初から", attrs: `data-act="restart"`, pri: true })));
    }
    return "";
  }

  // ---------- rendering ----------
  const cache = {};
  function put(id, html) {
    if (cache[id] === html) return;
    const el = document.getElementById(id), ae = document.activeElement;
    let key = null;
    if (ae && el.contains(ae) && ae.dataset && ae.dataset.act) key = ["act", "v", "k", "sid"].map((k) => ae.dataset[k] || "").join("|");
    const scroll = el.querySelector(".pane") ? el.querySelector(".pane").scrollTop : 0;
    cache[id] = html;
    el.innerHTML = html;
    const p = el.querySelector(".pane"); if (p) p.scrollTop = scroll;
    if (key) { const again = [...el.querySelectorAll("[data-act]")].find((x) => ["act", "v", "k", "sid"].map((k) => x.dataset[k] || "").join("|") === key); if (again && !again.disabled) again.focus({ preventScroll: true }); }
  }
  function render() {
    if (!s || pressing || dragging) return;
    drawScene();
    put("hud", hud());
    put("ov", overlay());
    put("ovb", bubbles());
    put("bar2", bar2());
    put("dock", paneHtml());
    put("modal-root", modalHtml());
    layout();
  }
  function layout() {
    const box = document.getElementById("box"), stage = document.getElementById("stage"), dock = document.getElementById("dock");
    const W = document.getElementById("wrap").clientWidth, wide = window.innerWidth >= 1100;
    const avail = wide ? Math.max(320, window.innerHeight - document.getElementById("hud").offsetHeight - document.getElementById("bar2").offsetHeight - 36) : 9999;
    const k = Math.min(W / 1440, avail / 900);
    stage.style.transform = `scale(${k})`;
    box.style.width = `${Math.round(1440 * k)}px`; box.style.height = `${Math.round(900 * k)}px`;
    const p = dock.querySelector(".pane");
    if (p) p.style.maxHeight = wide ? `${Math.max(400, window.innerHeight - document.getElementById("hud").offsetHeight - 36)}px` : "";
  }
  function toast(text) {
    const t = document.getElementById("toast");
    t.innerHTML = `<div class="toast" role="status">${esc(text)}</div>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.innerHTML = ""; }, 2600);
  }

  // ---------- time ----------
  let last = performance.now(), acc = 0, lastRender = 0, lastSave = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (s && s.phase === "play" && !ui.paused && !ui.modal) {
      acc += dt * MIN_PER_SEC * ui.speed;
      const n = Math.floor(acc);
      if (n > 0) {
        acc -= n;
        const before = s.shinko.map((x) => !!x.report);
        E.tick(s, n);
        if (s.phase !== "play") { save(); render(); }
        else if (s.shinko.some((x, i) => x.report && !before[i])) render();
      }
    }
    if (now - lastRender > 200) { lastRender = now; render(); }
    if (now - lastSave > 3000) { lastSave = now; save(); }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function select(k, id, extra) {
    ui.sel = { k, id };
    if (k === "sh") {
      const sh = shOf(id);
      if (sh.report) { sh.lastReport = sh.report.text; E.ack(s, id); }
      if (extra && extra.ep) ui.epSel = Number(extra.ep);
    }
    if (k === "phone") s.phone.forEach((m) => (m.read = true));
    if (k === "monitor" && id) ui.tab = id;
    save(); render();
    if (window.innerWidth < 1100 && k !== "monitor") document.getElementById("dock").scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  function doAct(el) {
    const a = el.dataset.act, v = el.dataset.v;
    if (a === "sel") return select(el.dataset.k, v, { ep: el.dataset.ep });
    if (a === "close") { if (ui.modal) { ui.modal = null; } else ui.sel = { k: "monitor", id: "eps" }; save(); return render(); }
    if (a === "pause") { if (ui.modal || s.phase !== "play") return; ui.paused = !ui.paused; return render(); }
    if (a === "speed") { ui.speed = ui.speed === 2 ? 1 : 2; return render(); }
    if (a === "help") { ui.modal = "help"; return render(); }
    if (a === "start") { ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "restartAsk") { ui.modal = "restart"; return render(); }
    if (a === "restart") { fresh(1 + Math.floor(Math.random() * 100000)); ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "nextWeek") { E.nextWeek(s); save(); return render(); }
    if (a === "epSel") { ui.epSel = Number(v); return render(); }
    if (a === "tab") { ui.tab = v; return render(); }
    if (a === "order") {
      const sid = el.dataset.sid || (ui.sel && ui.sel.k === "sh" ? ui.sel.id : null);
      if (!sid) return;
      const ok = E.order(s, sid, v, E.TASK[v].ep ? ui.epSel : null);
      if (ok) { const sh = shOf(sid); sh.lastReport = null; toast(`${sh.name}：「${taskName(sh.task)}」に取りかかった`); if (ui.sel && ui.sel.k !== "sh") ui.sel = { k: "sh", id: sid }; }
      save(); return render();
    }
    if (a === "cancel") { if (ui.sel && ui.sel.k === "sh") E.cancel(s, ui.sel.id); save(); return render(); }
    if (a === "car") { toast("社用車は、外回りに出す進行までドラッグする"); return select("car", "car"); }
  }
  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el) return;
    pressing = true;
    if (el.dataset.car && s.phase === "play" && !ui.modal) {
      dragging = { x0: ev.clientX, y0: ev.clientY, moved: false, id: ev.pointerId };
      try { el.setPointerCapture(ev.pointerId); } catch (e) { /* fine */ }
    }
  });
  function stagePoint(ev) {
    const r = document.getElementById("box").getBoundingClientRect(), k = r.width / 1440;
    return { x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k };
  }
  function zoneAt(p) { return s.shinko.find((sh) => Math.abs(p.x - SEAT[sh.id] * 4) <= 100 && p.y >= 180 && p.y <= 590); }
  document.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    if (!dragging.moved && Math.hypot(ev.clientX - dragging.x0, ev.clientY - dragging.y0) < 6) return;
    dragging.moved = true;
    const p = stagePoint(ev), g = document.getElementById("ghost");
    g.style.display = "block"; g.style.left = `${p.x - 60}px`; g.style.top = `${p.y - 36}px`;
    const z = zoneAt(p);
    document.querySelectorAll(".zone").forEach((el) => { el.classList.remove("drop", "nodrop"); if (z && el.dataset.zone === z.id) el.classList.add(E.canOrder(s, z.id, "soto") ? "nodrop" : "drop"); });
  });
  document.addEventListener("pointerup", (ev) => {
    if (dragging) {
      const d = dragging; dragging = null;
      document.getElementById("ghost").style.display = "none";
      if (d.moved) {
        const z = zoneAt(stagePoint(ev));
        if (z) {
          const why = E.canOrder(s, z.id, "soto");
          if (why) toast(`${z.name}は外回りに出せない：${why}`);
          else { E.order(s, z.id, "soto"); z.lastReport = null; toast(`${z.name}：外回りに出た（社用車）`); ui.sel = { k: "sh", id: z.id }; save(); }
        }
        pressing = false;
        render();
        ev.preventDefault();
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 0); // only the click that belongs to this drop
        return;
      }
    }
    setTimeout(() => { pressing = false; }, 0);
  });
  let suppressClick = false;
  document.addEventListener("pointercancel", () => { pressing = false; dragging = null; document.getElementById("ghost").style.display = "none"; });
  document.addEventListener("click", (ev) => {
    if (suppressClick) { suppressClick = false; return; }
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    pressing = false;
    doAct(el);
  });
  document.addEventListener("keydown", (ev) => {
    if (!s) return;
    if (ev.key === "Escape") { if (ui.modal === "intro") { ui.modal = null; ui.paused = false; } else if (ui.modal === "help" || ui.modal === "restart") ui.modal = null; else if (!ui.modal) ui.sel = { k: "monitor", id: "eps" }; render(); return; }
    if (ui.modal) return;
    if (ev.key === " ") { ev.preventDefault(); if (!ev.repeat && s.phase === "play") { ui.paused = !ui.paused; render(); } }
    if (["1", "2", "3"].includes(ev.key)) select("sh", s.shinko[Number(ev.key) - 1].id);
  });
  document.addEventListener("keyup", (ev) => { if (ev.key === " " && !ui.modal) ev.preventDefault(); });
  window.addEventListener("resize", layout);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  document.getElementById("scene").innerHTML = sceneSvg();
  if (!load()) fresh(1 + Math.floor(Math.random() * 100000));
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
