<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行RTS 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* Same layout rules as 深夜アニメP: collections on the left, the selected object's detail on the right,
     and what you can do with it at the bottom of the detail. The town map sits in between. */
  :root {
    --night: #12151f; --desk: #1c2130; --desk-2: #262c40; --line: #2a3146; --line-2: #323a52;
    --on: #e8eaf1; --on-soft: #a1a9be;
    --paper: #f4f2ec; --card: #ffffff; --rule: #dcd8cc; --ink: #1a1c24; --ink-soft: #5a6072; --chip: #e3dfd3;
    --marker: #ffe14a; --marker-d: #b89e1e;
    --red: #c8323a; --red-d: #e5484d; --red-l: #ff9a9d;
    --green: #167a4d; --green-d: #1f9d63; --green-l: #8fe0b5;
    --amber: #e0b400; --teal: #1f7f7f; --pink: #ff5fa2; --gross: #8a93ab;
    --s1: #ff9f43; --s2: #4fc3f7; --s3: #c792ea;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--on); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1440px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; margin: 0; }
  button, select { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }

  /* header: brand | the clock and its one action | system */
  .hdr { min-height: 64px; box-sizing: border-box; padding: 8px 24px; display: flex; align-items: center; gap: 12px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--night); position: sticky; top: 0; z-index: 10; }
  .brand { width: 248px; display: grid; line-height: 1.3; }
  .brand b { font-family: var(--font-pixel); font-weight: 400; font-size: 18px; }
  .brand span { font-size: 12px; color: var(--on-soft); }
  .wk { display: flex; align-items: center; gap: 12px 16px; padding-left: 24px; border-left: 1px solid var(--line); min-height: 44px; flex-wrap: wrap; }
  .clock { font-family: var(--font-pixel); font-size: 24px; line-height: 1.1; color: var(--marker); white-space: nowrap; }
  .clock small { font-size: 12px; color: var(--on-soft); margin-left: 8px; }
  .dl { font-size: 12px; color: var(--on-soft); white-space: nowrap; }
  .dl b { color: var(--on); font-weight: 700; }
  .hdr-r { margin-left: auto; display: flex; gap: 8px; }
  .btn-main { min-height: 44px; padding: 0 20px; font-family: var(--font-pixel); font-size: 16px; background: var(--marker); color: var(--night); border: 0; border-radius: 4px; box-shadow: 0 3px 0 var(--marker-d); white-space: nowrap; }
  .btn-main:hover { background: #ffe97a; }
  .btn-main.ring { background: var(--red-d); color: #fff; box-shadow: 0 3px 0 #8f1f25; }
  .btn-sys { min-height: 44px; padding: 0 14px; background: transparent; color: var(--on); border: 1px solid var(--line-2); border-radius: 4px; white-space: nowrap; }
  .btn-sys:hover { border-color: var(--on-soft); }
  .speed { display: flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
  .speed button { min-height: 44px; min-width: 52px; padding: 0 10px; background: transparent; border: 0; color: var(--on-soft); font-size: 13px; }
  .speed button + button { border-left: 1px solid var(--line-2); }
  .speed button.on { background: var(--desk-2); color: var(--marker); }

  /* body: collections | town | detail */
  .main { display: grid; grid-template-columns: 272px minmax(0, 1fr) 392px; grid-template-areas: "list map pane"; gap: 16px; padding: 16px 24px 32px; align-items: start; }
  #list { grid-area: list; } #mapw { grid-area: map; } #pane { grid-area: pane; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .sec-h { display: flex; align-items: center; gap: 12px; min-height: 20px; }
  .sec-h h2 { font-size: 13px; color: var(--on-soft); }
  .note { font-size: 12px; color: var(--on-soft); margin: 0; }
  .li { min-height: 48px; width: 100%; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; text-align: left; background: var(--desk); color: var(--on); border: 0; border-radius: 4px; padding: 4px 10px 4px 0; overflow: hidden; }
  .li:hover { background: #232940; }
  .li.on { background: var(--desk-2); box-shadow: 0 0 0 2px var(--marker); }
  .li > i { align-self: stretch; margin: -4px 0; background: var(--c, var(--gross)); }
  .li .t { display: block; font-weight: 700; font-size: 13px; }
  .li .s { display: block; font-size: 12px; color: var(--on-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .r { font-family: var(--font-pixel); font-size: 12px; white-space: nowrap; }
  .li .chev { color: var(--on-soft); }
  .li.ringing { box-shadow: inset 0 0 0 1.5px var(--red-d); }
  .li.ringing.on { box-shadow: 0 0 0 2px var(--marker); }

  /* the town */
  .mapw { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .map { position: relative; width: 100%; aspect-ratio: 100 / 64; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line-2); background: #1a2233; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
  .map .road { stroke: #2b3550; stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .map text { font-family: var(--font-body); font-size: 2.5px; fill: var(--on); pointer-events: none; }
  .map text.sm { font-size: 2.1px; fill: var(--on-soft); }
  .map .nd { cursor: pointer; }
  .map .nd .hit { fill: transparent; }
  .map .nd:hover .shape, .map .nd:focus-visible .shape { stroke: var(--on); }
  .map .nd.on .shape { stroke: var(--marker); stroke-width: .8; }
  .map .car { cursor: pointer; }
  .map .car text { font-size: 2.2px; fill: var(--night); font-weight: 700; }
  .map .car .ring { fill: none; stroke: var(--red-d); stroke-width: .7; opacity: 0; }
  .map .car.calling .ring { opacity: 1; }
  .map .car.on .body { stroke: var(--marker); stroke-width: .7; }
  .map .route { stroke-width: .45; stroke-dasharray: 1.2 1; fill: none; opacity: .8; }
  .feed .log { max-height: none; }
  .feed .log p { margin: 0; font-size: 12.5px; color: var(--on); }
  .feed .log p.warn { color: var(--marker); } .feed .log p.bad { color: var(--red-l); } .feed .log p.good { color: var(--green-l); }
  .feed .log .w { font-family: var(--font-pixel); color: var(--on-soft); margin-right: 6px; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: var(--on-soft); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    .map .car.calling .ring { animation: ring 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
    .btn-main.ring { animation: shake 1.2s ease-in-out infinite; }
    @keyframes shake { 0%, 70%, 100% { transform: none; } 75% { transform: translateX(-2px); } 85% { transform: translateX(2px); } }
  }

  /* tags */
  .tag { font-family: var(--font-pixel); font-size: 12px; padding: 0 8px; border-radius: 2px; white-space: nowrap; background: var(--chip); color: var(--ink); }
  .tag.bad { background: var(--red); color: #fff; }
  .tag.warn { background: var(--marker); color: var(--ink); }
  .tag.ok { background: #d6f2e4; color: #11633c; }

  /* the detail of the selected object */
  .pane { background: var(--paper); color: var(--ink); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 0 0 2px var(--marker); min-width: 0; }
  .pane-b { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px; }
  .pane-f { margin-top: 16px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
  .pane-f > .lbl { font-size: 11px; color: var(--ink-soft); }
  .pane .note { color: var(--ink-soft); }
  .oh { display: flex; flex-direction: column; gap: 4px; }
  .oh-top { display: flex; align-items: center; gap: 8px; }
  .oh-top .tag:last-child { margin-left: auto; }
  .typ { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 6px; border-radius: 2px; }
  .oh h2 { font-size: 22px; line-height: 1.3; }
  .oh-sub { font-size: 12px; color: var(--ink-soft); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--card); border-radius: 4px; padding: 8px 10px; min-width: 0; }
  .tile .l { font-size: 11px; color: var(--ink-soft); }
  .tile .v { font-family: var(--font-pixel); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.bad { box-shadow: inset 0 0 0 1.5px var(--red); }
  .tile.bad .l, .tile.bad .v { color: var(--red); }
  .tile.good { box-shadow: inset 0 0 0 1.5px var(--green); }
  .tile.good .l, .tile.good .v { color: var(--green); }
  .mut { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
  .me { width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--font-pixel); font-size: 11px; }
  .mut-b { background: var(--card); border-radius: 4px; padding: 8px 12px; box-shadow: inset 4px 0 0 var(--tone, var(--gross)); }
  .mut-b .l { font-size: 11px; color: var(--ink-soft); }
  .mut-b .t { font-size: 15px; font-weight: 700; }
  .tone-good { --tone: var(--green); } .tone-ok { --tone: var(--teal); } .tone-worry { --tone: var(--amber); } .tone-bad { --tone: var(--red); } .tone-mute { --tone: var(--gross); }
  .psec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .psec h3 { font-size: 14px; }
  .psec p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .rows { display: flex; flex-direction: column; }
  .row { min-height: 34px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; border-bottom: 1px dashed var(--rule); }
  .row .v { font-weight: 700; text-align: right; }
  .row .v small { font-weight: 400; color: var(--ink-soft); margin-left: 4px; }
  .row .v.bad { color: var(--red); } .row .v.good { color: var(--green); } .row .v.mute { color: var(--ink-soft); }
  .speech { background: var(--card); border-radius: 4px; padding: 10px 12px; font-size: 15px; margin: 0; color: var(--ink); }
  .who { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
  .who .ico { width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; background: var(--c); color: var(--night); font-family: var(--font-pixel); font-size: 16px; }
  .who .w { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .who .w b { color: var(--ink); }
  .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .acts.one { grid-template-columns: minmax(0, 1fr); }
  .act { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 4px; text-align: left; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .act.pri { background: var(--ink); color: var(--paper); }
  .act:hover:not(:disabled) { box-shadow: 0 2px 0 var(--ink); }
  .act:disabled { color: #6f7484; border: 1.5px dashed #b9b4a6; background: transparent; }
  .act .m { display: grid; line-height: 1.35; }
  .act .m small { font-size: 11.5px; font-weight: 400; }
  .act .m b { font-weight: 700; }
  .cost { font-family: var(--font-pixel); font-size: 11px; padding: 0 6px; border-radius: 2px; white-space: nowrap; background: var(--chip); color: var(--ink); }
  .act.pri .cost { background: #3a4158; color: var(--on); }
  .pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pick button { min-height: 48px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--card); color: var(--ink); display: grid; align-content: center; padding: 2px 6px; box-shadow: inset 4px 0 0 var(--c); }
  .pick button small { font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick button.on { background: var(--ink); color: var(--paper); }
  .pick button.on small { color: #c9cedc; }
  .step { display: grid; grid-template-columns: 44px 1fr 44px; height: 44px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--card); max-width: 220px; }
  .step button { border: 0; background: var(--chip); color: var(--ink); font-size: 18px; }
  .step button:disabled { opacity: .35; }
  .step span { display: grid; place-items: center; font-family: var(--font-pixel); }
  .field { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12.5px; }
  .field > span { color: var(--ink-soft); }
  .field select { min-height: 44px; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--card); color: var(--ink); color-scheme: light; min-width: 0; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; min-height: 44px; font-size: 12.5px; color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .log { font-size: 12.5px; display: grid; gap: 4px; max-height: 240px; overflow-y: auto; }
  .log p { margin: 0; color: var(--ink); }
  .log p.warn { color: #8a5a00; } .log p.bad { color: var(--red); } .log p.good { color: var(--green); }
  .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; white-space: nowrap; }

  /* dialogs use the same paper */
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 10, 18, .78); display: grid; place-items: center; padding: 16px; z-index: 20; overflow-y: auto; }
  .dlg { width: min(560px, 100%); }
  .dlg ul { margin: 0; padding-left: 20px; font-size: 13px; display: grid; gap: 6px; }
  .big { font-family: var(--font-pixel); font-size: 56px; line-height: 1; }

  @media (max-width: 1180px) {
    .main { grid-template-columns: 260px minmax(0, 1fr); grid-template-areas: "list map" "list pane"; }
  }
  @media (max-width: 760px) {
    .hdr { padding: 8px 16px; gap: 8px 12px; }
    .brand { display: none; }
    .wk { display: contents; }
    .wk > div:first-child { flex: 1 1 auto; min-width: 0; }
    .speed { order: 3; }
    .hdr-r { margin-left: auto; order: 4; }
    .hdr-r .btn-sys { padding: 0 10px; }
    .hdr { flex-wrap: wrap; }
    .main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "list" "pane"; padding: 12px 16px 32px; }
    .map text { font-size: 3px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  }
  @media (max-width: 400px) {
    .acts { grid-template-columns: minmax(0, 1fr); }
    .speed button { min-width: 44px; }
    .clock { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr"></header>
  <div class="main">
    <div class="col" id="list"></div>
    <div class="mapw" id="mapw">
      <div class="map" id="map">
        <svg viewBox="0 0 100 64" role="group" aria-label="街の地図">
          <rect id="sky" x="0" y="0" width="100" height="64" fill="#1a2233"></rect>
          <path class="road" d="M0 34 H100 M47 0 V64 M0 15 H100 M0 55 H100 M18 0 V64 M78 0 V64"></path>
          <g id="mroutes"></g>
          <g id="mstatic"></g>
          <g id="mcars"></g>
        </svg>
      </div>
      <div class="legend" id="legend"></div>
      <section class="sec feed"><div class="sec-h"><h2>現場の記録</h2></div><div id="feed"></div></section>
    </div>
    <div id="pane"></div>
  </div>
  <div id="modal-root"></div>
</div>
<script id="engine">
const Engine = (() => {
  "use strict";
  // time is in game minutes from 1日目 0:00. One real second at 等速 is 10 minutes.
  const DAY = 1440, START = 9 * 60, DEADLINE = 7 * DAY + 18 * 60, RING = 90, BAGS = 24, CALLBUSY = 15;
  const SPEED = 0.9, ROAD = 1.25, SHOT = 240, STUDIO_CAP = 2, WORK = 0.55;
  const PLACES = [
    { id: "hq", kind: "hq", name: "本社", x: 47, y: 34 },
    { id: "studio", kind: "studio", name: "撮影スタジオ", x: 88, y: 55 },
    { id: "fam1", kind: "fam", name: "駅前のファミレス", x: 25, y: 25 },
    { id: "fam2", kind: "fam", name: "商店街の喫茶店", x: 66, y: 15 },
  ];
  // speed: hours of drawing per unit of difficulty. honesty: chance of not passing off an unfinished bag.
  const ANIMS = [
    { id: "a1", name: "高槻 透", x: 11, y: 11, rhythm: "night", speed: [7, 9], skill: [78, 88], honesty: [0.4, 0.6], wander: 0.5, fav: "fam1", busy: 0.1, known: true },
    { id: "a2", name: "三好 かおる", x: 28, y: 52, rhythm: "morning", speed: [8, 10], skill: [62, 72], honesty: [0.85, 0.95], wander: 0.1, fav: "fam1", busy: 0.05, known: true },
    { id: "a3", name: "芹沢 一馬", x: 8, y: 38, rhythm: "night", speed: [6, 8], skill: [70, 80], honesty: [0.3, 0.5], wander: 0.2, fav: "fam1", busy: 0.3, known: false },
    { id: "a4", name: "小野寺 ゆう", x: 57, y: 56, rhythm: "loose", speed: [8, 11], skill: [55, 68], honesty: [0.6, 0.8], wander: 0.4, fav: "fam2", busy: 0.1, known: false },
    { id: "a5", name: "柚木 瞳", x: 82, y: 31, rhythm: "morning", speed: [9, 11], skill: [80, 92], honesty: [0.8, 0.95], wander: 0.15, fav: "fam2", busy: 0.2, known: true },
    { id: "a6", name: "黒川 仁", x: 90, y: 9, rhythm: "night", speed: [6, 8], skill: [58, 70], honesty: [0.35, 0.55], wander: 0.3, fav: "fam2", busy: 0.15, known: false },
    { id: "a7", name: "日向 まどか", x: 42, y: 7, rhythm: "loose", speed: [7, 9], skill: [66, 76], honesty: [0.55, 0.75], wander: 0.55, fav: "fam2", busy: 0.05, known: false },
    { id: "a8", name: "塩見 直", x: 69, y: 42, rhythm: "morning", speed: [10, 12], skill: [50, 62], honesty: [0.9, 1], wander: 0.05, fav: "fam1", busy: 0, known: true },
  ];
  const SHINKO = [
    { id: "s1", name: "佐伯", rookie: true },
    { id: "s2", name: "川口", rookie: false },
    { id: "s3", name: "真壁", rookie: true },
  ];
  const RHY = { morning: "朝型", night: "夜型", loose: "不規則" };
  const BASE = { morning: 23.5 * 60, night: 5 * 60, loose: 2 * 60 }; // when sleep starts
  const STANDING = {
    absent: [["ask", "その都度電話する"], ["wait", "1時間待つ"], ["note", "置き手紙して次へ"]],
    blank: [["ask", "その都度電話する"], ["make", "描き上がるまで張りつく"], ["take", "そのまま持っていく"], ["leave", "置いて次へ"]],
    jam: [["ask", "その都度電話する"], ["bypass", "抜け道を行く"], ["go", "そのまま行く"]],
    limit: [["ask", "その都度電話する"], ["rest", "帰って寝る"], ["push", "もう少し頑張る"]],
  };
  const DEFAULT = { rookie: { absent: "wait", blank: "take", jam: "go", limit: "push" }, vet: { absent: "note", blank: "make", jam: "bypass", limit: "rest" } };

  function rnd(s) {
    let a = (s.r = (s.r + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    let text;
    const loc = locOf(s, a);
    if (asleep(s, a)) text = `${a.name}さんは電話に出ない。寝ているのかもしれない。`;
    else if (loc === "other" && rnd(s) < 0.5) text = `${a.name}さんは電話に出ない。`;
    else {
      k.phoned = s.t; k.pview = {}; k.rhythm = true;
      const bs = animBags(s, a);
      bs.forEach((b) => (k.pview[b.id] = Math.min(1, b.prog + (1 - a.honesty) * 0.6 * rnd(s))));
      const avg = bs.length ? bs.reduce((t, b) => t + k.pview[b.id], 0) / bs.length : 0;
      const where = loc === "other" ? "今は別の現場に詰めてます。" : loc !== "home" ? `今、${node(s, loc).name}です。` : "";
      if (loc === "other") { const w = workOf(s, a); k.awayUntil = (w ? w.st : s.t) + 660; }
      if (loc === "fam1" || loc === "fam2") k.fav = true;
      text = `${a.name}さん「${where}${!bs.length ? "うちにはもう袋はないですよ" : avg >= 0.95 ? "上がってます、取りに来てください" : avg >= 0.6 ? "もうすぐ上がります" : avg >= 0.25 ? "半分くらいですね" : "これから描きます"}」`;
    }
    log(s, `あなたが電話：${text}`);
    return text;
  }
  function expire(s) {
    for (const c of s.calls) {
      if (c.state !== "ring" || s.t < c.until) continue;
      const sh = shOf(s, c.sid);
      let k = DEFAULT[sh.rookie ? "rookie" : "vet"][c.type];
      if (!okChoice(s, c, k)) k = choicesOf(s, c).find((x) => x.ok).k;
      s.stats.missed++;
      apply(s, c, k, "missed");
    }
    flushAfter(s);
  }

  // ---------- orders ----------
  function canOrder(s, sid, kind, aid) {
    const sh = shOf(s, sid);
    if (s.phase !== "play") return "現場は終わった";
    if (sh.status === "call") return "電話の返事待ち";
    if (kind === "hatchu" && !carryNew(s, sh).length && !hqBags(s).length) return "渡せる袋がない";
    if ((kind === "kaishu" || kind === "hari") && !animBags(s, anim(s, aid)).length) return "預けている袋がない";
    if (kind === "hikiage" && !animBags(s, anim(s, aid)).some((b) => b.prog < 1)) return "描きかけの袋がない";
    if (kind === "deliver" && !carryUp(s, sh).length) return "上がりの袋を持っていない";
    if (kind === "cancel" && !sh.steps.length) return "いまは用事がない";
    if (kind === "rest" && sh.status === "rest") return "もう休んでいる";
    return "";
  }
  function order(s, sid, kind, aid, n = 2) {
    if (canOrder(s, sid, kind, aid)) return false;
    const sh = shOf(s, sid), a = aid ? anim(s, aid) : null;
    const go = (to, g) => ({ k: "go", to, g });
    if (kind === "hatchu") {
      const st = [];
      if (carryNew(s, sh).length < n && hqBags(s).length) st.push(go("hq", "pick"), { k: "pick", n, g: "pick" });
      st.push(go(a.home, "visit"), { k: "give", aid, n, g: "visit" });
      sh.steps = st;
    } else if (kind === "kaishu") sh.steps = [go(a.home, "visit"), { k: "collect", aid, g: "visit" }, go("studio", "dlv"), { k: "drop", g: "dlv" }];
    else if (kind === "hari") sh.steps = [go(a.home, "visit"), { k: "meet", aid, g: "visit" }, { k: "wait", kind: "hari", aid, dur: 240, g: "visit" }, { k: "collect", aid, strict: true, g: "visit" }, go("studio", "dlv"), { k: "drop", g: "dlv" }];
    else if (kind === "hikiage") sh.steps = [go(a.home, "visit"), { k: "takeback", aid, g: "visit" }, go("hq", "back"), { k: "ret", g: "back" }];
    else if (kind === "deliver") sh.steps = [go("studio", "dlv"), { k: "drop", g: "dlv" }];
    else if (kind === "rest") sh.steps = [go("hq", "rest"), { k: "rest", g: "rest" }];
    else if (kind === "cancel") sh.steps = [];
    sh.status = sh.steps.length ? "move" : "idle";
    return true;
  }
  function setStanding(s, sid, type, k) {
    const sh = shOf(s, sid);
    if (STANDING[type] && STANDING[type].some(([v]) => v === k)) sh.standing[type] = k;
  }

  // ---------- what you can tell without looking ----------
  function viewOf(s, a, b) {
    const k = a.known, seen = k.seen != null && b.id in k.view, ph = k.phoned != null && b.id in k.pview;
    if (ph && (!seen || k.phoned > k.seen)) return { p: k.pview[b.id], src: "phone", t: k.phoned };
    if (seen) return { p: k.view[b.id], src: "seen", t: k.seen };
    return null;
  }
  const say = (tone, t) => ({ tone, t });
  function estimate(s) {
    if (s.phase !== "play") return null;
    const left = (DEADLINE - s.t) / DAY, hq = hqBags(s).length;
    if (hq === BAGS) return s.t > START + 180 ? say("bad", "まだ1袋も渡していない・・・") : say("mute", "まず原画マンに袋を撒かないと");
    let W = 0, unknown = 0;
    const load = {};
    for (const b of s.bags) if (b.at === "hq" || (b.at === "car" && !b.up)) W += b.diff * 8.5;
    for (const a of s.anims) {
      const bs = animBags(s, a);
      if (!bs.length) continue;
      let seenRest = 0, unseenRest = 0, last = null;
      for (const b of bs) {
        const v = viewOf(s, a, b);
        if (v) { seenRest += b.diff * 8.5 * (1 - v.p); last = Math.max(last || 0, v.t); } else { unseenRest += b.diff * 8.5; unknown++; }
      }
      // assume the drawing went on at the usual pace since you last knew
      const rest = (last == null ? 0 : Math.max(seenRest * 0.15, seenRest - ((s.t - last) / 60) * 0.27)) + unseenRest;
      load[a.id] = rest; W += rest;
    }
    const holders = Object.keys(load).length, eff = Math.min(8, holders + (hq ? 8 - holders : 0)) || 1;
    const maxLoad = Math.max(0, ...Object.values(load));
    const work = Math.max(W / (6.5 * eff), maxLoad / 6.5) + (W > 0 ? 0.4 : 0);
    const shots = s.bags.filter((b) => b.at !== "done").length;
    const r = Math.max(work, (shots * SHOT) / STUDIO_CAP / DAY) / Math.max(0.05, left);
    if (unknown > 6) return say("mute", "様子が分からない袋が多い・・・見に行かないと");
    if (r > 1.15) return say("bad", "このままじゃ落ちる・・・");
    if (r > 0.95) return say("worry", "ギリギリだ・・・");
    if (s.t > START + 3 * DAY && !s.bags.some((b) => b.at === "studio" || b.at === "done")) return say("worry", "撮影スタジオに何も入っていない・・・");
    if (r > 0.7) return say("ok", "このペースなら、なんとか");
    return say("good", "良い感じだ。余裕がある");
  }
  // your read of an absent animator, from what you know of them (never from what is true)
  function hintOf(s, c) {
    const sh = shOf(s, c.sid), a = anim(s, c.ctx.aid), k = a.known;
    if (k.awayUntil > s.t) return say("worry", "別の現場に缶詰めだと言っていた・・・");
    if (k.rhythm && a.rhythm === "loose") return say("mute", "生活が読めない人だ・・・");
    if (k.rhythm && asleep(s, a)) return say("ok", `${RHY[a.rhythm]}の人だ。この時間は寝ている・・・`);
    if (k.fav && workOf(s, a)) return say("ok", `この時間は${node(s, a.fav).name}で描いていることがある`);
    if (sh.rookie) return say("mute", `${sh.name}はまだ新人だ。本当にいないのか・・・？`);
    return say("mute", "分からない。あまり知らない人だ");
  }

  function result(s) {
    const done = s.bags.filter((b) => b.at === "done"), ok = done.length === BAGS;
    const avgQ = done.length ? Math.round(done.reduce((t, b) => t + b.q, 0) / done.length) : 0;
    const rank = !ok ? "落" : avgQ >= 80 ? "S" : avgQ >= 72 ? "A" : avgQ >= 64 ? "B" : "C";
    return { ok, avgQ, rank, done: done.length, at: s.t, blank: s.bags.filter((b) => b.blank && (b.at === "done" || b.at === "studio")).length, ...s.stats, minSta: Math.round(s.stats.minSta) };
  }
  function step(s) {
    s.t++;
    for (const a of s.anims) workAnim(s, a);
    workStudio(s);
    for (const sh of s.shinko) stepShinko(s, sh);
    flushAfter(s);
    expire(s);
    const all = s.bags.every((b) => b.at === "done");
    if (all || s.t >= DEADLINE) {
      s.phase = "end"; s.result = result(s);
      log(s, all ? "全部の袋の撮影が終わった。納品！" : "納品の時間が来た。間に合わなかった。", all ? "good" : "bad");
    }
  }
  function tick(s, n) { for (let i = 0; i < n && s.phase === "play"; i++) step(s); }

  return { DAY, START, DEADLINE, RING, BAGS, CALLBUSY, RHY, STANDING, newGame, tick, order, canOrder, answer, choicesOf, callOut, setStanding, estimate, hintOf, viewOf,
    animBags, carryNew, carryUp, hqBags, travel, node, anim, shOf, asleep, locOf, workOf, result };
})();
if (typeof module !== "undefined") module.exports = Engine;
</script>
<script>
(() => {
  "use strict";
  const E = Engine;
  const SAVE_KEY = "animep.rts";
  const SPEEDS = { 1: 10, 2: 20, 4: 40 }; // game minutes per real second
  const KIND_NAME = { absent: "原画さんいません", blank: "袋の中が白紙", jam: "渋滞", limit: "もう限界" };
  const LINES = {
    absent: ["原画さんいません！ 何回押しても出てこないです！", "{a}さん、留守みたいです。どうします？"],
    blank: ["あの……上がりって言われた袋、半分白いんですけど……", "上がりって言われた袋、半分白紙です。"],
    jam: ["渋滞です！ 全然動かないです！", "道が詰まってます。1時間は遅れますね。"],
    limit: ["すいません……もう目が開かないです……", "そろそろ限界です。一回帰っていいですか。"],
  };
  const STATE_NAME = { ring: "鳴っている", done: "返事した", missed: "出られなかった", auto: "決まった返事" };
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let s = null;
  const ui = { speed: 1, paused: true, onRing: "slow", sel: { k: "hq", id: "hq" }, pick: null, n: 2, modal: null, seenCall: 0 };
  let pressing = false;

  // ---------- save ----------
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ s, ui: { speed: ui.speed, onRing: ui.onRing, sel: ui.sel, pick: ui.pick, n: ui.n, modal: ui.modal } })); } catch (e) { /* storage may be off */ }
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (d && d.s && d.s.v === 1 && d.s.shinko) { s = d.s; Object.assign(ui, d.ui || {}); ui.paused = true; ui.seenCall = s.callSeq; return true; }
    } catch (e) { /* broken save: start over */ }
    return false;
  }
  function fresh(seed) {
    s = E.newGame(seed);
    Object.assign(ui, { sel: { k: "hq", id: "hq" }, pick: null, paused: true, modal: "intro", seenCall: 0, speed: 1 });
    save();
  }

  // ---------- words ----------
  const pad = (n) => String(n).padStart(2, "0");
  const clock = (t) => `${Math.floor(t / E.DAY) + 1}日目 ${pad(Math.floor((t % E.DAY) / 60))}:${pad(t % 60)}`;
  function leftText() {
    const m = Math.max(0, E.DEADLINE - s.t), d = Math.floor(m / E.DAY), h = Math.floor((m % E.DAY) / 60);
    return d ? `${d}日と${h}時間` : `${h}時間${pad(m % 60)}分`;
  }
  function ago(t0) {
    const m = s.t - t0;
    return m < 60 ? "さっき" : m < E.DAY ? `${Math.floor(m / 60)}時間前` : `${Math.floor(m / E.DAY)}日前`;
  }
  const placeName = (id) => (id ? E.node(s, id).name : "路上");
  const animOf = (id) => E.anim(s, id);
  const shOf = (id) => E.shOf(s, id);
  const famName = (a) => a.name.split(" ")[0];
  const progWord = (p) => (p >= 1 ? "上がり" : p >= 0.7 ? "もうすぐ" : p >= 0.35 ? "半分くらい" : p > 0.02 ? "描きはじめ" : "手つかず");
  const diffWord = (d) => (d >= 2 ? "重い" : d >= 1.5 ? "ふつう" : "軽い");
  const skillWord = (q) => (q >= 80 ? "うまい" : q >= 66 ? "確か" : "荒い");
  function shortOf(c) {
    const sh = shOf(c.sid);
    if (c.type === "absent") return sh.rookie ? "原画さんいません！" : "留守みたいです";
    if (c.type === "blank") return "袋の中が白紙です";
    if (c.type === "jam") return "渋滞です";
    return "もう限界です";
  }
  function lineOf(c) {
    const sh = shOf(c.sid), a = c.ctx.aid ? animOf(c.ctx.aid) : null;
    return LINES[c.type][sh.rookie ? 0 : 1].replace("{a}", a ? famName(a) : "");
  }
  function statusOf(sh) {
    if (sh.status === "call") return "電話の返事待ち";
    const st = sh.steps[0];
    if (!st) return `待機中（${placeName(sh.node)}）`;
    if (st.k === "rest") return "本社で休憩中";
    if (st.k === "wait") return st.kind === "hari" ? `${famName(animOf(st.aid))}さんに張り込み中` : `${placeName(sh.node)}で待っている`;
    const next = sh.steps.find((x) => x.k !== "go");
    const why = !next ? "" : { pick: "袋を取りに", give: "発注", collect: "回収", meet: "張り込み", takeback: "引き上げ", drop: "届ける", rest: "休む", ret: "袋を戻す" }[next.k] || "";
    if (st.k === "go") return `${placeName(st.to)}へ移動中${why ? `（${why}）` : ""}`;
    return why;
  }
  const ringing = () => s.calls.filter((c) => c.state === "ring");
  const selIs = (k, id) => ui.sel.k === k && String(ui.sel.id) === String(id);
  function pickId() {
    if (ui.pick && shOf(ui.pick)) return ui.pick;
    const free = s.shinko.find((x) => x.status !== "call" && !x.steps.length);
    return (free || s.shinko[0]).id;
  }

  // ---------- parts every pane reuses ----------
  const tile = (l, v, cls = "") => `<div class="tile ${cls}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const tagHtml = (t, cls = "") => (t ? `<span class="tag ${cls}">${esc(t)}</span>` : "");
  const oh = (type, name, sub, tag = "") => `<div class="oh"><div class="oh-top"><span class="typ">${esc(type)}</span>${tag}</div><h2 id="paneT">${esc(name)}</h2>${sub ? `<span class="oh-sub">${sub}</span>` : ""}</div>`;
  const mut = (m, label = "あなたの見立て") => (m ? `<div class="mut"><span class="me" aria-hidden="true">あなた</span><div class="mut-b tone-${m.tone}"><div class="l">${label}</div><div class="t">${esc(m.t)}</div></div></div>` : "");
  function li({ c, t, sub = "", r = "", on = false, attrs = "", cls = "" }) {
    return `<button class="li ${on ? "on" : ""} ${cls}" style="--c:${c}" ${attrs}><i></i><span><span class="t">${t}</span>${sub ? `<span class="s">${sub}</span>` : ""}</span><span class="r">${r}</span><span class="chev" aria-hidden="true">›</span></button>`;
  }
  function act({ label, sub = "", cost = null, attrs = "", pri = false, disabled = false }) {
    return `<button class="act ${pri ? "pri" : ""}" ${attrs} ${disabled ? "disabled" : ""}><span class="m"><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>${cost ? `<span class="cost">${esc(cost)}</span>` : ""}</button>`;
  }
  const foot = (name, acts, note = "", one = false) => `<div class="pane-f"><span class="lbl">${esc(name)}にできること</span>${acts ? `<div class="acts ${one ? "one" : ""}">${acts}</div>` : ""}${note ? `<p class="note">${note}</p>` : ""}</div>`;
  const pane = (body, f) => `<aside class="pane" aria-labelledby="paneT"><div class="pane-b">${body}</div>${f}</aside>`;
  const row = (l, v, cls = "") => `<div class="row"><span>${l}</span><span class="v ${cls}">${v}</span></div>`;
  const logHtml = (n = 40) => `<div class="log">${s.log.slice(0, n).map((l) => `<p class="${l.tone}"><span class="w">${clock(l.t).replace("日目 ", "日 ")}</span>${esc(l.text)}</p>`).join("")}</div>`;

  // ---------- header ----------
  function header() {
    const r = ringing();
    const main = r.length
      ? `<button class="btn-main ring" data-act="main">電話に出る（${r.length}）</button>`
      : `<button class="btn-main" data-act="main">${s.phase !== "play" ? "結果を見る" : ui.paused ? "動かす" : "止める"}</button>`;
    const sp = [1, 2, 4].map((v) => `<button class="${ui.speed === v ? "on" : ""}" data-act="speed" data-v="${v}" aria-pressed="${ui.speed === v}">${v === 1 ? "等速" : v + "倍"}</button>`).join("");
    return `<div class="brand"><b>進行RTS</b><span>深夜アニメP ・ 小さな試作（1話だけ）</span></div>
      <div class="wk"><div><div class="clock">${clock(s.t)}${ui.paused && s.phase === "play" ? "<small>止めています</small>" : ""}</div><div class="dl">局納品（8日目 18:00）まで <b>${leftText()}</b></div></div>${main}<div class="speed" role="group" aria-label="時間の速さ">${sp}</div></div>
      <div class="hdr-r"><button class="btn-sys" data-act="help">遊び方</button><button class="btn-sys" data-act="restartAsk">最初から</button></div>`;
  }

  // ---------- collections ----------
  function list() {
    const r = ringing(), past = s.calls.filter((c) => c.state !== "ring").slice(0, 3);
    const callLi = (c) => li({
      c: c.state === "ring" ? "var(--red-d)" : "var(--gross)", t: `${shOf(c.sid).name}「${shortOf(c)}」`,
      sub: c.state === "ring" ? `鳴っている ・ あと${Math.max(0, c.until - s.t)}分` : `${STATE_NAME[c.state]} ・ ${ago(c.t0)}`,
      on: selIs("call", c.id), attrs: `data-act="sel" data-k="call" data-v="${c.id}"`, cls: c.state === "ring" ? "ringing" : "",
    });
    const calls = r.length || past.length ? r.concat(past).map(callLi).join("") : `<p class="note">まだ鳴っていない。</p>`;
    const sh = s.shinko.map((x) => li({ c: `var(--${x.id})`, t: `${x.name}${x.rookie ? "（新人）" : "（ベテラン）"}`, sub: statusOf(x), r: `体力${Math.round(x.sta)}`, on: selIs("sh", x.id), attrs: `data-act="sel" data-k="sh" data-v="${x.id}"`, cls: x.status === "call" ? "ringing" : "" })).join("");
    const an = s.anims.map((a) => {
      const bs = E.animBags(s, a), k = a.known;
      const vs = bs.map((b) => E.viewOf(s, a, b)).filter(Boolean);
      const best = vs.length ? Math.max(...vs.map((v) => v.p)) : null;
      const r2 = !bs.length ? "" : best == null ? "？" : progWord(best);
      return li({ c: !bs.length ? "var(--line-2)" : best >= 1 ? "var(--green-d)" : "var(--gross)", t: a.name, sub: `袋${bs.length} ・ ${k.seen != null ? `見たのは${ago(k.seen)}` : "まだ会っていない"}`, r: r2, on: selIs("anim", a.id), attrs: `data-act="sel" data-k="anim" data-v="${a.id}"` });
    }).join("");
    const done = s.bags.filter((b) => b.at === "done").length;
    const places = [
      li({ c: "var(--marker)", t: "本社（制作デスク）", sub: "あなたの席", r: `袋${E.hqBags(s).length}`, on: selIs("hq", "hq"), attrs: `data-act="sel" data-k="hq" data-v="hq"` }),
      li({ c: "var(--teal)", t: "撮影スタジオ", sub: "仕上げ・撮影", r: `${done}/${E.BAGS}`, on: selIs("studio", "studio"), attrs: `data-act="sel" data-k="studio" data-v="studio"` }),
      ...["fam1", "fam2"].map((f) => li({ c: "var(--amber)", t: E.node(s, f).name, sub: "原画マンの作業場になることがある", on: selIs("fam", f), attrs: `data-act="sel" data-k="fam" data-v="${f}"` })),
    ].join("");
    const sec = (h, body) => `<section class="sec"><div class="sec-h"><h2>${h}</h2></div>${body}</section>`;
    return sec(`電話${r.length ? `（${r.length}件 鳴っている）` : ""}`, calls) + sec("制作進行", sh) + sec("原画マン", an) + sec("場所", places);
  }

  // ---------- the town ----------
  function mapStatic() {
    const out = [];
    for (const n of s.nodes) {
      let shape = "", label = n.name, sub = "", k = n.kind;

  const dlg = (body, f) => `<div class="modal-bg"><div class="pane dlg" role="dialog" aria-modal="true" aria-labelledby="paneT"><div class="pane-b">${body}</div>${f}</div></div>`;
  function helpBody() {
    return `<section class="psec" style="border:0;padding:0"><ul>
      <li>原画の袋が${E.BAGS}。8人の原画マンに描いてもらい、上がった袋を撮影スタジオへ運ぶ。<b>8日目の18時</b>までに全部の撮影が終われば納品。</li>
      <li>動かせるのは制作進行の3人だけ。原画マンを選んで「発注」「回収」「張り込み」「引き上げ」を指示する。</li>
      <li>原画マンが本当にどこまで描いたかは、進行が会いに行くまで分からない。電話の「もうすぐ上がります」は当てにならない。</li>
      <li>原画マンには朝型・夜型がいる。寝ている時間に行っても出てこない。ファミレスや喫茶店で描いていることもある。</li>
      <li>進行から電話が来る。出て返事をする。出ないでいると、進行が自分で決める（新人は待ち続けがち）。よくある電話には、進行ごとに「決まった返事」を設定できる。</li>
      <li>操作：<b>スペース</b>で時間を止める・動かす。<b>1〜3</b>で進行を選ぶ。進行を選んだまま地図の原画マンを<b>右クリック</b>すると、回収（袋がなければ発注）。</li>
    </ul></section>`;
  }
  function modalHtml() {
    if (ui.modal === "intro" || ui.modal === "help") {
      const intro = ui.modal === "intro";
      return dlg(oh("遊び方", intro ? "進行RTS（小さな試作）" : "遊び方", "1話だけの現場。時間は流れ続ける。") + helpBody(),
        foot("この画面", act({ label: intro ? "はじめる" : "閉じる", sub: intro ? "1日目 9:00 から" : "Esc でも閉じる", attrs: `data-act="${intro ? "start" : "close"}"`, pri: true }), "", true));
    }
    if (ui.modal === "restart") {
      return dlg(oh("最初から", "最初からやり直しますか？", "いまの現場は消える。"),
        foot("この画面", act({ label: "同じ配置でやり直す", sub: "原画マンの性格・予定が同じ", attrs: `data-act="retry"`, pri: true }) + act({ label: "別の配置でやり直す", sub: "原画マンの予定が変わる", attrs: `data-act="restart"` }) + act({ label: "やめる", sub: "続ける", attrs: `data-act="close"` }), "", true));
    }
    if (ui.modal === "result" && s.result) {
      const r = s.result;
      const m = !r.ok ? { tone: "bad", t: "落とした・・・総集編だ" } : r.rank === "S" ? { tone: "good", t: "完璧だ。良い話数になった" } : r.rank === "A" ? { tone: "good", t: "良い感じに仕上がった" } : r.rank === "B" ? { tone: "ok", t: "なんとか形になった" } : { tone: "worry", t: "間に合ったが、出来は荒い・・・" };
      const body = oh("結果", r.ok ? "納品できた" : "落とした", `${clock(r.at)} ・ 撮影済み ${r.done}/${E.BAGS}`, tagHtml(r.ok ? "納品" : "落とした", r.ok ? "ok" : "bad"))
        + `<div style="display:flex;align-items:center;gap:16px"><span class="big">${esc(r.rank)}</span><span class="note" style="color:var(--ink-soft)">${r.ok ? `作画の出来 ${r.avgQ}` : "全部の撮影が終わらなかった"}</span></div>`
        + mut(m, "あなたの見立て（この話数）")
        + `<section class="psec"><h3>現場の記録</h3><div class="rows">${row("取った電話", `${r.calls - r.missed}本`)}${row("出られなかった電話", `${r.missed}本`, r.missed ? "bad" : "")}${row("決まった返事で済んだ電話", `${r.auto}本`)}${row("あなたからかけた電話", `${r.out}本`)}${row("白いところが残ったまま撮影に回った袋", `${r.blank}袋`, r.blank ? "bad" : "")}${row("倒れかけた進行", `${r.faint}回`, r.faint ? "bad" : "")}</div></section>`;
      return dlg(body, foot("この画面", act({ label: "同じ配置でもう一度", attrs: `data-act="retry"`, pri: true }) + act({ label: "別の配置で", attrs: `data-act="restart"` }) + act({ label: "現場を振り返る", sub: "結果を閉じて記録を見る", attrs: `data-act="close"` }), "", true));
    }
    return "";
  }

  // ---------- rendering ----------
  const cache = {};
  function put(id, html) {
    if (cache[id] === html) return;
    const el = document.getElementById(id);
    const ae = document.activeElement;
    if (ae && ae.tagName === "SELECT" && el.contains(ae)) return; // don't close an open menu
    let key = null;
    if (ae && el.contains(ae) && ae.dataset && ae.dataset.act) key = ["act", "v", "arg", "sid", "type", "k"].map((k) => ae.dataset[k] || "").join("|");
    cache[id] = html;
    el.innerHTML = html;
    if (key) {
      const again = [...el.querySelectorAll("[data-act]")].find((x) => ["act", "v", "arg", "sid", "type", "k"].map((k) => x.dataset[k] || "").join("|") === key);
      if (again && !again.disabled) again.focus({ preventScroll: true });
    }
  }
  function render() {
    if (pressing || !s) return;
    put("hdr", header());
    put("list", list());
    put("pane", paneHtml());
    put("mstatic", mapStatic());
    put("legend", legend());
    put("feed", `<div class="log">${s.log.slice(0, window.matchMedia("(max-width: 760px)").matches ? 5 : 10).map((l) => `<p class="${l.tone}"><span class="w">${clock(l.t).replace("日目 ", "日 ")}</span>${esc(l.text)}</p>`).join("")}</div>`);
    put("modal-root", modalHtml());
    drawCars();
  }

  // ---------- time ----------
  let last = performance.now(), acc = 0, lastRender = 0, lastSave = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (s && s.phase === "play" && !ui.paused && !ui.modal) {
      acc += dt * SPEEDS[ui.speed];
      const n = Math.floor(acc);
      if (n > 0) { acc -= n; E.tick(s, n); afterTick(); }
    }
    drawCars();
    if (now - lastRender > 200) { lastRender = now; render(); }
    if (now - lastSave > 3000) { lastSave = now; save(); }
    requestAnimationFrame(frame);
  }
  function afterTick() {
    if (s.callSeq > ui.seenCall) {
      const fresh = s.calls.filter((c) => c.id > ui.seenCall && c.state === "ring");
      ui.seenCall = s.callSeq;
      if (fresh.length) { if (ui.onRing === "pause") ui.paused = true; else if (ui.onRing === "slow") ui.speed = 1; }
    }
    if (s.phase !== "play") { ui.modal = "result"; ui.paused = true; save(); render(); }
  }

  // ---------- input ----------
  function select(k, id) {
    ui.sel = { k, id };
    if (k === "sh") ui.pick = id;
    render();
    if (window.matchMedia("(max-width: 760px)").matches) {
      const p = document.getElementById("pane");
      p.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }
  }
  function doAct(el, ev) {
    const a = el.dataset.act, v = el.dataset.v;
    if (a === "sel") return select(el.dataset.k, el.dataset.k === "call" ? Number(v) : v);
    if (a === "main") {
      if (s.phase !== "play") { ui.modal = "result"; return render(); }
      const r = ringing();
      if (r.length) { ui.sel = { k: "call", id: r[r.length - 1].id }; if (ui.onRing === "pause") ui.paused = true; return select("call", r[r.length - 1].id); }
      ui.paused = !ui.paused; return render();
    }
    if (a === "speed") { ui.speed = Number(v); ui.paused = false; return render(); }
    if (a === "pick") { ui.pick = v; return render(); }
    if (a === "n") { ui.n = Math.max(1, Math.min(4, ui.n + Number(v))); return render(); }
    if (a === "onRing") { ui.onRing = v; save(); return render(); }
    if (a === "order") {
      const sid = el.dataset.sid || pickId();
      E.order(s, sid, v, el.dataset.arg || null, ui.n);
      save(); return render();
    }
    if (a === "answer") { E.answer(s, Number(el.dataset.arg), v); save(); return render(); }
    if (a === "callOut") { E.callOut(s, v); save(); return render(); }
    if (a === "help") { ui.modal = "help"; return render(); }
    if (a === "start") { ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "close") { ui.modal = null; return render(); }
    if (a === "restartAsk") { ui.modal = "restart"; return render(); }
    if (a === "retry") { fresh(s.seed); ui.modal = null; ui.paused = false; save(); return render(); }
    if (a === "restart") { fresh((s.seed % 100000) + 1 + Math.floor(Math.random() * 1000)); ui.modal = null; ui.paused = false; save(); return render(); }
  }
  document.addEventListener("pointerdown", (ev) => { if (ev.target.closest && ev.target.closest("[data-act]")) pressing = true; });
  document.addEventListener("pointerup", () => { setTimeout(() => { pressing = false; }, 0); });
  document.addEventListener("pointercancel", () => { pressing = false; });
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el || el.disabled || el.tagName === "SELECT") return;
    pressing = false;
    doAct(el, ev);
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.act === "standing") { E.setStanding(s, el.dataset.sid, el.dataset.type, el.value); save(); el.blur(); render(); }
  });
  // right-click a place on the map with a 進行 selected: the obvious order for that place
  document.getElementById("map").addEventListener("contextmenu", (ev) => {
    const g = ev.target.closest && ev.target.closest("[data-node]");
    if (!g || ui.sel.k !== "sh" || !s || s.phase !== "play") return;
    ev.preventDefault();
    const sid = ui.sel.id, n = E.node(s, g.dataset.node);
    if (n.kind === "home") E.order(s, sid, E.animBags(s, animOf(n.aid)).length && !E.canOrder(s, sid, "kaishu", n.aid) ? "kaishu" : "hatchu", n.aid, ui.n);
    else if (n.kind === "studio") E.order(s, sid, "deliver");
    else if (n.kind === "hq") E.order(s, sid, "rest");
    save(); render();
  });
  document.addEventListener("keydown", (ev) => {
    if (!s) return;
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (ev.key === "Escape" && ui.modal) { if (ui.modal === "intro") { ui.modal = null; ui.paused = false; } else ui.modal = null; render(); return; }
    if (ui.modal || tag === "SELECT" || tag === "INPUT") return;
    if (ev.key === " " && tag !== "BUTTON") { ev.preventDefault(); if (s.phase === "play") { ui.paused = !ui.paused; render(); } }
    if (["1", "2", "3"].includes(ev.key)) select("sh", s.shinko[Number(ev.key) - 1].id);
  });
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  if (!load()) fresh(1 + Math.floor(Math.random() * 100000));
  if (s.phase !== "play" && s.result) ui.modal = "result";
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
