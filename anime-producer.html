          tools = pv.map((x) => `<button class="btn small" data-act="addAnim" data-v="${ep.n}" data-k="${x.k}" title="完パケ予測 W${x.fc}／品質 ${x.q}">原画マン ＋${x.k}人<span class="pv">W${x.fc}・品質${x.q}</span></button>`).join("");
        } else tools = `<span class="sub">原画はほぼ上がったので、もう人は足せません。</span>`;
        if (ep.anims.some((a) => a.hold > 0)) tools += `<button class="btn small" data-act="reassign" data-v="${ep.n}">連絡がつかない人のカットを配り直す</button>`;
      }
    }
    const helpBtn = sh ? (sh.gone ? `<button class="btn small" data-act="do" data-v="hireShinko" data-arg="${sh.id}" ${E.canAct(s, "hireShinko", sh.id) ? "" : "disabled"}>新しい進行を採用（行動1・50万円）</button>`
      : `<button class="btn small" data-act="do" data-v="help" data-arg="${sh.id}" ${E.canAct(s, "help", sh.id) ? "" : "disabled"}>${sh.helped ? "今週はヘルプ済み" : `${sh.name}のヘルプに入る（行動1）`}</button>`) : "";
    const fx = ep ? `=第${ep.n}話!完パケ予測 → ${ep.aired ? "放送済" : ep.delivered ? `W${ep.deliveredWeek}` : `W${E.epForecast(s, ep)}`}` : "";
    return `<div class="xls" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="xls-top"><span class="xls-file">${esc(title)}</span>
        ${sh ? `<span class="xls-who">進行 ${esc(sh.name)}　体力 ${stamBar(sh.stamina)} ${Math.round(sh.stamina)}${sh.gone ? '　<span class="tagx t-bad">連絡が取れない</span>' : ""}</span>` : ""}
        <button class="xls-x" data-act="closeModal" aria-label="閉じる">×</button></div>
      <div class="xls-tools">${tools}${helpBtn}</div>
      <div class="xls-fx"><span class="fxl">fx</span><span>${esc(fx)}</span></div>
      <div class="xls-grid"><table>
        <thead><tr><th class="rn"></th>${COLS.slice(0, 11).map((c) => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${info}${body}</tbody>
      </table></div>
      <div class="xls-tabs">${tabs.map((e) => `<button class="${e.n === xls.n ? "on" : ""}" data-act="xlsTab" data-v="${e.n}">#${e.n}${e.aired ? "（済）" : e.delivered ? "（納品）" : e.started ? "" : "（前）"}</button>`).join("") || `<span class="sub">シートがありません</span>`}</div>
    </div>`;
  }

  // ---------- settlement ----------
  function renderEnd() {
    const r = s.result, T = E.TIERS[s.tier];
    const best = store.get("animep.best") || {};
    const isBest = best[s.tier] == null || r.score > best[s.tier];
    if (isBest && !s.savedBest) { best[s.tier] = r.score; store.set("animep.best", best); s.savedBest = true; }
    const by = s.spentBy;
    const inh = s.eps.filter((e) => !E.isGross(e.plan)).length || 1;
    app.innerHTML = `
      <p class="step">${esc(T.studio)} ／「${esc(s.src.title)}」／ 決算</p>
      <div class="result">
        <section class="sheet row" style="justify-content:space-between;align-items:center">
          <div><h2>決算スコア</h2>
            <div class="score ${r.score >= 0 ? "pos" : "neg"}">${r.score >= 0 ? "+" : ""}${fmt(r.score)}</div>
            <p class="sub">人気 ${r.P.toFixed(0)} ／ 評判 ${Math.round(s.R)} ／ 期待値 ${Math.round(s.H)}${isBest ? " ／ ベスト更新" : ` ／ ベスト ${fmt(best[s.tier])}`}</p></div>
          <div class="rank" style="color:${r.rank === "S" || r.rank === "A" ? "var(--pink)" : "var(--ink)"}">${r.rank}</div>
        </section>
        <div class="split">
          <section class="sheet"><h3>委員会の売上</h3><table class="pl">
            ${r.rev.lines.map((l) => `<tr><td>${esc(l.k)}${l.fixed ? `（固定。変動なら${fmt(l.alt)}）` : ""}</td><td class="r">${fmt(l.v)}</td></tr>`).join("")}
            <tr class="total"><td>売上合計</td><td class="r">${fmt(r.rev.total)}</td></tr></table></section>
          <section class="sheet"><h3>自社の収支</h3><table class="pl">
            <tr><td>予算</td><td class="r">${fmt(s.B)}</td></tr>
            <tr><td>実際の制作費</td><td class="r">${fmt(-s.spent)}</td></tr>
            ${r.cutPay ? `<tr><td>未完成納品による減額</td><td class="r neg">${fmt(-r.cutPay)}</td></tr>` : ""}
            ${r.bdFix ? `<tr><td>円盤用の作画修正費</td><td class="r neg">${fmt(-r.bdFix)}</td></tr>` : ""}
            <tr><td>制作の収支</td><td class="r ${r.prodBalance >= 0 ? "pos" : "neg"}">${fmt(r.prodBalance)}</td></tr>
            <tr><td>売上の取り分（${(s.share * 100).toFixed(1)}%）</td><td class="r">${fmt(r.rev.total * s.share)}</td></tr>
            <tr><td>自社の出資</td><td class="r">${fmt(-s.own)}</td></tr>
            <tr><td>出資のリターン</td><td class="r ${r.invest >= 0 ? "pos" : "neg"}">${fmt(r.invest)}</td></tr>
            <tr class="total"><td>決算スコア</td><td class="r ${r.score >= 0 ? "pos" : "neg"}">${fmt(r.score)}</td></tr></table></section>
        </div>
        <section class="sheet"><h3>制作費の内訳</h3>
          <table class="pl"><thead><tr><th>費目</th><th class="r">サンプル（1話）</th><th class="r">見積もり（社内1話）</th><th class="r">実績（全話合計）</th></tr></thead><tbody>
            ${E.COST_LINES.map((l, i) => `<tr><td>${esc(l.label)}</td><td class="r">${yen(l.base)}</td><td class="r">${yen(s.estPerEp.lines[i].v)}</td><td class="r">${fmt(by[l.k] || 0)}</td></tr>`).join("")}
            <tr><td>制作会社の制作管理費用（15%）</td><td class="r">${yen(167.25)}</td><td class="r">${yen(s.estPerEp.kanri)}</td><td class="r">${fmt(by.kanri || 0)}</td></tr>
            <tr><td>グロス（協力会社への発注）</td><td class="r">—</td><td class="r">—</td><td class="r">${fmt(by.gross || 0)}</td></tr>
            <tr><td>宣伝費</td><td class="r">—</td><td class="r">—</td><td class="r">${fmt(by.promo || 0)}</td></tr>
            <tr class="total"><td>合計</td><td class="r">${yen(1282.25)}</td><td class="r">${yen(s.estPerEp.total)}</td><td class="r">${fmt(s.spent)}</td></tr>
          </tbody></table><p class="sub" style="margin:6px 0 0">社内の班 ${s.eps.filter((e) => !E.isGross(e.plan)).length}話・グロス ${s.eps.filter((e) => E.isGross(e.plan)).length}話。原画マンの追加 ${s.added}人。</p></section>
        <section class="sheet"><h3>全12話</h3>
          <div class="kvs">${Array.from({ length: E.EPISODES }, (_, i) => `<div class="kvbox"><span data-kv="${i + 1}"></span><span>#${i + 1} ${s.eps[i].airQ ?? ""}</span></div>`).join("")}</div>
          <p class="sub" style="margin-top:8px">総集編 ${s.recaps}回 ／ 放送延期 ${s.delays}回 ／ 作画崩壊 ${s.eps.filter((e) => e.collapse).length}回 ／ ヘルプ ${s.helpCount}回</p></section>
        <section class="sheet"><h3>結果をシェア</h3>
          <p id="shareText" style="white-space:pre-wrap;margin:0 0 8px;user-select:all">${esc(shareText())}</p>
          <div class="row"><button class="btn" data-act="copy">コピー</button><span class="sub" id="copyMsg"></span></div></section>
        <div class="row"><button class="btn primary" data-act="again">同じスタジオでもう一度</button><button class="btn" data-act="title">スタジオを選び直す</button></div>
      </div>`;
    app.querySelectorAll("[data-kv]").forEach((el) => { const k = s.kv.find((x) => x.n === +el.dataset.kv && !x.recap); if (k) { el.innerHTML = ""; el.appendChild(kvCanvas(k)); } });
  }
  function shareText() {
    const r = s.result;
    const row = s.eps.map((e) => (e.collapse ? "🟥" : e.grade === "god" ? "🟪" : e.grade === "good" ? "🟩" : e.grade === "mid" ? "🟨" : "🟧")).join("");
    return `深夜アニメP ${E.TIERS[s.tier].name}「${s.src.title}」\n${row}${s.recaps ? ` 総集編${s.recaps}` : ""}\n決算 ${r.score >= 0 ? "+" : ""}${fmt(r.score)}（${r.rank}）`;
  }

  // ---------- modals ----------
  function showModal(m) { modal = m; renderModal(); }
  function closeModal() { modal = null; xls = null; modalRoot.innerHTML = ""; }
  function renderModal() {
    if (!modal) { modalRoot.innerHTML = ""; return; }
    if (modal.kind === "gantt") {
      modalRoot.innerHTML = `<div class="modal-bg xls-bg"><div class="xls" role="dialog" aria-modal="true" aria-label="グランドスケジュール" style="grid-template-rows:auto auto 1fr">
        <div class="xls-top"><span class="xls-file">グランドスケジュール</span><span class="xls-who">第${s.week}週</span><button class="xls-x" data-act="closeModal" aria-label="閉じる">×</button></div>
        <div class="xls-tools"><div class="legend">${s.teams.map((t) => `<span style="--c:${TEAM_COL[t.key]}">${t.label}</span>`).join("")}<span style="--c:#8a93ab">グロス</span></div><span class="sub">薄い色＝予定、濃い色＝作業した週、斜線＝完パケまでの予測、▼＝放送週</span></div>
        <div style="overflow:auto;padding:10px">${ganttHtml()}<div style="margin-top:10px">${issuesHtml()}</div></div></div></div>`;
      modalRoot.querySelector(".xls-x")?.focus({ preventScroll: true });
      return;
    }
    if (modal.kind === "xls") { modalRoot.innerHTML = `<div class="modal-bg xls-bg">${xlsHtml()}</div>`; modalRoot.querySelector(".xls-x")?.focus({ preventScroll: true }); return; }
    let body = "";
    if (modal.kind === "event") {
      const v = E.eventView(s);
      if (!v) return closeModal();
      body = `<h2>${esc(v.title)}</h2><p>${esc(v.text)}</p>
        <div class="choices">${v.choices.map((c) => `<button class="btn" data-act="evChoice" data-v="${c.i}" ${c.ok ? "" : "disabled"}>${esc(c.label)}</button>`).join("")}</div>`;
    } else if (modal.kind === "air") {
      const pa = s.pendingAir, pct = Math.round(pa.prog * 100);
      body = `<h2>第${pa.n}話が間に合わない</h2>
        <p>放送日なのに、第${pa.n}話は撮影まで終わったカットが${pct}%しかありません。</p>
        <div class="choices">
          <button class="btn" data-act="airChoice" data-v="air">このまま放送する（${pct < 85 ? "作画崩壊は確実" : "品質が落ちる"}）</button>
          <button class="btn" data-act="airChoice" data-v="recap" ${s.recaps >= 2 ? "disabled" : ""}>総集編を挟む（期待値−6・評判−2、残り${2 - s.recaps}回）</button>
          <button class="btn" data-act="airChoice" data-v="delay">万策尽きた。放送を2週延期（期待値−15・信頼−25）</button>
        </div>`;
    } else if (modal.kind === "aired") {
      const a = s.lastAir;
      if (!a || !a.ep || a.recap || a.delay) { const next = modal.next; closeModal(); return afterTurn(next); }
      const posts = s.sns.filter((p) => p.n === a.ep.n).slice(0, 2);
      body = `<h2>第${a.ep.n}話 放送${E.isGross(a.ep.plan) ? `<span class="sub">　グロス回（${esc(E.grossOf(s, a.ep.plan).name)}）</span>` : ""}</h2>
        <div class="bigkv"><span data-bigkv></span>
          <div><p style="margin:0">作画の出来 <b class="num" style="font-size:22px">${a.ep.airQ}</b> ${a.ep.collapse ? '<span class="tagx t-bad">作画崩壊</span>' : a.grade === "god" ? '<span class="tagx t-ok">神回</span>' : ""}</p>
          ${posts.map((p) => `<div class="post ${["god", "good"].includes(p.kind) ? "good" : ["bad", "collapse"].includes(p.kind) ? "bad" : ""}" style="margin-top:6px"><span class="h">${esc(p.h)}</span><br>${esc(p.t)}</div>`).join("")}</div>
        </div>
        <div class="choices"><button class="btn primary" data-act="airedOk">次へ</button></div>`;
    } else if (modal.kind === "quit") {
      body = `<h2>この作品をやめますか</h2><p>進行中のデータは消え、スタジオ選びに戻ります。</p>
        <div class="choices"><button class="btn" data-act="quitYes">やめてスタジオ選びに戻る</button><button class="btn primary" data-act="closeModal">続ける</button></div>`;
    } else if (modal.kind === "help") {
      body = `<h2>遊び方</h2>
        <p>夜のスタジオです。人や物を押すと、右に詳しい様子が出ます。</p>
        <ul>
          <li><b>制作進行</b>（各班の席）を押すと、その班の<b>進行表</b>が開きます。原画マンごとに ラフ原 → 原画 → 動画 → 仕上げ → 撮影 の進みが並びます。遅れていたら原画マンを足します。${E.BASE_ANIMS}人を超えると、腕がよくても絵がばらつき、品質が下がります。</li>
          <li>ラフ原が全部上がると、<b>美術とCG</b>が${E.ART_WEEKS}週間で仕上げます。撮影はそのあとです。</li>
          <li><b>ホワイトボード</b>はグランドスケジュール。着手前の話数は、担当の班や日程を組み替えたり、グロスに切り替えたりできます。</li>
          <li><b>デスク</b>：全体の報告、部署の処理能力、デスク・進行への指示。<b>電話</b>：協力会社（グロス）。<b>あなたの席</b>：予算・委員会・宣伝。<b>テレビ</b>：放送とSNS。</li>
          <li>行動は週3回。最後に「今週を締める」。放送日までに撮影が終わらないと、作画崩壊か総集編です。</li>
        </ul>
        <div class="choices"><button class="btn primary" data-act="closeModal">閉じる</button></div>`;
    }
    modalRoot.innerHTML = `<div class="modal-bg"><div class="sheet modal flashin" role="dialog" aria-modal="true">${body}</div></div>`;
    modalRoot.querySelectorAll("[data-face]").forEach((el) => el.appendChild(faceCanvas(+el.dataset.face)));
    const big = modalRoot.querySelector("[data-bigkv]");
    if (big && s.lastAir?.ep) { const k = s.kv.find((x) => x.n === s.lastAir.ep.n && !x.recap); if (k) big.appendChild(kvCanvas(k)); }
    const first = modalRoot.querySelector("button:not(:disabled)");
    if (first) first.focus({ preventScroll: true });
  }
  function afterTurn(res) {
    save();
    if (res === "end") { closeModal(); render(); window.scrollTo(0, 0); return; }
    render();
    if (res === "event") showModal({ kind: "event" }); else closeModal();
  }
  function runTurn(step) {
    const before = s.aired;
    const res = step();
    if (res == null) return;
    if (res === "air") { save(); render(); return showModal({ kind: "air" }); }
    if (s.aired > before) { save(); render(); return showModal({ kind: "aired", next: res }); }
    afterTurn(res);
  }
  const rerender = () => { save(); render(); if (modal && modal.kind === "xls") renderModal(); };

  // ---------- input ----------
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act, v = b.dataset.v;
    if (b.tagName === "INPUT" || b.tagName === "SELECT") return;
    switch (act) {
      case "tier": s = E.newGame(v, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break;
      case "title": s = null; clearSave(); render(); break;
      case "again": { const t = s.tier; s = E.newGame(t, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break; }
      case "source": E.chooseSource(s, +v); E.makeOffers(s); s.phase = "shikin"; render(); window.scrollTo(0, 0); break;
      case "backKikaku": s.phase = "kikaku"; render(); break;
      case "toZagumi": if (E.committee(s).ok) { s.phase = "zagumi"; render(); window.scrollTo(0, 0); } break;
      case "toShikinBack": s.phase = "shikin"; render(); window.scrollTo(0, 0); break;
      case "staff": E.chooseStaff(s, b.dataset.role, +v); render(); break;
      case "toSchedule": if (E.staffReady(s)) { if (!s.eps[0].plan) E.autoPlan(s); s.phase = "schedule"; render(); window.scrollTo(0, 0); } break;
      case "autoPlan": E.autoPlan(s); render(); break;
      case "planStart": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { start: ep.plan.start + +b.dataset.d }); rerender(); break; }
      case "planDur": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { dur: ep.plan.dur + +b.dataset.d }); rerender(); break; }
      case "backZagumi": s.phase = "zagumi"; render(); break;
      case "start": if (E.planIssues(s).some((i) => !i.soft) || !E.committee(s).ok) break; E.startProduction(s); panel = "desk"; save(); render(); window.scrollTo(0, 0); showModal({ kind: "help" }); break;
      case "howto": showModal({ kind: "help" }); break;
      case "closeModal": closeModal(); break;
      case "panel": panel = v; render(); if (matchMedia("(max-width: 980px)").matches) document.getElementById("panel")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); break;
      case "xls": openXls(v); break;
      case "ganttBig": showModal({ kind: "gantt" }); break;
      case "xlsTab": xls.n = +v; renderModal(); break;
      case "addAnim": E.addAnimators(s, +v, +b.dataset.k); rerender(); break;
      case "reassign": E.reassignHeld(s, +v); rerender(); break;
      case "policy": { const k = b.dataset.k; const val = v === "true" ? true : v === "false" ? false : v; E.setPolicy(s, k, val); rerender(); break; }
      case "do": { const arg = b.dataset.arg != null ? +b.dataset.arg : undefined; E.doAction(s, v, arg); rerender(); break; }
      case "endWeek": runTurn(() => E.endWeek(s)); break;
      case "airChoice": runTurn(() => E.resolveAir(s, v)); break;
      case "airedOk": { const next = modal.next; closeModal(); afterTurn(next); break; }
      case "evChoice": { if (E.resolveEvent(s, +v) != null) { closeModal(); save(); render(); } break; }
      case "quit": showModal({ kind: "quit" }); break;
      case "quitYes": closeModal(); s = null; clearSave(); render(); window.scrollTo(0, 0); break;
      case "copy": {
        const text = shareText(), msg = document.getElementById("copyMsg");
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("shareText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
        break;
      }
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && modal && ["xls", "gantt", "help", "quit"].includes(modal.kind)) closeModal(); });
  document.addEventListener("change", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || !s) return;
    if (b.dataset.act === "offer") { s.sel[b.dataset.v] = b.checked; const lim = E.budgetRange(s); s.budget = Math.min(lim.max, Math.max(lim.min, s.budget)); render(); }
    if (b.dataset.act === "right") { s.rsel[b.dataset.v] = b.checked; render(); }
    if (b.dataset.act === "budget") { s.budget = +b.value; render(); document.getElementById("budget")?.focus(); }
    if (b.dataset.act === "planTeam") { E.setPlan(s, +b.dataset.v, { team: b.value }); rerender(); }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "budget" && s) { s.budget = +ev.target.value; const out = document.getElementById("budgetOut"); if (out) out.textContent = fmt(s.budget); }
  });

  // ---------- save / resume ----------
  function save() { if (s && s.phase === "prod") store.set("animep.save", s); }
  function clearSave() { try { localStorage.removeItem("animep.save"); } catch (e) { /* storage unavailable */ } }
  function start(hotData) {
    const saved = hotData && hotData.s ? hotData.s : store.get("animep.save");
    if (saved && saved.v === 3 && saved.phase) s = saved;
    if (hotData && hotData.panel) panel = hotData.panel;
    render();
    if (s && s.phase === "prod") { if (s.pendingAir) showModal({ kind: "air" }); else if (s.event) showModal({ kind: "event" }); }
  }
  window.claude?.hot?.snapshot?.(() => ({ s, panel }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
