<title>深夜アニメP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* Layout: a night-time anime studio seen from above (pixel office) on the left; the sheet you clicked (desk report, 香盤表, a 進行's episodes) on the right. */
  :root {
    --desk: #1b2030;        /* page ground: the dark studio */
    --desk-2: #262c40;      /* HUD, raised items */
    --paper: #eef1f5;       /* cool office paper */
    --paper-2: #ffffff;
    --paper-line: #c9d3e3;  /* ruled grid */
    --ink: #1a1e29;
    --ink-soft: #5b6478;
    --on-desk: #e6e9f2;
    --on-desk-soft: #9aa3ba;
    --marker: #ffe14a;      /* highlighter yellow: attention, primary action */
    --pink: #ff5fa2;        /* hype */
    --black: #1f9d63;       /* 黒字 / done */
    --red: #e5484d;         /* 赤字 / danger */
    --blue: #3b6fe0;        /* progress */
    --st-script: #b9c6e4; --st-conte: #8aa6dd; --st-genga: #3b6fe0; --st-sakkan: #7a5cd6; --st-douga: #2ba3a3; --st-satsuei: #1f9d63;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--on-desk); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; box-sizing: border-box; }
  h1, h2, h3, .pix { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; }
  h1 { font-size: 30px; margin: 0; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 8px; text-wrap: balance; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  table { color: inherit; font-size: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sheet { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 14px 16px; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 6px 18px rgba(0,0,0,.35); min-width: 0; }
  .sheet .sub, .sub { color: var(--ink-soft); font-size: 12px; }
  .stamp { display: inline-block; font-family: var(--font-pixel); border: 2px solid currentColor; padding: 0 6px; border-radius: 3px; transform: rotate(-3deg); }
  .btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 8px 12px; font-family: var(--font-pixel); font-size: 14px; line-height: 1.3; }
  .btn:hover { background: #33394a; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: var(--marker); color: var(--ink); }
  .btn.primary:hover { background: #ffe97a; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 14px; }
  .pos { color: var(--black); } .neg { color: var(--red); }
  .money { font-family: var(--font-pixel); }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .face { width: 36px; height: 36px; border-radius: 2px; flex: none; }

  /* title & setup */
  .title-wrap { display: grid; gap: 18px; padding-top: 10px; }
  .logo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .lead { max-width: 62ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12.5px; margin: 0; }

  .cand:hover:not(:disabled) { border-color: var(--ink); }
  .cand.on { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink); }
  .cand:disabled { opacity: .45; cursor: not-allowed; }
  .cand .nm { font-weight: 700; }
  .arch { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 4px; border-radius: 2px; }
  .cand .st { font-size: 11.5px; color: var(--ink-soft); }
  .footerbar { position: sticky; bottom: 0; margin-top: 16px; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); background: linear-gradient(transparent, var(--desk) 30%); }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .summary b { font-family: var(--font-pixel); font-weight: 400; }

  input[type=range] { width: 100%; accent-color: var(--ink); }
  table.pl { border-collapse: collapse; width: 100%; font-size: 13px; }
  .pl td, .pl th { padding: 4px 4px; border-bottom: 1px solid var(--paper-line); text-align: left; font-weight: 400; }
  .pl th { font-size: 11.5px; color: var(--ink-soft); }
  .pl td.r, .pl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pl tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
  .pl tr.subt td { color: var(--ink-soft); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }

  /* production */

  .studio { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
  .officecol { display: grid; gap: 10px; min-width: 0; position: sticky; top: 8px; }
  .officewrap { min-width: 0; border-radius: 3px; }

  .office canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 2px; }
  .hot:hover, .hot:focus-visible, .hot.on { outline: 2px solid var(--marker); outline-offset: 0; background: rgba(255,225,74,.08); }
  .hot .tag { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); white-space: nowrap; font-size: 11px; background: var(--ink); color: var(--paper); padding: 1px 6px; border-radius: 2px; pointer-events: none; opacity: 0; font-family: var(--font-body); }

  .zone { position: absolute; font-family: var(--font-pixel); font-size: 11px; color: rgba(230,233,242,.75); pointer-events: none; text-shadow: 0 1px 0 #000; }
  .deskline { display: flex; gap: 10px; align-items: center; background: var(--desk-2); border-radius: 3px; padding: 8px 10px; }
  .deskline .say { flex: 1; min-width: 0; font-size: 13px; }

  .endweek { font-size: 17px; padding: 12px 18px; white-space: nowrap; }

  .panel { display: grid; gap: 12px; min-width: 0; }
  .panel .who { display: flex; gap: 10px; align-items: center; }
  .panel .who .nm { font-family: var(--font-pixel); font-size: 17px; }
  .speech { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 3px; padding: 8px 10px; font-size: 13px; position: relative; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button { background: #39405a; color: var(--on-desk); border: 0; border-radius: 3px; padding: 4px 9px; font-size: 12px; font-family: var(--font-pixel); }
  .tabs button.on { background: var(--marker); color: var(--ink); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 5px 6px; font-size: 12.5px; color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .policy { display: grid; gap: 8px; }
  .plab { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .act { text-align: left; background: var(--paper-2); border: 1.5px solid var(--paper-line); border-radius: 3px; padding: 6px 8px; color: var(--ink); display: grid; gap: 1px; }
  .act:hover:not(:disabled) { border-color: var(--ink); }
  .act:disabled { opacity: .4; cursor: not-allowed; }
  .act .an { font-family: var(--font-pixel); font-size: 13px; }
  .act .ac { font-size: 11px; color: var(--ink-soft); }
  .stagebar { display: flex; height: 10px; background: #dfe5ee; border-radius: 2px; overflow: hidden; min-width: 60px; }
  .stagebar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-soft); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 3px; border-radius: 1px; background: var(--c); }
  .tagx { font-family: var(--font-pixel); font-size: 11px; padding: 0 5px; border-radius: 2px; white-space: nowrap; background: #dfe5ee; color: var(--ink); }
  .t-ok { background: #d6f2e4; color: #11633c; } .t-warn { background: var(--marker); color: var(--ink); } .t-bad { background: var(--red); color: #fff; } .t-air { background: var(--ink); color: var(--paper); }
  .kohyo-wrap { overflow-x: auto; }
  table.kohyo { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .kohyo th { font-family: var(--font-pixel); font-weight: 400; text-align: left; font-size: 11.5px; color: var(--ink-soft); border-bottom: 2px solid var(--ink); padding: 4px 5px; white-space: nowrap; }
  .kohyo td { border-bottom: 1px solid var(--paper-line); padding: 4px 5px; vertical-align: middle; }
  .kohyo tr.aired td { color: var(--ink-soft); }
  .kohyo tr.next td { background: rgba(255,225,74,.35); }
  .kohyo tr.click { cursor: pointer; } .kohyo tr.click:hover td { background: rgba(59,111,224,.08); }
  .cap { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 4px 8px; align-items: center; font-size: 12.5px; }
  .cap .bar2 { height: 8px; background: #dfe5ee; border-radius: 2px; position: relative; overflow: hidden; }
  .cap .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; }
  .ep { color: var(--ink); border: 1.5px solid var(--paper-line); background: var(--paper-2); border-radius: 3px; padding: 10px; display: grid; gap: 6px; }
  .ep.hot2 { border-color: var(--red); }
  .ep .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .ep .hd .t { font-family: var(--font-pixel); font-size: 15px; }
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-size: 11px; text-align: center; }
  .stages div { background: #eef1f5; border-radius: 2px; padding: 2px 0; line-height: 1.25; }
  .stages div b { display: block; font-weight: 400; font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink); }
  .stages div.done { background: #d6f2e4; } .stages div.now { background: rgba(255,225,74,.6); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; gap: 6px; align-items: center; border: 1px solid var(--paper-line); border-radius: 3px; padding: 3px 6px 3px 3px; background: var(--paper); font-size: 12px; text-align: left; color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .chip .mini { font-size: 10.5px; color: var(--ink-soft); display: block; line-height: 1.2; }
  .stam { height: 6px; width: 90px; background: #dfe5ee; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .stam i { display: block; height: 100%; }
  .log { font-size: 12.5px; display: grid; gap: 3px; max-height: 240px; overflow-y: auto; }
  .log p { margin: 0; } .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; }
  .sns { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
  .post { font-size: 12.5px; background: var(--paper-2); border-radius: 3px; padding: 6px 8px; border-left: 3px solid var(--paper-line); }
  .post .h { color: var(--ink-soft); font-size: 11px; } .post.good { border-left-color: var(--black); } .post.bad { border-left-color: var(--red); }
  .kvs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .kvbox { display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--ink-soft); }
  .kvbox > span[data-kv] { display: block; width: 100%; max-width: 72px; aspect-ratio: 1; background: #dfe5ee; border-radius: 2px; overflow: hidden; }
  .kvbox canvas { width: 100%; height: 100%; }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper-2); color: var(--ink); color-scheme: light; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 10, 18, .72); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { max-width: 560px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box; }
  .modal .choices { display: grid; gap: 8px; margin-top: 12px; }
  .modal .choices .btn { text-align: left; }
  .modal .bigkv { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; }
  .modal .bigkv canvas { width: 112px; height: 112px; background: #dfe5ee; }

  .result { display: grid; gap: 14px; }
  .rank { font-family: var(--font-pixel); font-size: 64px; line-height: 1; }
  .score { font-family: var(--font-pixel); font-size: 34px; }

  @media (max-width: 980px) {
    .studio { grid-template-columns: minmax(0, 1fr); }
    .officecol { position: static; }
  }
  @media (max-width: 640px) {
    #app { padding-bottom: 100px; }
    .deskline .endweek { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.55); }
    .kvs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stages { font-size: 10px; }
    .hud .vl { font-size: 15px; }
    .sheet { padding: 12px; }
    .officewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .office { width: 720px; }
  }
  @media (max-width: 420px) { h1 { font-size: 24px; } .actions { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: no-preference) {
    .flashin { animation: flashin .3s ease-out; }
    @keyframes flashin { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>

<script id="engine">
/* ===================== ゲームの計算（UIなし） ===================== */
const Engine = (() => {
  "use strict";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const round = (v, step = 10) => Math.round(v / step) * step;

  // Seeded RNG kept inside the state so a saved game replays the same.
  function rnd(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    let t = s.rs;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rr = (s, a, b) => a + rnd(s) * (b - a);
  const ri = (s, a, b) => Math.floor(rr(s, a, b + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  function shuffle(s, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- 1話あたりの制作費（万円・ランク1.0のとき） ----------
  // 業界の一般的なサンプル（1話 約1,282万円）を最低ラインにしている。
  const COST_LINES = [
    { k: "gensaku", label: "原作料", base: 5 },
    { k: "settei", label: "設定", base: 30 },
    { k: "kyakuhon", label: "脚本", base: 25 },
    { k: "conte", label: "コンテ", base: 25 },
    { k: "enshutsu", label: "演出料", base: 50 },
    { k: "kantoku", label: "監督", base: 20 },
    { k: "sakkan", label: "作画監督料", base: 30 },
    { k: "shinko", label: "制作進行料（制作管理費用）", base: 100 },
    { k: "genga", label: "原画料（レイアウト込み）", base: 120 },
    { k: "douga", label: "動画料", base: 100 },
    { k: "haikei", label: "背景", base: 130 },
    { k: "shiage", label: "仕上げ料", base: 120 },
    { k: "satsuei", label: "撮影料", base: 100 },
    { k: "henshu", label: "編集料", base: 25 },
    { k: "print", label: "プリント（現像料）", base: 50 },
    { k: "zairyo", label: "用紙など原料・材料", base: 35 },
    { k: "onkyo", label: "音響", base: 150 },
  ];
  const KANRI = 0.15;       // 制作会社の制作管理費用（全体の15%）
  const CUT_BASE = 120 / 300;   // 原画1カットあたり 0.4万円（4,000円）
  const DOUGA_CUT = 100 / 300;

  const TIERS = {
    top: { key: "top", name: "有名スタジオ", studio: "スタジオ極光", pre: 10, grade: 2.0, shinko: 4, anim: 7, animSkill: [62, 86], sakkan: 3, sakkanSkill: [72, 86],
           dougaCap: 240, dougaSkill: 66, satsueiCap: 420, satsueiSkill: 72, scripts: 6, contes: 3,
           cash: 15000, revMul: 1.25, exp: 71, brand: 15, starNG: 0, eventMul: 0.8, investMul: 1.3, rankMul: 1.5, rateCap: 2.4,
           blurb: "社内に腕利きの原画マンと作監がそろう。単価は高く、ファンの期待も高い。少しの作画の乱れも許されない。" },
    mid: { key: "mid", name: "中堅スタジオ", studio: "アニメーション工房ひばり", pre: 8, grade: 1.5, shinko: 3, anim: 5, animSkill: [50, 74], sakkan: 2, sakkanSkill: [60, 74],
           dougaCap: 180, dougaSkill: 58, satsueiCap: 340, satsueiSkill: 62, scripts: 4, contes: 2,
           cash: 8000, revMul: 1.0, exp: 58, brand: 5, starNG: 0.5, eventMul: 1, investMul: 1, rankMul: 1, rateCap: 2.0,
           blurb: "標準の難易度。社内の原画マンだけでは手が足りず、外部の原画マン探しと作監のやりくりが鍵になる。" },
    low: { key: "low", name: "弱小スタジオ", studio: "有限会社 夜明け動画", pre: 7, grade: 1.0, shinko: 2, anim: 3, animSkill: [44, 64], sakkan: 1, sakkanSkill: [55, 66],
           dougaCap: 120, dougaSkill: 50, satsueiCap: 260, satsueiSkill: 54, scripts: 4, contes: 2,
           cash: 4000, revMul: 0.8, exp: 50, brand: 0, starNG: 0.85, eventMul: 1.25, investMul: 0.7, rankMul: 0.5, rateCap: 1.6,
           blurb: "人もお金も足りない。プロデューサー自ら現場に入る毎日。単価は業界の最低ライン。期待されていないぶん、当てれば大きい。" },
  };
  const EPISODES = 12;
  const MAX_PER_EP = 6;     // 1話に同時に入れる原画マンの上限
  // 工程（カットは脚本・コンテのあと、原画→作監→動画・仕上げ→撮影の順に流れる）
  const STAGES = [
    { k: "script", label: "脚本", w: 0.05 },
    { k: "conte", label: "コンテ", w: 0.10 },
    { k: "genga", label: "原画", w: 0.40 },
    { k: "sakkan", label: "作監", w: 0.15 },
    { k: "douga", label: "動画・仕上げ", w: 0.20 },
    { k: "satsuei", label: "撮影", w: 0.10 },
  ];

  const SOURCES = {
    manga:    { type: "manga", label: "人気漫画", pop: 42, gensaku: 3.0, kanshu: 0.12, titles: ["放課後ラグナロク", "ねこ侍は眠らない", "鉄骨のアリア", "となりの席の魔王さま", "深海ベーカリー"],
                note: "原作ファンが多く期待値が高い。原作監修の修正指示が入りやすい。" },
    novel:    { type: "novel", label: "ライトノベル", pop: 28, gensaku: 2.0, kanshu: 0.08, titles: ["転生したら制作進行だった件", "追放された錬金術師、辺境でカフェを開く", "最強賢者の二周目は静かに暮らしたい", "俺の妹が魔王軍の経理担当なんだが"],
                note: "固定ファンがいる。アニメの出来しだいで原作も売れる。" },
    game:     { type: "game", label: "スマホゲーム", pop: 30, gensaku: 1.0, kanshu: 0.05, titles: ["ステラ・リンクス", "アイドル戦国絵巻", "ギャラクシー☆ブレイヴ"],
                note: "ゲーム会社が大きく出資してくれる。そのぶん口出しも多い。" },
    original: { type: "original", label: "オリジナル", pop: 8, gensaku: 0, kanshu: 0, titles: ["夜明けのフィルム", "さよならロケット少女", "機械仕掛けの夏休み", "月面の郵便屋さん"],
                note: "知名度ゼロからのスタート。原作料はかからず、当たれば売上が1.25倍。" },
  };

  const FAMILY = ["岩城", "真柴", "黒須", "早乙女", "鷹野", "白石", "柳田", "東雲", "葛西", "三輪", "雨宮", "久遠", "椎名", "不破", "氷室", "九条", "皆川", "綾瀬", "桐生", "宗像", "結城", "日向", "朝霧", "篠原",
                  "小田切", "望月", "千早", "神楽", "伊吹", "相馬", "芹沢", "鳴海", "野々宮", "八雲", "藤堂", "水無瀬", "能登", "桜庭", "長谷部", "榊"];
  const GIVEN = ["透", "灯", "誠", "遥", "蓮", "朔", "薫", "湊", "静", "渉", "楓", "律", "環", "慧", "茜", "航", "紬", "悠", "澪", "迅", "一花", "健吾", "美雪", "大地", "千尋", "陽向", "瑞穂", "昴", "亜紀", "翔"];

  // grade: このスタッフを使うと関連する費目が何倍になるか（1.0〜3.0）
  const ROLE_DEFS = {
    dir: { label: "監督", lines: "監督・コンテ・演出・設定", arch: [
      { a: "巨匠", skill: [82, 92], speed: [28, 40], fame: [80, 92], grade: 3.0, quirk: 0.35, tag: "作家" },
      { a: "職人", skill: [70, 80], speed: [50, 65], fame: [40, 60], grade: 2.0, quirk: 0.15, tag: "職人" },
      { a: "早撮り", skill: [50, 62], speed: [78, 92], fame: [20, 40], grade: 1.2, quirk: 0.05, tag: "量産" },
      { a: "新鋭", skill: [45, 88], speed: [50, 75], fame: [5, 25], grade: 1.0, quirk: 0.25, tag: "作家", hidden: true },
    ] },
    wri: { label: "シリーズ構成", lines: "脚本", arch: [
      { a: "大御所", skill: [80, 90], speed: [30, 45], fame: [70, 85], grade: 3.0, tag: "作家" },
      { a: "職人", skill: [70, 78], speed: [55, 70], fame: [35, 55], grade: 2.0, tag: "職人" },
      { a: "速筆", skill: [52, 62], speed: [80, 95], fame: [15, 35], grade: 1.3, tag: "量産" },
      { a: "新人", skill: [40, 85], speed: [50, 70], fame: [0, 15], grade: 1.0, tag: "作家", hidden: true },
    ] },
    desk: { label: "制作デスク", lines: "制作進行料", arch: [
      { a: "伝説", mgmt: [92, 98], grade: 1.4, fame: [80, 80] },
      { a: "ベテラン", mgmt: [78, 88], grade: 1.2, fame: [0, 0] },
      { a: "中堅", mgmt: [60, 72], grade: 1.1, fame: [0, 0] },
      { a: "若手", mgmt: [40, 55], grade: 1.0, fame: [0, 0] },
    ] },
    va: { label: "主演声優", lines: "音響", arch: [
      { a: "人気", fame: [85, 95], act: [75, 85], grade: 3.0 },
      { a: "アイドル", fame: [75, 85], act: [45, 55], grade: 2.2 },
      { a: "実力派", fame: [40, 55], act: [80, 90], grade: 1.6 },
      { a: "新人", fame: [5, 20], act: [50, 75], grade: 1.0 },
    ] },
  };

  function makeName(s) {
    const used = new Set(s.usedNames);
    for (let i = 0; i < 80; i++) {
      const n = pick(s, FAMILY) + " " + pick(s, GIVEN);
      if (!used.has(n)) { s.usedNames.push(n); return n; }
    }
    return "名無し " + s.usedNames.length;
  }
  const uid = (s) => ++s.uid;
  const skillGrade = (skill) => clamp(1 + (skill - 40) / 25, 1, 3);

  function rollStaff(s, role, arch) {
    const r = (k) => (arch[k] ? ri(s, arch[k][0], arch[k][1]) : 0);
    const st = { role, arch: arch.a, name: makeName(s), skill: r("skill"), speed: r("speed"), fame: r("fame"), grade: arch.grade,
                 mgmt: r("mgmt"), act: r("act"), quirk: arch.quirk || 0, tag: arch.tag || "", hidden: !!arch.hidden, seed: ri(s, 1, 1e9) };
    st.busy = st.fame >= 75 && rnd(s) < TIERS[s.tier].starNG;
    return st;
  }
  function makeAnimator(s, lo, hi, inhouse) {
    const skill = ri(s, lo, hi);
    const speed = clamp(Math.round(rr(s, 25, 39) - (skill - 60) / 8), 18, 44);
    const rate = Math.round(skillGrade(skill) * rr(s, 0.92, 1.08) * 100) / 100;
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill, speed, rate, inhouse: !!inhouse, overseas: false, ep: null, batch: 0, done: 0, hold: 0 };
  }
  function makeSakkan(s, lo, hi, inhouse) {
    const skill = ri(s, lo, hi);
    const cap = clamp(Math.round(150 - skill * 0.6 + rr(s, -10, 10)), 80, 140);
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill, cap, grade: Math.round(clamp(1 + (skill - 50) / 30, 1, 3) * rr(s, 0.92, 1.08) * 100) / 100, inhouse: !!inhouse };
  }
  function makeShinko(s, rookie) {
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill: rookie ? ri(s, 35, 55) : ri(s, 45, 82), stamina: rookie ? 90 : ri(s, 70, 95), gone: false };
  }

  function newGame(tier, seed) {
    const s = { v: 2, phase: "kikaku", tier, rs: seed | 0, week: 0, log: [], sns: [], kv: [], usedNames: [], uid: 0 };
    s.pre = TIERS[tier].pre;
    s.sourceOpts = shuffle(s, Object.keys(SOURCES)).slice(0, 3).map((k) => ({ type: k, title: pick(s, SOURCES[k].titles) }));
    s.cands = {};
    for (const role of Object.keys(ROLE_DEFS)) s.cands[role] = ROLE_DEFS[role].arch.map((a) => rollStaff(s, role, a));
    if (tier !== "top" && rnd(s) < 0.6) s.cands.desk[0].busy = true;   // the legendary desk is rarely free
    s.staff = { dir: null, wri: null, desk: null, va: null };
    return s;
  }
  function chooseSource(s, i) { s.src = s.sourceOpts[i]; }
  function chooseStaff(s, role, i) { const c = s.cands[role][i]; if (c && !c.busy) s.staff[role] = c; }
  const staffReady = (s) => Object.values(s.staff).every(Boolean);
  function synergy(s) {
    const d = s.staff.dir, w = s.staff.wri;
    if (!d || !w) return 0;
    if (d.tag === w.tag) return 4;
    if ((d.tag === "作家" && w.tag === "量産") || (d.tag === "量産" && w.tag === "作家")) return -3;
    return 0;
  }
  function initialHype(s) {
    const T = TIERS[s.tier], st = s.staff, src = SOURCES[s.src.type];
    return Math.round(src.pop + T.brand + 0.12 * ((st.dir?.fame || 0) + (st.wri?.fame || 0)) + 0.2 * (st.va?.fame || 0));
  }

  // 費目ごとの倍率（ランク）
  function grades(s) {
    const T = TIERS[s.tier], st = s.staff;
    const g = { studio: T.grade, dir: st.dir?.grade || 1, wri: st.wri?.grade || 1, va: st.va?.grade || 1, desk: st.desk?.grade || 1, gensaku: SOURCES[s.src?.type || "original"].gensaku };
    g.rateUp = s.policy && s.policy.rate === "up" ? 1.3 : 1;
    return g;
  }
  // 1話あたりの見積もり（社内の原画マンと作監の平均単価で計算）
  function estimatePerEp(s) {
    const g = grades(s), T = TIERS[s.tier];
    const animRate = s.animators && s.animators.length ? avg(s.animators.filter((a) => a.inhouse).map((a) => a.rate)) : skillGrade((T.animSkill[0] + T.animSkill[1]) / 2);
    const sakRate = s.sakkans && s.sakkans.length ? avg(s.sakkans.map((a) => a.grade)) : skillGrade((T.sakkanSkill[0] + T.sakkanSkill[1]) / 2);
    const mul = {
      gensaku: g.gensaku, settei: g.dir, kyakuhon: g.wri, conte: g.dir, enshutsu: g.dir, kantoku: g.dir, sakkan: sakRate * g.rateUp,
      shinko: g.studio * g.desk, genga: animRate * g.rateUp, douga: g.studio * g.rateUp, haikei: g.studio, shiage: g.studio, satsuei: g.studio,
      henshu: g.studio, print: g.studio, zairyo: g.studio, onkyo: g.va,
    };
    const lines = COST_LINES.map((l) => ({ ...l, mul: mul[l.k], v: Math.round(l.base * mul[l.k]) }));
    const sub = lines.reduce((a, l) => a + l.v, 0);
    const kanri = Math.round(sub * KANRI);
    return { lines, sub, kanri, total: sub + kanri };
  }
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  function estimate(s) { return round(estimatePerEp(s).total * EPISODES + 2500, 100); }   // +宣伝費の目安

  // 資金集め
  function makeOffers(s) {
    const T = TIERS[s.tier], m = T.investMul, type = s.src.type;
    const H0 = initialHype(s);
    const o = [];
    const amt = (base) => round(base * m * rr(s, 0.9, 1.1), 100);
    if (type === "manga" || type === "novel")
      o.push({ id: "pub", name: "出版社（原作元）", amt: amt(type === "manga" ? 11000 : 8000), cond: "原作監修が入り、修正指示が増える", fx: { kanshu: 0.12 } });
    if (type === "game")
      o.push({ id: "gamec", name: "ゲーム会社（原作元）", amt: amt(13000), cond: "ゲームとのタイアップ宣伝（期待値+8、口出しが増える）", fx: { hype: 8, meddle: 0.06 } });
    o.push({ id: "rec", name: "レコード会社", amt: amt(5000), cond: "主題歌は所属アーティスト（期待値+4）", fx: { hype: 4 } });
    o.push({ id: "goods", name: "グッズメーカー", amt: amt(4000), cond: "キャラを1人追加（設定費+600万、グッズ売上1.4倍）", fx: { cost: 600, goods: 1.4 } });
    o.push({ id: "ad", name: "広告代理店", amt: amt(7000), cond: "宣伝は任せろ（期待値+6、委員会の口出しが増える）", fx: { hype: 6, meddle: 0.08 } });
    s.offers = o;
    s.rights = [
      { id: "mg", name: "配信プラットフォームと MG 契約", fixed: round((8000 + H0 * 90) * T.revMul, 100), cond: "配信収入が固定額になる（当たっても増えない）" },
      { id: "os", name: "海外配給会社へ先行販売", fixed: round((5000 + H0 * 45) * T.revMul, 100), cond: "海外売上が固定額になる（当たっても増えない）" },
    ];
    s.sel = {}; s.rsel = {};
    o.forEach((x) => { if (x.id !== "ad") s.sel[x.id] = true; });
    const others = o.filter((x) => s.sel[x.id]).reduce((a, x) => a + x.amt, 0);
    s.own = clamp(round(estimate(s) - others, 500), 0, T.cash);
  }
  function committee(s) {
    const others = s.offers.filter((x) => s.sel[x.id]).reduce((a, x) => a + x.amt, 0);
    const B = others + s.own;
    return { others, B, share: B > 0 ? s.own / B : 0 };
  }

  function startProduction(s) {
    const T = TIERS[s.tier];
    const c = committee(s);
    s.B = c.B; s.share = c.share; s.othersInvest = c.others;
    s.flags = { kanshu: SOURCES[s.src.type].kanshu, meddle: 0.04, goods: 1, hype: 0, mg: null, os: null, collab: 0, extraUsed: 0 };
    s.spent = 0; s.spentBy = {};
    s.policy = { genga: "domestic", douga: "inhouse", rate: "keep", mode: "stock", ot: false };
    for (const x of s.offers) if (s.sel[x.id]) {
      const f = x.fx;
      if (f.kanshu) s.flags.kanshu += f.kanshu;
      if (f.meddle) s.flags.meddle += f.meddle;
      if (f.goods) s.flags.goods *= f.goods;
      if (f.hype) s.flags.hype += f.hype;
      if (f.cost) pay(s, "settei", f.cost);
    }
    for (const r of s.rights) if (s.rsel[r.id]) s.flags[r.id] = r.fixed;
    // studio staff
    s.animators = Array.from({ length: T.anim }, () => makeAnimator(s, T.animSkill[0], T.animSkill[1], true));
    s.sakkans = Array.from({ length: T.sakkan }, () => makeSakkan(s, T.sakkanSkill[0], T.sakkanSkill[1], true));
    s.shinkos = Array.from({ length: T.shinko }, () => makeShinko(s, false));
    s.estPerEp = estimatePerEp(s);
    // episodes; pre-production already wrote a few scripts and storyboards
    s.eps = Array.from({ length: EPISODES }, (_, i) => ({
      n: i + 1, cuts: ri(s, 26, 34) * 10, script: i < T.scripts ? 1 : 0, conte: i < T.contes ? 1 : 0, genga: 0, alloc: 0, sakkan: 0, douga: 0, satsuei: 0,
      qGenga: 0, qSakkan: 0, qDouga: 0, shinko: s.shinkos[i % s.shinkos.length].id, sakkanId: null, bonus: 0, skipSakkan: false,
      aired: false, airQ: null, collapse: false, delivered: false,
    }));
    pay(s, "settei", 30 * EPISODES * grades(s).dir);      // キャラ・美術設定は最初に発注
    pay(s, "kyakuhon", 25 * T.scripts * grades(s).wri);   // 準備稿のぶん
    pay(s, "conte", 25 * T.contes * grades(s).dir);
    s.H = initialHype(s) + s.flags.hype; s.H0 = s.H;
    s.R = 55; s.trust = 60; s.ap = 3; s.dirMood = 0;
    s.mods = []; s.cool = { pv: 0, event: 0 };
    s.week = 1; s.nextAir = s.pre + 1; s.aired = 0; s.recaps = 0; s.delays = 0;
    s.lastAirQ = 0; s.lastCollapse = false; s.promo = 0; s.helpCount = 0; s.scoutCount = 0;
    s.phase = "prod"; s.event = null; s.pendingAir = null; s.scout = null; s.stat = null;
    assign(s);
    s.stat = forecast(s);
    log(s, `「${s.src.title}」制作開始。放送開始は第${s.nextAir}週。予算 ${fmt(s.B)}。`);
  }

  function pay(s, k, v) {
    const amt = v * (1 + KANRI);
    s.spent += amt;
    s.spentBy[k] = (s.spentBy[k] || 0) + v;
    s.spentBy.kanri = (s.spentBy.kanri || 0) + v * KANRI;
    s.weekSpend = (s.weekSpend || 0) + amt;
  }

  function fmt(v) {
    const n = Math.round(v);
    const sign = n < 0 ? "−" : "";
    const a = Math.abs(n);
    if (a >= 10000) { const oku = Math.floor(a / 10000), man = a % 10000; return `${sign}${oku}億${man ? man.toLocaleString("ja-JP") + "万" : ""}円`; }
    return `${sign}${a.toLocaleString("ja-JP")}万円`;
  }
  function log(s, text) { s.log.push({ w: s.week, text }); if (s.log.length > 120) s.log.shift(); }

  // ---------- helpers ----------
  const modMul = (s, target) => s.mods.filter((m) => m.target === target).reduce((a, m) => a * m.mul, 1);
  function addMod(s, id, weeks, mul, target) { s.mods.push({ id, weeks, mul, target }); }
  const unaired = (s) => s.eps.filter((e) => !e.aired);
  const epBy = (s, n) => s.eps[n - 1];
  const shinkoBy = (s, id) => s.shinkos.find((x) => x.id === id);
  const sakkanBy = (s, id) => s.sakkans.find((x) => x.id === id);
  const animBy = (s, id) => s.animators.find((x) => x.id === id);
  function progress(ep) {
    const c = ep.cuts;
    return clamp(0.05 * ep.script + 0.10 * ep.conte + 0.40 * ep.genga / c + 0.15 * ep.sakkan / c + 0.20 * ep.douga / c + 0.10 * ep.satsuei / c, 0, 1);
  }
  function stageOf(ep) {
    if (ep.aired) return "aired";
    if (ep.satsuei >= ep.cuts) return "done";
    if (ep.script < 1) return "script";
    if (ep.conte < 1) return "conte";
    if (ep.genga < ep.cuts) return "genga";
    if (ep.sakkan < ep.cuts) return "sakkan";
    if (ep.douga < ep.cuts) return "douga";
    return "satsuei";
  }
  const STAGE_LABEL = { script: "脚本", conte: "コンテ", genga: "原画", sakkan: "作監", douga: "動画・仕上げ", satsuei: "撮影", done: "納品済", aired: "放送済" };
  function airWeekOf(s, ep) { const i = unaired(s).indexOf(ep); return i < 0 ? null : s.nextAir + i; }
  const weeksLeft = (s, ep) => airWeekOf(s, ep) - s.week + 1;   // 今週を含め、放送までに作業できる週数
  function shinkoEff(s, ep) {
    const sh = shinkoBy(s, ep.shinko);
    if (!sh || sh.gone) return 0.6;
    return (0.85 + sh.skill / 500) * (sh.stamina < 30 ? 0.85 : 1) * (sh.helped ? 1.12 : 1);
  }
  const animatorsOn = (s, n) => s.animators.filter((a) => a.ep === n);
  const otMul = (s) => (s.policy.ot ? 1.2 : 1);

  // ---------- desk: assignment ----------
  function assign(s) {
    // 作監: the least loaded one takes a new episode once its key animation starts
    for (const ep of unaired(s)) {
      if (ep.sakkanId == null && ep.conte >= 1) {
        const load = (sk) => unaired(s).filter((e) => e.sakkanId === sk.id && e.sakkan < e.cuts).length;
        const sk = s.sakkans.slice().sort((a, b) => load(a) - load(b))[0];
        if (sk) ep.sakkanId = sk.id;
      }
    }
    // overseas genga studio
    const os = s.animators.find((a) => a.overseas);
    if (s.policy.genga === "overseas" && !os) {
      s.animators.push({ id: uid(s), name: "海外原画スタジオ", seed: 7, skill: 44, speed: 70, rate: 0.6, inhouse: false, overseas: true, ep: null, batch: 0, done: 0, hold: 0 });
    }
    // idle animators take a batch of cuts (持ちカット) on the earliest open episode
    const pool = s.animators.filter((a) => a.ep == null && !a.retire && a.hold <= 0)
      .sort((a, b) => (s.policy.mode === "quality" ? b.skill - a.skill : b.speed - a.speed));
    for (const a of pool) { const ep = findEp(s, a); if (ep) giveBatch(s, a, ep); }
  }
  function findEp(s, a) {
    const open = (e) => e.conte >= 1 && e.cuts - e.alloc > 0 && (a.overseas || animatorsOn(s, e.n).filter((x) => !x.overseas).length < MAX_PER_EP);
    if (a.pin) { const e = epBy(s, a.pin); if (e && !e.aired && open(e)) return e; a.pin = null; }
    return unaired(s).find(open);
  }
  function giveBatch(s, a, ep) {
    const batch = Math.min(ep.cuts - ep.alloc, Math.round(a.speed * (a.overseas ? 1.5 : 2)));
    if (batch <= 0) return false;
    a.ep = ep.n; a.batch = batch; a.done = 0; ep.alloc += batch;
    return true;
  }
  function freeAnimator(s, a) {
    if (a.ep != null) { const ep = epBy(s, a.ep); ep.alloc -= a.batch - a.done; }
    a.ep = null; a.batch = 0; a.done = 0;
  }
  // 原画マンを指定の話数へ回す（持っているカットは元の話数に戻す）
  function moveAnimator(s, id, n) {
    const a = animBy(s, id), ep = epBy(s, n);
    if (!a || !ep || ep.aired || ep.conte < 1 || ep.cuts - ep.alloc <= 0) return false;
    freeAnimator(s, a);
    a.pin = n;
    giveBatch(s, a, ep);
    log(s, `${a.name}さんを第${n}話に回した。`);
    return true;
  }
  function unpin(s, id) { const a = animBy(s, id); if (a) a.pin = null; }
  function setSakkan(s, n, id) { const ep = epBy(s, n); if (ep && !ep.aired && sakkanBy(s, id)) { ep.sakkanId = id; log(s, `第${n}話の作監を${sakkanBy(s, id).name}さんに。`); } }
  function canSkipSakkan(s, ep) { return !ep.aired && !ep.skipSakkan && ep.genga > ep.sakkan && weeksLeft(s, ep) <= 2; }
  function skipSakkan(s, n) {
    const ep = epBy(s, n);
    if (!canSkipSakkan(s, ep)) return false;
    ep.skipSakkan = true;
    log(s, `第${n}話は作監を通さず、原画をそのまま動画に回す。`);
    return true;
  }

  // ---------- capacity forecast (for the desk's report) ----------
  function forecast(s) {
    const T = TIERS[s.tier], st = s.staff, p = s.policy;
    const conte = (0.45 + st.dir.speed / 250) * (p.mode === "quality" ? 0.9 : 1) * modMul(s, "conte") * modMul(s, "pre");
    const script = (0.40 + st.wri.speed / 250) * modMul(s, "pre");
    const genga = s.animators.filter((a) => !a.retire).reduce((x, a) => x + a.speed * (a.overseas ? modMul(s, "os") : 1), 0) * otMul(s) * (p.mode === "quality" ? 0.88 : 1) * modMul(s, "ga");
    const sakkan = s.sakkans.reduce((x, k) => x + k.cap, 0) * otMul(s) * (p.mode === "quality" ? 0.85 : 1) * modMul(s, "ga");
    const douga = (T.dougaCap * otMul(s) * modMul(s, "ga") + (p.douga === "overseas" ? 250 * modMul(s, "os") : 0));
    const satsuei = T.satsueiCap * otMul(s);
    // required pace for each cut stage so every episode can still make its air date
    const need = { genga: 0, sakkan: 0, douga: 0, satsuei: 0 };
    const lag = { genga: 3, sakkan: 2, douga: 1, satsuei: 0 };   // later stages need the work handed over earlier
    for (const k of Object.keys(need)) {
      let acc = 0;
      unaired(s).forEach((ep, i) => {
        acc += ep.cuts - (k === "sakkan" && ep.skipSakkan ? ep.cuts : ep[k]);
        const w = Math.max(1, s.nextAir + i - s.week + 1 - lag[k]);
        need[k] = Math.max(need[k], acc / w);
      });
    }
    let needConte = 0, accC = 0;
    unaired(s).forEach((ep, i) => { accC += 1 - ep.conte; needConte = Math.max(needConte, accC / Math.max(1, s.nextAir + i - s.week + 1 - 4)); });
    return { conte, script, genga, sakkan, douga, satsuei, need, needConte };
  }
  // the desk's one-line read of the biggest problem
  function deskComment(s) {
    const f = s.stat || forecast(s);
    const gone = s.shinkos.filter((x) => x.gone);
    if (gone.length) return `進行の${gone[0].name}と連絡が取れません。担当の話数が止まりかけています。`;
    const ratios = [
      ["conte", f.conte / Math.max(0.01, f.needConte), "コンテが上がってきません。後半の話数が危ないです。"],
      ["genga", f.genga / Math.max(1, f.need.genga), "原画マンが足りません。外から人を探しましょう。"],
      ["sakkan", f.sakkan / Math.max(1, f.need.sakkan), "作監が回っていません。作監修正待ちのカットが積み上がっています。"],
      ["douga", f.douga / Math.max(1, f.need.douga), "動画・仕上げが追いついていません。海外に出すか、残業ですね。"],
      ["satsuei", f.satsuei / Math.max(1, f.need.satsuei), "撮影がパンクしそうです。"],
    ].sort((a, b) => a[1] - b[1]);
    const worst = ratios[0];
    if (worst[1] < 1) return worst[2];
    const tired = s.shinkos.filter((x) => !x.gone && x.stamina < 30);
    if (tired.length) return `進行の${tired[0].name}がかなり疲れています。そろそろ飛びますよ。`;
    if (s.aired === 0 && s.week >= s.pre - 1) return "放送まであとわずか。今のペースなら間に合います。";
    return "今のペースなら、全話間に合います。";
  }

  // ---------- one week of production ----------
  function produce(s) {
    const T = TIERS[s.tier], st = s.staff, p = s.policy, g = grades(s);
    s.weekSpend = 0;
    assign(s);
    const eps = unaired(s);
    // Cuts flow 原画 → 作監 → 動画・仕上げ → 撮影. A stage can use what was waiting at the start
    // of the week plus half of what the stage before it finished this week.
    const avail = (ep, k, start) => start + 0.5 * (ep[k] - start);
    const start0 = new Map(eps.map((e) => [e.n, { genga: e.genga, sakkan: e.sakkan, douga: e.douga }]));
    // 原画: an animator who finishes a batch picks up the next one in the same week
    for (const a of s.animators) {
      if (a.hold > 0) continue;
      let work = a.speed * otMul(s) * (p.mode === "quality" ? 0.88 : 1) * modMul(s, "ga") * (a.overseas ? modMul(s, "os") : 1);
      for (let guard = 0; work > 0.01 && guard < 6; guard++) {
        if (a.ep == null) { if (a.retire) break; const next = findEp(s, a); if (!next || !giveBatch(s, a, next)) break; }
        const ep = epBy(s, a.ep), eff = shinkoEff(s, ep);
        const t = Math.min(work * eff, a.batch - a.done);
        a.done += t; ep.genga = Math.min(ep.cuts, ep.genga + t); work -= t / eff;
        ep.qGenga += t * (a.skill + (p.mode === "quality" ? 5 : 0) + (p.rate === "up" && !a.overseas ? 3 : 0) - (p.ot ? 2 : 0));
        pay(s, "genga", CUT_BASE * a.rate * (a.overseas ? 1 : g.rateUp) * t);
        pay(s, "zairyo", 35 * g.studio * t / ep.cuts);
        pay(s, "enshutsu", 50 * g.dir * t / ep.cuts);
        pay(s, "kantoku", 20 * g.dir * t / ep.cuts);
        if (a.done >= a.batch - 0.01) {
          if (ep.alloc >= ep.cuts && ep.genga > ep.cuts - 0.5) ep.genga = ep.cuts;
          a.ep = null; a.batch = 0; a.done = 0;
        }
      }
    }
    // 作監修正: each 作監 handles their own episodes first, then helps with the oldest backlog
    const sakCap = new Map(s.sakkans.map((k) => [k.id, k.cap * otMul(s) * (p.mode === "quality" ? 0.85 : 1) * modMul(s, "ga")]));
    const doSakkan = (sk, ep) => {
      let c = sakCap.get(sk.id);
      if (c <= 0) return;
      const eff = shinkoEff(s, ep);
      const t = Math.min(avail(ep, "genga", start0.get(ep.n).genga) - ep.sakkan, c * eff);
      if (t <= 0) return;
      ep.sakkan += t; sakCap.set(sk.id, c - t / eff);
      ep.qSakkan += t * (sk.skill + (p.mode === "quality" ? 5 : 0) + (p.rate === "up" ? 2 : 0));
      pay(s, "sakkan", 30 * sk.grade * g.rateUp * t / ep.cuts);
    };
    for (const sk of s.sakkans) for (const ep of eps.filter((e) => e.sakkanId === sk.id && !e.skipSakkan)) doSakkan(sk, ep);
    for (const sk of s.sakkans) for (const ep of eps.filter((e) => !e.skipSakkan && e.sakkanId != null)) doSakkan(sk, ep);
    // 動画・仕上げ (in-house first, then overseas)
    let inCap = T.dougaCap * otMul(s) * modMul(s, "ga"), osCap = p.douga === "overseas" ? 250 * modMul(s, "os") : 0;
    for (const ep of eps) {
      if (inCap + osCap <= 0) break;
      const st0 = start0.get(ep.n);
      const ready = (ep.skipSakkan ? avail(ep, "genga", st0.genga) : avail(ep, "sakkan", st0.sakkan)) - ep.douga;
      if (ready <= 0) continue;
      const eff = shinkoEff(s, ep);
      const t1 = Math.min(ready, inCap * eff);
      const t2 = Math.min(ready - t1, osCap * eff);
      inCap -= t1 / eff; osCap -= t2 / eff;
      const t = t1 + t2;
      if (t <= 0) continue;
      ep.douga += t; ep.qDouga += t1 * T.dougaSkill + t2 * 40;
      pay(s, "douga", DOUGA_CUT * (t1 * g.studio * g.rateUp + t2 * g.studio * 0.6));
      pay(s, "haikei", 130 * g.studio * t / ep.cuts);
      pay(s, "shiage", 120 * g.studio * (t1 + t2 * 0.7) / ep.cuts);
    }
    // 撮影・編集, then 音響 and delivery
    let cap = T.satsueiCap * otMul(s);
    for (const ep of eps) {
      if (cap <= 0) break;
      const t = Math.min(avail(ep, "douga", start0.get(ep.n).douga) - ep.satsuei, cap * shinkoEff(s, ep));
      if (t > 0) { ep.satsuei += t; cap -= t; pay(s, "satsuei", 100 * g.studio * t / ep.cuts); pay(s, "henshu", 25 * g.studio * t / ep.cuts); pay(s, "print", 50 * g.studio * t / ep.cuts); }
      if (!ep.delivered && ep.satsuei >= ep.cuts - 0.5 && ep.douga >= ep.cuts - 0.5) {
        ep.satsuei = ep.cuts; ep.douga = ep.cuts; ep.delivered = true;
        pay(s, "onkyo", 150 * g.va);
        log(s, `第${ep.n}話、完パケ。音響も上がって納品済み。`);
      }
    }
    // コンテ and 脚本 (episode by episode)
    let conte = (0.45 + st.dir.speed / 250) * (p.mode === "quality" ? 0.9 : 1) * modMul(s, "conte") * modMul(s, "pre");
    for (const ep of eps) {
      if (conte <= 0) break;
      if (ep.conte >= 1) continue;
      const room = Math.min(1 - ep.conte, ep.script - ep.conte);   // can't storyboard past the script
      const t = Math.min(room, conte);
      if (t <= 0) break;
      ep.conte += t; conte -= t; pay(s, "conte", 25 * g.dir * t);
      if (ep.conte >= 0.999) { ep.conte = 1; log(s, `第${ep.n}話のコンテが上がった。`); }
    }
    let script = (0.40 + st.wri.speed / 250) * modMul(s, "pre");
    for (const ep of eps) {
      if (script <= 0) break;
      if (ep.script >= 1) continue;
      const t = Math.min(1 - ep.script, script);
      ep.script += t; script -= t; pay(s, "kyakuhon", 25 * g.wri * t);
      if (ep.script >= 0.999) ep.script = 1;
    }
    // 制作進行料: salaries every week
    pay(s, "shinko", 100 * EPISODES * g.studio * g.desk / (s.pre + EPISODES) * (p.ot ? 1.1 : 1));
    // people
    for (const sh of s.shinkos) {
      if (sh.gone) { sh.goneWeeks = (sh.goneWeeks || 0) + 1; continue; }
      const active = eps.filter((e) => e.shinko === sh.id && !e.delivered && e.conte >= 1).length;
      sh.stamina = clamp(sh.stamina - (2 + active * 2.2) - (p.ot ? 5 : 0) + (active <= 1 && !p.ot ? 6 : 0) + (sh.helped ? 18 : 0), 0, 100);
      sh.helped = false;
    }
    const leave = (p.rate === "keep" ? 0.05 : 0.015) + (p.ot ? 0.03 : 0);
    for (const a of s.animators.slice()) {
      if (a.hold > 0) { a.hold--; if (a.hold === 0) log(s, `${a.name}さんと連絡がついた。`); }
      if (a.inhouse || a.overseas) continue;
      if (rnd(s) < leave) { freeAnimator(s, a); s.animators.splice(s.animators.indexOf(a), 1); log(s, `原画の${a.name}さんが他社の仕事に移った。`); }
    }
    // overseas studio leaves once the policy is off and its batch is done
    for (const a of s.animators.slice()) if (a.overseas && s.policy.genga !== "overseas") { if (a.ep == null) s.animators.splice(s.animators.indexOf(a), 1); else a.retire = true; }
    s.mods.forEach((m) => m.weeks--);
    s.mods = s.mods.filter((m) => m.weeks > 0);
    if (s.cool.pv > 0) s.cool.pv--;
    if (s.cool.event > 0) s.cool.event--;
    s.lastCost = s.weekSpend;
  }

  // ---------- quality ----------
  function epQuality(s, ep) {
    const T = TIERS[s.tier], st = s.staff;
    const qG = ep.genga > 0 ? ep.qGenga / ep.genga : avg(s.animators.filter((a) => a.inhouse).map((a) => a.skill));
    const checked = ep.skipSakkan ? ep.sakkan / Math.max(1, ep.genga) : 1;
    const qS0 = ep.sakkan > 0 ? ep.qSakkan / ep.sakkan : (sakkanBy(s, ep.sakkanId)?.skill ?? qG);
    const qS = qS0 * checked + qG * 0.9 * (1 - checked);     // 作監を通していないカットは原画のまま
    const qD = ep.douga > 0 ? ep.qDouga / ep.douga : T.dougaSkill;
    return clamp(0.35 * qG + 0.25 * qS + 0.15 * (st.dir.skill + s.dirMood) + 0.10 * st.wri.skill + 0.10 * qD + 0.05 * T.satsueiSkill
                 + synergy(s) + ep.bonus + (st.va.act - 65) * 0.05, 0, 100);
  }

  // ---------- airing ----------
  function airDue(s) { return s.aired < EPISODES && s.week === s.nextAir; }
  function airEpisode(s, choice) {
    const ep = unaired(s)[0];
    const T = TIERS[s.tier], g = grades(s);
    const prog = ep.satsuei / ep.cuts;
    if (choice === "recap") {
      s.recaps++; s.nextAir++;
      s.H = clamp(s.H - 6, 0, 150); s.R = clamp(s.R - 2, 0, 100);
      log(s, `第${s.week}週は総集編を放送。第${ep.n}話は翌週へ。`);
      s.sns.unshift(...snsLines(s, "recap", ep.n));
      return { recap: true, ep };
    }
    if (choice === "delay") {
      s.delays++; s.nextAir += 2;
      s.H = clamp(s.H - 15, 0, 150); s.R = clamp(s.R - 4, 0, 100); s.trust = clamp(s.trust - 25, 0, 100);
      log(s, `万策尽きた。第${ep.n}話以降の放送を2週延期。`);
      s.sns.unshift(...snsLines(s, "delay", ep.n));
      return { delay: true, ep };
    }
    const f = prog >= 1 ? 1 : 0.35 + 0.65 * Math.pow(prog, 1.5);
    const q = epQuality(s, ep) * f;
    if (!ep.delivered) pay(s, "onkyo", 150 * g.va);   // アフレコ・ダビングは間に合わせる
    pay(s, "gensaku", 5 * g.gensaku);
    ep.aired = true; ep.airQ = Math.round(q); ep.collapse = prog < 0.85; ep.airProg = Math.min(1, prog);
    // anyone still holding cuts of this episode lets them go
    for (const a of s.animators) if (a.ep === ep.n) { a.ep = null; a.batch = 0; a.done = 0; a.pin = null; }
    s.aired++; s.nextAir++;
    const E = T.exp + (s.H - 50) * 0.18;
    const rec = q - E;
    s.R = clamp(s.R * 0.75 + clamp(55 + rec * 1.6, 0, 100) * 0.25, 0, 100);
    s.H = clamp(s.H + rec * 0.35 - (ep.collapse ? 8 : 0), 0, 150);
    s.lastAirQ = q; s.lastCollapse = ep.collapse;
    const grade = ep.collapse ? "collapse" : q >= 76 ? "god" : q >= 64 ? "good" : q >= 52 ? "mid" : "bad";
    ep.grade = grade;
    log(s, `第${ep.n}話 放送。作画の出来 ${ep.airQ}${ep.collapse ? "（作画崩壊）" : ""}。`);
    s.sns.unshift(...snsLines(s, grade, ep.n));
    if (s.sns.length > 40) s.sns.length = 40;
    s.kv.push({ n: ep.n, q: ep.airQ, collapse: ep.collapse, seed: s.rs });
    return { ep, q, grade };
  }

  const HANDLES = ["@anime_mitai", "@sakuga_kamikaze", "@yoru_no_otaku", "@genkaku_fan", "@kanshi_iinkai", "@nemui_shakaijin", "@cut_bukuro", "@ichiban_kuji", "@rewatch_3kaime", "@sinya_tv"];
  const SNS = {
    god: ["今週の作画、劇場版かよ", "この制作会社に何があった（褒め）", "作監の名前覚えた", "3回見返した。全カット止められる", "円盤買います"],
    good: ["安定して面白い", "今期はこれ追う", "OPの入りが好き", "原作のあのシーンが丁寧で泣いた"],
    mid: ["まあ普通", "来週に期待", "悪くはないけど地味", "途中でスマホ見てた"],
    bad: ["作画どうした", "顔が毎カット違う", "動かないな今週", "ちょっと心配になってきた"],
    collapse: ["作画崩壊してて草", "止め絵の紙芝居", "この回だけ別のアニメ", "原画マンの悲鳴が聞こえる", "円盤で直るって信じてる"],
    recap: ["もう総集編…？", "察し", "制作さん生きて", "総集編なのに新規カットがない"],
    delay: ["万策尽きたか", "放送延期って本当？", "スタッフの体調が心配", "委員会どうなってるの"],
  };
  function snsLines(s, kind, n) {
    return shuffle(s, SNS[kind]).slice(0, 2).map((t) => ({ n, kind, h: pick(s, HANDLES), t })).reverse();
  }

  // ---------- producer actions ----------
  const ACTIONS = {
    help:      { label: "ヘルプに入る", ap: 1, cost: 0, desc: "この進行の担当話数を自分も回す。今週の進みが上がり、疲れも取れる" },
    hireShinko:{ label: "新しい進行を採用", ap: 1, cost: 50, desc: "連絡が取れない進行の代わりに、新人を入れる" },
    scout:     { label: "原画マン探し", ap: 1, cost: 0, desc: "人脈をあたって外部の原画マンを口説く" },
    scoutSakkan:{ label: "作監探し", ap: 1, cost: 0, desc: "外部の作画監督を探す" },
    extConte:  { label: "外部コンテマンに頼む", ap: 1, cost: 150, desc: "3週間コンテが速くなる。監督の色は少し薄れる" },
    dirTalk:   { label: "監督と打ち合わせ", ap: 1, cost: 0, desc: "監督の機嫌を取る（品質の低下を戻す）" },
    committee: { label: "委員会対応", ap: 1, cost: 0, desc: "委員会の信頼+12" },
    extra:     { label: "追加出資のお願い", ap: 1, cost: 0, desc: "信頼65以上で1回だけ。予算が増え、自社の取り分は減る" },
    sns:       { label: "SNS施策", ap: 1, cost: 100, desc: "期待値が少し上がる" },
    pv:        { label: "PV公開", ap: 1, cost: 800, desc: "期待値が上がる（3週に1回）" },
    event:     { label: "イベント出展", ap: 2, cost: 1500, desc: "期待値が大きく上がる（4週に1回）" },
    collab:    { label: "コラボカフェ", ap: 1, cost: 600, desc: "放送中のみ。グッズ売上が伸びる" },
  };
  function canAct(s, id, arg) {
    const a = ACTIONS[id];
    if (s.phase !== "prod" || s.ap < a.ap) return false;
    if (id === "help") { const sh = shinkoBy(s, arg); return !!sh && !sh.gone && !sh.helped; }
    if (id === "hireShinko") { const sh = shinkoBy(s, arg); return !!sh && sh.gone; }
    if (id === "extra") return s.trust >= 65 && s.flags.extraUsed < 1;
    if (id === "committee") return s.trust < 100;
    if (id === "dirTalk") return s.dirMood < 0;
    if (id === "extConte") return !s.mods.some((m) => m.id === "extConte") && unaired(s).some((e) => e.conte < 1);
    if (id === "pv") return s.cool.pv === 0;
    if (id === "event") return s.cool.event === 0;
    if (id === "collab") return s.aired > 0 && s.flags.collab < 0.4;
    return true;
  }
  const hypeGain = (s, g) => g * clamp(1.3 - s.H / 150, 0.3, 1.3);
  function doAction(s, id, arg) {
    if (!canAct(s, id, arg)) return null;
    const a = ACTIONS[id];
    s.ap -= a.ap;
    if (a.cost) { s.spent += a.cost; s.spentBy.promo = (s.spentBy.promo || 0) + a.cost; }
    let msg = "";
    if (id === "help") {
      const sh = shinkoBy(s, arg); sh.helped = true; s.helpCount++;
      msg = `${sh.name}の担当話数を一緒に回した。カット袋の回収、原画マンへの催促、作監への受け渡し。`;
    } else if (id === "hireShinko") {
      const old = shinkoBy(s, arg), nu = makeShinko(s, true);
      s.shinkos.splice(s.shinkos.indexOf(old), 1, nu);
      s.eps.forEach((e) => { if (e.shinko === old.id) e.shinko = nu.id; });
      msg = `新人進行の${nu.name}を採用。${old.name}の担当を引き継がせた。`;
    } else if (id === "scout") {
      s.scoutCount++;
      s.scout = { kind: "anim", list: Array.from({ length: 3 }, () => makeAnimator(s, 40, 90, false)) };
      msg = "知り合いの原画マンに片っ端から電話をかけた。";
    } else if (id === "scoutSakkan") {
      s.scout = { kind: "sakkan", list: Array.from({ length: 3 }, () => makeSakkan(s, 48, 88, false)) };
      msg = "作監をやってくれる人を探して回った。";
    } else if (id === "extConte") {
      addMod(s, "extConte", 3, 1.6, "conte");
      s.dirMood -= 1;
      msg = "外部のコンテマンに数話分のコンテを頼んだ。";
    } else if (id === "dirTalk") {
      s.dirMood = Math.min(0, s.dirMood + 2);
      msg = `監督・${s.staff.dir.name}と飲みに行った。少し機嫌が直った。`;
    } else if (id === "committee") {

    else if (id === "pv") { const g = hypeGain(s, 9); s.H += g; s.cool.pv = 3; s.promo++; msg = `PVを公開。期待値 +${g.toFixed(1)}`; }

    else if (id === "collab") { s.flags.collab = Math.min(0.4, s.flags.collab + 0.08); msg = "コラボカフェを開催。グッズ売上が伸びそうだ。"; }

  }
  // 単価の上限: 上げなければスタジオの相場まで、上げれば1.3倍まで
  const rateCap = (s) => TIERS[s.tier].rateCap * (s.policy.rate === "up" ? 1.3 : 1);

  function hire(s, f) {

  const EVENTS = {
    tobi: { title: "制作進行が飛んだ", when: (s) => s.shinkos.some((x) => !x.gone), weight: (s) => 0.6 + s.shinkos.filter((x) => !x.gone && x.stamina < 30).length * 2.5 + (s.policy.ot ? 1 : 0),

      text: (s, p) => `進行の${shinkoBy(s, p.id).name}と連絡が取れない。担当話数のカット袋が机に積まれたままだ。`,

        { label: "そのままにする（担当話数が大きく遅れる。新しい進行を採用できる）", run: (s, p) => { const sh = shinkoBy(s, p.id); sh.gone = true; sh.goneWeeks = 0; return `${sh.name}の席は空いたままだ。`; } },
      ] },
    kakae: { title: "カットを抱えたまま連絡が取れない", when: (s) => s.animators.some((a) => !a.inhouse && !a.overseas && a.ep != null && a.batch - a.done > 5),
      weight: () => 1.1,
      prep: (s) => { const l = s.animators.filter((a) => !a.inhouse && !a.overseas && a.ep != null && a.batch - a.done > 5); return { id: pick(s, l).id }; },
      text: (s, p) => { const a = animBy(s, p.id); return `原画の${a.name}さんが、第${a.ep}話のカット${Math.round(a.batch - a.done)}本を抱えたまま連絡が取れない。`; },
      choices: [
        { label: "カットを回収して他の人に回す（行動−1）", ap: 1, run: (s, p) => { const a = animBy(s, p.id); const n = a.ep; freeAnimator(s, a); a.hold = 2; return `第${n}話のカットを回収した。`; } },
        { label: "連絡を待つ（2週間止まる）", run: (s, p) => { const a = animBy(s, p.id); a.hold = 2; return "待つことにした。"; } },
      ] },
    hikinuki: { title: "原画マンの引き抜き", when: (s) => s.animators.some((a) => !a.inhouse && !a.overseas), weight: (s) => (s.policy.rate === "keep" ? 1.5 : 0.5),
      prep: (s) => ({ id: pick(s, s.animators.filter((a) => !a.inhouse && !a.overseas)).id }),
      text: (s, p) => `原画の${animBy(s, p.id).name}さんに、他社の劇場作品から声がかかっている。`,
      choices: [
        { label: "単価を上げて引き止める（この人の単価+30%）", run: (s, p) => { const a = animBy(s, p.id); a.rate = Math.round(a.rate * 1.3 * 100) / 100; return `${a.name}さんは残ってくれた。`; } },

        { label: "却下する（監督の機嫌が悪くなり、全話の品質−3）", run: (s) => { s.dirMood -= 3; return "監督は黙って席に戻った。"; } },

    buzz: { title: "PVがバズった", weight: (s) => 0.4 + s.promo * 0.12,

      choices: [{ label: "休ませる（2週間、作画の進み−15%）", run: (s) => { addMod(s, "down", 2, 0.85, "ga"); return "みんなに休めと言った。"; } }] },

  function cutBack(s, ep, n) {
    if (!ep || ep.aired) return;
    const back = Math.min(n, ep.genga);
    const keep = ep.genga - back;

  function rollEvent(s) {
    const T = TIERS[s.tier];
    const p = 0.42 * T.eventMul * (1.15 - s.staff.desk.mgmt / 250);
    if (rnd(s) > p) return null;
    const pool = Object.entries(EVENTS).filter(([, e]) => !e.when || e.when(s)).map(([id, e]) => [id, Math.max(0, e.weight(s))]);
    const total = pool.reduce((a, [, w]) => a + w, 0);
    let r = rnd(s) * total;
    for (const [id, w] of pool) { r -= w; if (r <= 0) { const ev = EVENTS[id]; s.event = { id, p: ev.prep ? ev.prep(s) : {} }; return s.event; } }
    return null;
  }
  function eventView(s) {
    if (!s.event) return null;
    const ev = EVENTS[s.event.id], p = s.event.p;
    return { id: s.event.id, title: ev.title, text: ev.text(s, p), choices: ev.choices.map((c, i) => ({ i, label: c.label, ok: (!c.ap || s.ap >= c.ap) && (!c.need || c.need(s, p)) })) };
  }
  function resolveEvent(s, i) {
    const ev = EVENTS[s.event.id], c = ev.choices[i], p = s.event.p;
    if (c.ap) { if (s.ap < c.ap) return null; s.ap -= c.ap; }
    const msg = c.run(s, p);
    s.H = clamp(s.H, 0, 150);
    log(s, `【${ev.title}】${msg}`);
    s.event = null;
    s.stat = forecast(s);

  }

  // ---------- turn ----------
  function endWeek(s) {
    produce(s);
    if (airDue(s)) {
      const ep = unaired(s)[0];
      if (ep.satsuei >= ep.cuts) s.lastAir = airEpisode(s, "air");

  function resolveAir(s, choice) {
    if (!s.pendingAir) return null;

  function nextWeek(s) {

  function revenue(s) {

    const bd = Math.pow(Math.max(0, P - 35), 2.3) * 8 * m * orig;
    const goods = Math.pow(P, 1.5) * 12 * m * s.flags.goods * (1 + s.flags.collab) * orig;
    const osVar = (1000 + 2.5 * P * P) * m * orig;
    const season2 = P >= 72 && s.trust >= 40 ? 20000 * m : 0;
    const lines = [
      { k: "配信", v: s.flags.mg ?? streamVar, fixed: s.flags.mg != null, alt: streamVar },
      { k: "円盤（Blu-ray）", v: bd },
      { k: "グッズ", v: goods },
      { k: "海外", v: s.flags.os ?? osVar, fixed: s.flags.os != null, alt: osVar },
      { k: "二期決定（IPの価値）", v: season2 },
    ].map((l) => ({ ...l, v: Math.round(l.v), alt: l.alt != null ? Math.round(l.alt) : null }));
    return { P, lines, total: lines.reduce((a, l) => a + l.v, 0) };
  }
  function finish(s) {
    const rev = revenue(s);
    const perEp = s.estPerEp.total;
    // 未完成のまま納品した回は制作費が減額され、作画崩壊した回は円盤用に描き直す
    const cutPay = (s.B / EPISODES) * s.eps.reduce((a, e) => a + (1 - (e.airProg ?? 1)), 0);
    const bdFix = s.eps.filter((e) => e.collapse).length * perEp * 0.5;
    const prodBalance = s.B - cutPay - bdFix - s.spent;
    const invest = rev.total * s.share - s.own;
    const score = Math.round(prodBalance + invest);
    const k = TIERS[s.tier].rankMul;
    const rank = score >= 15000 * k ? "S" : score >= 6000 * k ? "A" : score >= 0 ? "B" : score >= -6000 * k ? "C" : "D";
    s.result = { rev, prodBalance: Math.round(prodBalance), cutPay: Math.round(cutPay), bdFix: Math.round(bdFix), invest: Math.round(invest), score, rank, P: rev.P };
    s.phase = "end";
    log(s, `最終回放送。決算スコア ${fmt(score)}（${rank}）。`);
  }

  return { TIERS, SOURCES, ROLE_DEFS, COST_LINES, KANRI, CUT_BASE, EPISODES, STAGES, STAGE_LABEL, ACTIONS, MAX_PER_EP,
           newGame, chooseSource, chooseStaff, staffReady, synergy, initialHype, grades, estimatePerEp, estimate, makeOffers, committee, startProduction,
           progress, stageOf, airWeekOf, weeksLeft, unaired, epBy, shinkoBy, sakkanBy, animBy, animatorsOn, shinkoEff, forecast, deskComment,
           epQuality, canAct, doAction, canHire, hire, release, setPolicy, rateCap, moveAnimator, unpin, setSakkan, canSkipSakkan, skipSakkan,
           eventView, resolveEvent, endWeek, resolveAir, popularity, revenue, fmt, clamp };
})();
if (typeof module !== "undefined") module.exports = Engine;

  // ---------- pixel art helpers ----------
  function prng(seed) { let a = seed | 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const HAIR = ["#2b2233", "#5a3a26", "#9b6b3f", "#c9c3b8", "#3d4f7a", "#7a2d3a", "#1f1f1f", "#d9b36a"];
  const SKIN = ["#f3d2b8", "#e9bf9b", "#d9a77f", "#f6dccb"];
  function lookOf(seed, shirt) {
    const r = prng(seed);
    return { hair: HAIR[(r() * HAIR.length) | 0], skin: SKIN[(r() * SKIN.length) | 0], style: (r() * 4) | 0, glasses: r() < 0.3, beard: r() < 0.15, shirt: shirt || ["#4a6fa5", "#7a5c8a", "#5a7a5a", "#a5704a", "#4a4a5a"][(r() * 5) | 0], ph: r() * 10 };
  }
  function faceCanvas(seed, cls = "") {
    const size = 12, c = document.createElement("canvas"); c.width = c.height = size; c.className = "px face " + cls;
    const g = c.getContext("2d"), L = lookOf(seed);
    const bg = ["#c9d3e3", "#d7e6d9", "#ead9e4", "#e6e1cf"][(seed >>> 3) % 4];
    const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
    g.fillStyle = bg; g.fillRect(0, 0, size, size);
    g.fillStyle = L.shirt; g.fillRect(2, 10, 8, 2);
    g.fillStyle = L.skin; g.fillRect(3, 3, 6, 7); g.fillRect(5, 9, 2, 1);

  // Key visual of an aired episode: the heroine, drawn worse as the episode's quality drops.

    const j = () => (r() < bad ? Math.round((r() - 0.5) * 4 * bad) : 0);

    if (hairHi !== hair) { rect(11, 7, 4, 1, hairHi); rect(18, 7, 3, 1, hairHi); }

    if (q >= 64 && !item.collapse) { rect(mx, my, 3, 1, "#c4506a"); px(mx + 1, my + 1, "#c4506a"); } else rect(mx, my, 2, 1, "#8a4a52");

  const TABS = [["desk", "デスク"], ["board", "香盤表"], ["me", "予算・宣伝"], ["phone", "人を探す"], ["tv", "放送・SNS"]];
  function panelHtml() {
    const tabs = `<div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button role="tab" aria-selected="${panel === k}" class="${panel === k ? "on" : ""}" data-act="panel" data-v="${k}">${t}</button>`).join("")}</div>`;

    if (kind === "desk") body = deskPanel();
    else if (kind === "board") body = boardPanel();
    else if (kind === "shinko") body = shinkoPanel(+arg);

    else if (kind === "anim") body = animPanel(+arg);
    else if (kind === "sakkan") body = sakkanPanel(+arg);
    else if (kind === "dir") body = dirPanel();
    else if (kind === "post") body = postPanel();
    else if (kind === "me") body = mePanel();
    else if (kind === "phone") body = phonePanel();
    else if (kind === "tv") body = tvPanel();
    if (!body) { panel = "desk"; body = deskPanel(); }
    return tabs + body;

      ${stageBar(ep)}
      <div class="stages">

        </div>
        <div class="row" style="gap:6px">
          <button class="btn small" data-act="pickAnim" data-v="${ep.n}" ${ep.conte >= 1 && unalloc > 0 ? "" : "disabled"}>原画マンを回す</button>

  function stamBar(v) { return `<span class="stam"><i style="width:${v}%;background:${v < 30 ? "var(--red)" : v < 55 ? "var(--marker)" : "var(--black)"}"></i></span>`; }
  function shinkoPanel(id) {
    const p = E.shinkoBy(s, id);

    return `<section class="sheet">

        <p class="speech" style="margin:10px 0 0">${esc(p.gone ? "（席は空いたまま。電話もつながらない）" : p.stamina < 25 ? "……すみません、ちょっと、限界かもです……" : p.stamina < 50 ? "原画マンさんの催促、今日で3周目です。" : active.some(danger) ? `第${active.find(danger).n}話がやばいです。手を貸してもらえますか。` : "担当話数、今のところ回ってます！")}</p>
        <div class="row" style="margin-top:10px">

      </section>
      ${active.length ? active.map((e) => epCard(e, false)).join("") : `<section class="sheet"><p class="sub" style="margin:0">担当話数はすべて放送済みです。</p></section>`}`;
  }
  function epPanel(n) {
    const ep = E.epBy(s, n);

    return `<section class="sheet"><div class="row" style="justify-content:space-between"><h3 style="margin:0">第${n}話の班</h3><span class="sub">担当進行：${sh ? esc(sh.name) : "—"}</span></div></section>${epCard(ep, true)}

  }
  function animPanel(id) {
    const a = E.animBy(s, id);

    const ep = a.ep != null ? E.epBy(s, a.ep) : null;

    return `<section class="sheet">

        <dt>速さ</dt><dd>週 ${a.speed} カット</dd>
        <dt>単価</dt><dd>${yen(E.CUT_BASE * a.rate * (a.overseas ? 1 : E.grades(s).rateUp))}/カット（ランク×${a.rate.toFixed(2)}）</dd>
        <dt>いまの仕事</dt><dd>${a.hold > 0 ? "連絡がつかない" : ep ? `第${ep.n}話の持ちカット ${Math.floor(a.done)}/${a.batch}本` : "手が空いている（デスクが次のカットを振ります）"}</dd>

  function sakkanPanel(id) {

      ${who(k.seed, k.inhouse ? "社内の作画監督" : "外部の作画監督", k.name)}

        <dt>実力</dt><dd>${k.skill}（各話の品質に大きく効く）</dd>

      <p class="speech" style="margin:10px 0 0">${sakkanBacklog(k) > 200 ? "原画が山のように来てる。全部は見きれないよ。" : sakkanBacklog(k) > 0 ? "上がってきた原画から順に直してる。" : "今は手が空いてる。"}</p>

  function dirPanel() {

  function postPanel() {

        <dt>動画・仕上げ</dt><dd>社内 週${E.TIERS[s.tier].dougaCap}カット${s.policy.douga === "overseas" ? "＋海外 週250カット" : ""}／待ち ${Math.round(waitD)}カット</dd>

            ${E.COST_LINES.map((l, i) => `<tr><td>${esc(l.label)}</td><td class="r">${yen(l.base)}</td><td class="r">${yen(s.estPerEp.lines[i].v)}</td><td class="r">${yen((by[l.k] || 0) / 12)}</td></tr>`).join("")}

          <p id="shareText" style="white-space:pre-wrap;margin:0 0 8px;user-select:all">${esc(shareText())}</p>
          <div class="row"><button class="btn" data-act="copy">コピー</button><span class="sub" id="copyMsg"></span></div></section>
        <div class="row"><button class="btn primary" data-act="again">同じスタジオでもう一度</button><button class="btn" data-act="title">スタジオを選び直す</button></div>
      </div>`;
    app.querySelectorAll("[data-kv]").forEach((el) => { const k = s.kv.find((x) => x.n === +el.dataset.kv && !x.recap); if (k) { el.innerHTML = ""; el.appendChild(kvCanvas(k)); } });
  }
  function shareText() {
    const r = s.result;
    const row = s.eps.map((e) => (e.collapse ? "🟥" : e.grade === "god" ? "🟪" : e.grade === "good" ? "🟩" : e.grade === "mid" ? "🟨" : "🟧")).join("");
    return `深夜アニメP ${E.TIERS[s.tier].name}「${s.src.title}」\n${row}${s.recaps ? ` 総集編${s.recaps}` : ""}\n決算 ${r.score >= 0 ? "+" : ""}${fmt(r.score)}（${r.rank}）`;
  }

  // ---------- modals ----------
  function showModal(m) { modal = m; renderModal(); }
  function closeModal() { modal = null; modalRoot.innerHTML = ""; }
  function renderModal() {
    if (!modal) { modalRoot.innerHTML = ""; return; }
    let body = "";
    if (modal.kind === "event") {
      const v = E.eventView(s);
      if (!v) return closeModal();
      body = `<h2>${esc(v.title)}</h2><p>${esc(v.text)}</p>
        <div class="choices">${v.choices.map((c) => `<button class="btn" data-act="evChoice" data-v="${c.i}" ${c.ok ? "" : "disabled"}>${esc(c.label)}</button>`).join("")}</div>`;
    } else if (modal.kind === "air") {
      const pa = s.pendingAir, pct = Math.round(pa.prog * 100);
      body = `<h2>第${pa.n}話が間に合わない</h2>
        <p>放送日なのに、第${pa.n}話は撮影まで終わったカットが${pct}%しかありません。</p>
        <div class="choices">
          <button class="btn" data-act="airChoice" data-v="air">このまま放送する（${pct < 85 ? "作画崩壊は確実" : "品質が落ちる"}）</button>
          <button class="btn" data-act="airChoice" data-v="recap" ${s.recaps >= 2 ? "disabled" : ""}>総集編を挟む（期待値−6・評判−2、残り${2 - s.recaps}回）</button>
          <button class="btn" data-act="airChoice" data-v="delay">万策尽きた。放送を2週延期（期待値−15・信頼−25）</button>
        </div>`;
    } else if (modal.kind === "aired") {
      const a = s.lastAir;
      if (!a || !a.ep || a.recap || a.delay) { const next = modal.next; closeModal(); return afterTurn(next); }
      const posts = s.sns.filter((p) => p.n === a.ep.n).slice(0, 2);
      body = `<h2>第${a.ep.n}話 放送</h2>
        <div class="bigkv"><span data-bigkv></span>
          <div><p style="margin:0">作画の出来 <b class="num" style="font-size:22px">${a.ep.airQ}</b> ${a.ep.collapse ? '<span class="tagx t-bad">作画崩壊</span>' : a.grade === "god" ? '<span class="tagx t-ok">神回</span>' : ""}</p>
          ${posts.map((p) => `<div class="post ${["god", "good"].includes(p.kind) ? "good" : ["bad", "collapse"].includes(p.kind) ? "bad" : ""}" style="margin-top:6px"><span class="h">${esc(p.h)}</span><br>${esc(p.t)}</div>`).join("")}</div>
        </div>
        <div class="choices"><button class="btn primary" data-act="airedOk">次へ</button></div>`;
    } else if (modal.kind === "scout") {
      const sc = s.scout;
      const isK = sc.kind === "sakkan";
      body = `<h2>${isK ? "作監探し" : "原画マン探し"}</h2>
        <p class="sub">いまの単価の上限：ランク×${E.rateCap(s).toFixed(2)}（「単価を上げる」にすると上限が上がります）</p>
        <div class="choices">${sc.list.map((f, i) => { const ok = E.canHire(s, f); return `
          <button class="cand" data-act="hire" data-v="${i}" ${ok ? "" : "disabled"}>
            <span data-face="${f.seed}"></span>
            <span><span class="nm">${esc(f.name)}</span><br>
            <span class="st">${isK ? `実力 ${f.skill} ／ 週${f.cap}カット ／ 作画監督料 1話 ${yen(30 * f.grade)}` : `実力 ${f.skill} ／ 週${f.speed}カット ／ ${yen(E.CUT_BASE * f.rate)}/カット`}</span><br>
            <span class="st">${ok ? "条件が合えば来てくれる" : "単価が合わず断られた"}</span></span>
          </button>`; }).join("")}
          <button class="btn ghost" data-act="scoutCancel">今回は誰も呼ばない</button>
        </div>`;
    } else if (modal.kind === "pick") {
      const n = modal.n, ep = E.epBy(s, n);
      const list = s.animators.filter((a) => a.hold <= 0 && a.ep !== n).sort((a, b) => (a.ep == null ? -1 : 0) - (b.ep == null ? -1 : 0) || b.skill - a.skill);
      body = `<h2>第${n}話に原画マンを回す</h2>
        <p class="sub">まだ誰にも振っていないカット ${Math.round(ep.cuts - ep.alloc)}本。別の話数を描いている人を回すと、描きかけのカットはその話数に戻ります。</p>
        <div class="choices">${list.map((a) => `
          <button class="cand" data-act="moveAnimTo" data-v="${a.id}" data-n="${n}">
            <span data-face="${a.seed}"></span>
            <span><span class="nm">${esc(a.name)}</span> <span class="sub">${a.overseas ? "海外" : a.inhouse ? "社内" : "外部"}</span><br>
            <span class="st">実力 ${a.skill} ／ 週${a.speed}カット ／ ${a.ep != null ? `いま第${a.ep}話（${Math.floor(a.done)}/${a.batch}）` : "手が空いている"}</span></span>
          </button>`).join("") || `<p class="sub">回せる人がいません。</p>`}
          <button class="btn ghost" data-act="closeModal">やめる</button>
        </div>`;
    } else if (modal.kind === "quit") {
      body = `<h2>この作品をやめますか</h2><p>進行中のデータは消え、スタジオ選びに戻ります。</p>
        <div class="choices"><button class="btn" data-act="quitYes">やめてスタジオ選びに戻る</button><button class="btn primary" data-act="closeModal">続ける</button></div>`;
    } else if (modal.kind === "help") {
      body = `<h2>遊び方</h2>
        <p>夜のスタジオです。人や物を押すと、右に詳しい様子が出ます。</p>
        <ul>
          <li><b>デスク</b>：全体の報告と、工程ごとの処理能力。ここでデスク・進行への指示（発注先、単価、進め方、残業）を出します。</li>
          <li><b>進行</b>：担当している話数の班（作監・原画マン・進み）。疲れてくると飛びます。ヘルプに入ると進みが上がります。</li>
          <li><b>原画マン・作監</b>：実力や単価、いま描いている持ちカット。別の話数に回せます。</li>
          <li><b>ホワイトボード</b>：香盤表。<b>電話</b>：原画マンと作監を探す。<b>あなたの席</b>：予算・委員会・宣伝。<b>テレビ</b>：放送とSNS。</li>
          <li>各話は 脚本 → コンテ → 原画 → 作監 → 動画・仕上げ → 撮影 の順に流れ、1工程進むのに1週かかります。放送日までに撮影が終わらないと、作画崩壊か総集編です。</li>
          <li>行動は週3回。最後に「今週を締める」。</li>
        </ul>
        <div class="choices"><button class="btn primary" data-act="closeModal">閉じる</button></div>`;
    }
    modalRoot.innerHTML = `<div class="modal-bg"><div class="sheet modal flashin" role="dialog" aria-modal="true">${body}</div></div>`;
    modalRoot.querySelectorAll("[data-face]").forEach((el) => el.appendChild(faceCanvas(+el.dataset.face)));
    const big = modalRoot.querySelector("[data-bigkv]");
    if (big && s.lastAir?.ep) { const k = s.kv.find((x) => x.n === s.lastAir.ep.n && !x.recap); if (k) big.appendChild(kvCanvas(k)); }
    const first = modalRoot.querySelector("button:not(:disabled)");
    if (first) first.focus({ preventScroll: true });
  }

  function afterTurn(res) {
    save();
    if (res === "end") { closeModal(); render(); window.scrollTo(0, 0); return; }
    render();
    if (res === "event") showModal({ kind: "event" }); else closeModal();
  }
  function runTurn(step) {
    const before = s.aired;
    const res = step();
    if (res == null) return;
    if (res === "air") { save(); render(); return showModal({ kind: "air" }); }
    if (s.aired > before) { save(); render(); return showModal({ kind: "aired", next: res }); }
    afterTurn(res);
  }

  // ---------- input ----------
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act, v = b.dataset.v;
    if (b.tagName === "INPUT" || b.tagName === "SELECT") return;
    switch (act) {
      case "tier": s = E.newGame(v, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break;
      case "title": s = null; clearSave(); render(); break;
      case "again": { const t = s.tier; s = E.newGame(t, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break; }
      case "source": E.chooseSource(s, +v); s.phase = "zagumi"; render(); window.scrollTo(0, 0); break;
      case "staff": E.chooseStaff(s, b.dataset.role, +v); render(); break;
      case "toShikin": if (E.staffReady(s)) { E.makeOffers(s); s.phase = "shikin"; render(); window.scrollTo(0, 0); } break;
      case "backZagumi": s.phase = "zagumi"; render(); break;
      case "start": E.startProduction(s); panel = "desk"; save(); render(); window.scrollTo(0, 0); showModal({ kind: "help" }); break;
      case "howto": showModal({ kind: "help" }); break;
      case "closeModal": closeModal(); break;
      case "panel": panel = v; render(); if (matchMedia("(max-width: 980px)").matches) document.getElementById("panel")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); break;
      case "policy": { const k = b.dataset.k; const val = v === "true" ? true : v === "false" ? false : v; E.setPolicy(s, k, val); save(); render(); break; }
      case "do": { const arg = b.dataset.arg != null ? +b.dataset.arg : undefined; E.doAction(s, v, arg); save(); render(); if (v === "scout" || v === "scoutSakkan") showModal({ kind: "scout" }); break; }
      case "hire": { const f = s.scout.list[+v]; if (E.hire(s, f)) { closeModal(); save(); render(); } break; }
      case "scoutCancel": s.scout = null; closeModal(); save(); render(); break;
      case "release": E.release(s, +v); panel = "phone"; save(); render(); break;
      case "pickAnim": showModal({ kind: "pick", n: +v }); break;
      case "moveAnimTo": E.moveAnimator(s, +v, +b.dataset.n); closeModal(); save(); render(); break;
      case "moveAnim": { const sel = document.getElementById("moveTo"); if (sel && sel.value) { E.moveAnimator(s, +v, +sel.value); save(); render(); } break; }
      case "skipSakkan": E.skipSakkan(s, +v); save(); render(); break;
      case "endWeek": runTurn(() => E.endWeek(s)); break;
      case "airChoice": runTurn(() => E.resolveAir(s, v)); break;
      case "airedOk": { const next = modal.next; closeModal(); afterTurn(next); break; }
      case "evChoice": { if (E.resolveEvent(s, +v) != null) { closeModal(); save(); render(); } break; }
      case "quit": showModal({ kind: "quit" }); break;
      case "quitYes": closeModal(); s = null; clearSave(); render(); window.scrollTo(0, 0); break;
      case "copy": {
        const text = shareText(), msg = document.getElementById("copyMsg");
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("shareText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
        break;
      }
    }
  });
  document.addEventListener("change", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || !s) return;
    if (b.dataset.act === "offer") { s.sel[b.dataset.v] = b.checked; render(); }
    if (b.dataset.act === "right") { s.rsel[b.dataset.v] = b.checked; render(); }
    if (b.dataset.act === "own") { s.own = +b.value; render(); document.getElementById("own")?.focus(); }
    if (b.dataset.act === "setSakkan") { E.setSakkan(s, +b.dataset.v, +b.value); save(); render(); }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "own" && s) { s.own = +ev.target.value; const out = document.getElementById("ownOut"); if (out) out.textContent = fmt(s.own); }
  });

  // ---------- save / resume ----------
  function save() { if (s && s.phase === "prod") store.set("animep.save", s); }
  function clearSave() { try { localStorage.removeItem("animep.save"); } catch (e) { /* storage unavailable */ } }
  function start(hotData) {
    const saved = hotData && hotData.s ? hotData.s : store.get("animep.save");
    if (saved && saved.v === 2 && saved.phase) s = saved;
    if (hotData && hotData.panel) panel = hotData.panel;
    render();
    if (s && s.phase === "prod") { if (s.pendingAir) showModal({ kind: "air" }); else if (s.event) showModal({ kind: "event" }); }
  }
  window.claude?.hot?.snapshot?.(() => ({ s, panel }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
