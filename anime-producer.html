<title>深夜アニメP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* Layout: a night-time anime studio seen from above (pixel office) on the left; the sheet you clicked (desk report, 香盤表, a 進行's episodes) on the right. */
  :root {
    --desk: #1b2030;        /* page ground: the dark studio */
    --desk-2: #262c40;      /* HUD, raised items */
    --paper: #eef1f5;       /* cool office paper */
    --paper-2: #ffffff;
    --paper-line: #c9d3e3;  /* ruled grid */
    --ink: #1a1e29;
    --ink-soft: #5b6478;
    --on-desk: #e6e9f2;
    --on-desk-soft: #9aa3ba;
    --marker: #ffe14a;      /* highlighter yellow: attention, primary action */
    --pink: #ff5fa2;        /* hype */
    --black: #1f9d63;       /* 黒字 / done */
    --red: #e5484d;         /* 赤字 / danger */
    --blue: #3b6fe0;        /* progress */
    --st-script: #b9c6e4; --st-conte: #8aa6dd; --st-genga: #3b6fe0; --st-sakkan: #7a5cd6; --st-douga: #2ba3a3; --st-satsuei: #1f9d63;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--on-desk); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; box-sizing: border-box; }
  h1, h2, h3, .pix { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; }
  h1 { font-size: 30px; margin: 0; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 8px; text-wrap: balance; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  table { color: inherit; font-size: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sheet { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 14px 16px; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 6px 18px rgba(0,0,0,.35); min-width: 0; }
  .sheet .sub, .sub { color: var(--ink-soft); font-size: 12px; }
  .stamp { display: inline-block; font-family: var(--font-pixel); border: 2px solid currentColor; padding: 0 6px; border-radius: 3px; transform: rotate(-3deg); }
  .btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 8px 12px; font-family: var(--font-pixel); font-size: 14px; line-height: 1.3; }
  .btn:hover { background: #33394a; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: var(--marker); color: var(--ink); }
  .btn.primary:hover { background: #ffe97a; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 14px; }
  .pos { color: var(--black); } .neg { color: var(--red); }
  .money { font-family: var(--font-pixel); }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .face { width: 36px; height: 36px; border-radius: 2px; flex: none; }
  .face.sm { width: 22px; height: 22px; }

  /* title & setup */
  .title-wrap { display: grid; gap: 18px; padding-top: 10px; }
  .logo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .lead { max-width: 62ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { text-align: left; border: 0; display: grid; gap: 6px; align-content: start; }
  .card:hover { outline: 3px solid var(--marker); }
  .card .name { font-family: var(--font-pixel); font-size: 17px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12.5px; margin: 0; }
  .kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }
  .step { color: var(--on-desk-soft); font-family: var(--font-pixel); font-size: 13px; margin: 0 0 4px; }
  .roles { display: grid; gap: 14px; }
  .cand-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
  .cand { background: var(--paper-2); border: 1.5px solid var(--paper-line); border-radius: 3px; padding: 8px; text-align: left; display: flex; gap: 8px; color: var(--ink); align-items: flex-start; }
  .cand:hover:not(:disabled) { border-color: var(--ink); }
  .cand.on { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink); }
  .cand:disabled { opacity: .45; cursor: not-allowed; }
  .cand .nm { font-weight: 700; }
  .arch { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 4px; border-radius: 2px; }
  .cand .st { font-size: 11.5px; color: var(--ink-soft); }
  .footerbar { position: sticky; bottom: 0; margin-top: 16px; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); background: linear-gradient(transparent, var(--desk) 30%); }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .summary b { font-family: var(--font-pixel); font-weight: 400; }
  .offer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
  .offer:last-child { border-bottom: 0; }
  .offer input { width: 18px; height: 18px; accent-color: var(--ink); }
  .offer .cond { font-size: 12px; color: var(--ink-soft); }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  table.pl { border-collapse: collapse; width: 100%; font-size: 13px; }
  .pl td, .pl th { padding: 4px 4px; border-bottom: 1px solid var(--paper-line); text-align: left; font-weight: 400; }
  .pl th { font-size: 11.5px; color: var(--ink-soft); }
  .pl td.r, .pl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pl tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
  .pl tr.subt td { color: var(--ink-soft); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }

  /* production */
  .hud { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; background: var(--desk-2); border-radius: 3px; padding: 8px 12px; margin-bottom: 12px; }
  .hud .it { display: grid; line-height: 1.2; }
  .hud .lb { font-size: 11px; color: var(--on-desk-soft); }
  .hud .vl { font-family: var(--font-pixel); font-size: 17px; }
  .hud .week { font-size: 19px; color: var(--marker); }
  .ap { letter-spacing: 2px; color: var(--marker); }
  .meter { height: 6px; width: 76px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; }
  .hud .tools { margin-left: auto; display: flex; gap: 6px; }
  .hud .tools .btn { background: #39405a; }

  .studio { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
  .officecol { display: grid; gap: 10px; min-width: 0; position: sticky; top: 8px; }
  .officewrap { min-width: 0; border-radius: 3px; }
  .office { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 3px; overflow: hidden; background: #262c40; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .office canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 2px; }
  .hot:hover, .hot:focus-visible, .hot.on { outline: 2px solid var(--marker); outline-offset: 0; background: rgba(255,225,74,.08); }
  .hot .tag { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); white-space: nowrap; font-size: 11px; background: var(--ink); color: var(--paper); padding: 1px 6px; border-radius: 2px; pointer-events: none; opacity: 0; font-family: var(--font-body); }
  .hot:hover .tag, .hot:focus-visible .tag, .hot.on .tag { opacity: 1; }
  .zone { position: absolute; font-family: var(--font-pixel); font-size: 11px; color: rgba(230,233,242,.75); pointer-events: none; text-shadow: 0 1px 0 #000; }
  .deskline { display: flex; gap: 10px; align-items: center; background: var(--desk-2); border-radius: 3px; padding: 8px 10px; }
  .deskline .say { flex: 1; min-width: 0; font-size: 13px; }
  .deskline .say b { font-family: var(--font-pixel); font-weight: 400; color: var(--marker); margin-right: 6px; }
  .endweek { font-size: 17px; padding: 12px 18px; white-space: nowrap; }

  .panel { display: grid; gap: 12px; min-width: 0; }
  .who { display: flex; gap: 10px; align-items: center; }
  .who .nm { font-family: var(--font-pixel); font-size: 17px; }
  .speech { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 3px; padding: 8px 10px; font-size: 13px; position: relative; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button { background: #39405a; color: var(--on-desk); border: 0; border-radius: 3px; padding: 4px 9px; font-size: 12px; font-family: var(--font-pixel); }
  .tabs button.on { background: var(--marker); color: var(--ink); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 5px 6px; font-size: 12.5px; color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .policy { display: grid; gap: 8px; }
  .plab { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .act { text-align: left; background: var(--paper-2); border: 1.5px solid var(--paper-line); border-radius: 3px; padding: 6px 8px; color: var(--ink); display: grid; gap: 1px; }
  .act:hover:not(:disabled) { border-color: var(--ink); }
  .act:disabled { opacity: .4; cursor: not-allowed; }
  .act .an { font-family: var(--font-pixel); font-size: 13px; }
  .act .ac { font-size: 11px; color: var(--ink-soft); }
  .stagebar { display: flex; height: 10px; background: #dfe5ee; border-radius: 2px; overflow: hidden; min-width: 60px; }
  .stagebar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-soft); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 3px; border-radius: 1px; background: var(--c); }
  .tagx { font-family: var(--font-pixel); font-size: 11px; padding: 0 5px; border-radius: 2px; white-space: nowrap; background: #dfe5ee; color: var(--ink); }
  .t-ok { background: #d6f2e4; color: #11633c; } .t-warn { background: var(--marker); color: var(--ink); } .t-bad { background: var(--red); color: #fff; } .t-air { background: var(--ink); color: var(--paper); }
  .kohyo-wrap { overflow-x: auto; }
  table.kohyo { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .kohyo th { font-family: var(--font-pixel); font-weight: 400; text-align: left; font-size: 11.5px; color: var(--ink-soft); border-bottom: 2px solid var(--ink); padding: 4px 5px; white-space: nowrap; }
  .kohyo td { border-bottom: 1px solid var(--paper-line); padding: 4px 5px; vertical-align: middle; }
  .kohyo tr.aired td { color: var(--ink-soft); }
  .kohyo tr.next td { background: rgba(255,225,74,.35); }
  .kohyo tr.click { cursor: pointer; } .kohyo tr.click:hover td { background: rgba(59,111,224,.08); }
  .cap { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 4px 8px; align-items: center; font-size: 12.5px; }
  .cap .bar2 { height: 8px; background: #dfe5ee; border-radius: 2px; position: relative; overflow: hidden; }
  .cap .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; }
  .ep { color: var(--ink); border: 1.5px solid var(--paper-line); background: var(--paper-2); border-radius: 3px; padding: 10px; display: grid; gap: 6px; }
  .ep.hot2 { border-color: var(--red); }
  .ep .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .ep .hd .t { font-family: var(--font-pixel); font-size: 15px; }
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-size: 11px; text-align: center; }
  .stages div { background: #eef1f5; border-radius: 2px; padding: 2px 0; line-height: 1.25; }
  .stages div b { display: block; font-weight: 400; font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink); }
  .stages div.done { background: #d6f2e4; } .stages div.now { background: rgba(255,225,74,.6); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; gap: 6px; align-items: center; border: 1px solid var(--paper-line); border-radius: 3px; padding: 3px 6px 3px 3px; background: var(--paper); font-size: 12px; text-align: left; color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .chip .mini { font-size: 10.5px; color: var(--ink-soft); display: block; line-height: 1.2; }
  .stam { height: 6px; width: 90px; background: #dfe5ee; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .stam i { display: block; height: 100%; }
  .log { font-size: 12.5px; display: grid; gap: 3px; max-height: 240px; overflow-y: auto; }
  .log p { margin: 0; } .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; }
  .sns { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
  .post { font-size: 12.5px; background: var(--paper-2); border-radius: 3px; padding: 6px 8px; border-left: 3px solid var(--paper-line); }
  .post .h { color: var(--ink-soft); font-size: 11px; } .post.good { border-left-color: var(--black); } .post.bad { border-left-color: var(--red); }
  .kvs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .kvbox { display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--ink-soft); }
  .kvbox > span[data-kv] { display: block; width: 100%; max-width: 72px; aspect-ratio: 1; background: #dfe5ee; border-radius: 2px; overflow: hidden; }
  .kvbox canvas { width: 100%; height: 100%; }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper-2); color: var(--ink); color-scheme: light; }


  /* grand schedule (Gantt) */
  .gantt-wrap { overflow-x: auto; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper-2); }
  table.gantt { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .gantt th, .gantt td { border-bottom: 1px solid #e3e8f0; padding: 0; height: 26px; }
  .gantt thead th { font-family: var(--font-pixel); font-weight: 400; font-size: 11px; color: var(--ink-soft); background: var(--paper); position: sticky; top: 0; padding: 0 6px; text-align: left; }
  .gantt th.wk { width: 20px; min-width: 20px; padding: 0; text-align: center; }
  .gantt th.ep { padding: 0 6px; font-family: var(--font-pixel); font-weight: 400; position: sticky; left: 0; background: var(--paper-2); z-index: 1; border: 0; border-bottom: 1px solid #e3e8f0; border-right: 1px solid var(--paper-line); vertical-align: middle; text-align: left; }
  .gantt td.ctl { padding: 0 6px; font-size: 12px; }
  .gantt td.ctl.st { color: var(--ink-soft); font-size: 11.5px; }
  .gantt td.c { width: 20px; min-width: 20px; position: relative; border-left: 1px solid #eef1f5; text-align: center; }
  .gantt td.c.pl { background: color-mix(in srgb, var(--tc) 22%, white); }
  .gantt td.c.ac { background: var(--tc); }
  .gantt td.c.fc { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--tc) 55%, white) 0 3px, transparent 3px 6px); }
  .gantt td.c.now { box-shadow: inset 2px 0 0 var(--marker), inset -2px 0 0 var(--marker); }
  .gantt th.wk.now { background: var(--marker); color: var(--ink); }
  .gantt .air { font-size: 12px; color: var(--ink); position: relative; z-index: 1; }
  .gantt .air.late { color: var(--red); font-weight: 700; }
  .gantt .air.done { color: var(--ink-soft); }
  .gantt tr.bad th.ep { color: var(--red); }
  .gantt tr.bad td.ctl { background: rgba(229,72,77,.08); }
  .gantt select { max-width: 11em; }
  .mini { border: 1px solid var(--paper-line); background: var(--paper); border-radius: 2px; padding: 0 4px; margin: 0 3px; font-size: 11px; line-height: 18px; color: var(--ink); }
  .mini:hover:not(:disabled) { border-color: var(--ink); }
  .mini:disabled { opacity: .35; }
  .tm { display: inline-block; border-left: 4px solid var(--tc); padding-left: 5px; }
  .issues { margin: 0; padding-left: 1.2em; font-size: 12.5px; color: var(--red); display: grid; gap: 2px; }
  .issues li.soft { color: var(--ink-soft); }

  /* the 進行表 (spreadsheet) */
  .xls-bg { padding: 2vh 2vw; }
  .xls { background: #ffffff; color: #1a1e29; width: 100%; max-width: 1180px; height: 100%; max-height: 96vh; display: grid; grid-template-rows: auto auto auto 1fr auto; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); font-family: var(--font-body); }
  .xls-top { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #1f6b45; color: #fff; flex-wrap: wrap; }
  .xls-file { font-weight: 700; font-size: 14px; }
  .xls-file::before { content: ""; display: inline-block; width: 12px; height: 14px; margin-right: 6px; vertical-align: -2px; background: #fff; clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%); }
  .xls-who { font-size: 12px; opacity: .95; }
  .xls-x { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 22px; line-height: 1; padding: 0 6px; }
  .xls-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; background: #f3f5f8; border-bottom: 1px solid #d5dbe5; align-items: center; }
  .xls-tools .btn { font-family: var(--font-body); background: #ffffff; color: #1a1e29; box-shadow: inset 0 0 0 1px #c3cad6; display: inline-grid; line-height: 1.2; text-align: left; }
  .xls-tools .btn:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px #1f6b45; }
  .xls-tools .pv { font-size: 10.5px; color: #5b6478; }
  .xls-tools .xls-sep { font-size: 11px; font-weight: 700; color: #a3262b; margin-left: 6px; }
  .xls-tools .btn.rush { box-shadow: inset 0 0 0 1px #e5a3a6; }
  .rushrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
  .rushrow .xls-sep { font-size: 11px; font-weight: 700; color: var(--red); }
  .rushrow .btn { display: inline-grid; text-align: left; line-height: 1.2; }
  .rushrow .pv { font-size: 10px; opacity: .75; }
  .xls-fx { display: flex; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid #d5dbe5; font-size: 12px; font-family: ui-monospace, "IPAGothic", monospace; color: #33394a; }
  .xls-fx .fxl { font-style: italic; color: #8a93ab; border-right: 1px solid #d5dbe5; padding-right: 8px; }
  .xls-grid { overflow: auto; }
  .xls-grid table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  .xls-grid th, .xls-grid td { border: 1px solid #e1e5ec; padding: 3px 8px; white-space: nowrap; height: 22px; }
  .xls-grid thead th { background: #f3f5f8; color: #5b6478; font-weight: 400; font-size: 11px; text-align: center; position: sticky; top: 0; z-index: 1; }
  .xls-grid th.rn { background: #f3f5f8; color: #8a93ab; font-weight: 400; font-size: 11px; text-align: right; width: 2.6em; position: sticky; left: 0; }
  .xls-grid td.k { color: #5b6478; background: #fafbfd; }
  .xls-grid td.v.bad { color: var(--red); font-weight: 700; }
  .xls-grid td.blank { height: 10px; padding: 0; }
  .xls-grid tr.hd td { background: #e9f3ee; font-weight: 700; color: #1f6b45; }
  .xls-grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .xls-grid td.ok { background: #d6f2e4; color: #11633c; }
  .xls-grid td.wip { background: #fff3b0; }
  .xls-grid tr.held td { background: #fde4e4; }
  .xls-grid tr.out td { color: #9aa3ba; }
  .xls-grid tr.tot td, .xls-grid td.tot { font-weight: 700; border-top: 2px solid #1f6b45; }
  .xls-grid td.hd { background: #e9f3ee; font-weight: 700; color: #1f6b45; }
  .xls-grid td.badc { background: #fde4e4; color: #a3262b; }
  .xls-grid td.outc { color: #9aa3ba; text-decoration: line-through; }
  .xls-grid td.sub { color: #5b6478; font-size: 11.5px; }

<script id="engine">
/* ===================== ゲームの計算（UIなし） ===================== */
const Engine = (() => {
  "use strict";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Seeded RNG kept inside the state so a saved game replays the same.
  function rnd(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    let t = s.rs;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rr = (s, a, b) => a + rnd(s) * (b - a);
  const ri = (s, a, b) => Math.floor(rr(s, a, b + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  function shuffle(s, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  const ROUGH_W = 0.4, GENGA_W = 0.6;     // ラフ原と原画にかかる手間の割合（1カット=1）
  const BASE_ANIMS = 10;                  // これを超えて人を足すと絵がばらつく
  const DILUTION = 0.6;                   // 1人増えるごとの品質低下
  const MIN_DUR = 6;                      // 1話の最短の制作期間（週）
  const DEF_DUR = 8;                      // グランドスケジュールの標準（週）
  const LINE = 50;                        // 局・製作委員会の納品基準（これを下回る品質は受け取ってもらえない）
  const ART_WEEKS = 2;                    // 美術・CGはラフ原が上がってから2週間
  const EPISODES = 12;
  const TEAM_KEYS = ["A", "B", "C", "D", "E", "F"];
  const FLOW = 0.8;                       // 上がったカットの8割はその週のうちに次の工程へ

  // スタジオ＝難易度。作品と座組もスタジオで決まる
  const TIERS = {
    top: { key: "top", name: "有名スタジオ", studio: "スタジオ極光", pre: 10, teams: 5, animSkill: [58, 86], sakkanSkill: [72, 86], shinkoSkill: [[64, 86], [60, 82], [58, 80], [55, 75], [50, 72]],
           dougaCap: 420, shiageCap: 480, satsueiCap: 560, dougaSkill: 66, artSkill: 72, scripts: 7, contes: 5, exp: 71, eventMul: 0.8,
           source: "manga", dir: { skill: 84, speed: 50, quirk: 0.3, tag: "作家" }, wri: { skill: 80, speed: 52, tag: "作家" }, va: { act: 82 }, rank: 4,
           blurb: "社内に5班。進行も粒ぞろい。腕利きの原画マンが集まるが、監督のこだわりが強く、ファンの目も厳しい。" },
    mid: { key: "mid", name: "中堅スタジオ", studio: "アニメーション工房ひばり", pre: 8, teams: 4, animSkill: [48, 78], sakkanSkill: [60, 74], shinkoSkill: [[60, 80], [52, 72], [45, 65], [32, 46]],
           dougaCap: 320, shiageCap: 360, satsueiCap: 440, dougaSkill: 58, artSkill: 62, scripts: 6, contes: 4, exp: 58, eventMul: 1,
           source: "novel", dir: { skill: 72, speed: 60, quirk: 0.15, tag: "職人" }, wri: { skill: 72, speed: 62, tag: "職人" }, va: { act: 70 }, rank: 0,
           blurb: "社内に4班。全話は回しきれないので、何話かはグロスに出す。新人の進行がひとりいる。標準の難易度。" },
    low: { key: "low", name: "弱小スタジオ", studio: "有限会社 夜明け動画", pre: 7, teams: 3, animSkill: [40, 70], sakkanSkill: [55, 66], shinkoSkill: [[50, 70], [34, 48], [28, 42]],
           dougaCap: 220, shiageCap: 260, satsueiCap: 320, dougaSkill: 50, artSkill: 54, scripts: 5, contes: 3, exp: 50, eventMul: 1.25,
           source: "original", dir: { skill: 58, speed: 84, quirk: 0.05, tag: "量産" }, wri: { skill: 58, speed: 86, tag: "量産" }, va: { act: 62 }, rank: -6,
           blurb: "社内に3班だけ。半分近くはグロス頼み。進行は新人ばかりで、トラブルを抱え込みがち。" },
  };
  const STAGES = [
    { k: "rough", label: "ラフ原" }, { k: "genga", label: "原画" }, { k: "douga", label: "動画" }, { k: "shiage", label: "仕上げ" }, { k: "satsuei", label: "撮影" },
  ];
  const GROSS_DEFS = [
    { name: "スタジオ灯台", q: [68, 76], slip: 0.03, cap: 1, note: "丁寧で確実。同時に1話まで。" },
    { name: "有限会社 青梅動画", q: [56, 64], slip: 0.08, cap: 2, note: "標準的。たまに遅れる。" },
    { name: "アニメ工房さざなみ", q: [47, 55], slip: 0.15, cap: 2, note: "品質も納期も怪しい。局の基準ぎりぎり。" },
  ];
  const SOURCES = {
    manga: { label: "人気漫画原作", kanshu: 0.24, titles: ["放課後ラグナロク", "ねこ侍は眠らない", "鉄骨のアリア", "となりの席の魔王さま"] },
    novel: { label: "ライトノベル原作", kanshu: 0.16, titles: ["転生したら制作進行だった件", "追放された錬金術師、辺境でカフェを開く", "俺の妹が魔王軍の経理担当なんだが"] },
    original: { label: "オリジナル", kanshu: 0, titles: ["夜明けのフィルム", "さよならロケット少女", "機械仕掛けの夏休み", "月面の郵便屋さん"] },
  };
  const FAMILY = ["岩城", "真柴", "黒須", "早乙女", "鷹野", "白石", "柳田", "東雲", "葛西", "三輪", "雨宮", "久遠", "椎名", "不破", "氷室", "九条", "皆川", "綾瀬", "桐生", "宗像", "結城", "日向", "朝霧", "篠原",
                  "小田切", "望月", "千早", "神楽", "伊吹", "相馬", "芹沢", "鳴海", "野々宮", "八雲", "藤堂", "水無瀬", "能登", "桜庭", "長谷部", "榊"];
  const GIVEN = ["透", "灯", "誠", "遥", "蓮", "朔", "薫", "湊", "静", "渉", "楓", "律", "環", "慧", "茜", "航", "紬", "悠", "澪", "迅", "一花", "健吾", "美雪", "大地", "千尋", "陽向", "瑞穂", "昴", "亜紀", "翔"];

  function makeName(s) {
    const used = new Set(s.usedNames);
    for (let i = 0; i < 80; i++) {
      const n = pick(s, FAMILY) + " " + pick(s, GIVEN);
      if (!used.has(n)) { s.usedNames.push(n); return n; }
    }
    return "名無し " + s.usedNames.length;
  }
  const uid = (s) => ++s.uid;
  function makeAnimator(s, bonus = 0) {
    const T = TIERS[s.tier];
    const skill = clamp(ri(s, T.animSkill[0], T.animSkill[1]) + bonus, 30, 95);
    const speed = Math.round(clamp(rr(s, 6.5, 10) - (skill - 60) / 40, 5, 11) * 10) / 10;
    return { id: uid(s), name: makeName(s), skill, speed, cuts: 0, rough: 0, genga: 0, hold: 0, slow: 1 };
  }
  function makeShinko(s, range) {
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill: ri(s, range[0], range[1]), stamina: ri(s, 75, 95), gone: false };
  }

  function newGame(tier, seed) {
    const T = TIERS[tier];
    const s = { v: 6, phase: "schedule", tier, rs: seed | 0, week: 0, log: [], sns: [], kv: [], usedNames: [], uid: 0 };
    s.pre = T.pre;
    s.src = { type: T.source, title: pick(s, SOURCES[T.source].titles) };
    const mk = (d) => ({ name: makeName(s), seed: ri(s, 1, 1e9), ...d });
    s.staff = { dir: mk(T.dir), wri: mk(T.wri), va: mk(T.va), kp: mk({}) };
    s.shinkos = [];
    s.teams = TEAM_KEYS.slice(0, T.teams).map((key, i) => {
      const sh = makeShinko(s, T.shinkoSkill[i]);
      sh.team = key; s.shinkos.push(sh);
      return { key, label: `${key}班`, shinko: sh.id, sakkan: { name: makeName(s), seed: ri(s, 1, 1e9), skill: ri(s, T.sakkanSkill[0], T.sakkanSkill[1]) } };
    });
    s.gross = GROSS_DEFS.map((d, i) => ({ id: i + 1, name: d.name, quality: ri(s, d.q[0], d.q[1]), slip: d.slip, cap: d.cap, note: d.note }));
    s.eps = Array.from({ length: EPISODES }, (_, i) => ({ n: i + 1, cuts: ri(s, 27, 33) * 10 }));
    autoPlan(s);
    return s;
  }
  const synergy = (s) => (s.staff.dir.tag === s.staff.wri.tag ? 4 : 0);
  const teamBy = (s, key) => s.teams.find((t) => t.key === key);
  const grossBy = (s, id) => s.gross.find((g) => g.id === id);
  const isGross = (plan) => typeof plan.team === "string" && plan.team.startsWith("g");
  const grossOf = (s, plan) => (isGross(plan) ? grossBy(s, +plan.team.slice(1)) : null);
  const planAir = (s, n) => s.pre + n;

  // ---------- グランドスケジュール ----------
  const conteRate = (s) => 0.45 + s.staff.dir.speed / 250;
  function conteWeek(s, n) {
    const K = TIERS[s.tier].contes;
    if (n <= K) return 1;
    let need = 0;
    for (const ep of s.eps) if (ep.n <= n && ep.n > K && !(ep.plan && isGross(ep.plan))) need++;
    return Math.ceil(need / conteRate(s)) + 1;
  }
  function autoPlan(s) { for (const ep of s.eps) ep.plan = null; planPass(s); planPass(s); return s.eps.map((e) => e.plan); }
  function planPass(s) {
    const free = Object.fromEntries(s.teams.map((t) => [t.key, 1]));
    const grossUse = [];
    const grossFits = (c, a, b) => grossUse.filter(([id, x, y]) => id === c.id && x <= b && a <= y).length < c.cap;
    for (const ep of s.eps) {
      const air = planAir(s, ep.n);
      const teamSlot = (buffer, dur) => {
        let best = null;
        for (const t of s.teams) {
          const start = Math.max(free[t.key], conteWeek(s, ep.n));
          if (start + dur - 1 <= air - buffer && (!best || start < best.start)) best = { team: t.key, start, dur };
        }
        return best;
      };
      const grossSlot = (buffer, dur) => {
        const start = Math.max(1, air - buffer - dur + 1), end = start + dur - 1;
        if (end > air) return null;
        const c = s.gross.find((c) => grossFits(c, start, end));
        return c ? { team: "g" + c.id, start, dur } : null;
      };
      let pick2 = null;
      for (const dur of [DEF_DUR, DEF_DUR - 1, MIN_DUR]) { pick2 = teamSlot(1, dur) || grossSlot(1, dur) || teamSlot(0, dur) || grossSlot(0, dur); if (pick2) break; }
      if (pick2 && !pick2.team.startsWith("g")) { ep.plan = { team: pick2.team, start: pick2.start, dur: pick2.dur }; free[pick2.team] = pick2.start + pick2.dur; continue; }
      const g = pick2 || { team: "g" + s.gross[s.gross.length - 1].id, start: Math.max(1, air - MIN_DUR + 1), dur: MIN_DUR };
      grossUse.push([+g.team.slice(1), g.start, g.start + g.dur - 1]);
      ep.plan = { team: g.team, start: g.start, dur: g.dur };
    }
  }
  function planIssues(s) {
    const out = [];
    for (const ep of s.eps) {
      const p = ep.plan;
      if (ep.started || ep.aired) continue;
      const end = p.start + p.dur - 1;
      const air = s.phase === "prod" ? airWeekOf(s, ep) : planAir(s, ep.n);
      if (end > air) out.push({ n: ep.n, kind: "late", msg: `第${ep.n}話：納品予定 第${end}週が放送（第${air}週）に間に合いません` });
      if (!isGross(p)) {
        for (const o of s.eps) {
          if (o.n <= ep.n || o.plan.team !== p.team || o.started) continue;
          const oe = o.plan.start + o.plan.dur - 1;
          if (o.plan.start <= end && p.start <= oe) out.push({ n: o.n, kind: "overlap", msg: `${p.team}班：第${ep.n}話と第${o.n}話の期間が重なっています（1班は同時に1話まで）` });
        }
        if (s.phase !== "prod" && p.start < conteWeek(s, ep.n)) out.push({ n: ep.n, kind: "conte", msg: `第${ep.n}話：コンテが上がるのは第${conteWeek(s, ep.n)}週ごろの見込み。それまで作業に入れません`, soft: true });
      } else {
        const c = grossOf(s, p);
        for (let w = p.start; w <= end; w++) {
          const busy = s.eps.filter((o) => !o.aired && o.plan.team === p.team && o.plan.start <= w && w <= o.plan.start + o.plan.dur - 1 + (o.gslip || 0)).length;
          if (busy > c.cap) { out.push({ n: ep.n, kind: "cap", msg: `${c.name}は同時に${c.cap}話までしか受けられません（第${w}週）` }); break; }
        }
      }
    }
    return out;
  }
  function setPlan(s, n, patch) {
    const ep = epBy(s, n);
    if (!ep || ep.started || ep.aired) return false;
    Object.assign(ep.plan, patch);
    ep.plan.dur = Math.max(MIN_DUR, ep.plan.dur);
    ep.plan.start = clamp(ep.plan.start, s.phase === "prod" ? s.week : 1, 60);
    return true;
  }
  const recommendAnims = (s, ep) => clamp(Math.ceil(ep.cuts / ((Math.max(MIN_DUR, ep.plan.dur) - 2.5) * 7.4)), BASE_ANIMS, 60);

  function startProduction(s) {
    const T = TIERS[s.tier];
    s.flags = { kanshu: SOURCES[s.src.type].kanshu };
    s.policy = { douga: "inhouse", mode: "stock", ot: false };
    s.eps.forEach((ep, i) => Object.assign(ep, {
      script: i < T.scripts ? 1 : 0, conte: i < T.contes ? 1 : 0, started: false, startWeek: null, anims: [], art: null,
      qG: 0, qD: 0, douga: 0, shiage: 0, satsuei: 0, bonus: 0, aired: false, airQ: null, collapse: false, delivered: false, deliveredWeek: null, gprog: 0, gslip: 0,
      rush: null, short: false, pen: 0, penFix: 0, alerted: null, planned: { ...ep.plan },
    }));
    s.H = 50 + (T.key === "top" ? 15 : T.key === "mid" ? 5 : 0); s.R = 55;
    s.ap = 3; s.dirMood = 0;
    s.mods = []; s.incidents = []; s.queue = [];
    s.week = 1; s.nextAir = s.pre + 1; s.aired = 0; s.recaps = 0; s.delays = 0;
    s.lastAirQ = 0; s.helpCount = 0; s.added = 0; s.hiddenFound = 0; s.lateReports = 0; s.rejects = 0;
    s.phase = "prod"; s.event = null; s.pendingAir = null;
    startEpisodes(s);
    s.stat = forecast(s);
    log(s, `「${s.src.title}」制作開始。放送開始は第${s.nextAir}週。`);
  }

  function log(s, text) { s.log.push({ w: s.week, text }); if (s.log.length > 140) s.log.shift(); }

  // ---------- helpers ----------
  const modMul = (s, target) => s.mods.filter((m) => m.target === target).reduce((a, m) => a * m.mul, 1);
  function addMod(s, id, weeks, mul, target) { s.mods.push({ id, weeks, mul, target }); }
  const unaired = (s) => s.eps.filter((e) => !e.aired);
  const epBy = (s, n) => s.eps[n - 1];
  const shinkoBy = (s, id) => s.shinkos.find((x) => x.id === id);
  const teamOfShinko = (s, id) => s.teams.find((t) => t.shinko === id);
  const shinkoOfTeam = (s, key) => { const t = teamBy(s, key); return t ? shinkoBy(s, t.shinko) : null; };
  const sumA = (ep, k) => ep.anims.reduce((a, x) => a + x[k], 0);
  const otMul = (s) => (s.policy.ot ? 1.2 : 1);
  function epTotals(ep) { return { rough: sumA(ep, "rough"), genga: sumA(ep, "genga"), douga: ep.douga, shiage: ep.shiage, satsuei: ep.satsuei }; }
  function done(ep) { return isGross(ep.plan) ? ep.gprog : ep.satsuei / ep.cuts; }
  function progress(ep) {
    if (isGross(ep.plan)) return ep.gprog;
    if (!ep.started) return 0;
    const t = epTotals(ep), c = ep.cuts;
    return clamp(0.15 * t.rough / c + 0.30 * t.genga / c + 0.20 * t.douga / c + 0.15 * t.shiage / c + 0.20 * t.satsuei / c, 0, 1);
  }
  function stageOf(ep) {
    if (ep.aired) return "aired";
    if (ep.delivered) return "done";
    if (isGross(ep.plan)) return ep.started ? "gross" : "wait";
    if (!ep.started) return ep.conte < 1 ? "conte" : "wait";
    const t = epTotals(ep), c = ep.cuts - 0.5;
    if (t.rough < c) return "rough";
    if (t.genga < c) return "genga";
    if (t.douga < c) return "douga";
    if (t.shiage < c) return "shiage";
    return "satsuei";
  }
  const STAGE_LABEL = { conte: "コンテ待ち", wait: "着手前", rough: "ラフ原", genga: "原画", douga: "動画", shiage: "仕上げ", satsuei: "撮影", gross: "グロス制作中", done: "納品済", aired: "放送済" };
  function airWeekOf(s, ep) { const i = unaired(s).indexOf(ep); return i < 0 ? null : s.nextAir + i; }
  const weeksLeft = (s, ep) => airWeekOf(s, ep) - s.week + 1;
  function teamEff(s, key) {
    const sh = shinkoOfTeam(s, key);
    if (!sh || sh.gone) return 0.6;
    return (0.85 + sh.skill / 500) * (sh.stamina < 30 ? 0.85 : 1) * (sh.helped ? 1.12 : 1);
  }
  const epEff = (s, ep) => teamEff(s, ep.plan.team) * modMul(s, "tm:" + ep.plan.team);
  const epGa = (s, ep) => modMul(s, "ga:" + ep.n);
  // 巻き。下ほど速いが、そのあと上がるカットの仕上がりが落ちる（pen はカット1本あたりの品質低下）
  const RUSH = {
    "24h":  { rank: 1, label: "24時間動仕", pen: 4, fix: 2, gfix: 4, desc: "上がった原画をその日のうちに外の動仕に回す。動画・仕上げの待ちがなくなる" },
    "12h":  { rank: 2, label: "12時間動仕", pen: 7, fix: 4, gfix: 8, desc: "動画・仕上げ・撮影まで上がった端から流す" },
    "2gen": { rank: 3, label: "2原動仕",   pen: 7, gpen: 10, fix: 6, gfix: 14, desc: "原画から仕上げまでを飛ばして、ラフ原をそのまま動仕に回す" },
  };
  // 巻くと演出・作監のチェックも飛ぶので、その話数全体に fix ぶん響く
  const SHORT_PEN = 12, SHORT_FIX = 6;

  // ---------- the desk's actions ----------
  const ACTIONS = {

  function canAct(s, id, arg) {
    const a = ACTIONS[id];

  // ---------- 巻き（間に合わないときの最後の手段）----------
  function canRush(s, ep, mode) {
    if (!ep || !ep.started || ep.delivered || ep.aired) return false;
    // グロス回は、協力会社に巻いてもらう（撮影短縮は先方の判断）
    if (isGross(ep.plan)) return !!RUSH[mode] && rushRank(ep) < RUSH[mode].rank;
    // デスクに見えている工程で判断する（進行が隠しているぶんは分からない）
    const st = withView(s, ep, () => stageOf(ep));
    if (mode === "short") return !ep.short && ["douga", "shiage", "satsuei"].includes(st) && ep.satsuei > 0.5;
    const r = RUSH[mode];
    if (!r || rushRank(ep) >= r.rank) return false;
    if (mode === "2gen") return st === "rough" || st === "genga";
    return ["rough", "genga", "douga", "shiage"].includes(st);
  }
  function setRush(s, n, mode) {
    const ep = epBy(s, n);
    if (!canRush(s, ep, mode)) return false;
    if (isGross(ep.plan)) {
      const gain = RUSH[mode].rank - rushRank(ep);
      ep.rush = mode; ep.penFix = RUSH[mode].gfix;
      ep.gprog = Math.min(0.999, ep.gprog + gain / ep.plan.dur); ep.gslip = Math.max(0, ep.gslip - gain);
      log(s, `第${n}話、${grossOf(s, ep.plan).name}に${RUSH[mode].label}で巻いてもらう。`);
      s.stat = forecast(s);
      return true;
    }
    if (mode === "short") ep.short = true; else ep.rush = mode;
    ep.penFix = (ep.rush ? RUSH[ep.rush].fix : 0) + (ep.short ? SHORT_FIX : 0);
    if (mode === "short") { log(s, `第${n}話、撮影スケジュールを短縮。上がった端から撮って出す。`); }

  function retake(s, ep, n, stage) {
    let left = n;
    const g0 = sumA(ep, "genga");
    const order = stage === "rough" ? ["rough", "genga"] : ["genga"];
    for (const a of ep.anims.slice().sort((x, y) => y[stage] - x[stage])) {
      if (left <= 0) break;
      const back = Math.min(left, a[stage]);
      if (back <= 0) continue;
      const keep = a[stage] - back;
      for (const k of order) a[k] = Math.min(a[k], keep);
      left -= back;
    }
    const g1 = sumA(ep, "genga");
    ep.qG *= g1 / Math.max(1, g0);
    for (const k of ["douga", "shiage", "satsuei"]) ep[k] = Math.min(ep[k], g1);
    if (stage === "rough" && sumA(ep, "rough") < ep.cuts - 0.5) ep.art = null;
    ep.delivered = false;
    // 抜けた人に戻ってきたカットは、残っている人に配り直す
    for (const a of ep.anims) if (a.out && a.cuts > a.genga) { a.cuts = a.genga; a.rough = Math.min(a.rough, a.genga); }
    redistribute(ep, s);
  }

  // Trouble gets more frequent as the series goes on.
  function troubleRate(s) {
    const T = TIERS[s.tier];

    return 0.36 * T.eventMul * (0.6 + 1.1 * Math.min(1, s.week / total));
  }
  function rollEvent(s) {
    if (rnd(s) > troubleRate(s)) return null;
    const pool = Object.entries(EVENTS).filter(([, e]) => !e.when || e.when(s)).map(([id, e]) => [id, Math.max(0, e.weight(s))]);
    const total = pool.reduce((a, [, w]) => a + w, 0);
    let r = rnd(s) * total;
    for (const [id, w] of pool) {
      r -= w;
      if (r > 0) continue;
      const ev = EVENTS[id], p = ev.prep ? ev.prep(s) : {};
      const ep = p.n ? epBy(s, p.n) : null;
      const reporter = ev.reporter ? ev.reporter(s, p) : reporterOfEp(s, ep);
      const inc = { id, p, start: s.week, team: reporter.kind === "shinko" ? reporter.team : null, reporter, revealed: false };
      if (ev.hideable) {
        if (p.aid) { const a = ep.anims.find((x) => x.id === p.aid); a.fakeRough = a.rough; a.fakeGenga = a.genga; }
        if (ev.hideAll) for (const a of ep.anims) { a.fakeRough = a.rough; a.fakeGenga = a.genga; }
      }
      if (ev.start) ev.start(s, p);
      if (ev.hideable) {
        const sh = shinkoOfTeam(s, inc.team);
        const d = reportDelay(s, sh, ep);
        inc.reportWeek = s.week + d;
        inc.aid = p.aid;
        if (ev.hideAll) inc.aids = ep.anims.map((a) => a.id);

      s.incidents.push(inc);
      return inc;
    }
    return null;
  }
  function reveal(s, inc) {

      if (inc.alert) { const ep = epBy(s, inc.p.n); if (ep.delivered || ep.aired || epForecast(s, ep) <= airWeekOf(s, ep)) { ep.alerted = null; continue; } }
      s.event = inc;
    }
    return s.event;
  }
  const choicesOf = (s, inc) => { const c = EVENTS[inc.id].choices; return typeof c === "function" ? c(s, inc.p) : c; };
  function eventView(s) {
    const inc = s.event;
    if (!inc) return null;
    const ev = EVENTS[inc.id], p = inc.p;
    return { id: inc.id, title: ev.title, text: ev.text(s, p, inc), reporter: inc.reporter, late: inc.late, found: inc.found, weeksHidden: s.week - inc.start,
             choices: choicesOf(s, inc).map((c, i) => ({ i, label: c.label, ok: (!c.ap || s.ap >= c.ap) && (!c.ok || c.ok(s, p)) })) };
  }
  function resolveEvent(s, i) {
    const inc = s.event, ev = EVENTS[inc.id], c = choicesOf(s, inc)[i], p = inc.p;
    if (!c || (c.ok && !c.ok(s, p))) return null;
    if (c.ap) { if (s.ap < c.ap) return null; s.ap -= c.ap; }
    const msg = c.run(s, p);
    log(s, `【${ev.title}】${msg}`);
    inc.closed = true;
    s.event = null;
    pumpEvents(s);

  function endWeek(s) {

    if (s.eps.some((e) => E.isGross(e.plan) && danger(e)) && (reduceMotion || Math.floor(t / 400) % 2)) rect(g, ph.x + 9, ph.y, 2, 2, "#e5484d");

  // ---------- screens ----------
  function weekSpan() {
    const last = Math.max(...s.eps.map((e) => (e.plan ? e.plan.start + e.plan.dur - 1 : 0)), s.pre + E.EPISODES, s.phase === "prod" ? s.nextAir + E.unaired(s).length : 0);
    return Math.min(40, last + 1);
  }
  function teamOptions(ep) {
    return s.teams.map((t) => `<option value="${t.key}" ${ep.plan.team === t.key ? "selected" : ""}>${t.label}（社内）</option>`).join("")
      + s.gross.map((c) => `<option value="g${c.id}" ${ep.plan.team === "g" + c.id ? "selected" : ""}>グロス：${esc(c.name)}</option>`).join("");
  }
  function ganttHtml() {
    const W = weekSpan(), prod = s.phase === "prod";
    const issues = E.planIssues(s);
    const bad = new Set(issues.filter((i) => !i.soft).map((i) => i.n));
    const head = Array.from({ length: W }, (_, i) => `<th class="wk ${prod && i + 1 === s.week ? "now" : ""}">${i + 1}</th>`).join("");
    const rows = s.eps.map((ep) => {
      const p = ep.plan, end = p.start + p.dur - 1;
      const air = prod ? (ep.aired ? null : E.airWeekOf(s, ep)) : E.planAir(s, ep.n);
      const editable = !ep.started && !ep.aired;
      const fc = prod && !ep.aired && !ep.delivered ? E.epForecast(s, ep) : null;
      const actualFrom = prod && ep.started ? ep.startWeek : null;
      const actualTo = prod && ep.started ? (ep.delivered ? ep.deliveredWeek : ep.aired ? null : s.week - 1) : null;
      const cells = Array.from({ length: W }, (_, i) => {
        const w = i + 1;
        const inPlan = w >= p.start && w <= end;
        const inAct = actualFrom != null && actualTo != null && w >= actualFrom && w <= actualTo;
        let cls = "c", inner = "";
        if (inPlan) cls += " pl";
        if (inAct) cls += " ac";
        const fcFrom = ep.started ? s.week : Math.max(s.week, fc - p.dur + 1);
        if (fc && w >= fcFrom && w <= fc) cls += " fc";
        if (air === w) inner = `<span class="air ${fc && fc > air ? "late" : ""}">▼</span>`;
        if (prod && ep.aired && ep.airWeek === w) inner = `<span class="air done">●</span>`;
        if (prod && w === s.week) cls += " now";
        return `<td class="${cls}" style="--tc:${teamColor(p.team)}">${inner}</td>`;
      }).join("");
      const status = prod ? (ep.aired ? `放送済 ${ep.airQ}` : ep.delivered ? "納品済" : ep.started ? `予測 W${fc}` : `W${p.start}着手予定`) : "";
      return `<tr class="${bad.has(ep.n) ? "bad" : ""}">
        <th class="ep">#${ep.n}</th>
        <td class="ctl">${editable ? `<select data-act="planTeam" data-v="${ep.n}" aria-label="第${ep.n}話の担当">${teamOptions(ep)}</select>` : `<span class="tm" style="--tc:${teamColor(p.team)}">${esc(teamLabel(p.team))}</span>`}</td>
        <td class="ctl num">${editable ? `<button class="mini" data-act="planStart" data-v="${ep.n}" data-d="-1" aria-label="着手を1週早める">◀</button>W${p.start}<button class="mini" data-act="planStart" data-v="${ep.n}" data-d="1" aria-label="着手を1週遅らせる">▶</button>` : `W${ep.startWeek ?? p.start}`}</td>
        <td class="ctl num">${editable ? `<button class="mini" data-act="planDur" data-v="${ep.n}" data-d="-1" aria-label="期間を1週短く" ${p.dur <= E.MIN_DUR ? "disabled" : ""}>−</button>${p.dur}週<button class="mini" data-act="planDur" data-v="${ep.n}" data-d="1" aria-label="期間を1週長く">＋</button>` : `${p.dur}週`}</td>
        ${prod ? `<td class="ctl st">${status}</td>` : ""}
        ${cells}</tr>`;
    }).join("");
    return `<div class="gantt-wrap"><table class="gantt">
      <thead><tr><th class="ep">話</th><th>担当</th><th>着手</th><th>期間</th>${prod ? "<th>状況</th>" : ""}${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  function issuesHtml() {
    const issues = E.planIssues(s);
    if (!issues.length) return `<p class="pos" style="margin:0">問題はありません。</p>`;
    return `<ul class="issues">${issues.map((i) => `<li class="${i.soft ? "soft" : ""}">${esc(i.msg)}</li>`).join("")}</ul>`;

  function hudItem(lb, vl, extra = "") { return `<div class="it"><span class="lb">${lb}</span><span class="vl num">${vl}</span>${extra}</div>`; }
  function meter(v, max, col) { return `<div class="meter"><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%;background:${col}"></i></div>`; }
  function phaseLabel() {
    const next = E.unaired(s)[0];
    if (!next) return "放送終了";
    const w = s.nextAir - s.week;
    if (w === 0) return `第${next.n}話 放送週`;
    return s.aired === 0 ? `放送まであと${w}週` : `次は第${next.n}話（あと${w}週）`;
  }
  function renderProd() {
    const T = E.TIERS[s.tier];
    app.innerHTML = `
      <div class="hud">

        ${hudItem("放送済み", `${s.aired}/12話`)}
        ${s.aired > 0 ? hudItem("評判", Math.round(s.R), meter(s.R, 100, "var(--black)")) : ""}
        ${hudItem("行動", `<span class="ap" aria-label="残り${s.ap}回">${"●".repeat(s.ap)}${"○".repeat(Math.max(0, 3 - s.ap))}</span>`)}

      </div>`;
    officeCanvas = document.getElementById("officeCanvas");
    app.querySelectorAll("[data-face]").forEach((el) => el.appendChild(faceCanvas(+el.dataset.face, el.dataset.sm ? "sm" : "")));
    app.querySelectorAll("[data-kv]").forEach((el) => { const k = s.kv.find((x) => x.n === +el.dataset.kv && !x.recap); if (k) { el.innerHTML = ""; el.appendChild(kvCanvas(k)); } });
    raf = requestAnimationFrame(loop);
  }

  const TABS = [["desk", "全体"], ["board", "グランドスケジュール"], ["gross", "グロス"], ["tv", "放送・SNS"]];
  function panelHtml() {
    const tabs = `<div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button role="tab" aria-selected="${panel === k}" class="${panel === k ? "on" : ""}" data-act="panel" data-v="${k}">${t}</button>`).join("")}</div>`;
    let body = "";
    if (panel === "desk") body = deskPanel();
    else if (panel === "board") body = boardPanel();
    else if (panel === "dir") body = dirPanel();
    else if (panel === "post") body = postPanel();
    else if (panel === "gross") body = grossPanel();
    else if (panel === "tv") body = tvPanel();
    if (!body) { panel = "desk"; body = deskPanel(); }
    return tabs + body;
  }
  function who(seed, role, name, extra = "") {
    return `<div class="who"><span data-face="${seed}"></span><div><span class="sub">${esc(role)}</span><br><span class="nm">${esc(name)}</span>${extra}</div></div>`;
  }
  function seg(label, key, opts) {
    return `<div><div class="plab">${label}</div><div class="seg">${opts.map(([v, t]) => `<button class="${s.policy[key] === v ? "on" : ""}" data-act="policy" data-k="${key}" data-v="${v}" aria-pressed="${s.policy[key] === v}">${t}</button>`).join("")}</div></div>`;
  }
  function capRow(label, have, need, unit, digitsN = 0) {
    if (need <= 0.001) return `<span>${label}</span><span class="bar2"><i style="width:100%;background:var(--paper-line)"></i></span><span class="num sub">完了</span>`;
    const ratio = have / need;
    const col = ratio >= 1.05 ? "var(--black)" : ratio >= 1 ? "var(--marker)" : "var(--red)";
    return `<span>${label}</span><span class="bar2"><i style="width:${Math.min(100, ratio * 50)}%;background:${col}"></i></span><span class="num ${ratio < 1 ? "neg" : ""}">${have.toFixed(digitsN)} / ${need.toFixed(digitsN)}${unit}</span>`;
  }
  function stamBar(v) { return `<span class="stam"><i style="width:${v}%;background:${v < 30 ? "var(--red)" : v < 55 ? "var(--marker)" : "var(--black)"}"></i></span>`; }
  function actBtn(id, arg) {
    const a = E.ACTIONS[id];
    return `<button class="act" data-act="do" data-v="${id}" ${arg != null ? `data-arg="${arg}"` : ""} ${E.canAct(s, id, arg) ? "" : "disabled"}>
      <span class="an">${esc(a.label)}</span><span class="ac">行動${a.ap}</span><span class="ac">${esc(a.desc)}</span></button>`;
  }
  function rushBtns(ep, cls = "btn small rush") {
    const late = !ep.aired && !ep.delivered && E.epForecast(s, ep) > E.airWeekOf(s, ep);
    const modes = ["24h", "12h", "2gen", "short"].filter((m) => E.canRush(s, ep, m));
    if (!late || !modes.length) return "";
    return `<span class="xls-sep">巻き</span>` + modes.map((m) => { const x = E.previewRush(s, ep.n, m); return `<button class="${cls}" data-act="rush" data-v="${ep.n}" data-k="${m}">${m === "short" ? "撮影スケジュール短縮" : E.RUSH[m].label}<span class="pv">W${x.fc}・品質${x.q0}→${x.q}${x.q < E.LINE ? "（基準割れ）" : ""}</span></button>`; }).join("");
  }
  function deskPanel() {
    const f = s.stat || E.forecast(s);
    const rows = s.teams.map((t) => {
      const sh = E.shinkoBy(s, t.shinko), ep = activeEpOf(t.key);
      const next = s.eps.find((e) => e.plan.team === t.key && !e.started && !e.aired);
      return `<tr class="click" data-act="xls" data-v="${t.key}">
        <td><span class="tm" style="--tc:${TEAM_COL[t.key]}">${t.label}</span></td>
        <td>${esc(sh.name)}${sh.gone ? ' <span class="tagx t-bad">不在</span>' : ""}<br><span class="sub">段取り${stars(sh.skill)}</span> ${stamBar(sh.stamina)}</td>
        <td>${ep ? `第${ep.n}話 ${E.STAGE_LABEL[E.stageOf(ep)]}` : "手が空いている"}</td>
        <td class="num">${ep ? `W${E.epForecast(s, ep)}${danger(ep) ? ' <span class="tagx t-bad">遅れ</span>' : ""}${Math.round(E.epQuality(s, ep)) < E.LINE ? ' <span class="tagx t-bad">基準割れ</span>' : ""}` : next ? `次 #${next.n}` : "—"}</td></tr>`;
    }).join("");
    return `
      <section class="sheet">
        ${who(424242, "制作デスク", "あなた")}
        <p class="speech" style="margin:10px 0 0">${esc(E.deskNote(s))}</p>
      </section>
      <section class="sheet">
        <h3>班の状況（進行の報告）</h3>
        <div class="kohyo-wrap"><table class="kohyo"><thead><tr><th>班</th><th>進行</th><th>作業中</th><th>完パケ予測</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="sub" style="margin:6px 0 0">行を押すと進行表を開きます。段取りの悪い進行は、トラブルを報告せずに抱え込むことがあります。ヘルプに入れば現場の本当の状況が分かります。</p>
      </section>
      <section class="sheet">
        <h3>部署の処理能力と、必要なペース</h3>
        <div class="cap">
          ${capRow("コンテ", f.conte, f.needConte, " 話/週", 2)}
          ${capRow("動画", f.douga, f.need.douga, " カット/週")}
          ${capRow("仕上げ", f.shiage, f.need.shiage, " カット/週")}
          ${capRow("撮影", f.satsuei, f.need.satsuei, " カット/週")}
        </div>
      </section>
      <section class="sheet">
        <h3>現場への指示</h3>
        <div class="policy">
          ${seg("動画・仕上げの発注先", "douga", [["inhouse", "社内のみ"], ["overseas", "海外も可"]])}
          ${seg("進め方", "mode", [["stock", "作り置き優先"], ["quality", "品質優先"]])}
          ${seg("残業", "ot", [[false, "させない"], [true, "させる"]])}
        </div>
        <p class="sub" style="margin:8px 0 0">海外は量をこなせますが品質は落ちます。品質優先は丁寧なぶん遅くなります。残業は2割速くなりますが、人が倒れ、進行が飛びやすくなります。</p>
      </section>`;
  }
  function boardPanel() {
    return `<section class="sheet">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">グランドスケジュール</h3>
          <div class="legend">${s.teams.map((t) => `<span style="--c:${TEAM_COL[t.key]}">${t.label}</span>`).join("")}<span style="--c:#8a93ab">グロス</span></div></div>
        <p class="sub" style="margin:4px 0 8px">薄い色が予定、濃い色が実際に作業した週、斜線が完パケまでの予測（進行の報告ベース）、▼が放送週。着手前の話数は担当や日程を組み替えられます（グロスへの切り替えも）。</p>
        <button class="btn small" data-act="ganttBig" style="margin-bottom:8px">大きく開く</button>
        ${ganttHtml()}
      </section>
      <section class="sheet"><h3>チェック</h3>${issuesHtml()}</section>`;
  }
  function grossPanel() {
    return s.gross.map((c) => {
      const eps = s.eps.filter((e) => e.plan.team === "g" + c.id);
      return `<section class="sheet">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(c.name)}</h3><span class="sub ${c.quality < E.LINE + 3 ? "neg" : ""}">品質 ${c.quality}（基準${E.LINE}） ／ 同時${c.cap}話</span></div>
        <p class="sub" style="margin:4px 0 6px">${esc(c.note)}</p>
        ${eps.length ? `<table class="pl"><thead><tr><th>話</th><th>予定</th><th>進み</th><th>完パケ予測</th><th></th></tr></thead><tbody>
          ${eps.map((e) => `<tr><td>#${e.n}</td><td>W${e.plan.start}–W${e.plan.start + e.plan.dur - 1}</td>
            <td>${e.aired ? `放送済 ${e.airQ}` : e.delivered ? "納品済" : e.started ? `${Math.round(e.gprog * 100)}%${e.gslip ? `（遅れ${e.gslip}週）` : ""}` : "着手前"}</td>
            <td>${!e.aired && !e.delivered ? `W${E.epForecast(s, e)}${danger(e) ? ' <span class="tagx t-bad">遅れ</span>' : ""}` : "—"}</td>
            <td>${e.started && !e.delivered && !e.aired ? `<button class="btn small" data-act="do" data-v="grossPush" data-arg="${e.n}" ${E.canAct(s, "grossPush", e.n) ? "" : "disabled"}>催促（行動1）</button>${e.rush ? `<span class="tagx t-bad">${E.RUSH[e.rush].label}</span>` : ""}<div class="rushrow">${rushBtns(e, "btn small")}</div>` : ""}</td></tr>`).join("")}
          </tbody></table>` : `<p class="sub" style="margin:0">発注している話数はありません。グランドスケジュールで担当を切り替えると発注できます。</p>`}
      </section>`;
    }).join("");
  }

  // ---------- the 進行表 (spreadsheet) ----------
  let xls = null;   // { key: team key or "all", n: episode on the open tab }
  function xlsTabs() {
    if (xls.key === "all") return s.eps.filter((e) => e.started && !e.aired && !e.delivered && !E.isGross(e.plan));
    return s.eps.filter((e) => e.plan.team === xls.key);
  }
  function openXls(key) {
    xls = { key, n: null };
    const tabs = xlsTabs();
    const cur = tabs.find((e) => e.started && !e.delivered && !e.aired) || tabs.find((e) => !e.aired) || tabs[0];
    xls.n = cur ? cur.n : null;
    showModal({ kind: "xls" });
  }
  const COLS = "ABCDEFGHIJKL".split("");
  function cell(v, total) {
    const cls = v >= total - 0.5 ? "ok" : v > 0.05 ? "wip" : "";
    return `<td class="n ${cls}">${Math.floor(v + 0.001)}/${Math.round(total)}</td>`;
  }
  function pctCell(v, total) {
    const p = Math.min(100, Math.floor((v / total) * 100 + 0.001));
    return `<td class="n ${p >= 100 ? "ok" : p > 0 ? "wip" : ""}">${p}%</td>`;
  }
  // what adding k animators would do: forecast and quality on a throwaway copy
  function previewAdd(ep, k) {
    const c = JSON.parse(JSON.stringify(s));
    E.addAnimators(c, ep.n, k, true);
    const e2 = E.epBy(c, ep.n);
    return { fc: E.epForecast(c, e2), q: Math.round(E.epQuality(c, e2)) };
  }
  function artState(ep) {
    if (E.isGross(ep.plan)) return "協力会社";
    if (!ep.art) return ep.started ? "ラフ原待ち" : "—";
    if (s.week < ep.art.start) return `W${ep.art.start}から`;
    if (s.week < ep.art.start + E.ART_WEEKS) return `作業中（W${ep.art.start + E.ART_WEEKS - 1}まで）`;
    return "完了";
  }
  function xlsHtml() {
    const tabs = xlsTabs();
    const ep = xls.n ? E.epBy(s, xls.n) : null;
    const team = xls.key !== "all" ? E.teamBy(s, xls.key) : ep && !E.isGross(ep.plan) ? E.teamBy(s, ep.plan.team) : null;
    const sh = team ? E.shinkoBy(s, team.shinko) : null;
    const title = xls.key === "all" ? "作画部屋_原画マン一覧" : `進行表_${team.label}`;
    let rows = [], tools = "";
    const row = (k, v, cls = "") => rows.push(`<td class="k" colspan="2">${k}</td><td class="v ${cls}" colspan="5">${esc(v)}</td>`);
    if (!ep) rows.push(`<td colspan="7">この班にはまだ話数が割り当てられていません。</td>`);
    else {
      const p = ep.plan, end = p.start + p.dur - 1;
      const air = ep.aired ? null : E.airWeekOf(s, ep);
      const fc = !ep.aired && !ep.delivered ? E.epForecast(s, ep) : ep.deliveredWeek;
      const late = air != null && fc > air;
      row("話数", `第${ep.n}話（${ep.cuts}カット）`);
      row("担当", E.isGross(p) ? teamLabel(p.team) : `${team.label}／進行 ${sh.name}／作画監督 ${team.sakkan.name}（実力${team.sakkan.skill}）`);
      row("予定", `W${p.start}〜W${end}（${p.dur}週）${ep.started ? `／実際の着手 W${ep.startWeek}` : ""}`);
      row("放送", ep.aired ? `放送済（出来 ${ep.airQ}）` : `W${air}`);
      row("完パケ", ep.aired ? "—" : ep.delivered ? `W${ep.deliveredWeek} 納品済` : `予測 W${fc}${late ? "　※放送に間に合いません" : ""}`, late ? "bad" : "");
      if (ep.rush || ep.short) row("巻き", [ep.rush ? E.RUSH[ep.rush].label : "", ep.short ? "撮影短縮" : ""].filter(Boolean).join("＋") + (E.isGross(p) ? `（品質 −${ep.penFix}）` : `（品質 −${((ep.pen || 0) / ep.cuts + (ep.penFix || 0)).toFixed(1)}。巻いたカットが増えるほど下がる）`), "bad");
      if (E.isGross(p)) {
        row("進み", `${Math.round(ep.gprog * 100)}%${ep.gslip ? `（遅れ ${ep.gslip}週）` : ""}／品質見込み ${Math.round(E.epQuality(s, ep))}（局の基準 ${E.LINE}）`, Math.round(E.epQuality(s, ep)) < E.LINE ? "bad" : "");
        rows.push(`<td colspan="7" class="blank"></td>`);
        row("グロス", "1話まるごと協力会社に発注しています。原画マンの内訳は先方の管理です。");
        tools = ep.started && !ep.delivered && !ep.aired ? `<button class="btn small" data-act="do" data-v="grossPush" data-arg="${ep.n}" ${E.canAct(s, "grossPush", ep.n) ? "" : "disabled"}>協力会社を催促（行動1）</button>` + rushBtns(ep) : "";
      } else if (!ep.started) {
        rows.push(`<td colspan="7" class="blank"></td>`);
        row("着手前", `${ep.conte < 1 ? `コンテ待ち（${Math.round(ep.conte * 100)}%）。` : ""}予定 W${p.start} から。前の話数の原画が上がり次第、班が入ります（原画マン${E.recommendAnims(s, ep)}人の予定）。`);
      } else {
        const view = ep.anims.map((a) => E.viewAnim(s, a));
        const live = view.filter((a) => !a.out);
        const q = Math.round(E.epQuality(s, ep));
        row("原画マン", `${live.length}人${E.dilution(ep) > 0 ? `（${E.BASE_ANIMS}人を超えたぶん品質 −${E.dilution(ep).toFixed(1)}）` : ""}／品質見込み ${q}（局の基準 ${E.LINE}）${q < E.LINE ? "　※このままだと納品拒否" : ""}`, q < E.LINE ? "bad" : "");
        rows.push(`<td colspan="7" class="blank"></td>`);
        rows.push(`<td class="hd">No.</td><td class="hd">原画マン</td><td class="hd n">実力</td><td class="hd n">持ち</td><td class="hd n">ラフ原</td><td class="hd n">原画</td><td class="hd">状態</td>`);
        view.forEach((a, i) => {
          const state = a.out ? "外れた" : a.hold > 0 ? "連絡待ち" : a.slow < 1 ? "他社優先" : a.genga >= a.cuts - 0.5 ? "上がり" : a.rough >= a.cuts - 0.5 ? "原画中" : a.rough > 0 ? "ラフ原中" : "未着手";
          rows.push(`<td class="n ${a.hold > 0 || a.slow < 1 ? "badc" : ""}">${i + 1}</td><td class="${a.hold > 0 || a.slow < 1 ? "badc" : a.out ? "outc" : ""}">${esc(a.name)}</td><td class="n">${a.skill}</td><td class="n">${Math.round(a.cuts)}</td>${cell(a.rough, a.cuts)}${cell(a.genga, a.cuts)}<td class="${a.hold > 0 || a.slow < 1 ? "badc" : ""}">${state}</td>`);
        });
        const tr = live.reduce((x, a) => x + a.rough, 0) + view.filter((a) => a.out).reduce((x, a) => x + a.rough, 0);
        const tg = view.reduce((x, a) => x + a.genga, 0);
        rows.push(`<td class="tot"></td><td class="tot">合計</td><td class="tot n">${Math.round(live.reduce((x, a) => x + a.skill, 0) / Math.max(1, live.length))}</td><td class="tot n">${ep.cuts}</td>${cell(tr, ep.cuts).replace('class="n', 'class="tot n')}${cell(tg, ep.cuts).replace('class="n', 'class="tot n')}<td class="tot"></td>`);
        rows.push(`<td colspan="7" class="blank"></td>`);
        rows.push(`<td class="hd" colspan="2">後工程（各部署）</td><td class="hd n" colspan="2">進捗</td><td class="hd" colspan="3"></td>`);
        rows.push(`<td colspan="2">動画</td>${pctCell(ep.douga, ep.cuts).replace("<td", '<td colspan="2"')}<td colspan="3" class="sub">${ep.rush ? `${E.RUSH[ep.rush].label}（外の動仕に直接）` : s.policy.douga === "overseas" ? "社内＋海外" : "社内"}</td>`);
        rows.push(`<td colspan="2">仕上げ</td>${pctCell(ep.shiage, ep.cuts).replace("<td", '<td colspan="2"')}<td colspan="3"></td>`);
        rows.push(`<td colspan="2">撮影</td>${pctCell(ep.satsuei, ep.cuts).replace("<td", '<td colspan="2"')}<td colspan="3" class="sub">${ep.short ? "撮影短縮（上がった端から撮って出す）" : ep.art && s.week >= ep.art.start + E.ART_WEEKS - 1 ? "" : "美術・CG待ち"}</td>`);
        rows.push(`<td colspan="2">美術</td><td colspan="2" class="n ${artState(ep) === "完了" ? "ok" : ep.art ? "wip" : ""}">${artState(ep)}</td><td colspan="3"></td>`);
        rows.push(`<td colspan="2">CG</td><td colspan="2" class="n ${artState(ep) === "完了" ? "ok" : ep.art ? "wip" : ""}">${artState(ep)}</td><td colspan="3"></td>`);
        if (E.canAddAnim(s, ep)) {
          tools = [1, 3, 5].map((k) => { const x = previewAdd(ep, k); return `<button class="btn small" data-act="addAnim" data-v="${ep.n}" data-k="${k}">原画マン ＋${k}人<span class="pv">W${x.fc}・品質${x.q}</span></button>`; }).join("");
        } else tools = `<span class="sub">原画はほぼ上がったので、もう人は足せません。</span>`;
        // 間に合わないときだけ、巻きの手を出す
        tools += rushBtns(ep);
      }
    }
    const helpBtn = sh ? (sh.gone ? `<button class="btn small" data-act="do" data-v="hireShinko" data-arg="${sh.id}" ${E.canAct(s, "hireShinko", sh.id) ? "" : "disabled"}>新しい進行を入れる（行動1）</button>`
      : `<button class="btn small" data-act="do" data-v="help" data-arg="${sh.id}" ${E.canAct(s, "help", sh.id) ? "" : "disabled"}>${sh.helped ? "今週はヘルプ済み" : `${sh.name}のヘルプに入る（行動1）`}<span class="pv">現場の本当の状況が分かる</span></button>`) : "";
    const fx = ep ? `=第${ep.n}話!完パケ予測 → ${ep.aired ? "放送済" : ep.delivered ? `W${ep.deliveredWeek}` : `W${E.epForecast(s, ep)}`}　（${sh ? `進行 ${sh.name} の報告` : "現場の数字"}）` : "";
    return `<div class="xls" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="xls-top"><span class="xls-file">${esc(title)}</span>
        ${sh ? `<span class="xls-who">進行 ${esc(sh.name)}　段取り ${stars(sh.skill)}　体力 ${stamBar(sh.stamina)} ${Math.round(sh.stamina)}${sh.gone ? '　<span class="tagx t-bad">連絡が取れない</span>' : ""}</span>` : ""}
        <button class="xls-x" data-act="closeModal" aria-label="閉じる">×</button></div>
      <div class="xls-tools">${tools}${helpBtn}</div>
      <div class="xls-fx"><span class="fxl">fx</span><span>${esc(fx)}</span></div>
      <div class="xls-grid"><table>
        <thead><tr><th class="rn"></th>${COLS.slice(0, 7).map((c) => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr><th class="rn">${i + 1}</th>${r}</tr>`).join("")}</tbody>
      </table></div>
      <div class="xls-tabs">${tabs.map((e) => `<button class="${e.n === xls.n ? "on" : ""}" data-act="xlsTab" data-v="${e.n}">#${e.n}${e.aired ? "（済）" : e.delivered ? "（納品）" : e.started ? "" : "（前）"}</button>`).join("") || `<span class="sub">シートがありません</span>`}</div>
    </div>`;
  }

  // ---------- result ----------
  function renderEnd() {
    const r = s.result, T = E.TIERS[s.tier];
    const best = store.get("animep.best4") || {};
    const order = "DCBAS";
    if (!s.savedBest && (!best[s.tier] || order.indexOf(r.rank) > order.indexOf(best[s.tier]))) { best[s.tier] = r.rank; store.set("animep.best4", best); }
    s.savedBest = true;
    app.innerHTML = `
      <p class="step">${esc(T.studio)} ／「${esc(s.src.title)}」／ 最終回放送</p>
      <div class="result">
        <section class="sheet row" style="justify-content:space-between;align-items:center">
          <div><h2>制作デスクの評価</h2>
            <div class="score">平均の出来 ${r.avgQ.toFixed(1)}</div>
            <p class="sub">作画崩壊 ${r.collapses}回 ／ 総集編 ${s.recaps}回 ／ 放送延期 ${s.delays}回 ／ 放送1週前までに納品 ${r.early}話</p></div>
          <div class="rank" style="color:${r.rank === "S" || r.rank === "A" ? "var(--pink)" : "var(--ink)"}">${r.rank}</div>
        </section>
        <section class="sheet"><h3>全12話</h3>
          <div class="kvs">${Array.from({ length: E.EPISODES }, (_, i) => `<div class="kvbox"><span data-kv="${i + 1}"></span><span>#${i + 1} ${s.eps[i].airQ ?? ""}${E.isGross(s.eps[i].plan) ? " G" : ""}</span></div>`).join("")}</div>
          <p class="sub" style="margin-top:8px">G＝グロス回</p></section>
        <section class="sheet"><h3>現場の記録</h3>
          <dl class="kv">
            <dt>起きたトラブル</dt><dd>${s.incidents.length}件</dd>
            <dt>進行が抱え込んでいたトラブル</dt><dd>${s.lateReports}件（ぎりぎりで報告）／ ヘルプで見つけた ${s.hiddenFound}件</dd>
            <dt>ヘルプに入った回数</dt><dd>${s.helpCount}回</dd>
            <dt>途中で足した原画マン</dt><dd>${s.added}人</dd>
            <dt>納品拒否</dt><dd>${s.rejects}回</dd>
            <dt>グロスに出した話数</dt><dd>${s.eps.filter((e) => E.isGross(e.plan)).length}話</dd>
          </dl></section>
        <section class="sheet"><h3>結果をシェア</h3>
          <p id="shareText" style="white-space:pre-wrap;margin:0 0 8px;user-select:all">${esc(shareText())}</p>
          <div class="row"><button class="btn" data-act="copy">コピー</button><span class="sub" id="copyMsg"></span></div></section>
        <div class="row"><button class="btn primary" data-act="again">同じスタジオでもう一度</button><button class="btn" data-act="title">スタジオを選び直す</button></div>
      </div>`;
    app.querySelectorAll("[data-kv]").forEach((el) => { const k = s.kv.find((x) => x.n === +el.dataset.kv && !x.recap); if (k) { el.innerHTML = ""; el.appendChild(kvCanvas(k)); } });
  }
  function shareText() {
    const r = s.result;
    const row = s.eps.map((e) => (e.collapse ? "🟥" : e.grade === "god" ? "🟪" : e.grade === "good" ? "🟩" : e.grade === "mid" ? "🟨" : "🟧")).join("");
    return `深夜アニメP 制作デスク篇 ${E.TIERS[s.tier].name}「${s.src.title}」\n${row}${s.recaps ? ` 総集編${s.recaps}` : ""}\n評価 ${r.rank}（平均の出来 ${r.avgQ.toFixed(1)}）`;
  }

  // ---------- modals ----------
  function showModal(m) { modal = m; renderModal(); }
  function closeModal() { modal = null; xls = null; modalRoot.innerHTML = ""; }
  function reporterHtml(rep) {
    if (!rep) return "";
    if (rep.kind === "shinko") { const sh = E.shinkoOfTeam(s, rep.team); return sh ? who(sh.seed, `${rep.team}班 制作進行`, sh.name, `<span class="sub">　段取り${stars(sh.skill)}</span>`) : ""; }
    if (rep.kind === "sakkan") { const t = E.teamBy(s, rep.team); return who(t.sakkan.seed, `${t.label} 作画監督`, t.sakkan.name); }
    if (rep.kind === "dir") return who(s.staff.dir.seed, "監督", s.staff.dir.name);
    if (rep.kind === "gross") { const c = E.grossBy(s, rep.id); return who(7000 + rep.id, "協力会社", c.name); }
    if (rep.kind === "post") return who(5150, "仕上げ担当", "海外窓口");
    if (rep.kind === "kyoku") return who(s.staff.kp.seed, "製作委員会・局プロデューサー", s.staff.kp.name);
    return who(424242, "制作デスク", "あなた（気づいたこと）");
  }
  function renderModal() {
    if (!modal) { modalRoot.innerHTML = ""; return; }
    if (modal.kind === "xls") { modalRoot.innerHTML = `<div class="modal-bg xls-bg">${xlsHtml()}</div>`; modalRoot.querySelector(".xls-x")?.focus({ preventScroll: true }); return; }
    if (modal.kind === "gantt") {
      modalRoot.innerHTML = `<div class="modal-bg xls-bg"><div class="xls" role="dialog" aria-modal="true" aria-label="グランドスケジュール" style="grid-template-rows:auto auto 1fr">
        <div class="xls-top"><span class="xls-file">グランドスケジュール</span><span class="xls-who">第${s.week}週</span><button class="xls-x" data-act="closeModal" aria-label="閉じる">×</button></div>
        <div class="xls-tools"><div class="legend">${s.teams.map((t) => `<span style="--c:${TEAM_COL[t.key]}">${t.label}</span>`).join("")}<span style="--c:#8a93ab">グロス</span></div><span class="sub">薄い色＝予定、濃い色＝作業した週、斜線＝完パケまでの予測、▼＝放送週</span></div>
        <div style="overflow:auto;padding:10px">${ganttHtml()}<div style="margin-top:10px">${issuesHtml()}</div></div></div></div>`;
      modalRoot.querySelector(".xls-x")?.focus({ preventScroll: true });
      return;
    }
    let body = "";
    if (modal.kind === "event") {
      const v = E.eventView(s);
      if (!v) return closeModal();
      const note = v.found ? `<p class="tagx t-warn" style="display:inline-block">ヘルプに入って見つけた（${v.weeksHidden > 0 ? `${v.weeksHidden}週間、報告がなかった` : "まだ報告されていなかった"}）</p>` : v.late ? `<p class="tagx t-bad" style="display:inline-block">報告が${v.weeksHidden}週間遅れた</p>` : "";
      body = `<h2>${esc(v.title)}</h2>${reporterHtml(v.reporter)}${note}<p class="speech">${esc(v.text)}</p>
        <div class="choices">${v.choices.map((c) => `<button class="btn" data-act="evChoice" data-v="${c.i}" ${c.ok ? "" : "disabled"}>${esc(c.label)}</button>`).join("")}</div>`;
    } else if (modal.kind === "air") {
      const pa = s.pendingAir, pct = Math.round(pa.prog * 100);
      body = `<h2>第${pa.n}話が間に合わない</h2>
        <p>放送日なのに、第${pa.n}話は撮影まで終わったカットが${pct}%しかありません。</p>
        <div class="choices">
          <button class="btn" data-act="airChoice" data-v="air" ${E.canAirAsIs(s) ? "" : "disabled"}>${E.canAirAsIs(s) ? `このまま放送する（${pct < 85 ? "作画崩壊は確実" : "品質が落ちる"}・出来 ${Math.round(E.airAsIsQ(s))}）` : `このまま放送する（局が受け取らない：${E.epBy(s, pa.n).rejectPending ? "納品拒否中" : `出来 ${Math.round(E.airAsIsQ(s))}／基準${E.LINE}`}）`}</button>
          <button class="btn" data-act="airChoice" data-v="recap" ${s.recaps >= 2 ? "disabled" : ""}>総集編を挟む（残り${2 - s.recaps}回）</button>
          <button class="btn" data-act="airChoice" data-v="delay">万策尽きた。放送を2週延期</button>
        </div>`;
    } else if (modal.kind === "aired") {
      const a = s.lastAir;
      if (!a || !a.ep || a.recap || a.delay) { const next = modal.next; closeModal(); return afterTurn(next); }
      const posts = s.sns.filter((p) => p.n === a.ep.n).slice(0, 2);
      body = `<h2>第${a.ep.n}話 放送${E.isGross(a.ep.plan) ? `<span class="sub">　グロス回（${esc(E.grossOf(s, a.ep.plan).name)}）</span>` : ""}</h2>
        <div class="bigkv"><span data-bigkv></span>
          <div><p style="margin:0">作画の出来 <b class="num" style="font-size:22px">${a.ep.airQ}</b> ${a.ep.collapse ? '<span class="tagx t-bad">作画崩壊</span>' : a.grade === "god" ? '<span class="tagx t-ok">神回</span>' : ""}</p>
          ${posts.map((p) => `<div class="post ${["god", "good"].includes(p.kind) ? "good" : ["bad", "collapse"].includes(p.kind) ? "bad" : ""}" style="margin-top:6px"><span class="h">${esc(p.h)}</span><br>${esc(p.t)}</div>`).join("")}</div>
        </div>
        <div class="choices"><button class="btn primary" data-act="airedOk">次へ</button></div>`;
    } else if (modal.kind === "quit") {
      body = `<h2>やめますか</h2><p>進行中のデータは消え、スタジオ選びに戻ります。</p>
        <div class="choices"><button class="btn" data-act="quitYes">やめてスタジオ選びに戻る</button><button class="btn primary" data-act="closeModal">続ける</button></div>`;
    } else if (modal.kind === "help") {
      body = `<h2>遊び方</h2>
        <p>あなたは制作デスク。夜のスタジオで、人や物を押すと詳しい様子が出ます。</p>
        <ul>
          <li><b>制作進行</b>（各班の席）を押すと、その班の<b>進行表</b>が開きます。原画マンごとのラフ原・原画の進みと、動画・仕上げ・撮影・美術・CGの進捗が並びます。遅れていたら原画マンを足します。${E.BASE_ANIMS}人を超えると、腕がよくても絵がばらつき、品質が下がります。</li>
          <li>トラブルは進行が報告してきます。<b>段取りの悪い進行はトラブルを抱え込み、放送直前まで報告しません</b>。そのあいだ進行表の数字は順調に見えます。怪しい班には<b>ヘルプに入る</b>と、本当の状況が分かります。</li>
          <li>トラブルはシリーズの後半ほど増えます。</li>
          <li><b>ホワイトボード</b>はグランドスケジュール。着手前の話数は組み替えたり、グロスに切り替えたりできます。<b>電話</b>は協力会社（グロス）です。</li>
          <li>放送に間に合わない話数が出ると、進行が報告してきます。原画中なら<b>24時間動仕・12時間動仕・2原動仕</b>（下ほど速く上がるが、カットの仕上がりが悪くなる）、撮影に入ってからなら<b>撮影スケジュールの短縮</b>（品質が大きく落ちる）で巻けます。進行表からも指示できます。</li>
          <li>局・製作委員会の<b>納品基準は品質${E.LINE}</b>。完パケの品質がこれを下回ると<b>納品拒否</b>され、リテイクになります。基準を下回る話数は、放送日に「このまま放送」もできません（総集編か延期）。</li>
          <li>行動は週3回。最後に「今週を締める」。放送日までに撮影が終わらないと、作画崩壊か総集編です。</li>
        </ul>
        <div class="choices"><button class="btn primary" data-act="closeModal">閉じる</button></div>`;
    }
    modalRoot.innerHTML = `<div class="modal-bg"><div class="sheet modal flashin" role="dialog" aria-modal="true">${body}</div></div>`;
    modalRoot.querySelectorAll("[data-face]").forEach((el) => el.appendChild(faceCanvas(+el.dataset.face)));
    const big = modalRoot.querySelector("[data-bigkv]");
    if (big && s.lastAir?.ep) { const k = s.kv.find((x) => x.n === s.lastAir.ep.n && !x.recap); if (k) big.appendChild(kvCanvas(k)); }
    const first = modalRoot.querySelector("button:not(:disabled)");
    if (first) first.focus({ preventScroll: true });
  }
  function afterTurn(res) {
    save();
    if (res === "end") { closeModal(); render(); window.scrollTo(0, 0); return; }
    render();
    if (s.event) showModal({ kind: "event" }); else closeModal();
  }
  function runTurn(step) {
    const before = s.aired;
    const res = step();
    if (res == null) return;
    if (res === "air") { save(); render(); return showModal({ kind: "air" }); }
    if (s.aired > before) { save(); render(); return showModal({ kind: "aired", next: res }); }
    afterTurn(res);
  }
  // after an action, a newly surfaced trouble takes over the screen
  const rerender = () => { save(); render(); if (s.event) showModal({ kind: "event" }); else if (modal && modal.kind === "xls") renderModal(); };

  // ---------- input ----------
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act, v = b.dataset.v;
    if (b.tagName === "INPUT" || b.tagName === "SELECT") return;
    switch (act) {
      case "tier": s = E.newGame(v, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break;
      case "title": s = null; clearSave(); render(); break;
      case "again": { const t = s.tier; s = E.newGame(t, (Math.random() * 2 ** 31) | 0); render(); window.scrollTo(0, 0); break; }
      case "autoPlan": E.autoPlan(s); render(); break;
      case "planStart": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { start: ep.plan.start + +b.dataset.d }); rerender(); break; }
      case "planDur": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { dur: ep.plan.dur + +b.dataset.d }); rerender(); break; }
      case "start": if (E.planIssues(s).some((i) => !i.soft)) break; E.startProduction(s); panel = "desk"; save(); render(); window.scrollTo(0, 0); showModal({ kind: "help" }); break;
      case "howto": showModal({ kind: "help" }); break;
      case "closeModal": closeModal(); break;
      case "panel": panel = v; render(); if (matchMedia("(max-width: 980px)").matches) document.getElementById("panel")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); break;
      case "xls": openXls(v); break;
      case "ganttBig": showModal({ kind: "gantt" }); break;
      case "xlsTab": xls.n = +v; renderModal(); break;
      case "addAnim": E.addAnimators(s, +v, +b.dataset.k); rerender(); break;
      case "rush": E.setRush(s, +v, b.dataset.k); rerender(); break;
      case "policy": { const k = b.dataset.k; const val = v === "true" ? true : v === "false" ? false : v; E.setPolicy(s, k, val); rerender(); break; }
      case "do": { const arg = b.dataset.arg != null ? +b.dataset.arg : undefined; const keep = modal && modal.kind === "xls" ? { ...xls } : null; E.doAction(s, v, arg); if (s.event) { modal = null; xls = null; } else if (keep) xls = keep; rerender(); break; }
      case "endWeek": runTurn(() => E.endWeek(s)); break;
      case "airChoice": runTurn(() => E.resolveAir(s, v)); break;
      case "airedOk": { const next = modal.next; closeModal(); afterTurn(next); break; }
      case "evChoice": { if (E.resolveEvent(s, +v) != null) { closeModal(); save(); render(); if (s.event) showModal({ kind: "event" }); } break; }
      case "quit": showModal({ kind: "quit" }); break;
      case "quitYes": closeModal(); s = null; clearSave(); render(); window.scrollTo(0, 0); break;
      case "copy": {
        const text = shareText(), msg = document.getElementById("copyMsg");
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("shareText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
        break;
      }
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && modal && ["xls", "gantt", "help", "quit"].includes(modal.kind)) closeModal(); });
  document.addEventListener("change", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || !s) return;
    if (b.dataset.act === "planTeam") { E.setPlan(s, +b.dataset.v, { team: b.value }); rerender(); }
  });

  // ---------- save / resume ----------
  function save() { if (s && s.phase === "prod") store.set("animep.save", s); }
  function clearSave() { try { localStorage.removeItem("animep.save"); } catch (e) { /* storage unavailable */ } }
  function start(hotData) {
    const saved = hotData && hotData.s ? hotData.s : store.get("animep.save");
    if (saved && saved.v === 6 && saved.phase) s = saved;
    if (hotData && hotData.panel) panel = hotData.panel;
    render();
    if (s && s.phase === "prod") { if (s.pendingAir) showModal({ kind: "air" }); else if (s.event) showModal({ kind: "event" }); }
  }
  window.claude?.hot?.snapshot?.(() => ({ s, panel }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
