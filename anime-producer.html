<title>深夜アニメP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* Layout: a night-time anime studio seen from above (pixel office) on the left; the sheet you clicked (desk report, 香盤表, a 進行's episodes) on the right. */
  :root {
    --desk: #1b2030;        /* page ground: the dark studio */
    --desk-2: #262c40;      /* HUD, raised items */
    --paper: #eef1f5;       /* cool office paper */
    --paper-2: #ffffff;
    --paper-line: #c9d3e3;  /* ruled grid */
    --ink: #1a1e29;
    --ink-soft: #5b6478;
    --on-desk: #e6e9f2;
    --on-desk-soft: #9aa3ba;
    --marker: #ffe14a;      /* highlighter yellow: attention, primary action */
    --pink: #ff5fa2;        /* hype */
    --black: #1f9d63;       /* 黒字 / done */
    --red: #e5484d;         /* 赤字 / danger */
    --blue: #3b6fe0;        /* progress */
    --st-script: #b9c6e4; --st-conte: #8aa6dd; --st-genga: #3b6fe0; --st-sakkan: #7a5cd6; --st-douga: #2ba3a3; --st-satsuei: #1f9d63;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--on-desk); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; box-sizing: border-box; }
  h1, h2, h3, .pix { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; }
  h1 { font-size: 30px; margin: 0; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 8px; text-wrap: balance; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  table { color: inherit; font-size: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sheet { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 14px 16px; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 6px 18px rgba(0,0,0,.35); min-width: 0; }
  .sheet .sub, .sub { color: var(--ink-soft); font-size: 12px; }
  .stamp { display: inline-block; font-family: var(--font-pixel); border: 2px solid currentColor; padding: 0 6px; border-radius: 3px; transform: rotate(-3deg); }
  .btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 8px 12px; font-family: var(--font-pixel); font-size: 14px; line-height: 1.3; }
  .btn:hover { background: #33394a; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: var(--marker); color: var(--ink); }
  .btn.primary:hover { background: #ffe97a; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 14px; }
  .pos { color: var(--black); } .neg { color: var(--red); }
  .money { font-family: var(--font-pixel); }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .face { width: 36px; height: 36px; border-radius: 2px; flex: none; }
  .face.sm { width: 22px; height: 22px; }

  /* title & setup */
  .title-wrap { display: grid; gap: 18px; padding-top: 10px; }
  .logo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .lead { max-width: 62ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { text-align: left; border: 0; display: grid; gap: 6px; align-content: start; }
  .card:hover { outline: 3px solid var(--marker); }
  .card .name { font-family: var(--font-pixel); font-size: 17px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12.5px; margin: 0; }
  .kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }
  .step { color: var(--on-desk-soft); font-family: var(--font-pixel); font-size: 13px; margin: 0 0 4px; }
  .roles { display: grid; gap: 14px; }
  .cand-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
  .cand { background: var(--paper-2); border: 1.5px solid var(--paper-line); border-radius: 3px; padding: 8px; text-align: left; display: flex; gap: 8px; color: var(--ink); align-items: flex-start; }
  .cand:hover:not(:disabled) { border-color: var(--ink); }
  .cand.on { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink); }
  .cand:disabled { opacity: .45; cursor: not-allowed; }
  .cand .nm { font-weight: 700; }
  .arch { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 4px; border-radius: 2px; }
  .cand .st { font-size: 11.5px; color: var(--ink-soft); }
  .footerbar { position: sticky; bottom: 0; margin-top: 16px; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); background: linear-gradient(transparent, var(--desk) 30%); }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .summary b { font-family: var(--font-pixel); font-weight: 400; }
  .offer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
  .offer:last-child { border-bottom: 0; }
  .offer input { width: 18px; height: 18px; accent-color: var(--ink); }
  .offer .cond { font-size: 12px; color: var(--ink-soft); }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  table.pl { border-collapse: collapse; width: 100%; font-size: 13px; }
  .pl td, .pl th { padding: 4px 4px; border-bottom: 1px solid var(--paper-line); text-align: left; font-weight: 400; }
  .pl th { font-size: 11.5px; color: var(--ink-soft); }
  .pl td.r, .pl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pl tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
  .pl tr.subt td { color: var(--ink-soft); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }

  /* production */
  .hud { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; background: var(--desk-2); border-radius: 3px; padding: 8px 12px; margin-bottom: 12px; }
  .hud .it { display: grid; line-height: 1.2; }
  .hud .lb { font-size: 11px; color: var(--on-desk-soft); }
  .hud .vl { font-family: var(--font-pixel); font-size: 17px; }
  .hud .week { font-size: 19px; color: var(--marker); }
  .ap { letter-spacing: 2px; color: var(--marker); }
  .meter { height: 6px; width: 76px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; }
  .hud .tools { margin-left: auto; display: flex; gap: 6px; }
  .hud .tools .btn { background: #39405a; }

  .studio { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
  .officecol { display: grid; gap: 10px; min-width: 0; position: sticky; top: 8px; }
  .officewrap { min-width: 0; border-radius: 3px; }
  .office { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 3px; overflow: hidden; background: #262c40; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .office canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 2px; }
  .hot:hover, .hot:focus-visible, .hot.on { outline: 2px solid var(--marker); outline-offset: 0; background: rgba(255,225,74,.08); }
  .hot .tag { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); white-space: nowrap; font-size: 11px; background: var(--ink); color: var(--paper); padding: 1px 6px; border-radius: 2px; pointer-events: none; opacity: 0; font-family: var(--font-body); }
  .hot:hover .tag, .hot:focus-visible .tag, .hot.on .tag { opacity: 1; }
  .zone { position: absolute; font-family: var(--font-pixel); font-size: 11px; color: rgba(230,233,242,.75); pointer-events: none; text-shadow: 0 1px 0 #000; }
  .deskline { display: flex; gap: 10px; align-items: center; background: var(--desk-2); border-radius: 3px; padding: 8px 10px; }
  .deskline .say { flex: 1; min-width: 0; font-size: 13px; }
  .deskline .say b { font-family: var(--font-pixel); font-weight: 400; color: var(--marker); margin-right: 6px; }
  .endweek { font-size: 17px; padding: 12px 18px; white-space: nowrap; }

  .panel { display: grid; gap: 12px; min-width: 0; }
  .panel .who { display: flex; gap: 10px; align-items: center; }
  .panel .who .nm { font-family: var(--font-pixel); font-size: 17px; }
  .speech { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 3px; padding: 8px 10px; font-size: 13px; position: relative; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button { background: #39405a; color: var(--on-desk); border: 0; border-radius: 3px; padding: 4px 9px; font-size: 12px; font-family: var(--font-pixel); }
  .tabs button.on { background: var(--marker); color: var(--ink); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 5px 6px; font-size: 12.5px; color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .policy { display: grid; gap: 8px; }
  .plab { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .act { text-align: left; background: var(--paper-2); border: 1.5px solid var(--paper-line); border-radius: 3px; padding: 6px 8px; color: var(--ink); display: grid; gap: 1px; }
  .act:hover:not(:disabled) { border-color: var(--ink); }
  .act:disabled { opacity: .4; cursor: not-allowed; }
  .act .an { font-family: var(--font-pixel); font-size: 13px; }
  .act .ac { font-size: 11px; color: var(--ink-soft); }
  .stagebar { display: flex; height: 10px; background: #dfe5ee; border-radius: 2px; overflow: hidden; min-width: 60px; }
  .stagebar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-soft); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 3px; border-radius: 1px; background: var(--c); }
  .tagx { font-family: var(--font-pixel); font-size: 11px; padding: 0 5px; border-radius: 2px; white-space: nowrap; background: #dfe5ee; color: var(--ink); }
  .t-ok { background: #d6f2e4; color: #11633c; } .t-warn { background: var(--marker); color: var(--ink); } .t-bad { background: var(--red); color: #fff; } .t-air { background: var(--ink); color: var(--paper); }
  .kohyo-wrap { overflow-x: auto; }
  table.kohyo { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .kohyo th { font-family: var(--font-pixel); font-weight: 400; text-align: left; font-size: 11.5px; color: var(--ink-soft); border-bottom: 2px solid var(--ink); padding: 4px 5px; white-space: nowrap; }
  .kohyo td { border-bottom: 1px solid var(--paper-line); padding: 4px 5px; vertical-align: middle; }
  .kohyo tr.aired td { color: var(--ink-soft); }
  .kohyo tr.next td { background: rgba(255,225,74,.35); }
  .kohyo tr.click { cursor: pointer; } .kohyo tr.click:hover td { background: rgba(59,111,224,.08); }
  .cap { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 4px 8px; align-items: center; font-size: 12.5px; }
  .cap .bar2 { height: 8px; background: #dfe5ee; border-radius: 2px; position: relative; overflow: hidden; }
  .cap .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; }
  .ep { color: var(--ink); border: 1.5px solid var(--paper-line); background: var(--paper-2); border-radius: 3px; padding: 10px; display: grid; gap: 6px; }
  .ep.hot2 { border-color: var(--red); }
  .ep .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .ep .hd .t { font-family: var(--font-pixel); font-size: 15px; }
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-size: 11px; text-align: center; }
  .stages div { background: #eef1f5; border-radius: 2px; padding: 2px 0; line-height: 1.25; }
  .stages div b { display: block; font-weight: 400; font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink); }
  .stages div.done { background: #d6f2e4; } .stages div.now { background: rgba(255,225,74,.6); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; gap: 6px; align-items: center; border: 1px solid var(--paper-line); border-radius: 3px; padding: 3px 6px 3px 3px; background: var(--paper); font-size: 12px; text-align: left; color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .chip .mini { font-size: 10.5px; color: var(--ink-soft); display: block; line-height: 1.2; }
  .stam { height: 6px; width: 90px; background: #dfe5ee; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .stam i { display: block; height: 100%; }
  .log { font-size: 12.5px; display: grid; gap: 3px; max-height: 240px; overflow-y: auto; }
  .log p { margin: 0; } .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; }
  .sns { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
  .post { font-size: 12.5px; background: var(--paper-2); border-radius: 3px; padding: 6px 8px; border-left: 3px solid var(--paper-line); }
  .post .h { color: var(--ink-soft); font-size: 11px; } .post.good { border-left-color: var(--black); } .post.bad { border-left-color: var(--red); }
  .kvs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .kvbox { display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--ink-soft); }
  .kvbox > span[data-kv] { display: block; width: 100%; max-width: 72px; aspect-ratio: 1; background: #dfe5ee; border-radius: 2px; overflow: hidden; }
  .kvbox canvas { width: 100%; height: 100%; }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper-2); color: var(--ink); color-scheme: light; }


  .budgetbar { position: relative; padding-bottom: 6px; }
  .budgetbar .marks { position: relative; height: 14px; margin: 0 8px; }
  .budgetbar .marks span { position: absolute; top: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; }
  .budgetbar .marks i { display: block; width: 1px; height: 6px; background: var(--ink-soft); margin: 0 auto 1px; }
  /* grand schedule (Gantt) */
  .gantt-wrap { overflow-x: auto; border: 1px solid var(--paper-line); border-radius: 3px; background: var(--paper-2); }
  table.gantt { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .gantt th, .gantt td { border-bottom: 1px solid #e3e8f0; padding: 0; height: 26px; }
  .gantt thead th { font-family: var(--font-pixel); font-weight: 400; font-size: 11px; color: var(--ink-soft); background: var(--paper); position: sticky; top: 0; padding: 0 6px; text-align: left; }
  .gantt th.wk { width: 20px; min-width: 20px; padding: 0; text-align: center; }
  .gantt th.ep { padding: 0 6px; font-family: var(--font-pixel); font-weight: 400; position: sticky; left: 0; background: var(--paper-2); z-index: 1; border: 0; border-bottom: 1px solid #e3e8f0; border-right: 1px solid var(--paper-line); vertical-align: middle; text-align: left; }
  .gantt td.ctl { padding: 0 6px; font-size: 12px; }
  .gantt td.ctl.st { color: var(--ink-soft); font-size: 11.5px; }
  .gantt td.c { width: 20px; min-width: 20px; position: relative; border-left: 1px solid #eef1f5; text-align: center; }
  .gantt td.c.pl { background: color-mix(in srgb, var(--tc) 22%, white); }
  .gantt td.c.ac { background: var(--tc); }
  .gantt td.c.fc { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--tc) 55%, white) 0 3px, transparent 3px 6px); }
  .gantt td.c.now { box-shadow: inset 2px 0 0 var(--marker), inset -2px 0 0 var(--marker); }
  .gantt th.wk.now { background: var(--marker); color: var(--ink); }
  .gantt .air { font-size: 12px; color: var(--ink); position: relative; z-index: 1; }
  .gantt .air.late { color: var(--red); font-weight: 700; }
  .gantt .air.done { color: var(--ink-soft); }
  .gantt tr.bad th.ep { color: var(--red); }
  .gantt tr.bad td.ctl { background: rgba(229,72,77,.08); }
  .gantt select { max-width: 11em; }
  .mini { border: 1px solid var(--paper-line); background: var(--paper); border-radius: 2px; padding: 0 4px; margin: 0 3px; font-size: 11px; line-height: 18px; color: var(--ink); }
  .mini:hover:not(:disabled) { border-color: var(--ink); }
  .mini:disabled { opacity: .35; }
  .tm { display: inline-block; border-left: 4px solid var(--tc); padding-left: 5px; }
  .issues { margin: 0; padding-left: 1.2em; font-size: 12.5px; color: var(--red); display: grid; gap: 2px; }
  .issues li.soft { color: var(--ink-soft); }

  /* the 進行表 (spreadsheet) */
  .xls-bg { padding: 2vh 2vw; }
  .xls { background: #ffffff; color: #1a1e29; width: 100%; max-width: 1180px; height: 100%; max-height: 96vh; display: grid; grid-template-rows: auto auto auto 1fr auto; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); font-family: var(--font-body); }
  .xls-top { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #1f6b45; color: #fff; flex-wrap: wrap; }
  .xls-file { font-weight: 700; font-size: 14px; }
  .xls-file::before { content: ""; display: inline-block; width: 12px; height: 14px; margin-right: 6px; vertical-align: -2px; background: #fff; clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%); }
  .xls-who { font-size: 12px; opacity: .95; }
  .xls-x { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 22px; line-height: 1; padding: 0 6px; }
  .xls-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; background: #f3f5f8; border-bottom: 1px solid #d5dbe5; align-items: center; }
  .xls-tools .btn { font-family: var(--font-body); background: #ffffff; color: #1a1e29; box-shadow: inset 0 0 0 1px #c3cad6; display: inline-grid; line-height: 1.2; text-align: left; }
  .xls-tools .btn:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px #1f6b45; }
  .xls-tools .pv { font-size: 10.5px; color: #5b6478; }
  .xls-fx { display: flex; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid #d5dbe5; font-size: 12px; font-family: ui-monospace, "IPAGothic", monospace; color: #33394a; }
  .xls-fx .fxl { font-style: italic; color: #8a93ab; border-right: 1px solid #d5dbe5; padding-right: 8px; }
  .xls-grid { overflow: auto; }
  .xls-grid table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  .xls-grid th, .xls-grid td { border: 1px solid #e1e5ec; padding: 3px 8px; white-space: nowrap; height: 22px; }
  .xls-grid thead th { background: #f3f5f8; color: #5b6478; font-weight: 400; font-size: 11px; text-align: center; position: sticky; top: 0; z-index: 1; }
  .xls-grid th.rn { background: #f3f5f8; color: #8a93ab; font-weight: 400; font-size: 11px; text-align: right; width: 2.6em; position: sticky; left: 0; }
  .xls-grid td.k { color: #5b6478; background: #fafbfd; }
  .xls-grid td.v.bad { color: var(--red); font-weight: 700; }
  .xls-grid td.blank { height: 10px; padding: 0; }
  .xls-grid tr.hd td { background: #e9f3ee; font-weight: 700; color: #1f6b45; }
  .xls-grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .xls-grid td.ok { background: #d6f2e4; color: #11633c; }
  .xls-grid td.wip { background: #fff3b0; }
  .xls-grid tr.held td { background: #fde4e4; }
  .xls-grid tr.out td { color: #9aa3ba; }
  .xls-grid tr.tot td { font-weight: 700; border-top: 2px solid #1f6b45; }
  .xls-tabs { display: flex; gap: 2px; padding: 0 8px; background: #f3f5f8; border-top: 1px solid #d5dbe5; overflow-x: auto; }
  .xls-tabs button { border: 0; background: transparent; padding: 6px 12px; font-size: 12px; color: #33394a; border-bottom: 3px solid transparent; white-space: nowrap; }
  .xls-tabs button.on { background: #ffffff; color: #1f6b45; border-bottom-color: #1f6b45; font-weight: 700; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 10, 18, .72); display: grid; place-items: center; padding: 16px; z-index: 10; }

<script id="engine">
/* ===================== ゲームの計算（UIなし） ===================== */
const Engine = (() => {
  "use strict";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const round = (v, step = 10) => Math.round(v / step) * step;

  // Seeded RNG kept inside the state so a saved game replays the same.
  function rnd(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    let t = s.rs;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rr = (s, a, b) => a + rnd(s) * (b - a);
  const ri = (s, a, b) => Math.floor(rr(s, a, b + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  function shuffle(s, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- 1話あたりの制作費（万円・ランク1.0のとき） ----------
  // 業界の一般的なサンプル（1話 約1,282万円）を最低ラインにしている。
  const COST_LINES = [
    { k: "gensaku", label: "原作料", base: 5 },
    { k: "settei", label: "設定", base: 30 },
    { k: "kyakuhon", label: "脚本", base: 25 },
    { k: "conte", label: "コンテ", base: 25 },
    { k: "enshutsu", label: "演出料", base: 50 },
    { k: "kantoku", label: "監督", base: 20 },
    { k: "sakkan", label: "作画監督料", base: 30 },
    { k: "shinko", label: "制作進行料（制作管理費用）", base: 100 },
    { k: "genga", label: "原画料（レイアウト込み）", base: 120 },
    { k: "douga", label: "動画料", base: 100 },
    { k: "haikei", label: "背景", base: 130 },
    { k: "shiage", label: "仕上げ料", base: 120 },
    { k: "satsuei", label: "撮影料", base: 100 },
    { k: "henshu", label: "編集料", base: 25 },
    { k: "print", label: "プリント（現像料）", base: 50 },
    { k: "zairyo", label: "用紙など原料・材料", base: 35 },
    { k: "onkyo", label: "音響", base: 150 },
  ];
  const KANRI = 0.15;       // 制作会社の制作管理費用（全体の15%）
  const CUT_BASE = 120 / 300;   // 原画1カットあたり 0.4万円（4,000円）
  const DOUGA_CUT = 100 / 300;
  const SOURCES = {
    manga:    { type: "manga", label: "人気漫画", pop: 42, gensaku: 3.0, kanshu: 0.12, titles: ["放課後ラグナロク", "ねこ侍は眠らない", "鉄骨のアリア", "となりの席の魔王さま", "深海ベーカリー"],
                note: "原作ファンが多く期待値が高い。原作監修の修正指示が入りやすい。" },
    novel:    { type: "novel", label: "ライトノベル", pop: 28, gensaku: 2.0, kanshu: 0.08, titles: ["転生したら制作進行だった件", "追放された錬金術師、辺境でカフェを開く", "最強賢者の二周目は静かに暮らしたい", "俺の妹が魔王軍の経理担当なんだが"],
                note: "固定ファンがいる。アニメの出来しだいで原作も売れる。" },
    game:     { type: "game", label: "スマホゲーム", pop: 30, gensaku: 1.0, kanshu: 0.05, titles: ["ステラ・リンクス", "アイドル戦国絵巻", "ギャラクシー☆ブレイヴ"],
                note: "ゲーム会社が大きく出資してくれる。そのぶん口出しも多い。" },
    original: { type: "original", label: "オリジナル", pop: 8, gensaku: 0, kanshu: 0, titles: ["夜明けのフィルム", "さよならロケット少女", "機械仕掛けの夏休み", "月面の郵便屋さん"],
                note: "知名度ゼロからのスタート。原作料はかからず、当たれば売上が1.25倍。" },
  };

  const FAMILY = ["岩城", "真柴", "黒須", "早乙女", "鷹野", "白石", "柳田", "東雲", "葛西", "三輪", "雨宮", "久遠", "椎名", "不破", "氷室", "九条", "皆川", "綾瀬", "桐生", "宗像", "結城", "日向", "朝霧", "篠原",
                  "小田切", "望月", "千早", "神楽", "伊吹", "相馬", "芹沢", "鳴海", "野々宮", "八雲", "藤堂", "水無瀬", "能登", "桜庭", "長谷部", "榊"];
  const GIVEN = ["透", "灯", "誠", "遥", "蓮", "朔", "薫", "湊", "静", "渉", "楓", "律", "環", "慧", "茜", "航", "紬", "悠", "澪", "迅", "一花", "健吾", "美雪", "大地", "千尋", "陽向", "瑞穂", "昴", "亜紀", "翔"];

  // grade: このスタッフを使うと関連する費目が何倍になるか（1.0〜3.0）
  const ROLE_DEFS = {
    dir: { label: "監督", lines: "監督・コンテ・演出・設定", arch: [
      { a: "巨匠", skill: [82, 92], speed: [28, 40], fame: [80, 92], grade: 3.0, quirk: 0.35, tag: "作家" },
      { a: "職人", skill: [70, 80], speed: [50, 65], fame: [40, 60], grade: 2.0, quirk: 0.15, tag: "職人" },
      { a: "早撮り", skill: [50, 62], speed: [78, 92], fame: [20, 40], grade: 1.2, quirk: 0.05, tag: "量産" },
      { a: "新鋭", skill: [45, 88], speed: [50, 75], fame: [5, 25], grade: 1.0, quirk: 0.25, tag: "作家", hidden: true },
    ] },
    wri: { label: "シリーズ構成", lines: "脚本", arch: [
      { a: "大御所", skill: [80, 90], speed: [30, 45], fame: [70, 85], grade: 3.0, tag: "作家" },
      { a: "職人", skill: [70, 78], speed: [55, 70], fame: [35, 55], grade: 2.0, tag: "職人" },
      { a: "速筆", skill: [52, 62], speed: [80, 95], fame: [15, 35], grade: 1.3, tag: "量産" },
      { a: "新人", skill: [40, 85], speed: [50, 70], fame: [0, 15], grade: 1.0, tag: "作家", hidden: true },
    ] },
    desk: { label: "制作デスク", lines: "制作進行料", arch: [
      { a: "伝説", mgmt: [92, 98], grade: 1.4, fame: [80, 80] },
      { a: "ベテラン", mgmt: [78, 88], grade: 1.2, fame: [0, 0] },
      { a: "中堅", mgmt: [60, 72], grade: 1.1, fame: [0, 0] },
      { a: "若手", mgmt: [40, 55], grade: 1.0, fame: [0, 0] },
    ] },
    va: { label: "主演声優", lines: "音響", arch: [
      { a: "人気", fame: [85, 95], act: [75, 85], grade: 3.0 },
      { a: "アイドル", fame: [75, 85], act: [45, 55], grade: 2.2 },
      { a: "実力派", fame: [40, 55], act: [80, 90], grade: 1.6 },
      { a: "新人", fame: [5, 20], act: [50, 75], grade: 1.0 },
    ] },
  };

  function makeName(s) {
    const used = new Set(s.usedNames);
    for (let i = 0; i < 80; i++) {
      const n = pick(s, FAMILY) + " " + pick(s, GIVEN);
      if (!used.has(n)) { s.usedNames.push(n); return n; }
    }
    return "名無し " + s.usedNames.length;
  }
  const uid = (s) => ++s.uid;
  const skillGrade = (skill) => clamp(1 + (skill - 40) / 25, 1, 3);

  function rollStaff(s, role, arch) {
    const r = (k) => (arch[k] ? ri(s, arch[k][0], arch[k][1]) : 0);
    const st = { role, arch: arch.a, name: makeName(s), skill: r("skill"), speed: r("speed"), fame: r("fame"), grade: arch.grade,
                 mgmt: r("mgmt"), act: r("act"), quirk: arch.quirk || 0, tag: arch.tag || "", hidden: !!arch.hidden, seed: ri(s, 1, 1e9) };
    st.busy = st.fame >= 75 && rnd(s) < TIERS[s.tier].starNG;
    return st;
  }
  const ROUGH_W = 0.4, GENGA_W = 0.6;     // ラフ原と原画にかかる手間の割合（1カット=1）
  const BASE_ANIMS = 10;                  // これを超えて人を足すと絵がばらつく
  const DILUTION = 0.6;                   // 1人増えるごとの品質低下
  const MIN_DUR = 6;                      // 1話の最短の制作期間（週）
  const ART_WEEKS = 2;                    // 美術・CGはラフ原が上がってから2週間
  const GROSS_BASE = 25 + 50 + 30 + 100 + 120 + 100 + 130 + 120 + 100 + 25 + 50 + 35;   // グロスに含まれる費目（サンプル額）
  const TEAM_KEYS = ["A", "B", "C", "D", "E", "F"];

  const TIERS = {
    top: { key: "top", name: "有名スタジオ", studio: "スタジオ極光", pre: 10, grade: 2.0, teams: 5, animSkill: [58, 86], sakkanSkill: [72, 86],
           dougaCap: 420, shiageCap: 480, satsueiCap: 560, dougaSkill: 66, artSkill: 72, scripts: 7, contes: 5,
           cash: 15000, revMul: 1.25, exp: 71, brand: 15, starNG: 0, eventMul: 0.8, investMul: 1.3, rankMul: 1.5,
           blurb: "社内に5班。腕利きの原画マンが集まり、単価もファンの期待も高い。少しの作画の乱れも許されない。" },
    mid: { key: "mid", name: "中堅スタジオ", studio: "アニメーション工房ひばり", pre: 8, grade: 1.5, teams: 4, animSkill: [48, 78], sakkanSkill: [60, 74],
           dougaCap: 320, shiageCap: 360, satsueiCap: 440, dougaSkill: 58, artSkill: 62, scripts: 6, contes: 4,
           cash: 8000, revMul: 1.0, exp: 58, brand: 5, starNG: 0.5, eventMul: 1, investMul: 1, rankMul: 1,
           blurb: "社内に4班。全話は回しきれないので、何話かはグロスに出すことになる。標準の難易度。" },
    low: { key: "low", name: "弱小スタジオ", studio: "有限会社 夜明け動画", pre: 7, grade: 1.0, teams: 3, animSkill: [40, 70], sakkanSkill: [55, 66],
           dougaCap: 220, shiageCap: 260, satsueiCap: 320, dougaSkill: 50, artSkill: 54, scripts: 5, contes: 3,
           cash: 4000, revMul: 0.8, exp: 50, brand: 0, starNG: 0.85, eventMul: 1.25, investMul: 0.7, rankMul: 0.5,
           blurb: "社内に3班だけ。半分近くはグロス頼み。単価は業界の最低ライン。期待されていないぶん、当てれば大きい。" },
  };
  const EPISODES = 12;
  const STAGES = [
    { k: "rough", label: "ラフ原" }, { k: "genga", label: "原画" }, { k: "douga", label: "動画" }, { k: "shiage", label: "仕上げ" }, { k: "satsuei", label: "撮影" },
  ];
  // 協力会社（グロス先）
  const GROSS_DEFS = [
    { name: "スタジオ灯台", q: [68, 76], price: 1.9, slip: 0.03, cap: 1, note: "丁寧で確実。高い。" },
    { name: "有限会社 青梅動画", q: [56, 64], price: 1.35, slip: 0.08, cap: 2, note: "標準的。たまに遅れる。" },
    { name: "アニメ工房さざなみ", q: [44, 52], price: 1.0, slip: 0.15, cap: 2, note: "安いが品質も納期も怪しい。" },
  ];

  function makeAnimator(s, bonus = 0) {
    const T = TIERS[s.tier];
    const skill = clamp(ri(s, T.animSkill[0], T.animSkill[1]) + bonus, 30, 95);
    const speed = Math.round(clamp(rr(s, 6.5, 10) - (skill - 60) / 40, 5, 11) * 10) / 10;
    const rate = Math.round(skillGrade(skill) * rr(s, 0.92, 1.08) * 100) / 100;
    return { id: uid(s), name: makeName(s), skill, speed, rate, cuts: 0, rough: 0, genga: 0, douga: 0, shiage: 0, satsuei: 0, hold: 0 };
  }
  function makeShinko(s, rookie) {
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill: rookie ? ri(s, 35, 55) : ri(s, 45, 82), stamina: rookie ? 90 : ri(s, 75, 95), gone: false };
  }

  function newGame(tier, seed) {
    const s = { v: 3, phase: "kikaku", tier, rs: seed | 0, week: 0, log: [], sns: [], kv: [], usedNames: [], uid: 0 };
    const T = TIERS[tier];
    s.pre = T.pre;
    s.sourceOpts = shuffle(s, Object.keys(SOURCES)).slice(0, 3).map((k) => ({ type: k, title: pick(s, SOURCES[k].titles) }));
    s.cands = {};
    for (const role of Object.keys(ROLE_DEFS)) s.cands[role] = ROLE_DEFS[role].arch.map((a) => rollStaff(s, role, a));
    if (tier !== "top" && rnd(s) < 0.6) s.cands.desk[0].busy = true;   // the legendary desk is rarely free
    s.staff = { dir: null, wri: null, desk: null, va: null };
    // the studio's production teams: one 制作進行 and one 作画監督 each
    s.shinkos = [];
    s.teams = TEAM_KEYS.slice(0, T.teams).map((key) => {
      const sh = makeShinko(s, false);
      sh.team = key; s.shinkos.push(sh);
      const skill = ri(s, T.sakkanSkill[0], T.sakkanSkill[1]);
      return { key, label: `${key}班`, shinko: sh.id, sakkan: { name: makeName(s), seed: ri(s, 1, 1e9), skill, grade: Math.round(clamp(1 + (skill - 50) / 30, 1, 3) * 100) / 100 } };
    });
    s.gross = GROSS_DEFS.map((d, i) => ({ id: i + 1, name: d.name, quality: ri(s, d.q[0], d.q[1]), price: d.price, slip: d.slip, cap: d.cap, note: d.note }));
    s.eps = Array.from({ length: EPISODES }, (_, i) => ({ n: i + 1, cuts: ri(s, 27, 33) * 10 }));
    return s;
  }
  function chooseSource(s, i) { s.src = s.sourceOpts[i]; }
  function chooseStaff(s, role, i) { const c = s.cands[role][i]; if (c && !c.busy) s.staff[role] = c; }
  const staffReady = (s) => Object.values(s.staff).every(Boolean);
  function synergy(s) {
    const d = s.staff.dir, w = s.staff.wri;
    if (!d || !w) return 0;
    if (d.tag === w.tag) return 4;
    if ((d.tag === "作家" && w.tag === "量産") || (d.tag === "量産" && w.tag === "作家")) return -3;
    return 0;
  }
  function initialHype(s) {
    const T = TIERS[s.tier], st = s.staff, src = SOURCES[s.src.type];
    return Math.round(src.pop + T.brand + 0.12 * ((st.dir?.fame || 0) + (st.wri?.fame || 0)) + 0.2 * (st.va?.fame || 0));
  }
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  const teamBy = (s, key) => s.teams.find((t) => t.key === key);
  const grossBy = (s, id) => s.gross.find((g) => g.id === id);
  const isGross = (plan) => typeof plan.team === "string" && plan.team.startsWith("g");
  const grossOf = (s, plan) => (isGross(plan) ? grossBy(s, +plan.team.slice(1)) : null);
  const planAir = (s, n) => s.pre + n;      // 予定どおりなら第n話は第(pre+n)週に放送

  // 費目ごとの倍率（ランク）
  function grades(s, over) {
    const T = TIERS[s.tier], st = s.staff;
    const g = { studio: T.grade, dir: st.dir?.grade || 1, wri: st.wri?.grade || 1, va: st.va?.grade || 1, desk: st.desk?.grade || 1,
             gensaku: SOURCES[s.src?.type || "original"].gensaku, rateUp: s.policy && s.policy.rate === "up" ? 1.3 : 1 };
    return over ? { ...g, ...over } : g;
  }
  // 座組の目安（資金集めの時点ではまだ座組が決まっていない）
  const GUIDE = { min: { dir: 1, wri: 1, va: 1, desk: 1 }, std: { dir: 2, wri: 2, va: 1.6, desk: 1.1 }, max: { dir: 3, wri: 3, va: 3, desk: 1.4, rateUp: 1.3 } };
  function budgetGuide(s) {
    const f = (k) => round(estimatePerEp(s, GUIDE[k]).total * EPISODES + 2500, 500);
    return { min: f("min"), std: f("std"), max: f("max") };
  }
  // 社内の班で作る1話あたりの見積もり
  function estimatePerEp(s, over) {
    const g = grades(s, over), T = TIERS[s.tier];
    const animRate = skillGrade((T.animSkill[0] + T.animSkill[1]) / 2);
    const sakRate = avg(s.teams.map((t) => t.sakkan.grade));
    const mul = {
      gensaku: g.gensaku, settei: g.dir, kyakuhon: g.wri, conte: g.dir, enshutsu: g.dir, kantoku: g.dir, sakkan: sakRate * g.rateUp,
      shinko: g.studio * g.desk, genga: animRate * g.rateUp, douga: g.studio * g.rateUp, haikei: g.studio, shiage: g.studio, satsuei: g.studio,
      henshu: g.studio, print: g.studio, zairyo: g.studio, onkyo: g.va,
    };
    const lines = COST_LINES.map((l) => ({ ...l, mul: mul[l.k], v: Math.round(l.base * mul[l.k]) }));
    const sub = lines.reduce((a, l) => a + l.v, 0);
    const kanri = Math.round(sub * KANRI);
    return { lines, sub, kanri, total: sub + kanri };
  }
  // グロスに出した回：協力会社への支払い＋こちらで持つ費目（原作料・設定・脚本・監督・音響）
  const grossFee = (c) => Math.round(GROSS_BASE * c.price);
  function ownLinesPerEp(s) {
    const g = grades(s);
    return Math.round((5 * g.gensaku + 30 * g.dir + 25 * g.wri + 20 * g.dir + 150 * g.va) * (1 + KANRI));
  }
  function estimateTotal(s) {
    const per = estimatePerEp(s).total;
    let total = 0, gross = 0, inhouse = 0;
    for (const ep of s.eps) {
      const c = ep.plan && grossOf(s, ep.plan);
      if (c) { total += grossFee(c) + ownLinesPerEp(s); gross++; } else { total += per; inhouse++; }
    }
    return { total: round(total + 2500, 100), per, gross, inhouse };
  }
  const estimate = (s) => estimateTotal(s).total;

  // ---------- グランドスケジュール ----------
  const conteRate = (s) => 0.45 + (s.staff.dir?.speed || 60) / 250;
  // 第n話のコンテが上がる見込みの週（社内の班はコンテが上がってから作業に入る）
  function conteWeek(s, n) {
    const K = TIERS[s.tier].contes;
    if (n <= K) return 1;
    let need = 0;
    for (const ep of s.eps) if (ep.n <= n && ep.n > K && !(ep.plan && isGross(ep.plan))) need++;
    return Math.ceil(need / conteRate(s)) + 1;
  }
  function autoPlan(s) { for (const ep of s.eps) ep.plan = null; planPass(s); planPass(s); return s.eps.map((e) => e.plan); }
  function planPass(s) {
    const free = Object.fromEntries(s.teams.map((t) => [t.key, 1]));
    const grossUse = [];   // [companyId, start, end]
    const grossFits = (c, a, b) => grossUse.filter(([id, x, y]) => id === c.id && x <= b && a <= y).length < c.cap;
    for (const ep of s.eps) {
      const air = planAir(s, ep.n);
      const teamSlot = (buffer) => {
        let best = null;
        for (const t of s.teams) {
          const start = Math.max(free[t.key], conteWeek(s, ep.n));
          if (start + MIN_DUR - 1 <= air - buffer && (!best || start < best.start)) best = { team: t.key, start };
        }
        return best;
      };
      const grossSlot = (buffer) => {
        const start = Math.max(1, air - buffer - MIN_DUR + 1), end = start + MIN_DUR - 1;
        if (end > air) return null;
        const c = s.gross.find((c) => grossFits(c, start, end));
        return c ? { team: "g" + c.id, start, end } : null;
      };
      // prefer finishing a week before air; send the episode out rather than run it to the wire
      const pick = teamSlot(1) || grossSlot(1) || teamSlot(0) || grossSlot(0);
      if (pick && !pick.team.startsWith("g")) { ep.plan = { team: pick.team, start: pick.start, dur: MIN_DUR }; free[pick.team] = pick.start + MIN_DUR; continue; }
      const g = pick || { team: "g" + s.gross[s.gross.length - 1].id, start: Math.max(1, air - MIN_DUR + 1), end: air };
      grossUse.push([+g.team.slice(1), g.start, g.start + MIN_DUR - 1]);
      ep.plan = { team: g.team, start: g.start, dur: MIN_DUR };

  }
  function planIssues(s) {
    const out = [];
    for (const ep of s.eps) {
      const p = ep.plan; if (!p || !p.team) { out.push({ n: ep.n, kind: "none", msg: `第${ep.n}話の担当が決まっていません` }); continue; }
      const end = p.start + p.dur - 1;
      if (ep.started) continue;
      if (end > planAir(s, ep.n)) out.push({ n: ep.n, kind: "late", msg: `第${ep.n}話：納品予定 第${end}週が放送（第${planAir(s, ep.n)}週）に間に合いません` });
      if (p.dur < MIN_DUR) out.push({ n: ep.n, kind: "short", msg: `第${ep.n}話：制作期間は最短${MIN_DUR}週です` });
      if (!isGross(p)) {
        for (const o of s.eps) {
          if (o.n <= ep.n || !o.plan || o.plan.team !== p.team) continue;
          const oe = o.plan.start + o.plan.dur - 1;

  const recommendAnims = (s, ep) => clamp(Math.ceil(ep.cuts / ((Math.max(MIN_DUR, ep.plan.dur) - 2.5) * 7.4)), BASE_ANIMS, 60);

  // 資金集め
  function makeOffers(s) {
    const T = TIERS[s.tier], m = T.investMul, type = s.src.type;
    const H0 = SOURCES[type].pop + T.brand + 15;   // 座組が決まる前の見込み
    const o = [];
    const amt = (base) => round(base * m * rr(s, 0.9, 1.1), 100);
    if (type === "manga" || type === "novel")
      o.push({ id: "pub", name: "出版社（原作元）", amt: amt(type === "manga" ? 11000 : 8000), cond: "原作監修が入り、修正指示が増える", fx: { kanshu: 0.12 } });
    if (type === "game")
      o.push({ id: "gamec", name: "ゲーム会社（原作元）", amt: amt(13000), cond: "ゲームとのタイアップ宣伝（期待値+8、口出しが増える）", fx: { hype: 8, meddle: 0.06 } });
    o.push({ id: "rec", name: "レコード会社", amt: amt(5000), cond: "主題歌は所属アーティスト（期待値+4）", fx: { hype: 4 } });
    o.push({ id: "goods", name: "グッズメーカー", amt: amt(4000), cond: "キャラを1人追加（設定費+600万、グッズ売上1.4倍）", fx: { cost: 600, goods: 1.4 } });
    o.push({ id: "ad", name: "広告代理店", amt: amt(7000), cond: "宣伝は任せろ（期待値+6、委員会の口出しが増える）", fx: { hype: 6, meddle: 0.08 } });
    s.offers = o;
    s.rights = [
      { id: "mg", name: "配信プラットフォームと MG 契約", fixed: round((8000 + H0 * 90) * T.revMul, 100), cond: "配信収入が固定額になる（当たっても増えない）" },
      { id: "os", name: "海外配給会社へ先行販売", fixed: round((5000 + H0 * 45) * T.revMul, 100), cond: "海外売上が固定額になる（当たっても増えない）" },
    ];
    s.sel = {}; s.rsel = {};
    o.forEach((x) => { if (x.id !== "ad") s.sel[x.id] = true; });
    const lim = budgetRange(s);
    s.budget = clamp(budgetGuide(s).std, lim.min, lim.max);
  }
  // 総予算は、委員会の出資＋自社が出せる上限まで
  function budgetRange(s) {
    const others = s.offers.filter((x) => s.sel[x.id]).reduce((a, x) => a + x.amt, 0);
    return { min: Math.max(5000, Math.ceil(others / 500) * 500), max: Math.floor((others + TIERS[s.tier].cash) / 500) * 500, others };
  }
  function committee(s) {
    const others = s.offers.filter((x) => s.sel[x.id]).reduce((a, x) => a + x.amt, 0);
    const B = s.budget;
    const own = B - others;
    const ok = own >= 0 && own <= TIERS[s.tier].cash;
    return { others, B, own, ok, share: B > 0 ? Math.max(0, own) / B : 0, members: s.offers.filter((x) => s.sel[x.id]).length };
  }
  // 委員会の組み方ごとの損益の目安（予算ぴったりで作れたとして、ヒット・普通・コケた）
  function scenarios(s) {
    const c = committee(s);
    const goods = s.offers.some((x) => x.id === "goods" && s.sel[x.id]) ? 1.4 : 1;
    const opts = { mg: s.rsel.mg ? s.rights.find((r) => r.id === "mg").fixed : null, os: s.rsel.os ? s.rights.find((r) => r.id === "os").fixed : null, goods, collab: 0, trust: 60 };
    return [["ヒット", 80], ["普通", 60], ["コケた", 40]].map(([label, P]) => {
      const rev = revenueAt(s, P, opts);
      return { label, P, rev: rev.total, profit: Math.round(rev.total * c.share - Math.max(0, c.own)) };
    });
  }

  function startProduction(s) {
    const T = TIERS[s.tier];
    const c = committee(s);
    s.B = c.B; s.share = c.share; s.othersInvest = c.others; s.own = Math.max(0, c.own);
    s.flags = { kanshu: SOURCES[s.src.type].kanshu, meddle: 0.04, goods: 1, hype: 0, mg: null, os: null, collab: 0, extraUsed: 0 };
    s.spent = 0; s.spentBy = {};
    s.policy = { douga: "inhouse", rate: "keep", mode: "stock", ot: false };
    for (const x of s.offers) if (s.sel[x.id]) {
      const f = x.fx;
      if (f.kanshu) s.flags.kanshu += f.kanshu;
      if (f.meddle) s.flags.meddle += f.meddle;
      if (f.goods) s.flags.goods *= f.goods;
      if (f.hype) s.flags.hype += f.hype;
      if (f.cost) pay(s, "settei", f.cost);
    }
    for (const r of s.rights) if (s.rsel[r.id]) s.flags[r.id] = r.fixed;
    s.estPerEp = estimatePerEp(s);
    s.estGross = estimateTotal(s);
    s.eps.forEach((ep, i) => Object.assign(ep, {
      script: i < T.scripts ? 1 : 0, conte: i < T.contes ? 1 : 0, started: false, startWeek: null, anims: [], art: null, cg: null,
      qG: 0, qD: 0, dougaDone: 0, bonus: 0, aired: false, airQ: null, collapse: false, delivered: false, deliveredWeek: null, gprog: 0, gslip: 0, gpaid: 0,
      planned: { ...ep.plan },
    }));
    pay(s, "settei", 30 * EPISODES * grades(s).dir);
    pay(s, "kyakuhon", 25 * T.scripts * grades(s).wri);
    pay(s, "conte", 25 * T.contes * grades(s).dir);
    s.H = initialHype(s) + s.flags.hype; s.H0 = s.H;
    s.R = 55; s.trust = 60; s.ap = 3; s.dirMood = 0;
    s.mods = []; s.cool = { pv: 0, event: 0 };
    s.week = 1; s.nextAir = s.pre + 1; s.aired = 0; s.recaps = 0; s.delays = 0;
    s.lastAirQ = 0; s.lastCollapse = false; s.promo = 0; s.helpCount = 0; s.added = 0;
    s.phase = "prod"; s.event = null; s.pendingAir = null; s.stat = null;
    startEpisodes(s);
    s.stat = forecast(s);
    log(s, `「${s.src.title}」制作開始。放送開始は第${s.nextAir}週。予算 ${fmt(s.B)}。`);
  }

  function pay(s, k, v, noKanri) {
    const amt = v * (noKanri ? 1 : 1 + KANRI);
    s.spent += amt;
    s.spentBy[k] = (s.spentBy[k] || 0) + v;
    if (!noKanri) s.spentBy.kanri = (s.spentBy.kanri || 0) + v * KANRI;
    s.weekSpend = (s.weekSpend || 0) + amt;
  }
  function fmt(v) {
    const n = Math.round(v);
    const sign = n < 0 ? "−" : "";
    const a = Math.abs(n);
    if (a >= 10000) { const oku = Math.floor(a / 10000), man = a % 10000; return `${sign}${oku}億${man ? man.toLocaleString("ja-JP") + "万" : ""}円`; }
    return `${sign}${a.toLocaleString("ja-JP")}万円`;
  }
  function log(s, text) { s.log.push({ w: s.week, text }); if (s.log.length > 120) s.log.shift(); }

  // ---------- helpers ----------
  const modMul = (s, target) => s.mods.filter((m) => m.target === target).reduce((a, m) => a * m.mul, 1);
  function addMod(s, id, weeks, mul, target) { s.mods.push({ id, weeks, mul, target }); }
  const unaired = (s) => s.eps.filter((e) => !e.aired);
  const epBy = (s, n) => s.eps[n - 1];
  const shinkoBy = (s, id) => s.shinkos.find((x) => x.id === id);
  const teamOfShinko = (s, id) => s.teams.find((t) => t.shinko === id);
  const sum = (ep, k) => ep.anims.reduce((a, x) => a + x[k], 0);
  const otMul = (s) => (s.policy.ot ? 1.2 : 1);
  function epTotals(ep) {
    const t = { rough: 0, genga: 0, douga: 0, shiage: 0, satsuei: 0 };
    for (const a of ep.anims) for (const k in t) t[k] += a[k];
    return t;
  }
  // 撮影まで終わったカットの割合（グロスは協力会社の進み）
  function done(ep) { return ep.plan && isGross(ep.plan) ? ep.gprog : sum(ep, "satsuei") / ep.cuts; }
  function progress(ep) {
    if (ep.plan && isGross(ep.plan)) return ep.gprog;
    if (!ep.started) return 0;
    const t = epTotals(ep), c = ep.cuts;
    return clamp(0.15 * t.rough / c + 0.30 * t.genga / c + 0.20 * t.douga / c + 0.15 * t.shiage / c + 0.20 * t.satsuei / c, 0, 1);
  }
  function stageOf(ep) {
    if (ep.aired) return "aired";
    if (ep.delivered) return "done";
    if (ep.plan && isGross(ep.plan)) return ep.started ? "gross" : "wait";
    if (!ep.started) return ep.conte < 1 ? "conte" : "wait";
    const t = epTotals(ep), c = ep.cuts - 0.5;
    if (t.rough < c) return "rough";
    if (t.genga < c) return "genga";
    if (t.douga < c) return "douga";
    if (t.shiage < c) return "shiage";
    return "satsuei";
  }
  const STAGE_LABEL = { conte: "コンテ待ち", wait: "着手前", rough: "ラフ原", genga: "原画", douga: "動画", shiage: "仕上げ", satsuei: "撮影", gross: "グロス制作中", done: "納品済", aired: "放送済" };
  function airWeekOf(s, ep) { const i = unaired(s).indexOf(ep); return i < 0 ? null : s.nextAir + i; }
  const weeksLeft = (s, ep) => airWeekOf(s, ep) - s.week + 1;
  function teamEff(s, key) {
    const t = teamBy(s, key); if (!t) return 1;
    const sh = shinkoBy(s, t.shinko);
    if (!sh || sh.gone) return 0.6;
    return (0.85 + sh.skill / 500) * (sh.stamina < 30 ? 0.85 : 1) * (sh.helped ? 1.12 : 1) * (0.9 + s.staff.desk.mgmt / 1000);
  }
  const epEff = (s, ep) => teamEff(s, ep.plan.team);
  // 班は前の話数の原画が上がれば次の話数に入れる（動画から先は各部署の仕事）
  const teamBusy = (s, key, except) => s.eps.some((e) => e !== except && e.plan.team === key && e.started && !e.delivered && !e.aired && sum(e, "genga") < e.cuts - 0.5);
  const animWork = (s, a) => a.speed * otMul(s) * (s.policy.mode === "quality" ? 0.88 : 1) * modMul(s, "ga");

  // ---------- starting episodes ----------
  function startEpisodes(s) {
    for (const ep of unaired(s)) {
      if (ep.started) continue;
      const p = ep.plan;
      if (s.week < p.start) continue;
      if (isGross(p)) {
        const c = grossOf(s, p);
        ep.started = true; ep.startWeek = s.week;
        const fee = grossFee(c);
        pay(s, "gross", fee * 0.3, true); ep.gpaid = fee * 0.3;
        log(s, `第${ep.n}話を${c.name}にグロス発注（${fmt(fee)}）。`);

      }

      if (teamBusy(s, p.team, ep)) { if (!ep.busyNote) { ep.busyNote = true; log(s, `${p.team}班は前の話数が終わっていない。第${ep.n}話は着手待ち。`); } continue; }
      ep.started = true; ep.startWeek = s.week;
      const n = recommendAnims(s, ep);

    }
  }
  // 原画マンを増やす：まだラフ原に手をつけていないカットを全員で配り直す
  function addAnimators(s, n, k, silent) {
    const ep = epBy(s, n);
    if (!ep || !ep.started || ep.delivered || ep.aired || isGross(ep.plan)) return false;
    const bonus = s.policy && s.policy.rate === "up" ? 6 : 0;
    for (let i = 0; i < k; i++) ep.anims.push(makeAnimator(s, bonus));
    redistribute(ep);
    if (!silent) { s.added += k; log(s, `第${n}話に原画マンを${k}人追加（計${ep.anims.length}人）。`); s.stat = forecast(s); }
    return true;
  }
  // 原画に入っていないカットを全員で配り直す（ラフ原済みのカットも、原画が未着手なら渡せる）
  function redistribute(ep) {
    const active = ep.anims.filter((a) => a.hold <= 0 && !a.out);

    let R = 0, U = ep.cuts - ep.anims.reduce((x, a) => x + a.cuts, 0);   // まだ誰にも振っていないカット

    const n = active.length;
    for (const a of active) { a.rough = a.genga + R / n; a.cuts = a.rough + U / n; }
  }
  function canAddAnim(s, ep) { return ep && ep.started && !ep.delivered && !ep.aired && !isGross(ep.plan) && sum(ep, "genga") < ep.cuts - 5; }

  // ---------- forecast ----------
  // 社内の班の回が何週目に完パケになりそうか
  function epForecast(s, ep) {
    if (ep.delivered) return ep.deliveredWeek;
    const p = ep.plan;
    if (isGross(p)) return Math.max(s.week, (ep.started ? ep.startWeek : p.start) + p.dur - 1 + ep.gslip);
    if (!ep.started) {
      let start = Math.max(p.start, s.week, ep.conte < 1 ? s.week + Math.ceil((1 - ep.conte) / conteRate(s)) : 0);

    const eff = epEff(s, ep);
    let gw = 0, rw = 0;

      if (a.hold > 0) continue;
      rw = Math.max(rw, ((a.cuts - a.rough) * ROUGH_W) / w);
      gw = Math.max(gw, ((a.cuts - a.rough) * ROUGH_W + (a.cuts - a.genga) * GENGA_W) / w);
    }
    const gengaDone = s.week + Math.ceil(gw - 0.05) - 1;
    const artDone = ep.art ? ep.art.start + ART_WEEKS - 1 : s.week + Math.ceil(rw - 0.05) - 1 + ART_WEEKS;
    const t = epTotals(ep);
    const tail = t.satsuei >= ep.cuts - 0.5 ? 0 : t.genga >= ep.cuts - 0.5 ? (t.douga >= ep.cuts - 0.5 ? 1 : 2) : 2;
    return Math.max(gengaDone + tail, artDone, s.week);
  }
  function forecast(s) {
    const T = TIERS[s.tier], p = s.policy;
    const os = p.douga === "overseas" ? 300 * modMul(s, "os") : 0;
    const douga = T.dougaCap * otMul(s) * modMul(s, "ga") + os;
    const shiage = T.shiageCap * otMul(s) + os;
    const satsuei = T.satsueiCap * otMul(s);
    const need = { douga: 0, shiage: 0, satsuei: 0 };
    const inh = unaired(s).filter((e) => !isGross(e.plan));
    for (const k of Object.keys(need)) {
      let acc = 0;
      for (const ep of inh) {
        const left = ep.cuts - (ep.started ? sum(ep, k) : 0);
        acc += left;
        const w = Math.max(1, airWeekOf(s, ep) - s.week + 1 - (k === "douga" ? 2 : k === "shiage" ? 1 : 0));
        need[k] = Math.max(need[k], acc / w);
      }
    }
    let needConte = 0, accC = 0;
    for (const ep of inh) {
      accC += 1 - ep.conte;
      needConte = Math.max(needConte, accC / Math.max(1, ep.plan.start - s.week + 1));
    }
    const late = unaired(s).filter((ep) => epForecast(s, ep) > airWeekOf(s, ep)).map((e) => e.n);
    return { conte: conteRate(s) * modMul(s, "conte") * modMul(s, "pre"), needConte, douga, shiage, satsuei, need, late };
  }
  function deskComment(s) {
    const f = s.stat || forecast(s);
    const gone = s.shinkos.filter((x) => x.gone);
    if (gone.length) return `${teamOfShinko(s, gone[0].id)?.label || ""}の進行・${gone[0].name}と連絡が取れません。担当話数が止まりかけています。`;
    if (f.late.length) {
      const ep = epBy(s, f.late[0]);
      if (isGross(ep.plan)) return `グロスに出した第${ep.n}話、${grossOf(s, ep.plan).name}の進みが遅いです。放送に間に合わないかもしれません。`;
      if (!ep.started) return `第${ep.n}話の着手が遅れそうです。グランドスケジュールを見直すか、グロスに出しましょう。`;
      return `第${ep.n}話、このままだと完パケが第${epForecast(s, ep)}週。放送に間に合いません。原画マンを増やしましょう。`;
    }
    const ratios = [
      [f.douga / Math.max(1, f.need.douga), "動画が追いついていません。海外に出すか、残業ですね。"],
      [f.shiage / Math.max(1, f.need.shiage), "仕上げが詰まりそうです。"],
      [f.satsuei / Math.max(1, f.need.satsuei), "撮影がパンクしそうです。"],
      [f.conte / Math.max(0.01, f.needConte), "コンテが上がってきません。着手が遅れる話数が出ます。"],
    ].sort((a, b) => a[0] - b[0]);
    if (ratios[0][0] < 1) return ratios[0][1];
    const tired = s.shinkos.filter((x) => !x.gone && x.stamina < 30);
    if (tired.length) return `${teamOfShinko(s, tired[0].id)?.label}の${tired[0].name}がかなり疲れています。そろそろ飛びますよ。`;
    if (s.aired === 0 && s.week >= s.pre - 1) return "放送まであとわずか。今のペースなら間に合います。";
    return "今のところ、全話グランドスケジュールどおりに回っています。";
  }

  // ---------- one week of production ----------
  function produce(s) {
    const T = TIERS[s.tier], st = s.staff, p = s.policy, g = grades(s);
    s.weekSpend = 0;
    startEpisodes(s);
    const eps = unaired(s);
    const inh = eps.filter((e) => e.started && !isGross(e.plan) && !e.delivered);
    const snap = new Map(inh.map((e) => [e.n, e.anims.map((a) => ({ genga: a.genga, douga: a.douga, shiage: a.shiage }))]));
    const avail = (now, start) => start + 0.8 * (now - start);   // 8割はその週のうちに次の工程へ
    // ラフ原 → 原画 (each animator works through their own cuts)
    for (const ep of inh) {
      const eff = epEff(s, ep), N = ep.anims.length;
      for (const a of ep.anims) {
        if (a.hold > 0) continue;
        let work = animWork(s, a) * eff;
        const r = Math.min(a.cuts - a.rough, work / ROUGH_W);
        a.rough += r; work -= r * ROUGH_W;
        const gn = Math.max(0, Math.min(a.rough - a.genga, work / GENGA_W));
        a.genga += gn;
        ep.qG += gn * (a.skill + (p.mode === "quality" ? 5 : 0) + (p.rate === "up" ? 3 : 0) - (p.ot ? 2 : 0));
        const effort = r * ROUGH_W + gn * GENGA_W;
        pay(s, "genga", CUT_BASE * a.rate * g.rateUp * effort);
        pay(s, "sakkan", 30 * teamBy(s, ep.plan.team).sakkan.grade * g.rateUp * effort / ep.cuts);
        pay(s, "zairyo", 35 * g.studio * effort / ep.cuts);
        pay(s, "enshutsu", 50 * g.dir * effort / ep.cuts);
        pay(s, "kantoku", 20 * g.dir * effort / ep.cuts);
      }
      // 美術・CG start once every ラフ原 is in
      if (!ep.art && sum(ep, "rough") >= ep.cuts - 0.5) {
        ep.art = { start: s.week + 1 + (ep.artDelay || 0) }; ep.cg = { start: s.week + 1 + (ep.artDelay || 0) };
        log(s, `第${ep.n}話のラフ原が全部上がった。美術とCGが作業に入る。`);
      }
    }
    // 動画 (in-house first, then overseas), 仕上げ, 撮影 — earliest episode first
    const os = p.douga === "overseas" ? 300 * modMul(s, "os") : 0;
    let dIn = T.dougaCap * otMul(s) * modMul(s, "ga"), dOs = os, sh = T.shiageCap * otMul(s) + os, sa = T.satsueiCap * otMul(s);
    for (const ep of inh) {
      const eff = epEff(s, ep), sn = snap.get(ep.n);
      const artReady = ep.art && s.week >= ep.art.start + ART_WEEKS - 1;
      ep.anims.forEach((a, i) => {
        // 動画
        let ready = avail(a.genga, sn[i].genga) - a.douga;
        if (ready > 0 && dIn + dOs > 0) {
          const t1 = Math.min(ready, dIn * eff), t2 = Math.min(ready - t1, dOs * eff);
          dIn -= t1 / eff; dOs -= t2 / eff;
          a.douga += t1 + t2; ep.qD += t1 * T.dougaSkill + t2 * 40;
          pay(s, "douga", DOUGA_CUT * g.studio * (t1 * g.rateUp + t2 * 0.6));
        }
        // 仕上げ
        ready = avail(a.douga, sn[i].douga) - a.shiage;
        if (ready > 0 && sh > 0) { const t = Math.min(ready, sh * eff); sh -= t / eff; a.shiage += t; pay(s, "shiage", 120 * g.studio * t / ep.cuts); }
        // 撮影 (needs the backgrounds and CG)
        ready = avail(a.shiage, sn[i].shiage) - a.satsuei;
        if (artReady && ready > 0 && sa > 0) { const t = Math.min(ready, sa * eff); sa -= t / eff; a.satsuei += t; pay(s, "satsuei", 100 * g.studio * t / ep.cuts); pay(s, "henshu", 25 * g.studio * t / ep.cuts); pay(s, "print", 50 * g.studio * t / ep.cuts); }
      });
      // backgrounds are paid while 美術 works
      if (ep.art && s.week >= ep.art.start && s.week < ep.art.start + ART_WEEKS) pay(s, "haikei", 130 * g.studio / ART_WEEKS);
      if (!ep.delivered && sum(ep, "satsuei") >= ep.cuts - 0.5) {
        ep.anims.forEach((a) => { a.rough = a.genga = a.douga = a.shiage = a.satsuei = a.cuts; });
        ep.delivered = true; ep.deliveredWeek = s.week;
        pay(s, "onkyo", 150 * g.va);
        log(s, `第${ep.n}話、完パケ。音響も上がって納品済み。`);
      }
    }
    // グロス
    for (const ep of eps.filter((e) => e.started && isGross(e.plan) && !e.delivered)) {
      const c = grossOf(s, ep.plan);
      if (rnd(s) < c.slip) { ep.gslip++; log(s, `${c.name}から連絡。第${ep.n}話が1週遅れる。`); }
      else ep.gprog = Math.min(1, ep.gprog + 1 / ep.plan.dur);
      if (ep.gprog >= 0.999) {
        ep.gprog = 1; ep.delivered = true; ep.deliveredWeek = s.week;
        const fee = grossFee(c); pay(s, "gross", fee - ep.gpaid, true); ep.gpaid = fee;
        pay(s, "onkyo", 150 * g.va);
        log(s, `第${ep.n}話、${c.name}から納品。`);
      }
    }
    // コンテ and 脚本 (in-house episodes only; partners storyboard their own)
    let conte = conteRate(s) * (p.mode === "quality" ? 0.9 : 1) * modMul(s, "conte") * modMul(s, "pre");
    for (const ep of eps) {
      if (conte <= 0) break;
      if (ep.conte >= 1 || isGross(ep.plan)) continue;
      const t = Math.min(1 - ep.conte, ep.script - ep.conte, conte);
      if (t <= 0) break;
      ep.conte += t; conte -= t; pay(s, "conte", 25 * g.dir * t);
      if (ep.conte >= 0.999) { ep.conte = 1; log(s, `第${ep.n}話のコンテが上がった。`); }
    }
    let script = (0.40 + st.wri.speed / 250) * modMul(s, "pre");
    for (const ep of eps) {
      if (script <= 0) break;
      if (ep.script >= 1) continue;
      const t = Math.min(1 - ep.script, script);
      ep.script += t; script -= t; pay(s, "kyakuhon", 25 * g.wri * t);
      if (ep.script >= 0.999) ep.script = 1;
    }
    // 制作進行料: salaries every week for the in-house episodes
    const inhouseEps = s.eps.filter((e) => !isGross(e.plan)).length;
    pay(s, "shinko", 100 * inhouseEps * g.studio * g.desk / (s.pre + EPISODES) * (p.ot ? 1.1 : 1));
    // people
    for (const shk of s.shinkos) {
      if (shk.gone) { shk.goneWeeks = (shk.goneWeeks || 0) + 1; continue; }
      const t = teamOfShinko(s, shk.id);
      const busy = t && teamBusy(s, t.key);
      shk.stamina = clamp(shk.stamina - (busy ? 5 : 0) - (p.ot ? 5 : 0) + (!busy && !p.ot ? 8 : 0) + (shk.helped ? 18 : 0) + 1, 0, 100);
      shk.helped = false;
    }
    for (const ep of s.eps) ep.pushed = false;
    for (const ep of inh) for (const a of ep.anims) if (a.hold > 0) { a.hold--; if (a.hold === 0) log(s, `原画の${a.name}さんと連絡がついた（第${ep.n}話）。`); }
    s.mods.forEach((m) => m.weeks--);
    s.mods = s.mods.filter((m) => m.weeks > 0);
    if (s.cool.pv > 0) s.cool.pv--;
    if (s.cool.event > 0) s.cool.event--;
    s.lastCost = s.weekSpend;
  }

  // ---------- quality ----------
  function epQuality(s, ep) {
    const T = TIERS[s.tier], st = s.staff;
    const dirS = st.dir.skill + s.dirMood;
    if (isGross(ep.plan)) return clamp(grossOf(s, ep.plan).quality + 0.15 * (dirS - 65) + synergy(s) / 2 + ep.bonus, 0, 100);
    const N = ep.anims.length;
    const g = sum(ep, "genga");
    const art = g > 0 ? ep.qG / g : N ? avg(ep.anims.map((a) => a.skill)) : avg(T.animSkill);
    const d = sum(ep, "douga");
    const qD = d > 0 ? ep.qD / d : T.dougaSkill;
    const sak = teamBy(s, ep.plan.team).sakkan.skill;
    return clamp(0.40 * art + 0.20 * sak + 0.15 * dirS + 0.10 * st.wri.skill + 0.10 * qD + 0.05 * T.artSkill + synergy(s) + ep.bonus + (st.va.act - 65) * 0.05 - dilution(ep), 0, 100);

    const ep = unaired(s)[0];

    const prog = Math.min(1, done(ep));

      ep.recapped = (ep.recapped || 0) + 1;
      log(s, `第${s.week}週は総集編を放送。第${ep.n}話は翌週へ。`);

    if (choice === "delay") {
      s.delays++; s.nextAir += 2;

    }
    const f = prog >= 1 ? 1 : 0.35 + 0.65 * Math.pow(prog, 1.5);

    ep.grade = grade;
    log(s, `第${ep.n}話 放送。作画の出来 ${ep.airQ}${ep.collapse ? "（作画崩壊）" : ""}。`);
    s.sns.unshift(...snsLines(s, grade, ep.n));
    if (s.sns.length > 40) s.sns.length = 40;
    s.kv.push({ n: ep.n, q: ep.airQ, collapse: ep.collapse, seed: s.rs });
    return { ep, q, grade };
  }

  const HANDLES = ["@anime_mitai", "@sakuga_kamikaze", "@yoru_no_otaku", "@genkaku_fan", "@kanshi_iinkai", "@nemui_shakaijin", "@cut_bukuro", "@ichiban_kuji", "@rewatch_3kaime", "@sinya_tv"];
  const SNS = {
    god: ["今週の作画、劇場版かよ", "この制作会社に何があった（褒め）", "作監の名前覚えた", "3回見返した。全カット止められる", "円盤買います"],
    good: ["安定して面白い", "今期はこれ追う", "OPの入りが好き", "原作のあのシーンが丁寧で泣いた"],
    mid: ["まあ普通", "来週に期待", "悪くはないけど地味", "途中でスマホ見てた", "グロス回っぽい"],
    bad: ["作画どうした", "顔が毎カット違う", "動かないな今週", "ちょっと心配になってきた", "原画マン何人いるのこれ"],
    collapse: ["作画崩壊してて草", "止め絵の紙芝居", "この回だけ別のアニメ", "原画マンの悲鳴が聞こえる", "円盤で直るって信じてる"],
    recap: ["もう総集編…？", "察し", "制作さん生きて", "総集編なのに新規カットがない"],

  function snsLines(s, kind, n) { return shuffle(s, SNS[kind]).slice(0, 2).map((t) => ({ n, kind, h: pick(s, HANDLES), t })).reverse(); }

  // ---------- producer actions ----------
  const ACTIONS = {
    help:      { label: "ヘルプに入る", ap: 1, cost: 0, desc: "この班の話数を自分も回す。今週の進みが上がり、進行の疲れも取れる" },
    hireShinko:{ label: "新しい進行を採用", ap: 1, cost: 50, desc: "連絡が取れない進行の代わりに、新人を入れる" },
    extConte:  { label: "外部コンテマンに頼む", ap: 1, cost: 150, desc: "3週間コンテが速くなる。監督の色は少し薄れる" },
    dirTalk:   { label: "監督と打ち合わせ", ap: 1, cost: 0, desc: "監督の機嫌を取る（品質の低下を戻す）" },
    committee: { label: "委員会対応", ap: 1, cost: 0, desc: "委員会の信頼+12" },
    extra:     { label: "追加出資のお願い", ap: 1, cost: 0, desc: "信頼65以上で1回だけ。予算が増え、自社の取り分は減る" },
    sns:       { label: "SNS施策", ap: 1, cost: 100, desc: "期待値が少し上がる" },
    pv:        { label: "PV公開", ap: 1, cost: 800, desc: "期待値が上がる（3週に1回）" },
    event:     { label: "イベント出展", ap: 2, cost: 1500, desc: "期待値が大きく上がる（4週に1回）" },
    collab:    { label: "コラボカフェ", ap: 1, cost: 600, desc: "放送中のみ。グッズ売上が伸びる" },
    grossPush: { label: "協力会社を催促", ap: 1, cost: 300, desc: "追加料金を払って、グロスの回を1週ぶん巻いてもらう" },
  };
  function canAct(s, id, arg) {
    const a = ACTIONS[id];
    if (s.phase !== "prod" || s.ap < a.ap) return false;
    if (id === "help") { const sh = shinkoBy(s, arg); return !!sh && !sh.gone && !sh.helped; }
    if (id === "hireShinko") { const sh = shinkoBy(s, arg); return !!sh && sh.gone; }
    if (id === "extra") return s.trust >= 65 && s.flags.extraUsed < 1;
    if (id === "committee") return s.trust < 100;
    if (id === "dirTalk") return s.dirMood < 0;
    if (id === "extConte") return !s.mods.some((m) => m.id === "extConte") && unaired(s).some((e) => e.conte < 1 && !isGross(e.plan));
    if (id === "pv") return s.cool.pv === 0;
    if (id === "event") return s.cool.event === 0;
    if (id === "collab") return s.aired > 0 && s.flags.collab < 0.4;

  }
  const hypeGain = (s, g) => g * clamp(1.3 - s.H / 150, 0.3, 1.3);
  function doAction(s, id, arg) {
    if (!canAct(s, id, arg)) return null;
    const a = ACTIONS[id];
    s.ap -= a.ap;
    if (a.cost) { s.spent += a.cost; s.spentBy.promo = (s.spentBy.promo || 0) + a.cost; }
    let msg = "";
    if (id === "help") { const sh = shinkoBy(s, arg); sh.helped = true; s.helpCount++; msg = `${teamOfShinko(s, sh.id).label}の${sh.name}と一緒に回った。カット袋の回収、原画マンへの催促、美術への受け渡し。`; }
    else if (id === "hireShinko") {
      const old = shinkoBy(s, arg), nu = makeShinko(s, true), t = teamOfShinko(s, old.id);
      nu.team = t.key; t.shinko = nu.id;
      s.shinkos.splice(s.shinkos.indexOf(old), 1, nu);
      msg = `新人進行の${nu.name}を採用。${t.label}を引き継がせた。`;
    } else if (id === "extConte") { addMod(s, "extConte", 3, 1.6, "conte"); s.dirMood -= 1; msg = "外部のコンテマンに数話分のコンテを頼んだ。"; }
    else if (id === "dirTalk") { s.dirMood = Math.min(0, s.dirMood + 2); msg = `監督・${s.staff.dir.name}と飲みに行った。少し機嫌が直った。`; }
    else if (id === "committee") { s.trust = clamp(s.trust + 12, 0, 100); msg = "委員会の各社を回って進捗を説明した。"; }
    else if (id === "extra") {
      const add = round(3000 * TIERS[s.tier].investMul, 100);
      s.othersInvest += add; s.B += add; s.share = s.own / s.B;
      s.trust = clamp(s.trust - 20, 0, 100); s.flags.extraUsed++;
      msg = `委員会から追加出資 ${fmt(add)}。自社の取り分は ${(s.share * 100).toFixed(1)}% に。`;
    } else if (id === "sns") { const g = hypeGain(s, 3); s.H += g; s.promo++; msg = `公式SNSでキャラ紹介を連投。期待値 +${g.toFixed(1)}`; }
    else if (id === "pv") { const g = hypeGain(s, 9); s.H += g; s.cool.pv = 3; s.promo++; msg = `PVを公開。期待値 +${g.toFixed(1)}`; }
    else if (id === "event") { const g = hypeGain(s, 16); s.H += g; s.cool.event = 4; s.promo += 2; msg = `イベントで先行カットを上映。期待値 +${g.toFixed(1)}`; }
    else if (id === "collab") { s.flags.collab = Math.min(0.4, s.flags.collab + 0.08); msg = "コラボカフェを開催。グッズ売上が伸びそうだ。"; }
    else if (id === "grossPush") {
      const ep = epBy(s, arg); ep.pushed = true;
      ep.gprog = Math.min(1, ep.gprog + 1 / ep.plan.dur); ep.gslip = Math.max(0, ep.gslip - 1);
      msg = `${grossOf(s, ep.plan).name}に追加料金を払い、第${ep.n}話を巻いてもらった。`;
    }

  }
  function setPolicy(s, key, val) { s.policy[key] = val; s.stat = forecast(s); }
  // 落ちた原画マンのカットを他の人に配り直す
  function reassignHeld(s, n) {
    const ep = epBy(s, n);

    if (!held.length || held.length === ep.anims.filter((a) => !a.out).length) return false;
    // what they finished stays theirs; everything else goes to the others
    const back = { r: 0, u: 0 };
    for (const a of held) { back.r += a.rough - a.genga; back.u += a.cuts - a.rough; a.cuts = a.genga; a.rough = a.genga; a.hold = 0; a.out = true; }
    const active = ep.anims.filter((a) => !a.out && a.hold <= 0);
    active[0].rough += back.r; active[0].cuts += back.r + back.u;
    redistribute(ep);
    log(s, `第${n}話：連絡がつかない原画マンのカットを、残りの${active.length}人に配り直した。`);
    s.stat = forecast(s);
    return true;
  }

  // ---------- events ----------
  const activeInh = (s) => unaired(s).filter((e) => e.started && !e.delivered && !isGross(e.plan));
  const EVENTS = {
    tobi: { title: "制作進行が飛んだ", when: (s) => s.shinkos.some((x) => !x.gone), weight: (s) => 0.6 + s.shinkos.filter((x) => !x.gone && x.stamina < 30).length * 2.5 + (s.policy.ot ? 1 : 0),
      prep: (s) => { const l = s.shinkos.filter((x) => !x.gone).sort((a, b) => a.stamina - b.stamina); return { id: (rnd(s) < 0.7 ? l[0] : pick(s, l)).id }; },
      text: (s, p) => `${teamOfShinko(s, p.id).label}の進行・${shinkoBy(s, p.id).name}と連絡が取れない。カット袋が机に積まれたままだ。`,
      choices: [
        { label: "家まで迎えに行く（行動−2・休ませて戻す）", ap: 2, run: (s, p) => { const sh = shinkoBy(s, p.id); sh.stamina = 70; addMod(s, "tobiShort", 1, 0.95, "ga"); return `${sh.name}は戻ってきた。しばらくは無理をさせない。`; } },
        { label: "そのままにする（その班の進みが大きく落ちる。新しい進行を採用できる）", run: (s, p) => { const sh = shinkoBy(s, p.id); sh.gone = true; sh.goneWeeks = 0; return `${sh.name}の席は空いたままだ。`; } },
      ] },
    kakae: { title: "カットを抱えたまま連絡が取れない", when: (s) => activeInh(s).some((e) => e.anims.some((a) => !a.out && a.hold <= 0 && a.cuts - a.genga > 5)),
      weight: () => 1.2,
      prep: (s) => { const ep = pick(s, activeInh(s).filter((e) => e.anims.some((a) => !a.out && a.hold <= 0 && a.cuts - a.genga > 5))); const a = pick(s, ep.anims.filter((x) => !x.out && x.hold <= 0 && x.cuts - x.genga > 5)); return { n: ep.n, id: a.id }; },
      text: (s, p) => { const a = epBy(s, p.n).anims.find((x) => x.id === p.id); return `第${p.n}話の原画・${a.name}さんが、カット${Math.round(a.cuts - a.genga)}本を抱えたまま連絡が取れない。`; },

  // 描き直し: 進んだカットを戻す（後の工程に進んだぶんも戻る）
  function retake(s, ep, n, stage) {

  function nextWeek(s) {
    if (s.aired >= EPISODES) { finish(s); return "end"; }
    s.week++;

    s.H = clamp(s.H * (s.aired === 0 ? 0.985 : 1), 0, 150);

  function popularity(s) { return clamp(0.65 * s.R + 0.35 * Math.min(s.H, 120) * 0.8, 0, 100); }
  function revenue(s) { return revenueAt(s, popularity(s), { mg: s.flags.mg, os: s.flags.os, goods: s.flags.goods, collab: s.flags.collab, trust: s.trust }); }
  function revenueAt(s, P, o) {
    const T = TIERS[s.tier], m = T.revMul;
    const orig = s.src.type === "original" && P >= 65 ? 1.25 : 1;

    const bd = Math.pow(Math.max(0, P - 35), 2.3) * 8 * m * orig;
    const goods = Math.pow(P, 1.5) * 12 * m * o.goods * (1 + o.collab) * orig;
    const osVar = (1000 + 2.5 * P * P) * m * orig;
    const season2 = P >= 72 && o.trust >= 40 ? 20000 * m : 0;
    const lines = [
      { k: "配信", v: o.mg ?? streamVar, fixed: o.mg != null, alt: streamVar },
      { k: "円盤（Blu-ray）", v: bd },
      { k: "グッズ", v: goods },
      { k: "海外", v: o.os ?? osVar, fixed: o.os != null, alt: osVar },
      { k: "二期決定（IPの価値）", v: season2 },
    ].map((l) => ({ ...l, v: Math.round(l.v), alt: l.alt != null ? Math.round(l.alt) : null }));

  }
  function finish(s) {

    const bdFix = s.eps.filter((e) => e.collapse).length * perEp * 0.5;
    const prodBalance = s.B - cutPay - bdFix - s.spent;
    const invest = rev.total * s.share - s.own;
    const score = Math.round(prodBalance + invest);

  }

  // ---------- grand schedule (Gantt) ----------
  function weekSpan() {
    const last = Math.max(...s.eps.map((e) => (e.plan ? e.plan.start + e.plan.dur - 1 : 0)), s.pre + E.EPISODES, s.phase === "prod" ? s.nextAir + E.unaired(s).length : 0);
    return Math.min(40, last + 1);
  }
  function teamOptions(ep) {
    return s.teams.map((t) => `<option value="${t.key}" ${ep.plan.team === t.key ? "selected" : ""}>${t.label}（社内）</option>`).join("")
      + s.gross.map((c) => `<option value="g${c.id}" ${ep.plan.team === "g" + c.id ? "selected" : ""}>グロス：${esc(c.name)}</option>`).join("");
  }
  function ganttHtml() {
    const W = weekSpan(), prod = s.phase === "prod";
    const issues = E.planIssues(s);
    const bad = new Set(issues.filter((i) => !i.soft).map((i) => i.n));
    const head = Array.from({ length: W }, (_, i) => `<th class="wk ${prod && i + 1 === s.week ? "now" : ""}">${i + 1}</th>`).join("");
    const rows = s.eps.map((ep) => {
      const p = ep.plan, end = p.start + p.dur - 1;
      const air = prod ? (ep.aired ? null : E.airWeekOf(s, ep)) : E.planAir(s, ep.n);
      const editable = !ep.started && !ep.aired;
      const fc = prod && !ep.aired && !ep.delivered ? E.epForecast(s, ep) : null;
      const actualFrom = prod && ep.started ? ep.startWeek : null;
      const actualTo = prod && ep.started ? (ep.delivered ? ep.deliveredWeek : ep.aired ? null : s.week - 1) : null;
      const cells = Array.from({ length: W }, (_, i) => {
        const w = i + 1;
        const inPlan = w >= p.start && w <= end;
        const inAct = actualFrom != null && actualTo != null && w >= actualFrom && w <= actualTo;
        let cls = "c", inner = "";
        if (inPlan) cls += " pl";
        if (inAct) cls += " ac";
        const fcFrom = ep.started ? s.week : Math.max(s.week, fc - p.dur + 1);
        if (fc && w >= fcFrom && w <= fc) cls += " fc";
        if (air === w) inner = `<span class="air ${fc && fc > air ? "late" : ""}">▼</span>`;
        if (prod && ep.aired && ep.airWeek === w) inner = `<span class="air done">●</span>`;
        if (prod && w === s.week) cls += " now";
        return `<td class="${cls}" style="--tc:${teamColor(p.team)}">${inner}</td>`;
      }).join("");
      const status = prod ? (ep.aired ? `放送済 ${ep.airQ}` : ep.delivered ? "納品済" : ep.started ? `予測 W${fc}` : `W${p.start}着手予定`) : "";
      return `<tr class="${bad.has(ep.n) ? "bad" : ""}">
        <th class="ep">#${ep.n}</th>
        <td class="ctl">${editable ? `<select data-act="planTeam" data-v="${ep.n}" aria-label="第${ep.n}話の担当">${teamOptions(ep)}</select>` : `<span class="tm" style="--tc:${teamColor(p.team)}">${esc(teamLabel(p.team))}</span>`}</td>
        <td class="ctl num">${editable ? `<button class="mini" data-act="planStart" data-v="${ep.n}" data-d="-1" aria-label="着手を1週早める">◀</button>W${p.start}<button class="mini" data-act="planStart" data-v="${ep.n}" data-d="1" aria-label="着手を1週遅らせる">▶</button>` : `W${ep.startWeek ?? p.start}`}</td>
        <td class="ctl num">${editable ? `<button class="mini" data-act="planDur" data-v="${ep.n}" data-d="-1" aria-label="期間を1週短く" ${p.dur <= E.MIN_DUR ? "disabled" : ""}>−</button>${p.dur}週<button class="mini" data-act="planDur" data-v="${ep.n}" data-d="1" aria-label="期間を1週長く">＋</button>` : `${p.dur}週`}</td>
        ${prod ? `<td class="ctl st">${status}</td>` : ""}
        ${cells}</tr>`;
    }).join("");
    return `<div class="gantt-wrap"><table class="gantt">
      <thead><tr><th class="ep">話</th><th>担当</th><th>着手</th><th>期間</th>${prod ? "<th>状況</th>" : ""}${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  // ---------- the 進行表 (spreadsheet) ----------
  let xls = null;   // { key: team key or "all", n: episode on the open tab, sel: animator id }
  function xlsTabs() {
    if (xls.key === "all") return s.eps.filter((e) => e.started && !e.aired && !e.delivered && !E.isGross(e.plan));
    return s.eps.filter((e) => e.plan.team === xls.key);

  function openXls(key) {

    xls.n = cur ? cur.n : null;

  const COLS = "ABCDEFGHIJKL".split("");
  function cell(v, total, extra = "") {
    const cls = v >= total - 0.5 ? "ok" : v > 0.05 ? "wip" : "";

  }
  // what adding k animators would do: forecast and quality on a throwaway copy
  function previewAdd(ep, k) {
    const c = JSON.parse(JSON.stringify(s));
    E.addAnimators(c, ep.n, k, true);
    const e2 = E.epBy(c, ep.n);
    return { fc: E.epForecast(c, e2), q: Math.round(E.epQuality(c, e2)), dil: E.dilution(e2) };
  }
  function xlsHtml() {
    const tabs = xlsTabs();
    const ep = xls.n ? E.epBy(s, xls.n) : null;
    const team = xls.key !== "all" ? E.teamBy(s, xls.key) : ep && !E.isGross(ep.plan) ? E.teamBy(s, ep.plan.team) : null;
    const sh = team ? E.shinkoBy(s, team.shinko) : null;
    const title = xls.key === "all" ? "作画部屋_原画マン一覧" : `進行表_${team.label}`;
    let body = `<tr><th class="rn">1</th><td colspan="11">この班にはまだ話数が割り当てられていません。</td></tr>`, info = "", tools = "";
    if (ep) {
      const p = ep.plan, end = p.start + p.dur - 1;
      const air = ep.aired ? null : E.airWeekOf(s, ep);
      const fc = !ep.aired && !ep.delivered ? E.epForecast(s, ep) : ep.deliveredWeek;
      const late = air != null && fc > air;
      const infoRows = [
        ["話数", `第${ep.n}話（${ep.cuts}カット）`],
        ["担当", E.isGross(p) ? teamLabel(p.team) : `${team.label}／進行 ${sh.name}／作画監督 ${team.sakkan.name}（実力${team.sakkan.skill}）`],
        ["予定", `W${p.start}〜W${end}（${p.dur}週）${ep.started ? `／実際の着手 W${ep.startWeek}` : ""}`],
        ["放送", ep.aired ? `放送済（出来 ${ep.airQ}）` : `W${air}`],
        ["完パケ", ep.aired ? "—" : ep.delivered ? `W${ep.deliveredWeek} 納品済` : `予測 W${fc}${late ? "　※放送に間に合いません" : ""}`],
      ];
      if (!E.isGross(p)) {
        infoRows.push(["美術／CG", `${artState(ep)}／${artState(ep)}`]);
        infoRows.push(["原画マン", ep.started ? `${ep.anims.filter((a) => !a.out).length}人${E.dilution(ep) > 0 ? `（${E.BASE_ANIMS}人を超えたぶん品質 −${E.dilution(ep).toFixed(1)}）` : ""}／品質見込み ${Math.round(E.epQuality(s, ep))}` : `着手時に ${E.recommendAnims(s, ep)}人 集める予定`]);
      } else {
        infoRows.push(["進み", `${Math.round(ep.gprog * 100)}%${ep.gslip ? `（遅れ ${ep.gslip}週）` : ""}／品質見込み ${Math.round(E.epQuality(s, ep))}`]);
      }
      info = infoRows.map(([k, v], i) => `<tr><th class="rn">${i + 1}</th><td class="k" colspan="2">${k}</td><td class="v ${k === "完パケ" && late ? "bad" : ""}" colspan="9">${esc(v)}</td></tr>`).join("")
        + `<tr><th class="rn">${infoRows.length + 1}</th><td colspan="11" class="blank"></td></tr>`;
      const r0 = infoRows.length + 2;
      if (E.isGross(p)) {
        body = `<tr><th class="rn">${r0}</th><td class="k" colspan="2">グロス</td><td class="v" colspan="9">1話まるごと協力会社に発注しています。原画マンの内訳は先方の管理です。</td></tr>`;
        tools = ep.started && !ep.delivered && !ep.aired ? `<button class="btn small" data-act="do" data-v="grossPush" data-arg="${ep.n}" ${E.canAct(s, "grossPush", ep.n) ? "" : "disabled"}>協力会社を催促（行動1・300万円）</button>` : "";
      } else if (!ep.started) {
        body = `<tr><th class="rn">${r0}</th><td class="k" colspan="2">着手前</td><td class="v" colspan="9">${ep.conte < 1 ? `コンテ待ち（${Math.round(ep.conte * 100)}%）。` : ""}予定 W${p.start} から。前の話数の原画が上がり次第、班が入ります。担当や日程はグランドスケジュールで変えられます。</td></tr>`;
      } else {
        const T = E.epTotals(ep);

        if (E.canAddAnim(s, ep)) {
