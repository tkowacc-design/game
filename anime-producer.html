<title>深夜アニメP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* Layout: every screen is "collections on the left, the selected object's detail on the right".
     The header carries the current week and its one main action; a detail always ends with what you can do to that object. */
  :root {
    --night: #12151f;       /* page ground */
    --desk: #1c2130;        /* collection items */
    --desk-2: #262c40;      /* selected item, office floor */
    --line: #2a3146;
    --line-2: #323a52;
    --on: #e8eaf1;
    --on-soft: #a1a9be;
    --paper: #f4f2ec;       /* the detail of the selected object */
    --card: #ffffff;
    --rule: #dcd8cc;
    --ink: #1a1c24;
    --ink-soft: #5a6072;
    --chip: #e3dfd3;
    --marker: #ffe14a;      /* the one main action, "now", the selection */
    --marker-d: #b89e1e;
    --red: #c8323a;  --red-d: #e5484d;  --red-l: #ff9a9d;
    --green: #1a8a57; --green-d: #1f9d63; --green-l: #8fe0b5;
    --amber: #e0b400;
    --teal: #2ba3a3;
    --pink: #ff5fa2;
    --gross: #8a93ab;
    --font-pixel: "DotGothic16", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--on); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 1440px; margin: 0 auto; }
  h1, h2, h3, .pix { font-family: var(--font-pixel); font-weight: 400; letter-spacing: .04em; margin: 0; }
  button, select { font: inherit; color: inherit; cursor: pointer; }
  table { color: inherit; font-size: inherit; }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }
  .num { font-variant-numeric: tabular-nums; }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .face { width: 40px; height: 40px; border-radius: 3px; flex: none; }
  .face.sm { width: 32px; height: 32px; }

  /* ---------- header: brand | the week and its action | system ---------- */
  .hdr { min-height: 64px; box-sizing: border-box; padding: 8px 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { width: 264px; display: grid; line-height: 1.3; }
  .brand b { font-family: var(--font-pixel); font-weight: 400; font-size: 18px; }
  .brand span { font-size: 12px; color: var(--on-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk { display: flex; align-items: center; gap: 16px; padding-left: 24px; border-left: 1px solid var(--line); min-height: 44px; flex-wrap: wrap; }
  .wk-n { font-family: var(--font-pixel); font-size: 28px; line-height: 1; color: var(--marker); }
  .wk-n.mute { color: var(--on-soft); font-size: 20px; }
  .wk-t b { font-family: var(--font-pixel); font-weight: 400; color: var(--marker); }
  .ap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-soft); }
  .ap i { width: 16px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px #4a5370; }
  .ap i.on { background: var(--marker); box-shadow: none; }
  .hdr-r { margin-left: auto; display: flex; gap: 8px; }
  .btn-main { height: 44px; padding: 0 20px; font-family: var(--font-pixel); font-size: 16px; background: var(--marker); color: var(--night); border: 0; border-radius: 4px; box-shadow: 0 3px 0 var(--marker-d); white-space: nowrap; }
  .btn-main:hover:not(:disabled) { background: #ffe97a; }
  .btn-main:disabled { opacity: .45; box-shadow: none; }
  .btn-sys { height: 40px; padding: 0 14px; background: transparent; color: var(--on); border: 1px solid var(--line-2); border-radius: 4px; white-space: nowrap; }
  .btn-sys:hover { border-color: var(--on-soft); }

  /* ---------- body: collections | detail ---------- */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 488px; gap: 24px; padding: 16px 24px 32px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sec-h { display: flex; align-items: center; gap: 12px; min-height: 20px; }
  .sec-h h2 { font-size: 13px; color: var(--on-soft); }
  .sec-h .btn-sys { margin-left: auto; height: 36px; font-size: 13px; }
  .note { font-size: 12px; color: var(--on-soft); margin: 0; }

  /* collection item (the same row everywhere) */
  .li { min-height: 52px; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; text-align: left; background: var(--desk); color: var(--on); border: 0; border-radius: 4px; padding: 0 12px 0 0; overflow: hidden; }
  .li:hover { background: #232940; }
  .li.on { background: var(--desk-2); box-shadow: 0 0 0 2px var(--marker); }
  .li > i { align-self: stretch; background: var(--c, var(--gross)); }
  .li .t { display: block; font-weight: 700; font-size: 13px; }
  .li .s { display: block; font-size: 12px; color: var(--on-soft); }
  .li .r { font-family: var(--font-pixel); font-size: 12px; }
  .li .chev { color: var(--on-soft); }
  .li.static { cursor: default; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

  /* tags (status) */
  .tag { font-family: var(--font-pixel); font-size: 12px; padding: 0 8px; border-radius: 2px; white-space: nowrap; background: var(--chip); color: var(--ink); }
  .tag.bad { background: var(--red); color: #fff; }
  .tag.warn { background: var(--marker); color: var(--ink); }
  .tag.ok { background: #d6f2e4; color: #11633c; }
  .tag.ink { background: var(--ink); color: var(--paper); }
  .tag.pink { background: var(--pink); color: var(--night); }
  .tag.dark.bad { background: #3a1c22; color: var(--red-l); }
  .tag.dark.ok { background: #1c3a2c; color: var(--green-l); }
  .tag.dark { background: var(--desk-2); color: var(--on-soft); }
  .tag.dark.warn { background: #3a3418; color: var(--marker); }

  /* ---------- the office (map of people) ---------- */
  .office { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--desk-2); box-shadow: 0 0 0 1px var(--line-2); }
  .office canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 3px; }
  .hot:hover, .hot:focus-visible { box-shadow: inset 0 0 0 2px rgba(232, 234, 241, .5); }
  .hot.on { box-shadow: inset 0 0 0 2px var(--marker); background: rgba(255, 225, 74, .08); }
  .ochip { position: absolute; font-family: var(--font-pixel); font-size: 11px; line-height: 18px; padding: 0 6px 0 8px; border-radius: 2px; white-space: nowrap; background: var(--night); color: var(--on); box-shadow: inset 3px 0 0 var(--c, var(--on-soft)); pointer-events: none; }
  .ochip.on { background: var(--marker); color: var(--night); box-shadow: none; }

  /* ---------- the 12 episodes ---------- */
  .eps { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
  .epc { height: 64px; text-align: left; border: 0; border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; color: var(--on); background: var(--desk); box-shadow: inset 0 3px 0 var(--c); min-width: 0; }
  .epc.pre { background: #161a26; }
  .epc.on { background: var(--desk-2); box-shadow: inset 0 3px 0 var(--c), 0 0 0 2px var(--marker); }
  .epc .n { display: flex; justify-content: space-between; width: 100%; font-family: var(--font-pixel); font-size: 14px; }
  .epc .n small { font-size: 11px; color: var(--on-soft); }
  .epc .s { font-size: 11px; color: var(--on-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .epc .s.bad { color: var(--red-l); }
  .epc .b { width: 100%; height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin-top: auto; }
  .epc .b i { display: block; height: 100%; background: var(--c); }

  /* ---------- the detail of the selected object (paper) ---------- */
  .pane { background: var(--paper); color: var(--ink); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 0 0 2px var(--marker); min-width: 0; }
  .pane-b { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px; }
  .pane-f { margin-top: 16px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
  .pane-f > .lbl { font-size: 11px; color: var(--ink-soft); }
  .oh { display: flex; flex-direction: column; gap: 4px; }
  .oh-top { display: flex; align-items: center; gap: 8px; }
  .oh-top .tag:last-child { margin-left: auto; }
  .typ { font-family: var(--font-pixel); font-size: 11px; background: var(--ink); color: var(--paper); padding: 0 6px; border-radius: 2px; }
  .oh-name { display: flex; align-items: center; gap: 10px; }
  .oh-name h2 { font-size: 24px; line-height: 1.3; }
  .oh-sub { font-size: 12px; color: var(--ink-soft); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .tile { background: var(--card); border-radius: 4px; padding: 8px 10px; min-width: 0; }
  .tile .l { font-size: 11px; color: var(--ink-soft); }
  .tile .v { font-family: var(--font-pixel); font-size: 18px; white-space: nowrap; }
  .tile.bad { box-shadow: inset 0 0 0 1.5px var(--red); }
  .tile.bad .l, .tile.bad .v { color: var(--red); }
  .tile.good { box-shadow: inset 0 0 0 1.5px var(--green); }
  .tile.good .l, .tile.good .v { color: var(--green); }

  /* your own read of the work: never a number */
  .mut { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
  .mut-b { background: var(--card); border-radius: 4px; padding: 8px 12px; box-shadow: inset 4px 0 0 var(--tone, var(--gross)); }
  .mut-b .l { font-size: 11px; color: var(--ink-soft); }
  .mut-b .t { font-size: 15px; font-weight: 700; }
  .tone-good { --tone: var(--green); } .tone-ok { --tone: var(--teal); } .tone-worry { --tone: var(--amber); } .tone-bad { --tone: var(--red); } .tone-mute { --tone: var(--gross); }
  .word { font-size: 12px; font-weight: 700; padding-left: 8px; box-shadow: inset 3px 0 0 var(--tone); white-space: nowrap; }

  .psec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .psec h3 { font-size: 14px; }
  .psec p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; font-size: 11px; text-align: center; color: var(--ink-soft); }
  .stages span { display: flex; flex-direction: column; gap: 4px; }
  .stages i { height: 8px; background: var(--rule); }
  .stages .done i { background: var(--green); }
  .stages .now { color: var(--ink); font-weight: 700; }
  .stages .now i { background: var(--amber); }
  .bar { height: 8px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gross); }
  .rows { display: flex; flex-direction: column; }
  .row { min-height: 36px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; border-bottom: 1px dashed var(--rule); background: transparent; border-left: 0; border-right: 0; border-top: 0; padding: 0 2px; text-align: left; color: var(--ink); }
  button.row:hover { background: rgba(26, 28, 36, .04); }
  .row .v { font-family: var(--font-pixel); }
  .row .v.bad { color: var(--red); }
  .row .v.mute { color: var(--ink-soft); }
  .rel { min-height: 48px; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; border-radius: 4px; padding: 0 4px; color: var(--ink); }
  .rel:hover { background: rgba(26, 28, 36, .05); }
  .rel .ico { width: 32px; height: 32px; border-radius: 3px; display: grid; place-items: center; color: #fff; font-family: var(--font-pixel); font-size: 12px; background: var(--c, var(--ink-soft)); }
  .rel .t { display: block; font-size: 13px; font-weight: 700; }
  .rel .s { display: block; font-size: 11.5px; color: var(--ink-soft); }
  .rel .chev { color: var(--ink-soft); }
  .speech { background: var(--card); border-radius: 4px; padding: 10px 12px; font-size: 14px; margin: 0; color: var(--ink); }
  .who { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
  .who .w { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .who .w b { color: var(--ink); }

  /* what you can do with this object */
  .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .acts.one { grid-template-columns: minmax(0, 1fr); }
  .act { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 4px; text-align: left; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .act.pri { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .act:hover:not(:disabled) { box-shadow: 0 2px 0 var(--ink); }
  .act:disabled { color: #8a8f9e; border: 1.5px dashed #c9c4b6; background: transparent; }
  .act .m { display: grid; line-height: 1.35; }
  .act .m small { font-size: 11.5px; opacity: .8; font-weight: 400; }
  .act .m b { font-weight: 700; }
  .cost { font-family: var(--font-pixel); font-size: 11px; padding: 0 6px; border-radius: 2px; white-space: nowrap; background: var(--chip); color: var(--ink); }
  .cost.ap { background: var(--marker); color: var(--night); }
  .act.pri .cost:not(.ap) { background: #3a4158; color: var(--on); }
  .act:disabled .cost { opacity: .6; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; min-height: 36px; font-size: 12.5px; color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .field { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; }
  .field > span:first-child { color: var(--ink-soft); }
  .field select { height: 40px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--card); color: var(--ink); color-scheme: light; min-width: 0; }
  .step { display: grid; grid-template-columns: 44px 1fr 44px; height: 40px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--card); }
  .step button { border: 0; background: var(--chip); color: var(--ink); font-size: 16px; }
  .step button:disabled { opacity: .35; }
  .step span { display: grid; place-items: center; font-family: var(--font-pixel); }
  .cap { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; font-size: 12px; }
  .cap .g { position: relative; height: 10px; background: var(--chip); border-radius: 2px; }
  .cap .g i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .cap .g b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .cap .n { font-family: var(--font-pixel); text-align: right; white-space: nowrap; }
  .cap .n.bad { color: var(--red); }
  .kvs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .kvbox { display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--ink-soft); }
  .kvbox > span[data-kv] { display: block; width: 100%; aspect-ratio: 1; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .kvbox canvas { width: 100%; height: 100%; }
  .post { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; background: var(--card); border-radius: 4px; overflow: hidden; font-size: 13px; }
  .post > i { background: var(--rule); } .post.good > i { background: var(--green); } .post.bad > i { background: var(--red); }
  .post > span { padding: 6px 10px 6px 0; }
  .post small { display: block; font-size: 11px; color: var(--ink-soft); }
  .log { font-size: 12.5px; display: grid; gap: 3px; max-height: 220px; overflow-y: auto; }
  .log p { margin: 0; color: var(--ink); } .log .w { font-family: var(--font-pixel); color: var(--ink-soft); margin-right: 6px; }

  /* ---------- schedule (timeline of episodes) ---------- */
  .tl-head, .tl-row { display: grid; grid-template-columns: 40px 132px minmax(0, 1fr); gap: 0 12px; align-items: center; padding-left: 12px; }
  .tl-head { font-size: 11px; color: var(--on-soft); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .tl-weeks { display: grid; text-align: center; font-family: var(--font-pixel); }
  .tl-weeks .now { background: var(--marker); color: var(--night); border-radius: 2px; }
  .tl-row { height: 40px; text-align: left; color: var(--on); border: 0; border-radius: 4px; background: var(--desk); padding-right: 0; }
  .tl-row:hover { background: #232940; }
  .tl-row.on { background: var(--desk-2); box-shadow: 0 0 0 2px var(--marker); }
  .tl-row.bad { box-shadow: inset 3px 0 0 var(--red-d); }
  .tl-row.on.bad { box-shadow: 0 0 0 2px var(--marker), inset 3px 0 0 var(--red-d); }
  .tl-row .n { font-family: var(--font-pixel); font-size: 14px; }
  .tl-row .w { display: flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  .tl-row .w i { width: 8px; height: 8px; border-radius: 1px; flex: none; background: var(--c); }
  .tl-track { position: relative; height: 40px; }
  .tl-track .grid { position: absolute; inset: 0; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); }
  .tl-track .nowc { position: absolute; top: 0; bottom: 0; background: rgba(255, 225, 74, .10); }
  .tl-track .plan { position: absolute; top: 12px; height: 16px; border-radius: 3px; background: color-mix(in srgb, var(--c) 45%, transparent); }
  .tl-track .act2 { position: absolute; top: 12px; height: 16px; border-radius: 3px 0 0 3px; background: var(--c); }
  .tl-track .fc { position: absolute; top: 12px; height: 16px; background-image: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); }
  .tl-track .air { position: absolute; top: 9px; text-align: center; font-family: var(--font-pixel); font-size: 13px; }
  .tl-track .air.late { color: var(--red-l); }
  .tl-track .air.done { color: var(--on-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: var(--on-soft); padding-left: 12px; }

  /* ---------- title ---------- */
  .logo { padding: 24px 0 8px; display: flex; flex-direction: column; gap: 12px; }
  .logo-t { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo h1 { font-size: 64px; line-height: 1; }
  .stamp { font-family: var(--font-pixel); font-size: 15px; color: var(--pink); border: 2px solid var(--pink); padding: 2px 10px; border-radius: 3px; transform: rotate(-4deg); }
  .logo p { margin: 0; max-width: 600px; font-size: 15px; color: #c9cedc; }
  .logo p b { color: var(--on); }
  .st-head, .st-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) 96px 64px 64px 120px 56px 12px; gap: 16px; align-items: center; padding-right: 16px; }
  .st-head { font-size: 11px; color: var(--on-soft); }
  .st-head .r, .st-row .r { text-align: right; }
  .st-row { min-height: 64px; text-align: left; color: var(--on); border: 0; border-radius: 4px; background: var(--desk); overflow: hidden; }
  .st-row:hover { background: #232940; }
  .st-row.on { background: var(--desk-2); box-shadow: 0 0 0 2px var(--marker); }
  .st-row > i { align-self: stretch; background: var(--c); }
  .st-row .big { font-family: var(--font-pixel); font-size: 18px; }
  .st-row .big small { font-size: 12px; }

  /* ---------- result ---------- */
  .chart { background: var(--desk); border-radius: 6px; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .bars { position: relative; height: 240px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: end; border-bottom: 1px solid #4a5370; }
  .bars .line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--on-soft); }
  .bars .line span { position: absolute; right: 0; bottom: 2px; font-size: 11px; color: var(--on-soft); }
  .bars button { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%; background: transparent; border: 0; padding: 0; color: var(--on); }
  .bars button span { font-family: var(--font-pixel); font-size: 13px; text-align: center; }
  .bars button i { display: block; border-radius: 3px 3px 0 0; }
  .bars-x { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; text-align: center; font-size: 11px; }
  .bars-x b { display: block; font-family: var(--font-pixel); font-weight: 400; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }

<script id="engine">
/* ===================== ゲームの計算（UIなし） ===================== */
const Engine = (() => {
  "use strict";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Seeded RNG kept inside the state so a saved game replays the same.
  function rnd(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    let t = s.rs;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rr = (s, a, b) => a + rnd(s) * (b - a);
  const ri = (s, a, b) => Math.floor(rr(s, a, b + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  function shuffle(s, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  const ROUGH_W = 0.4, GENGA_W = 0.6;     // ラフ原と原画にかかる手間の割合（1カット=1）
  const BASE_ANIMS = 10;                  // これを超えて人を足すと絵がばらつく
  const DILUTION = 0.6;                   // 1人増えるごとの品質低下
  const MIN_DUR = 6;                      // 1話の最短の制作期間（週）
  const DEF_DUR = 8;                      // グランドスケジュールの標準（週）
  const LINE = 50;                        // 局・製作委員会の納品基準（これを下回る品質は受け取ってもらえない）
  const ART_WEEKS = 2;                    // 美術・CGはラフ原が上がってから2週間
  const EPISODES = 12;
  const TEAM_KEYS = ["A", "B", "C", "D", "E", "F"];
  const FLOW = 0.8;                       // 上がったカットの8割はその週のうちに次の工程へ

  // スタジオ＝難易度。作品と座組もスタジオで決まる
  const TIERS = {
    top: { key: "top", name: "有名スタジオ", studio: "スタジオ極光", pre: 10, teams: 5, animSkill: [58, 86], sakkanSkill: [72, 86], shinkoSkill: [[64, 86], [60, 82], [58, 80], [55, 75], [50, 72]],
           dougaCap: 420, shiageCap: 480, satsueiCap: 560, dougaSkill: 66, artSkill: 72, scripts: 7, contes: 5, exp: 71, eventMul: 0.8,
           source: "manga", dir: { skill: 84, speed: 50, quirk: 0.3, tag: "作家" }, wri: { skill: 80, speed: 52, tag: "作家" }, va: { act: 82 }, rank: 4,
           blurb: "社内に5班。進行も粒ぞろい。腕利きの原画マンが集まるが、監督のこだわりが強く、ファンの目も厳しい。" },
    mid: { key: "mid", name: "中堅スタジオ", studio: "アニメーション工房ひばり", pre: 8, teams: 4, animSkill: [48, 78], sakkanSkill: [60, 74], shinkoSkill: [[60, 80], [52, 72], [45, 65], [32, 46]],
           dougaCap: 320, shiageCap: 360, satsueiCap: 440, dougaSkill: 58, artSkill: 62, scripts: 6, contes: 4, exp: 58, eventMul: 1,
           source: "novel", dir: { skill: 72, speed: 60, quirk: 0.15, tag: "職人" }, wri: { skill: 72, speed: 62, tag: "職人" }, va: { act: 70 }, rank: 0,
           blurb: "社内に4班。全話は回しきれないので、何話かはグロスに出す。新人の進行がひとりいる。標準の難易度。" },
    low: { key: "low", name: "弱小スタジオ", studio: "有限会社 夜明け動画", pre: 7, teams: 3, animSkill: [40, 70], sakkanSkill: [55, 66], shinkoSkill: [[50, 70], [34, 48], [28, 42]],
           dougaCap: 220, shiageCap: 260, satsueiCap: 320, dougaSkill: 50, artSkill: 54, scripts: 5, contes: 3, exp: 50, eventMul: 1.25,
           source: "original", dir: { skill: 58, speed: 84, quirk: 0.05, tag: "量産" }, wri: { skill: 58, speed: 86, tag: "量産" }, va: { act: 62 }, rank: -6,
           blurb: "社内に3班だけ。半分近くはグロス頼み。進行は新人ばかりで、トラブルを抱え込みがち。" },
  };
  const STAGES = [
    { k: "rough", label: "ラフ原" }, { k: "genga", label: "原画" }, { k: "douga", label: "動画" }, { k: "shiage", label: "仕上げ" }, { k: "satsuei", label: "撮影" },
  ];
  const GROSS_DEFS = [
    { name: "スタジオ灯台", q: [68, 76], slip: 0.03, cap: 1, note: "丁寧で確実。同時に1話まで。" },
    { name: "有限会社 青梅動画", q: [56, 64], slip: 0.08, cap: 2, note: "標準的。たまに遅れる。" },
    { name: "アニメ工房さざなみ", q: [47, 55], slip: 0.15, cap: 2, note: "品質も納期も怪しい。局の基準ぎりぎり。" },
  ];
  const SOURCES = {
    manga: { label: "人気漫画原作", kanshu: 0.24, titles: ["放課後ラグナロク", "ねこ侍は眠らない", "鉄骨のアリア", "となりの席の魔王さま"] },
    novel: { label: "ライトノベル原作", kanshu: 0.16, titles: ["転生したら制作進行だった件", "追放された錬金術師、辺境でカフェを開く", "俺の妹が魔王軍の経理担当なんだが"] },
    original: { label: "オリジナル", kanshu: 0, titles: ["夜明けのフィルム", "さよならロケット少女", "機械仕掛けの夏休み", "月面の郵便屋さん"] },
  };
  const FAMILY = ["岩城", "真柴", "黒須", "早乙女", "鷹野", "白石", "柳田", "東雲", "葛西", "三輪", "雨宮", "久遠", "椎名", "不破", "氷室", "九条", "皆川", "綾瀬", "桐生", "宗像", "結城", "日向", "朝霧", "篠原",
                  "小田切", "望月", "千早", "神楽", "伊吹", "相馬", "芹沢", "鳴海", "野々宮", "八雲", "藤堂", "水無瀬", "能登", "桜庭", "長谷部", "榊"];
  const GIVEN = ["透", "灯", "誠", "遥", "蓮", "朔", "薫", "湊", "静", "渉", "楓", "律", "環", "慧", "茜", "航", "紬", "悠", "澪", "迅", "一花", "健吾", "美雪", "大地", "千尋", "陽向", "瑞穂", "昴", "亜紀", "翔"];

  function makeName(s) {
    const used = new Set(s.usedNames);
    for (let i = 0; i < 80; i++) {
      const n = pick(s, FAMILY) + " " + pick(s, GIVEN);
      if (!used.has(n)) { s.usedNames.push(n); return n; }
    }
    return "名無し " + s.usedNames.length;
  }
  const uid = (s) => ++s.uid;
  function makeAnimator(s, bonus = 0) {
    const T = TIERS[s.tier];
    const skill = clamp(ri(s, T.animSkill[0], T.animSkill[1]) + bonus, 30, 95);
    const speed = Math.round(clamp(rr(s, 6.5, 10) - (skill - 60) / 40, 5, 11) * 10) / 10;
    return { id: uid(s), name: makeName(s), skill, speed, cuts: 0, rough: 0, genga: 0, hold: 0, slow: 1 };
  }
  function makeShinko(s, range) {
    return { id: uid(s), name: makeName(s), seed: ri(s, 1, 1e9), skill: ri(s, range[0], range[1]), stamina: ri(s, 75, 95), gone: false };
  }

  function newGame(tier, seed) {
    const T = TIERS[tier];
    const s = { v: 6, phase: "schedule", tier, rs: seed | 0, week: 0, log: [], sns: [], kv: [], usedNames: [], uid: 0 };
    s.pre = T.pre;
    s.src = { type: T.source, title: pick(s, SOURCES[T.source].titles) };
    const mk = (d) => ({ name: makeName(s), seed: ri(s, 1, 1e9), ...d });
    s.staff = { dir: mk(T.dir), wri: mk(T.wri), va: mk(T.va), kp: mk({}) };
    s.shinkos = [];
    s.teams = TEAM_KEYS.slice(0, T.teams).map((key, i) => {
      const sh = makeShinko(s, T.shinkoSkill[i]);
      sh.team = key; s.shinkos.push(sh);
      return { key, label: `${key}班`, shinko: sh.id, sakkan: { name: makeName(s), seed: ri(s, 1, 1e9), skill: ri(s, T.sakkanSkill[0], T.sakkanSkill[1]) } };
    });
    s.gross = GROSS_DEFS.map((d, i) => ({ id: i + 1, name: d.name, quality: ri(s, d.q[0], d.q[1]), slip: d.slip, cap: d.cap, note: d.note }));
    s.eps = Array.from({ length: EPISODES }, (_, i) => ({ n: i + 1, cuts: ri(s, 27, 33) * 10 }));
    autoPlan(s);
    return s;
  }
  const synergy = (s) => (s.staff.dir.tag === s.staff.wri.tag ? 4 : 0);
  const teamBy = (s, key) => s.teams.find((t) => t.key === key);
  const grossBy = (s, id) => s.gross.find((g) => g.id === id);
  const isGross = (plan) => typeof plan.team === "string" && plan.team.startsWith("g");
  const grossOf = (s, plan) => (isGross(plan) ? grossBy(s, +plan.team.slice(1)) : null);
  const planAir = (s, n) => s.pre + n;

  // ---------- グランドスケジュール ----------
  const conteRate = (s) => 0.45 + s.staff.dir.speed / 250;
  function conteWeek(s, n) {
    const K = TIERS[s.tier].contes;
    if (n <= K) return 1;
    let need = 0;
    for (const ep of s.eps) if (ep.n <= n && ep.n > K && !(ep.plan && isGross(ep.plan))) need++;
    return Math.ceil(need / conteRate(s)) + 1;
  }
  function autoPlan(s) { for (const ep of s.eps) ep.plan = null; planPass(s); planPass(s); return s.eps.map((e) => e.plan); }
  function planPass(s) {
    const free = Object.fromEntries(s.teams.map((t) => [t.key, 1]));
    const grossUse = [];
    const grossFits = (c, a, b) => grossUse.filter(([id, x, y]) => id === c.id && x <= b && a <= y).length < c.cap;
    for (const ep of s.eps) {
      const air = planAir(s, ep.n);
      const teamSlot = (buffer, dur) => {
        let best = null;
        for (const t of s.teams) {
          const start = Math.max(free[t.key], conteWeek(s, ep.n));
          if (start + dur - 1 <= air - buffer && (!best || start < best.start)) best = { team: t.key, start, dur };
        }
        return best;
      };
      const grossSlot = (buffer, dur) => {
        const start = Math.max(1, air - buffer - dur + 1), end = start + dur - 1;
        if (end > air) return null;
        const c = s.gross.find((c) => grossFits(c, start, end));
        return c ? { team: "g" + c.id, start, dur } : null;
      };
      let pick2 = null;
      for (const dur of [DEF_DUR, DEF_DUR - 1, MIN_DUR]) { pick2 = teamSlot(1, dur) || grossSlot(1, dur) || teamSlot(0, dur) || grossSlot(0, dur); if (pick2) break; }
      if (pick2 && !pick2.team.startsWith("g")) { ep.plan = { team: pick2.team, start: pick2.start, dur: pick2.dur }; free[pick2.team] = pick2.start + pick2.dur; continue; }
      const g = pick2 || { team: "g" + s.gross[s.gross.length - 1].id, start: Math.max(1, air - MIN_DUR + 1), dur: MIN_DUR };
      grossUse.push([+g.team.slice(1), g.start, g.start + g.dur - 1]);
      ep.plan = { team: g.team, start: g.start, dur: g.dur };
    }
  }
  function planIssues(s) {
    const out = [];
    for (const ep of s.eps) {
      const p = ep.plan;
      if (ep.started || ep.aired) continue;
      const end = p.start + p.dur - 1;
      const air = s.phase === "prod" ? airWeekOf(s, ep) : planAir(s, ep.n);
      if (end > air) out.push({ n: ep.n, kind: "late", msg: `第${ep.n}話：納品予定 第${end}週が放送（第${air}週）に間に合いません` });
      if (!isGross(p)) {
        for (const o of s.eps) {
          if (o.n <= ep.n || o.plan.team !== p.team || o.started) continue;
          const oe = o.plan.start + o.plan.dur - 1;
          if (o.plan.start <= end && p.start <= oe) out.push({ n: o.n, kind: "overlap", msg: `${p.team}班：第${ep.n}話と第${o.n}話の期間が重なっています（1班は同時に1話まで）` });
        }

  function officeHtml() {

  // ---------- the 12 episodes ----------

  // ---------- things to look at (each points at an object) ----------
  function concerns() {
    const f = s.stat || E.forecast(s), out = [];
    for (const sh of s.shinkos.filter((x) => x.gone)) {
      const t = E.teamOfShinko(s, sh.id); if (!t) continue;
      out.push({ c: "var(--red-d)", t: `${t.label}の進行と連絡が取れない`, sub: `${esc(sh.name)} ・ 担当話数が止まりかけている`, k: "shinko", id: sh.id });
    }
    for (const n of f.late) {
      const ep = E.epBy(s, n);
      out.push({ c: "var(--red-d)", t: `第${n}話が放送に間に合わない`, sub: `${esc(whoShort(ep.plan.team))} ・ 完パケ予測 W${E.epForecast(s, ep)} ／ 放送 W${E.airWeekOf(s, ep)}`, k: "ep", id: n });
    }
    for (const ep of E.unaired(s)) {
      if (ep.started && !ep.delivered && !f.late.includes(ep.n) && qOf(ep) < E.LINE) out.push({ c: "var(--red-d)", t: `第${ep.n}話、局に突き返されそう`, sub: "あなたの見立て：作画が基準に届かない", k: "ep", id: ep.n });
    }
    if (f.conte < f.needConte) out.push({ c: "var(--amber)", t: "コンテが上がってこない", sub: "監督 ・ 着手が遅れる話数が出る", k: "dir", id: "" });
    [["douga", "動画が追いついていない"], ["shiage", "仕上げが詰まりそう"], ["satsuei", "撮影がパンクしそう"]].forEach(([k, t]) => { if (f[k] < f.need[k]) out.push({ c: "var(--amber)", t, sub: "動画・仕上げ・撮影", k: "post", id: "" }); });
    for (const sh of s.shinkos.filter((x) => !x.gone && x.stamina < 30)) {
      const t = E.teamOfShinko(s, sh.id); if (!t) continue;
      out.push({ c: "var(--amber)", t: `${sh.name}がかなり疲れている`, sub: `${t.label} 制作進行 ・ そろそろ飛ぶかもしれない`, k: "shinko", id: sh.id });
    }
    return out;
  }
  function concernsHtml(list) {

  // ---------- details (one per kind of object, all the same shape) ----------
  function paneEp(ep, ctx) {
    const P = prod(), gross = E.isGross(ep.plan), p = ep.plan, end = p.start + p.dur - 1;
    const air = airOf(ep), fc = ep.aired || ep.delivered ? null : fcOf(ep);
    const late = fc != null && air != null && fc > air;
    const editable = !ep.started && !ep.aired;
    const st = P ? stageV(ep) : "wait";
    const tag = ep.aired ? tagHtml("放送済", "ink") : ep.delivered ? tagHtml("納品済", "ok") : late ? tagHtml(`遅れ ${fc - air}週`, "bad")
      : !ep.started ? tagHtml(P && !gross && ep.conte < 1 ? "コンテ待ち" : "着手前") : tagHtml(E.STAGE_LABEL[st]);
    const who = gross ? `グロス：${esc(E.grossOf(s, p).name)}` : `${p.team}班（社内）`;
    let body = oh("話数", `第${ep.n}話`, `${who} ・ ${ep.cuts}カット ・ 予定 W${p.start}–W${end}`, tag);
    if (ep.aired) body += `<div class="tiles">${tile("作画の出来", ep.airQ, ep.collapse ? "bad" : "")}${tile("放送", `W${ep.airWeek}`)}${tile("担当", esc(whoShort(p.team)))}</div>`;
    else if (!P) body += `<div class="tiles">${tile("予定", `W${p.start}–${end}`)}${tile("放送", `W${air}`)}${tile("余裕", `${air - end}週`, air - end <= 0 ? "bad" : "")}</div>`;
    else body += `<div class="tiles">${tile("工程", ep.delivered ? "納品済" : gross ? (ep.started ? `${Math.round(ep.gprog * 100)}%` : "着手前") : esc(E.STAGE_LABEL[st]))}${tile("完パケ予測", ep.delivered ? `W${ep.deliveredWeek}` : `W${fc}`, late ? "bad" : "")}${tile("放送", `W${air}`)}</div>`;
    body += mutHtml(mutterOf(ep));

    // 工程

      else if (ep.started) {

        inner = `<div class="stages">${Object.keys(L).map((k) => { const v = Math.min(1, t[k] / ep.cuts); const cls = k === st ? "now" : t[k] >= ep.cuts - 0.5 ? "done" : ""; return `<span class="${cls}"><i></i>${L[k]}${cls === "now" ? ` ${Math.floor(v * 100)}%` : ""}</span>`; }).join("")}</div>
          <p>美術・CG：${artState(ep)}${ep.rush || ep.short ? ` ・ 巻き：${[ep.rush ? E.RUSH[ep.rush].label : "", ep.short ? "撮影短縮" : ""].filter(Boolean).join("＋")}` : ""}</p>`;
        const sh = E.shinkoOfTeam(s, p.team);
        if (sh && sh.skill < 45) inner += `<p>数字は進行の報告ベース。${esc(p.team)}班の進行は段取りが悪いので、実態はずれているかもしれない。</p>`;
      } else inner = `<p>${!gross && ep.conte < 1 ? `コンテ ${Math.round(ep.conte * 100)}%。` : ""}予定 W${p.start} から。${gross ? "" : `前の話数の原画が上がり次第、班が入ります（原画マン${E.recommendAnims(s, ep)}人の予定）。`}</p>`;
      body += `<section class="psec"><h3>工程</h3>${inner}</section>`;
    }
    if (!P) {
      const iss = E.planIssues(s).filter((i) => i.n === ep.n);
      if (iss.length) body += `<section class="psec"><h3>チェック</h3>${iss.map((i) => `<p style="color:${i.soft ? "var(--ink-soft)" : "var(--red)"}">${esc(i.msg)}</p>`).join("")}</section>`;

    else {
      const t = E.teamBy(s, p.team), sh = E.shinkoBy(s, t.shinko);
      rels += rel({ ico: p.team, c: TEAM_COL[p.team], t: t.label, sub: `班 ・ 作監 ${esc(t.sakkan.name)}`, attrs: selAttrs("team", p.team) });
      rels += rel({ faceSeed: sh.seed, t: esc(sh.name), sub: `制作進行 ・ 段取り${stars(sh.skill)}${sh.gone ? " ・ 連絡が取れない" : sh.stamina < 30 ? " ・ 体力 低" : ""}`, attrs: selAttrs("shinko", sh.id) });
    }

    // できること
    const name = `第${ep.n}話`;
    if (editable) {
      const minStart = P ? s.week : 1;
      const form = `<label class="field"><span>担当</span><select data-act="planTeam" data-v="${ep.n}" aria-label="第${ep.n}話の担当">${teamOptions(ep)}</select></label>
        <div class="field"><span>着手</span><div class="step"><button data-act="planStart" data-v="${ep.n}" data-d="-1" aria-label="着手を1週早める" ${p.start <= minStart ? "disabled" : ""}>−</button><span>W${p.start}</span><button data-act="planStart" data-v="${ep.n}" data-d="1" aria-label="着手を1週遅らせる">＋</button></div></div>
        <div class="field"><span>期間</span><div class="step"><button data-act="planDur" data-v="${ep.n}" data-d="-1" aria-label="期間を1週短く" ${p.dur <= E.MIN_DUR ? "disabled" : ""}>−</button><span>${p.dur}週</span><button data-act="planDur" data-v="${ep.n}" data-d="1" aria-label="期間を1週長く">＋</button></div></div>`;
      return pane(name, body, `<div class="pane-f"><span class="lbl">${name} にできること（着手前なので担当と日程を変えられる・行動なし）</span>${form}</div>`);

      const modes = rushModes(ep);
      if (modes.length) acts.push(act({ label: "巻く…", sub: late ? "放送に間に合わせる手を選ぶ" : "急がせると絵が荒れる", cost: "行動なし", attrs: `data-act="rushOpen" data-v="${ep.n}"`, pri: late }));
      if (gross) acts.push(actFor("grossPush", ep.n, { label: "協力会社を催促", sub: "1週ぶん巻いてもらう", pri: !late }));
      else {
        if (E.canAddAnim(s, ep)) [3, 1].forEach((k) => { const x = previewAdd(ep, k); acts.push(act({ label: `原画マンを足す ＋${k}`, sub: `予測 W${x.fc} ・ 作画：${judge({ q: x.q, fc: x.fc, air }).short}`, cost: "行動なし", attrs: `data-act="addAnim" data-v="${ep.n}" data-k="${k}"`, pri: !late && k === 3 && !acts.length })); });
        if (ctx === "xls") { const sh = E.shinkoOfTeam(s, p.team); if (sh) acts.push(sh.gone ? actFor("hireShinko", sh.id) : actFor("help", sh.id, { label: `${sh.name}のヘルプに入る`, sub: "現場の本当の状況が分かる" })); }
        else acts.push(act({ label: "進行表を開く", sub: "原画マンごとの進み", attrs: `data-act="xls" data-v="${p.team}" data-n="${ep.n}"` }));

  function shinkoTag(sh) {
    return sh.gone ? tagHtml("連絡が取れない", "bad") : sh.stamina < 30 ? tagHtml("体力 低", "bad") : sh.helped ? tagHtml("今週ヘルプ済み", "ok") : "";

    const acts = (sh.gone ? actFor("hireShinko", sh.id, { pri: true }) : actFor("help", sh.id, { pri: true, sub: "現場の本当の状況が分かる" })) + act({ label: "進行表を開く", attrs: `data-act="xls" data-v="${t.key}"` });

  function paneDir() {

  function panePost() {

    body += mutHtml(m, "あなたの見立て（全体）");
    body += `<section class="psec"><h3>処理能力と必要なペース（週あたり）</h3>${capHtml(true)}</section>`;
    body += `<section class="psec"><h3>関係するもの</h3><div>${rel({ faceSeed: s.staff.dir.seed, t: esc(s.staff.dir.name), sub: "監督", attrs: selAttrs("dir", "") })}${rel({ ico: "部", c: "var(--teal)", t: "動画・仕上げ・撮影", sub: "部署", attrs: selAttrs("post", "") })}${rel({ ico: "TV", c: "var(--pink)", t: "放送・SNS", sub: `次の放送 W${s.nextAir}`, attrs: selAttrs("tv", "") })}</div></section>`;
    const foot = `<div class="pane-f"><span class="lbl">スタジオ にできること（現場の方針・行動なし）</span>
      ${seg("発注先", "douga", [["inhouse", "社内のみ"], ["overseas", "海外も可"]])}${seg("進め方", "mode", [["stock", "作り置き優先"], ["quality", "品質優先"]])}${seg("残業", "ot", [[false, "させない"], [true, "させる"]])}
      <p class="note" style="color:var(--ink-soft)">品質優先は丁寧なぶん遅い。残業は2割速いが、人が倒れ、進行が飛びやすくなる。</p></div>`;
    return pane(T.studio, body, foot);
  }
  function paneGross(id) {
    const c = E.grossBy(s, id); if (!c) return paneStudio();
    const eps = s.eps.filter((e) => e.plan.team === "g" + id);
    const m = c.quality < E.LINE + 3 ? { tone: "bad", t: "ここに出すと基準ぎりぎりだ・・・" } : c.quality < E.LINE + 12 ? { tone: "worry", t: "ちょっと作画厳しいか・・・？" } : { tone: "good", t: "ここなら安心だ" };
    let body = oh("協力会社", c.name, esc(c.note), c.quality < E.LINE + 3 ? tagHtml("基準ぎりぎり", "warn") : "");
    body += `<div class="tiles">${tile("同時に", `${c.cap}話`)}${tile("受けている", eps.length ? eps.map((e) => `#${e.n}`).join(" ") : "なし")}${tile("局の基準", E.LINE)}</div>`;
    body += mutHtml(m, "あなたの見立て（この会社の作画）");
    body += `<section class="psec"><h3>受けている話数</h3><div class="rows">${eps.length ? eps.map(epRow).join("") : `<div class="row"><span>発注している話数はありません</span><span></span></div>`}</div><p>グランドスケジュールで話数の担当を切り替えると発注できる。</p></section>`;
    const acts = prod() ? eps.filter((e) => e.started && !e.delivered && !e.aired).map((e) => actFor("grossPush", e.n, { label: `第${e.n}話を催促`, sub: "1週ぶん巻いてもらう" })).join("") : "";
    return pane(c.name, body, paneFoot(c.name, acts, acts ? "" : "いま制作中の話数はありません。"));
  }
  function paneTV() {
    let body = oh("放送", "放送・SNS", `放送済み ${s.aired}/12 ・ 次の放送 W${s.nextAir}`);
    body += `<div class="tiles">${tile("放送済み", `${s.aired}/12`)}${tile("評判", s.aired ? Math.round(s.R) : "—")}${tile("次の放送", `W${s.nextAir}`)}</div>`;
    body += `<section class="psec"><h3>放送済みの1枚絵</h3><div class="kvs">${s.eps.map((e) => `<div class="kvbox"><span data-kv="${e.n}"></span><span>#${e.n}${e.airQ != null ? ` ${e.airQ}` : ""}</span></div>`).join("")}</div></section>`;
    body += `<section class="psec"><h3>SNSの反応</h3>${s.sns.length ? s.sns.slice(0, 8).map(postHtml).join("") : "<p>放送が始まると、ここに反応が流れます。</p>"}</section>`;
    body += `<section class="psec"><h3>現場ログ</h3><div class="log">${s.log.slice(-24).reverse().map((l) => `<p><span class="w">W${l.w}</span>${esc(l.text)}</p>`).join("")}</div></section>`;
    return pane("放送・SNS", body, paneFoot("放送", "", "放送は毎週自動で進みます。間に合わない話数があると、放送日に判断を求められます。"));
  }
  const postHtml = (p) => `<div class="post ${["god", "good"].includes(p.kind) ? "good" : ["bad", "collapse", "recap", "delay"].includes(p.kind) ? "bad" : ""}"><i></i><span><small>${esc(p.h)} ・ 第${p.n}話</small>${esc(p.t)}</span></div>`;
  function paneFor() {
    const k = sel.k;
    if (k === "ep") return paneEp(E.epBy(s, +sel.id), "prod");
    if (k === "team") return paneTeam(sel.id);
    if (k === "shinko") return paneShinko(+sel.id);
    if (k === "dir") return paneDir();
    if (k === "post") return panePost();
    if (k === "gross") return paneGross(+sel.id);
    if (k === "tv") return paneTV();
    return paneStudio();
  }

  // ---------- the schedule (timeline of episodes) ----------
  function weekSpan() {
    const last = Math.max(...s.eps.map((e) => (e.plan ? e.plan.start + e.plan.dur - 1 : 0)), s.pre + E.EPISODES, prod() ? s.nextAir + E.unaired(s).length : 0);
    return Math.min(40, last + 1);
  }
  function timelineHtml() {
    const W = weekSpan(), P = prod(), now = P ? s.week : 1;
    const left = (w) => ((w - 1) / W) * 100, width = (n) => (n / W) * 100;
    const bad = new Set(E.planIssues(s).filter((i) => !i.soft).map((i) => i.n));
    const head = `<div class="tl-head"><span>話</span><span>担当</span><span class="tl-weeks" style="grid-template-columns:repeat(${W},minmax(0,1fr))">${Array.from({ length: W }, (_, i) => `<span class="${i + 1 === now ? "now" : ""}">${i + 1}</span>`).join("")}</span></div>`;
    const rows = s.eps.map((ep) => {
      const p = ep.plan, c = teamColor(p.team), air = airOf(ep);
      const fc = P && !ep.aired && !ep.delivered ? E.epForecast(s, ep) : null;
      const late = fc != null && air != null && fc > air;
      let bars = `<span class="plan" style="left:${left(p.start)}%;width:${width(p.dur)}%"></span>`;
      if (P && ep.started) {
        const to = ep.delivered ? ep.deliveredWeek : ep.aired ? ep.airWeek : s.week - 1;
        if (to >= ep.startWeek) bars += `<span class="act2" style="left:${left(ep.startWeek)}%;width:${width(to - ep.startWeek + 1)}%"></span>`;
      }
      if (fc != null) { const from = ep.started ? s.week : Math.max(s.week, fc - p.dur + 1); if (fc >= from) bars += `<span class="fc" style="left:${left(from)}%;width:${width(fc - from + 1)}%"></span>`; }
      const mark = air ? `<span class="air ${ep.aired ? "done" : late ? "late" : ""}" style="left:${left(air)}%;width:${width(1)}%">${ep.aired ? "●" : "▼"}</span>` : "";
      return `<button class="tl-row ${isSel("ep", ep.n) ? "on" : ""} ${bad.has(ep.n) || late ? "bad" : ""}" style="--c:${c}" ${selAttrs("ep", ep.n)} aria-label="第${ep.n}話 ${esc(whoShort(p.team))}">
        <span class="n">#${ep.n}</span><span class="w"><i></i>${esc(whoShort(p.team))}</span>
        <span class="tl-track"><span class="grid" style="background-size:${100 / W}% 100%"></span><span class="nowc" style="left:${left(now)}%;width:${width(1)}%"></span>${bars}${mark}</span></button>`;
    }).join("");
    return `${head}<div style="display:flex;flex-direction:column;gap:4px">${rows}</div>
      <div class="legend"><span>薄いバー＝予定</span>${P ? "<span>濃いバー＝作業した週</span><span>斜線＝完パケまでの予測（進行の報告）</span>" : ""}<span>▼＝放送週</span><span>黄＝今週</span><span>1話は標準${E.DEF_DUR}週（最短${E.MIN_DUR}週）・1班は同時に1話まで</span></div>`;
  }
  function checksHtml() {
    const issues = E.planIssues(s);
    if (!issues.length) return li({ c: "var(--green-d)", t: "問題はありません", sub: "全話が放送週までに終わる予定 ・ 班の重なりなし" });
    return issues.map((i) => li({ c: i.soft ? "var(--amber)" : "var(--red-d)", t: esc(i.msg), on: isSel("ep", i.n), attrs: selAttrs("ep", i.n) })).join("");
  }

  // ---------- screens ----------
  function render() {
    cancelAnimationFrame(raf); officeCanvas = null;
    if (!s) renderTitle();
    else if (s.phase === "schedule") renderSchedule();
    else if (s.phase === "prod") renderProd();
    else renderEnd();
    mountFaces(app); mountKV(app);
    if (prod()) { officeCanvas = document.getElementById("officeCanvas"); raf = requestAnimationFrame(loop); }
  }
  function mountFaces(root) { root.querySelectorAll("[data-face]").forEach((el) => el.replaceWith(faceCanvas(+el.dataset.face, el.dataset.cls || ""))); }
  function mountKV(root) { if (!s) return; root.querySelectorAll("[data-kv]").forEach((el) => { const k = s.kv.find((x) => x.n === +el.dataset.kv && !x.recap); if (k) { el.innerHTML = ""; el.appendChild(kvCanvas(k)); } }); }

  const DIFF = { top: ["やさしい", "ok", "var(--green-d)"], mid: ["ふつう", "warn", "var(--amber)"], low: ["むずかしい", "bad", "var(--red-d)"] };
  function renderTitle() {
    const best = store.get("animep.best4") || {};
    const T = E.TIERS[pickTier];
    const rows = Object.values(E.TIERS).map((t) => `<button class="st-row ${t.key === pickTier ? "on" : ""}" style="--c:${DIFF[t.key][2]}" data-act="pickTier" data-v="${t.key}" aria-pressed="${t.key === pickTier}">
        <i></i><span><span style="display:block;font-weight:700">${esc(t.studio)}</span><span style="display:block;font-size:12px;color:var(--on-soft)">${esc(t.name)}</span></span>
        <span class="tag dark ${DIFF[t.key][1]}" style="justify-self:start">${DIFF[t.key][0]}</span>
        <span class="big r hide-n">${t.teams}</span><span class="big r hide-n">${t.pre}<small>週</small></span><span class="hide-n" style="font-size:13px">${esc(E.SOURCES[t.source].label)}</span>
        <span class="big r hide-n" style="color:${best[t.key] ? "var(--pink)" : "var(--on-soft)"}">${esc(best[t.key] || "—")}</span><span style="color:var(--on-soft)" aria-hidden="true">›</span></button>`).join("");
    let body = oh("スタジオ", T.studio, `${esc(T.name)} ・ ${esc(E.SOURCES[T.source].label)}`, tagHtml(DIFF[T.key][0], DIFF[T.key][1]));
    body += `<div class="tiles">${tile("社内の班", T.teams)}${tile("放送前", `${T.pre}週`)}${tile("ベスト", esc(best[T.key] || "—"))}</div>`;
    body += `<p style="margin:0;font-size:13.5px">${esc(T.blurb)}</p>`;
    body += `<section class="psec"><h3>座組（スタジオで決まっている）</h3><div class="rows">
      <div class="row"><span>監督 実力 ／ コンテの速さ</span><span class="v">${stars(T.dir.skill)} ／ ${stars(T.dir.speed)}</span></div>
      ${T.shinkoSkill.map((r, i) => { const v = (r[0] + r[1]) / 2; return `<div class="row"><span>${"ABCDEF"[i]}班 進行の段取り${v < 45 ? "（新人）" : ""}</span><span class="v ${v < 45 ? "bad" : ""}">${stars(v)}</span></div>`; }).join("")}</div></section>`;
    const foot = paneFoot(T.studio, act({ label: "このスタジオで始める", sub: "グランドスケジュールを引くところから", attrs: `data-act="tier" data-v="${T.key}"`, pri: true, cost: "→" }), "", true);
    app.innerHTML = hdr("制作デスク篇", `<div class="wk"><span class="wk-n mute">放送前</span><span class="wk-t">スタジオを選ぶと、グランドスケジュールに進みます</span></div>`, `<button class="btn-sys" data-act="howto">遊び方</button>`)
      + `<div class="main"><div class="col">
          <div class="logo"><div class="logo-t"><h1>深夜アニメP</h1><span class="stamp">制作デスク篇</span></div>
            <p>グランドスケジュールを引き、進行の報告を受け、原画マンを足し、協力会社を急かす。TVアニメ1クール全12話を、放送まで落とさずに届ける。<b>ただし、進行の報告がいつも本当とは限らない。</b></p></div>
          <section class="sec"><div class="sec-h"><h2>スタジオ 3</h2></div>
            <div class="st-head"><span></span><span>名前</span><span>難しさ</span><span class="r">社内の班</span><span class="r">放送前</span><span>作品</span><span class="r">ベスト</span><span></span></div>
            ${rows}</section>
          <p class="note">1プレイ15〜25分。制作中の進行状況はこのブラウザに保存されます。</p>
        </div>${pane(T.studio, body, foot)}</div>`;
  }

  function renderSchedule() {
    const issues = E.planIssues(s), hard = issues.filter((i) => !i.soft);
    if (!sel || !["ep", "gross"].includes(sel.k)) sel = { k: "ep", id: (hard[0] || issues[0] || { n: 1 }).n };
    const gross = s.eps.filter((e) => E.isGross(e.plan)).length;
    const first = E.planAir(s, 1);
    app.innerHTML = hdr(studioSub(), `<div class="wk wk-fix"><span class="wk-n">放送前</span><span class="wk-t">第1話 放送 <b>W${first}</b> ・ 準備 ${first - 1}週</span><button class="btn-main" data-act="start" ${hard.length ? "disabled" : ""}>${hard.length ? "問題を直すと制作開始" : "制作開始"}</button></div>`, `<button class="btn-sys" data-act="title">スタジオを選び直す</button>`)
      + `<div class="main"><div class="col">
          <section class="sec"><div class="sec-h"><h2>話数 12 ・ 社内${12 - gross} ・ グロス${gross}</h2><button class="btn-sys" data-act="autoPlan">おまかせで組み直す</button></div>${timelineHtml()}</section>
          <section class="sec"><div class="sec-h"><h2>チェック${issues.length ? ` ${issues.length}件` : ""}</h2></div><div class="grid2">${checksHtml()}</div></section>
          <section class="sec"><div class="sec-h"><h2>協力会社（グロス先） ${s.gross.length}</h2></div><div class="grid2">${s.gross.map((c) => li({ c: "var(--gross)", t: esc(c.name), sub: `同時に${c.cap}話 ・ ${esc(c.note)}`, on: isSel("gross", c.id), attrs: selAttrs("gross", c.id) })).join("")}</div></section>
        </div>${sel.k === "gross" ? paneGross(+sel.id) : paneEp(E.epBy(s, +sel.id), "sched")}</div>`;
  }

  function renderProd() {
    if (!sel) sel = { k: "studio" };
    const list = concerns();
    app.innerHTML = hdr(studioSub(), `<div class="wk wk-fix"><span class="wk-n">第${s.week}週</span><span class="wk-t">${phaseLabel()}</span>${apHtml()}<button class="btn-main" data-act="endWeek">今週を締める</button></div>`, `<button class="btn-sys" data-act="howto">遊び方</button><button class="btn-sys" data-act="quit">やめる</button>`)
      + `<div class="main"><div class="col">
          <section class="sec"><div class="sec-h"><h2>スタジオ　人・班・協力会社</h2></div>${officeHtml()}</section>
          <section class="sec"><div class="sec-h"><h2>話数 12 ・ 放送済み ${s.aired}</h2><button class="btn-sys" data-act="ganttBig">グランドスケジュール</button></div>${epsHtml()}</section>
          <section class="sec"><div class="sec-h"><h2>気になること${list.length ? ` ${list.length}` : ""}</h2></div><div class="grid2">${concernsHtml(list)}</div></section>
        </div>${paneFor()}</div>`;
  }

  // ---------- result ----------
  const GRADE = { god: ["神回", "pink", "var(--pink)"], good: ["良", "ok", "var(--green-d)"], mid: ["並", "", "var(--amber)"], bad: ["不安", "warn", "#d9731a"], collapse: ["作画崩壊", "bad", "var(--red-d)"] };
  function renderEnd() {
    const r = s.result, T = E.TIERS[s.tier];
    const best = store.get("animep.best4") || {};
    const order = "DCBAS";
    if (!s.savedBest) {
      s.newBest = !best[s.tier] || order.indexOf(r.rank) > order.indexOf(best[s.tier]);
      if (s.newBest) { best[s.tier] = r.rank; store.set("animep.best4", best); }
      s.savedBest = true;
    }
    const H = 240;
    const bars = s.eps.map((e) => { const g = GRADE[e.grade || (e.collapse ? "collapse" : "mid")]; return `<div style="display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%"><span class="pix" style="font-size:13px;text-align:center">${e.airQ ?? "—"}</span><i style="display:block;border-radius:3px 3px 0 0;height:${Math.round(((e.airQ || 0) / 100) * (H - 24))}px;background:${g[2]}"></i></div>`; }).join("");
    const xs = s.eps.map((e) => { const g = GRADE[e.grade || (e.collapse ? "collapse" : "mid")]; return `<span><b>#${e.n}</b><span style="color:var(--on-soft)">${g[0]}${E.isGross(e.plan) ? "・G" : ""}</span></span>`; }).join("");
    let body = oh("シリーズ", s.src.title, `${esc(T.studio)} ・ 全12話 ・ ${esc(E.SOURCES[s.src.type].label)}`, s.newBest ? tagHtml("ベスト更新", "pink") : "");
    body += `<div style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center"><div class="rank" style="color:${r.rank === "S" || r.rank === "A" ? "#ff2f87" : r.rank === "D" ? "var(--red)" : "var(--ink)"}">${r.rank}</div>
      <div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">${tile("平均の出来", r.avgQ.toFixed(1))}${tile("作画崩壊", `${r.collapses}回`, r.collapses ? "bad" : "")}${tile("総集編", `${s.recaps}回`, s.recaps ? "bad" : "")}${tile("放送延期", `${s.delays}回`, s.delays ? "bad" : "")}</div></div>`;
    body += `<section class="psec"><h3>シェア用の結果</h3><div class="share"><p id="shareText" style="white-space:pre-wrap;margin:0;user-select:all">${esc(shareText())}</p></div></section>`;
    const foot = `<div class="pane-f"><span class="lbl">シリーズ にできること</span><div class="acts">${act({ label: "結果をコピー", attrs: `data-act="copy"`, pri: true })}${act({ label: "スタジオを選び直す", attrs: `data-act="title"` })}</div><span class="note" id="copyMsg" style="color:var(--ink-soft)"></span></div>`;
    app.innerHTML = hdr(studioSub(), `<div class="wk wk-fix"><span class="wk-n">第${s.week}週</span><span class="wk-t">最終回 放送 ・ <b>12 / 12話</b></span><button class="btn-main" data-act="again">同じスタジオでもう一度</button></div>`, "")
      + `<div class="main"><div class="col">
          <section class="sec"><div class="sec-h"><h2>話数 12 ・ 作画の出来（線＝局の基準${E.LINE}）</h2></div>
            <div class="chart"><div class="bars" style="height:${H}px"><span class="line" style="bottom:${Math.round((E.LINE / 100) * (H - 24))}px"><span>基準${E.LINE}</span></span>${bars}</div><div class="bars-x">${xs}</div></div></section>
          <section class="sec"><div class="sec-h"><h2>放送した1枚絵</h2></div><div class="kvs" style="grid-template-columns:repeat(12,minmax(0,1fr))">${s.eps.map((e) => `<div class="kvbox"><span data-kv="${e.n}"></span></div>`).join("")}</div></section>
          <section class="sec"><div class="sec-h"><h2>現場の記録</h2></div><div class="stats">
            <div class="stat"><div class="l">起きたトラブル</div><div class="v">${s.incidents.length}<small>件</small></div></div>
            <div class="stat"><div class="l">抱え込まれていた</div><div class="v">${s.lateReports}<small>件</small></div></div>
            <div class="stat"><div class="l">ヘルプで発見</div><div class="v">${s.hiddenFound}<small>件</small></div></div>
            <div class="stat"><div class="l">ヘルプに入った</div><div class="v">${s.helpCount}<small>回</small></div></div>
            <div class="stat"><div class="l">足した原画マン</div><div class="v">${s.added}<small>人</small></div></div>
            <div class="stat"><div class="l">納品拒否</div><div class="v">${s.rejects}<small>回</small></div></div>
            <div class="stat"><div class="l">グロスに出した</div><div class="v">${s.eps.filter((e) => E.isGross(e.plan)).length}<small>話</small></div></div>
          </div></section>
        </div>${pane(s.src.title, body, foot)}</div>`;
  }
  function shareText() {
    const r = s.result;
    const row = s.eps.map((e) => (e.collapse ? "🟥" : e.grade === "god" ? "🟪" : e.grade === "good" ? "🟩" : e.grade === "mid" ? "🟨" : "🟧")).join("");
    return `深夜アニメP 制作デスク篇 ${E.TIERS[s.tier].name}「${s.src.title}」\n${row}${s.recaps ? ` 総集編${s.recaps}` : ""}\n評価 ${r.rank}（平均の出来 ${r.avgQ.toFixed(1)}）`;
  }

  // ---------- the 進行表 (spreadsheet) ----------
  let xls = null;   // { key: team key or "all", n: episode on the open tab }
  function xlsTabs() {
    if (xls.key === "all") return s.eps.filter((e) => e.started && !e.aired && !e.delivered && !E.isGross(e.plan));
    return s.eps.filter((e) => e.plan.team === xls.key);
  }
  function openXls(key, n) {
    xls = { key, n: null };
    const tabs = xlsTabs();
    const cur = (n && tabs.find((e) => e.n === n)) || tabs.find((e) => e.started && !e.delivered && !e.aired) || tabs.find((e) => !e.aired) || tabs[0];
    xls.n = cur ? cur.n : null;
    showModal({ kind: "xls" });
  }
  function dbar(v, total, cls = "") {
    const p = Math.max(0, Math.min(1, v / Math.max(1, total)));
    return `<td class="db"><div class="dbar ${cls}"><span><i style="width:${p * 100}%"></i></span><em>${Math.floor(v + 0.001)}/${Math.round(total)}</em></div></td>`;
  }
  function xlsSheet() {
    const tabs = xlsTabs();
    const ep = xls.n ? E.epBy(s, xls.n) : null;
    const team = xls.key !== "all" ? E.teamBy(s, xls.key) : ep && !E.isGross(ep.plan) ? E.teamBy(s, ep.plan.team) : null;
    const sh = team ? E.shinkoBy(s, team.shinko) : null;
    const title = xls.key === "all" ? "作画部屋_原画マン一覧.xlsx" : `進行表_${team.label}.xlsx`;
    let grid = "", post = "";
    if (!ep) grid = `<div class="xls-msg">この班にはまだ話数が割り当てられていません。</div>`;
    else if (E.isGross(ep.plan)) grid = `<div class="xls-msg">第${ep.n}話は協力会社に1話まるごと発注しています。原画マンの内訳は先方の管理です。</div>`;
    else if (!ep.started) grid = `<div class="xls-msg">第${ep.n}話は着手前です。${ep.conte < 1 ? `コンテ待ち（${Math.round(ep.conte * 100)}%）。` : ""}予定 W${ep.plan.start} から（原画マン${E.recommendAnims(s, ep)}人の予定）。</div>`;
    else {
      const view = ep.anims.map((a) => E.viewAnim(s, a));
      const live = view.filter((a) => !a.out);
      const rows = view.map((a, i) => {
        const held = a.hold > 0 || a.slow < 1;
        const state = a.out ? "外れた" : a.hold > 0 ? "連絡待ち" : a.slow < 1 ? "他社優先" : a.genga >= a.cuts - 0.5 ? "上がり" : a.rough >= a.cuts - 0.5 ? "原画中" : a.rough > 0 ? "ラフ原中" : "未着手";
        return `<tr class="${held ? "held" : a.out ? "out" : ""}"><th class="rn">${i + 1}</th><td>${esc(a.name)}</td><td class="n">${a.skill}</td><td class="n">${Math.round(a.cuts)}</td>${dbar(a.rough, a.cuts, "r")}${dbar(a.genga, a.cuts, held ? "bad" : "")}<td class="st">${state}</td></tr>`;
      }).join("");
      const tr = view.reduce((x, a) => x + a.rough, 0), tg = view.reduce((x, a) => x + a.genga, 0);
      grid = `<div class="xls-grid"><table><thead><tr><th class="rn"></th><th>原画マン</th><th style="text-align:right">実力</th><th style="text-align:right">持ち</th><th>ラフ原</th><th>原画</th><th>状態</th></tr></thead>
        <tbody>${rows}<tr class="tot"><th class="rn"></th><td>合計 ${live.length}人${E.dilution(ep) > 0 ? `（${E.BASE_ANIMS}人を超えたぶん絵がばらつく）` : ""}</td><td class="n">${Math.round(live.reduce((x, a) => x + a.skill, 0) / Math.max(1, live.length))}</td><td class="n">${ep.cuts}</td>${dbar(tr, ep.cuts, "r")}${dbar(tg, ep.cuts)}<td></td></tr></tbody></table></div>`;
      const pc = (v) => `${Math.min(100, Math.floor((v / ep.cuts) * 100 + 0.001))}%`;
      const cls = (v) => (v >= ep.cuts - 0.5 ? "ok" : v > 0.05 ? "wip" : "");
      const art = artState(ep);
      post = `<div class="xls-post"><div class="${cls(ep.douga)}"><div class="l">動画</div><div class="v">${pc(ep.douga)}</div></div><div class="${cls(ep.shiage)}"><div class="l">仕上げ</div><div class="v">${pc(ep.shiage)}</div></div><div class="${cls(ep.satsuei)}"><div class="l">撮影</div><div class="v">${pc(ep.satsuei)}</div></div><div class="${art === "完了" ? "ok" : ep.art ? "wip" : ""}"><div class="l">美術</div><div class="v">${esc(art)}</div></div><div class="${art === "完了" ? "ok" : ep.art ? "wip" : ""}"><div class="l">CG</div><div class="v">${esc(art)}</div></div></div>`;
    }
    const fx = ep ? `=第${ep.n}話!完パケ予測 → <b>${ep.aired ? "放送済" : ep.delivered ? `W${ep.deliveredWeek}` : `W${E.epForecast(s, ep)}`}</b>　（${sh ? `進行 ${esc(sh.name)} の報告` : "現場の数字"}）` : "";
    return `<section class="xls" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="xls-top"><span class="xls-file">${esc(title)}</span>
        ${sh ? `<span class="xls-who">進行 ${esc(sh.name)} ・ 段取り ${stars(sh.skill)} ・ 体力 ${Math.round(sh.stamina)}${sh.gone ? " ・ 連絡が取れない" : sh.helped ? " ・ 今週ヘルプ済み（実態）" : ""}</span>` : ""}
        <button class="xls-x" data-act="closeModal" aria-label="閉じる">×</button></div>
      <div class="xls-fx"><span class="fxl">fx</span><span>${fx}</span></div>
      ${grid}${post}
      <div class="xls-tabs">${tabs.map((e) => `<button class="${e.n === xls.n ? "on" : ""}" data-act="xlsTab" data-v="${e.n}">#${e.n}${e.aired ? "（済）" : e.delivered ? "（納品）" : e.started ? " 制作中" : "（前）"}</button>`).join("") || `<span style="padding:10px;font-size:12px">シートがありません</span>`}</div>
    </section>`;
  }

  // ---------- dialogs: the same detail, on top ----------
  function showModal(m) { modal = m; renderModal(); }
  function closeModal() { modal = null; xls = null; modalRoot.innerHTML = ""; }
  function reporter(rep) {
    if (!rep) return null;
    if (rep.kind === "shinko") { const sh = E.shinkoOfTeam(s, rep.team); return sh ? { seed: sh.seed, w: `<b>${esc(sh.name)}</b> ・ ${rep.team}班 制作進行 ・ 段取り${stars(sh.skill)}` } : null; }
    if (rep.kind === "sakkan") { const t = E.teamBy(s, rep.team); return { seed: t.sakkan.seed, w: `<b>${esc(t.sakkan.name)}</b> ・ ${t.label} 作画監督` }; }
    if (rep.kind === "dir") return { seed: s.staff.dir.seed, w: `<b>${esc(s.staff.dir.name)}</b> ・ 監督` };
    if (rep.kind === "gross") { const c = E.grossBy(s, rep.id); return { seed: 7000 + rep.id, w: `<b>${esc(c.name)}</b> ・ 協力会社` }; }
    if (rep.kind === "post") return { seed: 5150, w: "<b>海外窓口</b> ・ 仕上げ担当" };
    if (rep.kind === "kyoku") return { seed: s.staff.kp.seed, w: `<b>${esc(s.staff.kp.name)}</b> ・ 製作委員会・局プロデューサー` };
    return { seed: YOU, w: "<b>あなた</b> ・ 気づいたこと" };
  }
  // an event choice reads "label（行動−1・effect・品質 66→58）": split it into the verb, its cost and its effect
  function choiceAct(label, attrs, disabled, pri) {
    let main = label, inner = "";
    const m = label.match(/^(.*?)（(.*)）$/);
    if (m) { main = m[1]; inner = m[2]; }
    let cost = "行動なし";
    const rest = [];
    for (const part of inner ? inner.split("・") : []) {
      const a = part.match(/^行動−(\d)/);
      if (a) { cost = `行動${a[1]}`; const tail = part.slice(a[0].length).trim(); if (tail) rest.push(tail); } else rest.push(part);
    }
    const sub = rest.join(" ・ ").replace(/品質\s*(\d+)\s*→\s*(\d+)/g, (_, a, b) => `作画：${qWord(+b)}`);
    return act({ label: main, sub, cost, attrs, pri, disabled });
  }
  const dlg = (body, foot, label = "") => `<div class="modal-bg"><div class="pane dlg flashin" role="dialog" aria-modal="true" ${label ? `aria-label="${esc(label)}"` : `aria-labelledby="dlgT"`}><div class="pane-b">${body}</div>${foot}</div></div>`;
  function renderModal() {
    if (!modal) { modalRoot.innerHTML = ""; return; }
    let html = "";
    if (modal.kind === "xls") {
      const ep = xls.n ? E.epBy(s, xls.n) : null;
      html = `<div class="modal-bg"><div class="xls-wrap">${xlsSheet()}${ep ? paneEp(ep, "xls") : ""}</div></div>`;
    } else if (modal.kind === "gantt") {
      const ep = sel && sel.k === "ep" ? E.epBy(s, +sel.id) : E.unaired(s)[0] || s.eps[0];
      const issues = E.planIssues(s);
      html = `<div class="modal-bg"><div class="gantt-dlg" role="dialog" aria-modal="true" aria-label="グランドスケジュール"><div class="col">
        <div class="sec-h"><h2>グランドスケジュール ・ 第${s.week}週</h2><button class="btn-sys" data-act="closeModal">閉じる</button></div>${timelineHtml()}
        ${issues.length ? `<div class="grid2">${checksHtml()}</div>` : ""}</div>${paneEp(ep, "prod")}</div></div>`;
    } else if (modal.kind === "rush") html = rushHtml();
    else if (modal.kind === "event") {
      const v = E.eventView(s);
      if (!v) return closeModal();
      const rp = reporter(v.reporter);
      const pre = v.found ? tagHtml("ヘルプで発見", "warn") : v.late ? tagHtml("報告が遅れた", "warn") : "";
      let body = oh("報告", v.title, `第${s.week}週${v.found && v.weeksHidden > 0 ? ` ・ ${v.weeksHidden}週間、報告がなかった` : v.found ? " ・ まだ報告されていなかった" : v.late ? " ・ 進行が抱え込んでいた" : ""}`, tagHtml("トラブル", "bad"), null, pre, "dlgT");
      body += `<div class="who">${face(rp ? rp.seed : YOU)}<div><div class="w">${rp ? rp.w : ""}</div><p class="speech">${esc(v.text)}</p></div></div>`;
      const foot = `<div class="pane-f"><span class="lbl">この報告にできること ・ 今週の行動 残り${s.ap}</span><div class="acts one">${v.choices.map((c, i) => choiceAct(c.label, `data-act="evChoice" data-v="${c.i}"`, !c.ok, i === 0)).join("")}</div></div>`;
      html = dlg(body, foot);
    } else if (modal.kind === "air") {
      const pa = s.pendingAir, pctv = Math.round(pa.prog * 100);
      const can = E.canAirAsIs(s), q = Math.round(E.airAsIsQ(s));
      const m = !can ? { tone: "bad", t: "局の基準を割っている。このままは出せない" } : pctv < 85 ? { tone: "bad", t: "このまま出したら作画崩壊だ・・・" } : judge({ q });
      let body = oh("放送", `第${pa.n}話が間に合わない`, `第${s.week}週 ・ 今週が放送日`, tagHtml("放送日", "bad"), null, "", "dlgT");
      body += `<div class="tiles">${tile("撮影まで上がったカット", `${pctv}%`, "bad")}${tile("総集編 残り", `${Math.max(0, 2 - s.recaps)}回`)}</div>`;
      body += mutHtml(m, "あなたの見立て（このまま放送したら）");
      const foot = `<div class="pane-f"><span class="lbl">第${pa.n}話 にできること</span><div class="acts one">
        ${act({ label: "このまま放送する", sub: !can ? "局の基準を割っているので出せない" : pctv < 85 ? "作画崩壊は確実" : `作画：${qWord(q)}`, attrs: `data-act="airChoice" data-v="air"`, disabled: !can })}
        ${act({ label: "総集編を挟む", sub: `第${pa.n}話は翌週へ ・ 残り${Math.max(0, 2 - s.recaps)}回`, attrs: `data-act="airChoice" data-v="recap"`, disabled: s.recaps >= 2 })}
        ${act({ label: "放送を2週延期する", sub: "万策尽きた", attrs: `data-act="airChoice" data-v="delay"` })}</div></div>`;
      html = dlg(body, foot);
    } else if (modal.kind === "aired") {
      const a = s.lastAir;
      if (!a || !a.ep || a.recap || a.delay) { const next = modal.next; closeModal(); return afterTurn(next); }
      const g = GRADE[a.ep.collapse ? "collapse" : a.grade] || GRADE.mid;
      const posts = s.sns.filter((p) => p.n === a.ep.n).slice(0, 2);
      const gross = E.isGross(a.ep.plan);
      let body = oh("放送", `第${a.ep.n}話 放送`, `第${a.ep.airWeek}週 深夜 ・ ${gross ? `グロス（${esc(E.grossOf(s, a.ep.plan).name)}）` : `${a.ep.plan.team}班（社内）`}${a.ep.rush ? ` ・ 巻き：${E.RUSH[a.ep.rush].label}` : ""}`, tagHtml(g[0], g[1]), null, tagHtml("ON AIR", "bad"), "dlgT");
      body += `<div class="tiles">${tile("作画の出来", a.ep.airQ, a.ep.collapse ? "bad" : "")}${tile("評判", Math.round(s.R))}${tile("放送済み", `${s.aired}/12`)}</div>`;
      body += `<section class="psec" style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start"><span data-bigkv style="display:block;width:120px;height:120px;background:var(--chip);border-radius:4px;overflow:hidden"></span><div style="display:flex;flex-direction:column;gap:6px"><h3>放送後のSNS</h3>${posts.map(postHtml).join("")}</div></section>`;
      const next = E.unaired(s)[0];
      html = dlg(body, `<div class="pane-f"><span class="lbl">${next ? `次の放送：第${next.n}話（${esc(whoShort(next.plan.team))}）W${E.airWeekOf(s, next)}` : "全話の放送が終わりました"}</span><div class="acts one">${act({ label: "次へ", attrs: `data-act="airedOk"`, pri: true, cost: "→" })}</div></div>`);
    } else if (modal.kind === "quit") {
      html = dlg(oh("メニュー", "やめますか", "進行中のデータは消え、スタジオ選びに戻ります。", "", null, "", "dlgT"),
        `<div class="pane-f"><div class="acts">${act({ label: "続ける", attrs: `data-act="closeModal"`, pri: true })}${act({ label: "やめてスタジオ選びに戻る", attrs: `data-act="quitYes"` })}</div></div>`);
    } else if (modal.kind === "help") {
      const body = oh("遊び方", "制作デスクの仕事", "夜のスタジオで、人や物を選ぶと右に詳しい様子が出ます。できることは、いつもその下にあります。", "", YOU, "", "dlgT")
        + `<ul>
          <li><b>選ぶ → 詳しく見る → できること</b>。オフィスの人、話数の帯、気になることのどれを押しても、右側にその詳細と「できること」が出ます。</li>
          <li><b>制作進行</b>（各班の席）を選ぶと、進行の様子と<b>ヘルプに入る</b>が出ます。<b>段取りの悪い進行はトラブルを抱え込み、放送直前まで報告しません</b>。そのあいだ進行表の数字は順調に見えます。</li>
          <li><b>話数</b>を選ぶと、工程・完パケ予測・放送週と、<b>あなたの見立て</b>が出ます。遅れていたら、原画マンを足すか、<b>巻く</b>（24時間動仕・12時間動仕・2原動仕・撮影短縮）。速いほど絵が荒れます。</li>
          <li>局・製作委員会の納品基準を下回ると<b>納品拒否</b>でリテイク。基準を割った話数は、放送日に「このまま放送」もできません。</li>
          <li>行動は週3回（ヘルプ、新しい進行、外部コンテ、監督と打ち合わせ、協力会社の催促）。原画マンの追加・巻き・方針の変更は行動を使いません。最後に<b>今週を締める</b>。</li>
          <li>ホワイトボードはグランドスケジュール、電話は協力会社、テレビは放送とSNSです。</li></ul>`;
      html = dlg(body, `<div class="pane-f"><div class="acts one">${act({ label: "閉じる", attrs: `data-act="closeModal"`, pri: true })}</div></div>`);
    }
    modalRoot.innerHTML = html;
    mountFaces(modalRoot); mountKV(modalRoot);
    const big = modalRoot.querySelector("[data-bigkv]");
    if (big && s.lastAir?.ep) { const k = s.kv.find((x) => x.n === s.lastAir.ep.n && !x.recap); if (k) { const c = kvCanvas(k); c.style.width = c.style.height = "100%"; big.appendChild(c); } }
    const first = modalRoot.querySelector(".opt.on, button:not(:disabled)");
    if (first) first.focus({ preventScroll: true });
  }

  // 巻く: compare each way of rushing by week and by your read of the drawing
  const RUSH_DESC = { "24h": "動画・仕上げを急がせる", "12h": "さらに速いが粗くなる", "2gen": "原画から仕上げまで飛ばす", short: "上がった端から撮って出す" };
  function rushHtml() {
    const ep = E.epBy(s, modal.n);
    if (!ep || ep.aired || ep.delivered) return "";
    const air = E.airWeekOf(s, ep), fc0 = E.epForecast(s, ep), q0 = qOf(ep);
    const opts = rushModes(ep).map((m) => { const x = E.previewRush(s, ep.n, m); return { m, label: m === "short" ? "撮影スケジュール短縮" : E.RUSH[m].label, desc: RUSH_DESC[m], fc: x.fc, q: x.q }; });
    opts.push({ m: "stay", label: "このまま粘る", desc: "何もしない", fc: fc0, q: q0 });
    opts.forEach((o) => { o.j = judge({ q: o.q, fc: o.fc, air }); });
    const pick = opts.find((o) => o.m === modal.pick) || opts[0];
    const W0 = s.week, W1 = Math.max(air, ...opts.map((o) => o.fc)), cols = W1 - W0 + 1;
    const toneC = { good: "var(--green)", ok: "var(--teal)", worry: "var(--amber)", bad: "var(--red)", mute: "var(--gross)" };
    let body = oh("話数", `第${ep.n}話を巻く`, `${esc(whoShort(ep.plan.team))} ・ いま${esc(E.STAGE_LABEL[stageV(ep)])} ・ 放送 W${air}`, fc0 > air ? tagHtml(`遅れ ${fc0 - air}週`, "bad") : "", null, "", "dlgT");
    body += `<div class="tiles">${tile("完パケ予測", `W${fc0} → W${pick.fc}`, pick.fc > air ? "bad" : "good")}${tile("放送", `W${air}`)}</div>`;
    body += mutHtml(pick.j);
    body += `<section class="psec"><div class="opt-head"><span>巻き方</span><span class="wks" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${Array.from({ length: cols }, (_, i) => `<span class="${W0 + i === air ? "air" : ""}">W${W0 + i}${W0 + i === air ? "▼" : ""}</span>`).join("")}</span><span>あなたの見立て</span></div>
      <div role="radiogroup" aria-label="巻き方" style="display:flex;flex-direction:column;gap:4px">${opts.map((o) => `<button class="opt ${o === pick ? "on" : ""}" role="radio" aria-checked="${o === pick}" data-act="rushPick" data-v="${o.m}">
        <span><span class="t">${esc(o.label)}</span><span class="s">${esc(o.desc)}</span></span>
        <span class="trk"><span class="airc" style="left:${((air - W0) / cols) * 100}%;width:${100 / cols}%"></span><i style="width:${(Math.max(1, o.fc - W0 + 1) / cols) * 100}%;background:${toneC[o.j.tone]}"></i></span>
        <span class="word tone-${o.j.tone}" style="color:${toneC[o.j.tone]}">${esc(o.j.short)}</span></button>`).join("")}</div>
      <p class="verdict ${pick.fc > air || pick.q < E.LINE ? "bad" : "good"}">${pick.fc > air ? "放送に間に合わない。放送日に「総集編」か「延期」を選ぶことになる。" : pick.q < E.LINE ? "間に合うが、局の基準を割りそう。納品拒否されたらリテイクになる。" : `W${pick.fc}に完パケ。放送には間に合う。`}</p></section>`;
    const foot = `<div class="pane-f"><span class="lbl">第${ep.n}話 にできること</span><div class="acts">${act({ label: pick.m === "stay" ? "このまま粘る" : `「${pick.label}」で指示する`, cost: "行動なし", attrs: `data-act="rushGo" data-v="${ep.n}" data-k="${pick.m}"`, pri: true })}${act({ label: "やめる", attrs: `data-act="closeModal"` })}</div></div>`;
    return dlg(body, foot);
  }

  function afterTurn(res) {
    save();
    if (res === "end") { closeModal(); sel = null; render(); window.scrollTo(0, 0); return; }
    render();
    if (s.event) showModal({ kind: "event" }); else closeModal();
  }
  function runTurn(step) {
    const before = s.aired;
    const res = step();
    if (res == null) return;
    if (res === "air") { save(); render(); return showModal({ kind: "air" }); }
    if (s.aired > before) { save(); render(); return showModal({ kind: "aired", next: res }); }
    afterTurn(res);
  }
  // after an action, a newly surfaced trouble takes over the screen
  const rerender = () => { save(); render(); if (s.event) showModal({ kind: "event" }); else if (modal && ["xls", "gantt", "rush"].includes(modal.kind)) renderModal(); };

  // ---------- input ----------
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const what = b.dataset.act, v = b.dataset.v;
    if (b.tagName === "INPUT" || b.tagName === "SELECT") return;
    switch (what) {
      case "sel": {
        sel = { k: b.dataset.k, id: v === "" ? undefined : v };
        if (modal && modal.kind === "gantt") { render(); renderModal(); break; }
        if (modal) closeModal();
        render();
        if (narrow()) app.querySelector(".pane")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        break;
      }
      case "pickTier": pickTier = v; render(); if (narrow()) app.querySelector(".pane")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); break;
      case "tier": s = E.newGame(v, (Math.random() * 2 ** 31) | 0); sel = null; render(); window.scrollTo(0, 0); break;
      case "title": s = null; sel = null; closeModal(); clearSave(); render(); break;
      case "again": { const t = s.tier; s = E.newGame(t, (Math.random() * 2 ** 31) | 0); sel = null; render(); window.scrollTo(0, 0); break; }
      case "autoPlan": E.autoPlan(s); render(); break;
      case "planStart": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { start: ep.plan.start + +b.dataset.d }); rerender(); break; }
      case "planDur": { const ep = E.epBy(s, +v); E.setPlan(s, +v, { dur: ep.plan.dur + +b.dataset.d }); rerender(); break; }
      case "start": if (E.planIssues(s).some((i) => !i.soft)) break; E.startProduction(s); sel = { k: "studio" }; save(); render(); window.scrollTo(0, 0); showModal({ kind: "help" }); break;
      case "howto": showModal({ kind: "help" }); break;
      case "closeModal": closeModal(); render(); break;
      case "xls": openXls(v, b.dataset.n ? +b.dataset.n : null); break;
      case "ganttBig": showModal({ kind: "gantt" }); break;
      case "xlsTab": xls.n = +v; renderModal(); break;
      case "addAnim": E.addAnimators(s, +v, +b.dataset.k); rerender(); break;
      case "rushOpen": showModal({ kind: "rush", n: +v }); break;
      case "rushPick": modal.pick = v; renderModal(); break;
      case "rushGo": { const k = b.dataset.k; if (k !== "stay") E.setRush(s, +v, k); closeModal(); sel = { k: "ep", id: v }; rerender(); break; }
      case "policy": { const k = b.dataset.k; const val = v === "true" ? true : v === "false" ? false : v; E.setPolicy(s, k, val); rerender(); break; }
      case "do": { const arg = b.dataset.arg != null ? +b.dataset.arg : undefined; const keep = modal && modal.kind === "xls" ? { ...xls } : null; E.doAction(s, v, arg); if (s.event) { modal = null; xls = null; } else if (keep) xls = keep; rerender(); break; }
      case "endWeek": closeModal(); runTurn(() => E.endWeek(s)); break;
      case "airChoice": runTurn(() => E.resolveAir(s, v)); break;
      case "airedOk": { const next = modal.next; closeModal(); afterTurn(next); break; }
      case "evChoice": { if (E.resolveEvent(s, +v) != null) { closeModal(); save(); render(); if (s.event) showModal({ kind: "event" }); } break; }
      case "quit": showModal({ kind: "quit" }); break;
      case "quitYes": closeModal(); s = null; sel = null; clearSave(); render(); window.scrollTo(0, 0); break;
      case "copy": {
        const text = shareText(), msg = document.getElementById("copyMsg");
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("shareText")); const selection = getSelection(); selection.removeAllRanges(); selection.addRange(r); msg.textContent = "選択しました。コピーしてください。"; };
        try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
        break;
      }
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && modal && ["xls", "gantt", "help", "quit", "rush"].includes(modal.kind)) { closeModal(); render(); } });
  document.addEventListener("change", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || !s) return;
    if (b.dataset.act === "planTeam") { E.setPlan(s, +b.dataset.v, { team: b.value }); rerender(); }
  });

  // ---------- save / resume ----------
  function save() { if (s && s.phase === "prod") store.set("animep.save", s); }
  function clearSave() { try { localStorage.removeItem("animep.save"); } catch (e) { /* storage unavailable */ } }
  function start(hotData) {
    const saved = hotData && hotData.s ? hotData.s : store.get("animep.save");
    if (saved && saved.v === 6 && saved.phase) s = saved;
    if (hotData && hotData.sel) sel = hotData.sel;
    render();
    if (s && s.phase === "prod") { if (s.pendingAir) showModal({ kind: "air" }); else if (s.event) showModal({ kind: "event" }); }
  }
  window.claude?.hot?.snapshot?.(() => ({ s, sel }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
